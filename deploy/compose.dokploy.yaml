x-scrs-storage-env: &scrs-storage-env
  SCRS_DATABASE_URL: ${SCRS_DATABASE_URL:?Set SCRS_DATABASE_URL}
  SCRS_DATABASE_SCHEMA: ${SCRS_DATABASE_SCHEMA:-scrs}
  SCRS_REDIS_QUEUE_URL: ${SCRS_REDIS_QUEUE_URL:?Set SCRS_REDIS_QUEUE_URL}
  SCRS_REDIS_CACHE_URL: ${SCRS_REDIS_CACHE_URL:-}
  SCRS_S3_ENDPOINT: ${SCRS_S3_ENDPOINT:?Set SCRS_S3_ENDPOINT}
  SCRS_S3_REGION: ${SCRS_S3_REGION:?Set SCRS_S3_REGION}
  SCRS_S3_BUCKET: ${SCRS_S3_BUCKET:?Set SCRS_S3_BUCKET}
  SCRS_S3_ACCESS_KEY: ${SCRS_S3_ACCESS_KEY:?Set SCRS_S3_ACCESS_KEY}
  SCRS_S3_SECRET_KEY: ${SCRS_S3_SECRET_KEY:?Set SCRS_S3_SECRET_KEY}
  SCRS_S3_FORCE_PATH_STYLE: ${SCRS_S3_FORCE_PATH_STYLE:-true}

services:
  scrs-storage-init:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE to your published full image reference}
    command: ["init"]
    environment:
      <<: *scrs-storage-env
      SCRS_DATABASE_ADMIN_URL: ${SCRS_DATABASE_ADMIN_URL:-}
      SCRS_MASTER_KEY: ${SCRS_MASTER_KEY:?Set SCRS_MASTER_KEY to base64 of 32 bytes}
    labels:
      - "traefik.enable=false"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  scrs-api:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE to your published full image reference}
    restart: unless-stopped
    environment:
      <<: *scrs-storage-env
      SCRS_HTTP_ADDR: ":7000"
      # Legacy shared webhook secrets (shared receivers only). Connections set
      # their own with POST /connections/{id}:webhook.
      SCRS_GITHUB_WEBHOOK_SECRET: ${SCRS_GITHUB_WEBHOOK_SECRET:-}
      SCRS_GITLAB_WEBHOOK_SECRET: ${SCRS_GITLAB_WEBHOOK_SECRET:-}
      SCRS_RELAY_ENABLED: ${SCRS_RELAY_ENABLED:-false}
      SCRS_MASS_DELETION_FILES: ${SCRS_MASS_DELETION_FILES:-50}
      SCRS_PUBLIC_BASE_URL: ${SCRS_PUBLIC_BASE_URL:-}
      SCRS_WEBHOOK_PRIVATE_HOSTS: ${SCRS_WEBHOOK_PRIVATE_HOSTS:-}
      # TAXII feed hosts allowed to resolve to private addresses (feed checks).
      SCRS_TAXII_PRIVATE_HOSTS: ${SCRS_TAXII_PRIVATE_HOSTS:-}
      # E2E QA: the Karate runner (for GET /qa/runner) and self-hosted model
      # hosts allowed to resolve privately (LLM provider checks).
      SCRS_RELEASE_FEED_URL: ${SCRS_RELEASE_FEED_URL:-}
      SCRS_RETENTION_DEFAULT_CLOSED_FINDINGS_DAYS: ${SCRS_RETENTION_DEFAULT_CLOSED_FINDINGS_DAYS:-}
      SCRS_RETENTION_DEFAULT_AUDIT_LOG_DAYS: ${SCRS_RETENTION_DEFAULT_AUDIT_LOG_DAYS:-}
      SCRS_QA_RUNNER_URL: ${SCRS_QA_RUNNER_URL:-http://scrs-qa-runner:8090}
      SCRS_QA_RUNNER_TOKEN: ${SCRS_QA_RUNNER_TOKEN:?Set SCRS_QA_RUNNER_TOKEN to 32+ random characters}
      # SAST analyzers (M9): the API lists them and validates custom rules.
      SCRS_SAST_URL: ${SCRS_SAST_URL:-http://scrs-sast:8083}
      SCRS_SAST_API_TOKEN: ${SCRS_SAST_API_TOKEN:?Set SCRS_SAST_API_TOKEN to 32+ random characters}
      SCRS_SAST_ENABLED: ${SCRS_SAST_ENABLED:-false}
      SCRS_REACHABILITY_ENABLED: ${SCRS_REACHABILITY_ENABLED:-false}
      SCRS_QA_RUNNER_ALLOW_HTTP: ${SCRS_QA_RUNNER_ALLOW_HTTP:-true}
      SCRS_LLM_PRIVATE_HOSTS: ${SCRS_LLM_PRIVATE_HOSTS:-}
      SCRS_EVENT_MAX_BYTES: ${SCRS_EVENT_MAX_BYTES:-1048576}
      SCRS_EVENT_FIELD_MAX: ${SCRS_EVENT_FIELD_MAX:-512}
      SCRS_EVENT_REDACT: ${SCRS_EVENT_REDACT:-}
      SCRS_MASTER_KEY: ${SCRS_MASTER_KEY:?Set SCRS_MASTER_KEY}
      SCRS_BOOTSTRAP_API_TOKEN: ${SCRS_BOOTSTRAP_API_TOKEN:?Set SCRS_BOOTSTRAP_API_TOKEN}
      SCRS_REMEDIATION_ENABLED: ${SCRS_REMEDIATION_ENABLED:-true}
      SCRS_DOCS_PUBLIC: ${SCRS_DOCS_PUBLIC:-true}
      SCRS_CORS_ORIGINS: ${SCRS_CORS_ORIGINS:-}
      SCRS_TRUSTED_PROXY_CIDRS: ${SCRS_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      scrs-storage-init:
        condition: service_completed_successfully
    networks:
      - default
      - proxy
      - qa
      - sast
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${SCRS_TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.rule=Host(`${SCRS_DOMAIN:?Set SCRS_DOMAIN to your DNS hostname}`) && (Path(`/scrs/v1`) || PathPrefix(`/scrs/v1/`))"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.entrypoints=${SCRS_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.tls=true"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.tls.certresolver=${SCRS_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.service=${SCRS_ROUTER_NAME:-scrs}"
      - "traefik.http.services.${SCRS_ROUTER_NAME:-scrs}.loadbalancer.server.port=7000"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.rule=Host(`${SCRS_DOMAIN}`) && (Path(`/scrs/v1`) || PathPrefix(`/scrs/v1/`))"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.entrypoints=${SCRS_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.middlewares=${SCRS_ROUTER_NAME:-scrs}-https"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.service=${SCRS_ROUTER_NAME:-scrs}"
      - "traefik.http.middlewares.${SCRS_ROUTER_NAME:-scrs}-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${SCRS_ROUTER_NAME:-scrs}-https.redirectscheme.permanent=true"
    expose:
      - "7000"
    read_only: true
    # YARA rule validation compiles in a scratch directory (rules up to 16 MiB).
    tmpfs: ["/tmp:size=67108864,mode=1777,noexec,nosuid"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrs", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  scrs-worker:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *scrs-storage-env
      SCRS_MASTER_KEY: ${SCRS_MASTER_KEY:?Set SCRS_MASTER_KEY}
      SCRS_SCANNER_URL: http://scrs-scanner:8081/scan
      SCRS_MAX_IMAGE_BYTES: ${SCRS_MAX_IMAGE_BYTES:-419430400}
      SCRS_SNAPSHOT_ARCHIVES: ${SCRS_SNAPSHOT_ARCHIVES:-false}
      SCRS_RESCAN_INTERVAL_HOURS: ${SCRS_RESCAN_INTERVAL_HOURS:-0}
      # GitHub webhook delivery check: redeliver missed events (0 disables).
      SCRS_GITHUB_HOOK_CHECK_MINUTES: ${SCRS_GITHUB_HOOK_CHECK_MINUTES:-5}
      SCRS_GITHUB_HOOK_URL: ${SCRS_GITHUB_HOOK_URL:-}
      # TAXII 2.1 feeds: how often due feeds are checked (0 disables polling),
      # and feed hosts allowed to resolve to private addresses.
      SCRS_TAXII_POLL_SECONDS: ${SCRS_TAXII_POLL_SECONDS:-60}
      SCRS_TAXII_PRIVATE_HOSTS: ${SCRS_TAXII_PRIVATE_HOSTS:-}
      # E2E QA: the stack's Karate runner over the private qa network (set an
      # https URL instead for a runner on another host); test generation calls
      # the LLM providers added through the API.
      SCRS_QA_RUNNER_URL: ${SCRS_QA_RUNNER_URL:-http://scrs-qa-runner:8090}
      SCRS_QA_RUNNER_TOKEN: ${SCRS_QA_RUNNER_TOKEN:?Set SCRS_QA_RUNNER_TOKEN}
      # SAST and Go reachability in scrs-sast over the internal sast network.
      # Off by default; enable per deployment here or per asset (PUT /assets/{id}/sast).
      SCRS_SAST_URL: ${SCRS_SAST_URL:-http://scrs-sast:8083}
      SCRS_SAST_API_TOKEN: ${SCRS_SAST_API_TOKEN:?Set SCRS_SAST_API_TOKEN}
      SCRS_SAST_ENABLED: ${SCRS_SAST_ENABLED:-false}
      SCRS_REACHABILITY_ENABLED: ${SCRS_REACHABILITY_ENABLED:-false}
      SCRS_SAST_TIMEOUT: ${SCRS_SAST_TIMEOUT:-10m}
      SCRS_REACHABILITY_WEIGHTS: ${SCRS_REACHABILITY_WEIGHTS:-10,-15}
      SCRS_QA_RUNNER_ALLOW_HTTP: ${SCRS_QA_RUNNER_ALLOW_HTTP:-true}
      SCRS_QA_MAX_ACTIVE: ${SCRS_QA_MAX_ACTIVE:-4}
      # NVD and CVE Program advisory sync (0 disables); retention defaults.
      SCRS_ADVISORY_SYNC_SECONDS: ${SCRS_ADVISORY_SYNC_SECONDS:-60}
      SCRS_NVD_API_KEY: ${SCRS_NVD_API_KEY:-}
      SCRS_RETENTION_DEFAULT_CLOSED_FINDINGS_DAYS: ${SCRS_RETENTION_DEFAULT_CLOSED_FINDINGS_DAYS:-}
      SCRS_RETENTION_DEFAULT_AUDIT_LOG_DAYS: ${SCRS_RETENTION_DEFAULT_AUDIT_LOG_DAYS:-}
      # Licence metadata and version lists from deps.dev; compliance report builds.
      SCRS_DEPSDEV_ENABLED: ${SCRS_DEPSDEV_ENABLED:-true}
      SCRS_DEPSDEV_URL: ${SCRS_DEPSDEV_URL:-}
      SCRS_DEPSDEV_PRIVATE_HOSTS: ${SCRS_DEPSDEV_PRIVATE_HOSTS:-}
      SCRS_DEPSDEV_MAX_LOOKUPS: ${SCRS_DEPSDEV_MAX_LOOKUPS:-2000}
      SCRS_REPORT_POLL_SECONDS: ${SCRS_REPORT_POLL_SECONDS:-30}
      SCRS_QA_GENERATION_ENABLED: ${SCRS_QA_GENERATION_ENABLED:-true}
      SCRS_LLM_PRIVATE_HOSTS: ${SCRS_LLM_PRIVATE_HOSTS:-}
      # Git history mirrors (bundles in S3); scheduled for assets labelled mirror=true.
      SCRS_MIRRORS_ENABLED: ${SCRS_MIRRORS_ENABLED:-true}
      SCRS_MIRROR_INTERVAL_HOURS: ${SCRS_MIRROR_INTERVAL_HOURS:-0}
      SCRS_MIRROR_MAX_BYTES: ${SCRS_MIRROR_MAX_BYTES:-2147483648}
      SCRS_MIRROR_KEEP: ${SCRS_MIRROR_KEEP:-7}
      SCRS_MIRROR_MIN_AGE_DAYS: ${SCRS_MIRROR_MIN_AGE_DAYS:-30}
      SCRS_REMEDIATION_ENABLED: ${SCRS_REMEDIATION_ENABLED:-true}
      SCRS_SCANNER_API_TOKEN: ${SCRS_SCANNER_API_TOKEN:?Set a separate random scanner service token}
      # Outbound webhooks are delivered from the worker (OUT-001/002).
      SCRS_PUBLIC_BASE_URL: ${SCRS_PUBLIC_BASE_URL:-}
      SCRS_WEBHOOK_PRIVATE_HOSTS: ${SCRS_WEBHOOK_PRIVATE_HOSTS:-}
      SCRS_EVENT_MAX_BYTES: ${SCRS_EVENT_MAX_BYTES:-1048576}
      SCRS_EVENT_FIELD_MAX: ${SCRS_EVENT_FIELD_MAX:-512}
      SCRS_EVENT_REDACT: ${SCRS_EVENT_REDACT:-}
    depends_on:
      scrs-storage-init:
        condition: service_completed_successfully
      scrs-scanner:
        condition: service_healthy
    networks: [default, scanning, qa, sast]
    read_only: true
    # YARA patterns from TAXII feeds compile in a scratch directory.
    tmpfs: ["/tmp:size=67108864,mode=1777,noexec,nosuid"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    labels: ["traefik.enable=false"]

  scrs-scanner:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["scanner"]
    restart: unless-stopped
    environment:
      SCRS_SCANNER_API_TOKEN: ${SCRS_SCANNER_API_TOKEN:?Set SCRS_SCANNER_API_TOKEN}
      SCRS_OSV_DB: /feeds/current
      SCRS_WORK_ROOT: /work
      SCRS_CLAMD_ADDRESS: ${SCRS_CLAMD_ADDRESS:-scrs-clamav:3310}
      SCRS_INDICATOR_FILE: ${SCRS_INDICATOR_FILE:-}
      SCRS_REMEDIATION_ENABLED: ${SCRS_REMEDIATION_ENABLED:-true}
      SCRS_REMEDIATION_PROXY: http://scrs-egress-proxy:8082
      SCRS_MAX_IMAGE_BYTES: ${SCRS_MAX_IMAGE_BYTES:-419430400}
    networks: [scanning]
    volumes: ["scrs-feeds:/feeds:ro"]
    # Holds one extracted repository or one streamed image archive at a time.
    tmpfs: ["/work:size=1073741824,mode=1777,noexec,nosuid"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SCRS_SCANNER_MEMORY:-3g}
    cpus: 2
    pids_limit: 128
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrs", "scanner-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      # First deploy waits for feed-sync to download and validate the OSV
      # archives (npm alone is ~220 MiB); the worker starts once this is healthy.
      start_period: 15m
      start_interval: 10s

  scrs-clamav:
    user: clamav
    entrypoint: /init-unprivileged
    cap_drop: [ALL]
    image: ${SCRS_CLAMAV_IMAGE:-clamav/clamav:1.5.4-debian13-slim@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc}
    restart: unless-stopped
    networks: [default, scanning]
    volumes: ["scrs-clamav-signatures:/var/lib/clamav"]
    mem_limit: ${SCRS_CLAMAV_MEMORY:-4g}
    cpus: 2
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    labels: ["traefik.enable=false"]

  # Installs the embedded YARA ruleset into ClamAV's database volume after
  # ClamAV has created and owns it, then asks clamd to reload. Runs as the
  # clamav uid of the pinned official image (1000). Re-runs on each deploy.
  scrs-yara-rules:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["yara-install"]
    user: "1000:1000"
    restart: "no"
    environment:
      SCRS_CLAMAV_DATABASE: /clamav-db
      SCRS_CLAMD_ADDRESS: ${SCRS_CLAMD_ADDRESS:-scrs-clamav:3310}
    depends_on:
      scrs-clamav:
        condition: service_started
    networks: [scanning]
    volumes: ["scrs-clamav-signatures:/clamav-db"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    labels: ["traefik.enable=false"]

  scrs-egress-proxy:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["egress-proxy"]
    restart: unless-stopped
    networks: [default, scanning]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    labels: ["traefik.enable=false"]

  # Go module downloads for reachability analysis: proxy.golang.org and
  # sum.golang.org only (SCRS_EGRESS_PROFILE=go-modules).
  scrs-sast-egress:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["egress-proxy"]
    restart: unless-stopped
    environment:
      SCRS_EGRESS_PROFILE: go-modules
    networks: [default, sast]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    labels: ["traefik.enable=false"]

  # SAST analyzers and Go reachability (its own image, deploy/Dockerfile.sast).
  # It reads repository code but never runs it, holds no SCRS secrets except
  # its own bearer token, and sits only on the internal sast network: its one
  # route out is scrs-sast-egress. It is not published through Traefik.
  scrs-sast:
    image: ${SCRS_SAST_IMAGE:?Set SCRS_SAST_IMAGE to your published scrs-sast image reference}
    command: ["sast"]
    restart: unless-stopped
    environment:
      SCRS_SAST_API_TOKEN: ${SCRS_SAST_API_TOKEN:?Set SCRS_SAST_API_TOKEN}
      SCRS_SAST_ANALYZERS: ${SCRS_SAST_ANALYZERS:-gosec,bandit,opengrep,bearer}
      SCRS_SAST_SLOTS: ${SCRS_SAST_SLOTS:-1}
      SCRS_SAST_GO_PROXY: http://scrs-sast-egress:8082
      SCRS_OSV_DB: /feeds/current
      SCRS_WORK_ROOT: /work
    networks: [sast]
    volumes: ["scrs-feeds:/feeds:ro"]
    tmpfs:
      # Source, analyzer scratch, Go module cache and the govulncheck database.
      - /work:size=${SCRS_SAST_WORK_SIZE:-4g},mode=1777,nosuid
      - /tmp:size=256m,mode=1777,noexec,nosuid
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SCRS_SAST_MEMORY:-4g}
    cpus: 2
    pids_limit: 512
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrs", "sast-healthcheck"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s

  scrs-feed-sync:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["feed-sync", "--loop"]
    user: "0:0"
    restart: unless-stopped
    environment:
      SCRS_FEED_ROOT: /feeds
      SCRS_OSV_ECOSYSTEMS: ${SCRS_OSV_ECOSYSTEMS:-npm,Go,Maven,PyPI,Pub,SwiftURL,RubyGems,Alpine,Debian}
    volumes: ["scrs-feeds:/feeds"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    labels: ["traefik.enable=false"]

  # E2E QA Karate runner (its own image, deploy/karate-runner/Dockerfile).
  # SCRS reaches it privately at http://scrs-qa-runner:8090 on the internal
  # qa network; Traefik also publishes it at SCRS_QA_DOMAIN for external
  # callers, limited to SCRS_QA_RUNNER_ALLOWED_CIDRS and the bearer token.
  # It runs repository test code: it holds no SCRS secrets and is kept off
  # the default network. See docs/QA_TESTING.md for the host firewall rules.
  scrs-qa-runner:
    image: ${SCRS_QA_RUNNER_IMAGE:?Set SCRS_QA_RUNNER_IMAGE to your published runner image reference}
    restart: unless-stopped
    environment:
      SCRS_QA_RUNNER_TOKEN: ${SCRS_QA_RUNNER_TOKEN:?Set SCRS_QA_RUNNER_TOKEN}
      SCRS_QA_RUNNER_SLOTS: ${SCRS_QA_RUNNER_SLOTS:-1}
      SCRS_QA_RUNNER_MAX_QUEUED: ${SCRS_QA_RUNNER_MAX_QUEUED:-20}
      SCRS_QA_RUNNER_RETENTION_HOURS: ${SCRS_QA_RUNNER_RETENTION_HOURS:-24}
      # Tests run as this user: they cannot read the runner's token.
      SCRS_QA_RUNNER_JOB_UID: "10001"
      SCRS_QA_RUNNER_JOB_GID: "10001"
    networks:
      - qa
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${SCRS_TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}.rule=Host(`${SCRS_QA_DOMAIN:?Set SCRS_QA_DOMAIN to the runner's DNS hostname}`)"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}.entrypoints=${SCRS_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}.tls=true"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}.tls.certresolver=${SCRS_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}.middlewares=${SCRS_QA_ROUTER_NAME:-scrs-qa}-allow"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}.service=${SCRS_QA_ROUTER_NAME:-scrs-qa}"
      - "traefik.http.services.${SCRS_QA_ROUTER_NAME:-scrs-qa}.loadbalancer.server.port=8090"
      - "traefik.http.middlewares.${SCRS_QA_ROUTER_NAME:-scrs-qa}-allow.ipallowlist.sourcerange=${SCRS_QA_RUNNER_ALLOWED_CIDRS:-127.0.0.1/32}"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}-http.rule=Host(`${SCRS_QA_DOMAIN}`)"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}-http.entrypoints=${SCRS_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}-http.middlewares=${SCRS_QA_ROUTER_NAME:-scrs-qa}-https"
      - "traefik.http.routers.${SCRS_QA_ROUTER_NAME:-scrs-qa}-http.service=${SCRS_QA_ROUTER_NAME:-scrs-qa}"
      - "traefik.http.middlewares.${SCRS_QA_ROUTER_NAME:-scrs-qa}-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${SCRS_QA_ROUTER_NAME:-scrs-qa}-https.redirectscheme.permanent=true"
    expose:
      - "8090"
    # The supervisor starts as root only to switch test processes to the job
    # user and manage their files; every other capability is dropped.
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE, KILL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /work:size=${SCRS_QA_RUNNER_WORK_SIZE:-2g},mode=0711
      - /tmp:size=512m,mode=1777
    shm_size: 1g
    mem_limit: ${SCRS_QA_RUNNER_MEMORY:-3g}
    pids_limit: 2048
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  scrs-clamav-signatures:
  scrs-feeds:


networks:
  scanning:
    internal: true
  # API and worker <-> Karate runner only; no route out.
  qa:
    internal: true
