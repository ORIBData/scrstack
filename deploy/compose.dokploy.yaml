x-scrs-storage-env: &scrs-storage-env
  SCRS_DATABASE_URL: ${SCRS_DATABASE_URL:?Set SCRS_DATABASE_URL}
  SCRS_DATABASE_SCHEMA: ${SCRS_DATABASE_SCHEMA:-scrs}
  SCRS_REDIS_QUEUE_URL: ${SCRS_REDIS_QUEUE_URL:?Set SCRS_REDIS_QUEUE_URL}
  SCRS_REDIS_CACHE_URL: ${SCRS_REDIS_CACHE_URL:-}
  SCRS_S3_ENDPOINT: ${SCRS_S3_ENDPOINT:?Set SCRS_S3_ENDPOINT}
  SCRS_S3_REGION: ${SCRS_S3_REGION:?Set SCRS_S3_REGION}
  SCRS_S3_BUCKET: ${SCRS_S3_BUCKET:?Set SCRS_S3_BUCKET}
  SCRS_S3_ACCESS_KEY: ${SCRS_S3_ACCESS_KEY:?Set SCRS_S3_ACCESS_KEY}
  SCRS_S3_SECRET_KEY: ${SCRS_S3_SECRET_KEY:?Set SCRS_S3_SECRET_KEY}
  SCRS_S3_FORCE_PATH_STYLE: ${SCRS_S3_FORCE_PATH_STYLE:-true}

services:
  scrs-storage-init:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE to your published full image reference}
    command: ["init"]
    environment:
      <<: *scrs-storage-env
      SCRS_DATABASE_ADMIN_URL: ${SCRS_DATABASE_ADMIN_URL:-}
      SCRS_MASTER_KEY: ${SCRS_MASTER_KEY:?Set SCRS_MASTER_KEY to base64 of 32 bytes}
    labels:
      - "traefik.enable=false"
    restart: "no"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  scrs-api:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE to your published full image reference}
    restart: unless-stopped
    environment:
      <<: *scrs-storage-env
      SCRS_HTTP_ADDR: ":7000"
      SCRS_GITHUB_WEBHOOK_SECRET: ${SCRS_GITHUB_WEBHOOK_SECRET:-}
      SCRS_RELAY_ENABLED: ${SCRS_RELAY_ENABLED:-false}
      SCRS_MASS_DELETION_FILES: ${SCRS_MASS_DELETION_FILES:-50}
      SCRS_PUBLIC_BASE_URL: ${SCRS_PUBLIC_BASE_URL:-}
      SCRS_WEBHOOK_PRIVATE_HOSTS: ${SCRS_WEBHOOK_PRIVATE_HOSTS:-}
      SCRS_EVENT_MAX_BYTES: ${SCRS_EVENT_MAX_BYTES:-1048576}
      SCRS_EVENT_FIELD_MAX: ${SCRS_EVENT_FIELD_MAX:-512}
      SCRS_EVENT_REDACT: ${SCRS_EVENT_REDACT:-}
      SCRS_MASTER_KEY: ${SCRS_MASTER_KEY:?Set SCRS_MASTER_KEY}
      SCRS_BOOTSTRAP_API_TOKEN: ${SCRS_BOOTSTRAP_API_TOKEN:?Set SCRS_BOOTSTRAP_API_TOKEN}
      SCRS_REMEDIATION_ENABLED: ${SCRS_REMEDIATION_ENABLED:-true}
      SCRS_DOCS_PUBLIC: ${SCRS_DOCS_PUBLIC:-true}
      SCRS_CORS_ORIGINS: ${SCRS_CORS_ORIGINS:-}
      SCRS_TRUSTED_PROXY_CIDRS: ${SCRS_TRUSTED_PROXY_CIDRS:-}
    depends_on:
      scrs-storage-init:
        condition: service_completed_successfully
    networks:
      - default
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${SCRS_TRAEFIK_NETWORK:-dokploy-network}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.rule=Host(`${SCRS_DOMAIN:?Set SCRS_DOMAIN to your DNS hostname}`) && (Path(`/scrs/v1`) || PathPrefix(`/scrs/v1/`))"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.entrypoints=${SCRS_HTTPS_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.tls=true"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.tls.certresolver=${SCRS_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}.service=${SCRS_ROUTER_NAME:-scrs}"
      - "traefik.http.services.${SCRS_ROUTER_NAME:-scrs}.loadbalancer.server.port=7000"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.rule=Host(`${SCRS_DOMAIN}`) && (Path(`/scrs/v1`) || PathPrefix(`/scrs/v1/`))"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.entrypoints=${SCRS_HTTP_ENTRYPOINT:-web}"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.middlewares=${SCRS_ROUTER_NAME:-scrs}-https"
      - "traefik.http.routers.${SCRS_ROUTER_NAME:-scrs}-http.service=${SCRS_ROUTER_NAME:-scrs}"
      - "traefik.http.middlewares.${SCRS_ROUTER_NAME:-scrs}-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.${SCRS_ROUTER_NAME:-scrs}-https.redirectscheme.permanent=true"
    expose:
      - "7000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrs", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  scrs-worker:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["worker"]
    restart: unless-stopped
    environment:
      <<: *scrs-storage-env
      SCRS_MASTER_KEY: ${SCRS_MASTER_KEY:?Set SCRS_MASTER_KEY}
      SCRS_SCANNER_URL: http://scrs-scanner:8081/scan
      SCRS_MAX_IMAGE_BYTES: ${SCRS_MAX_IMAGE_BYTES:-419430400}
      SCRS_SNAPSHOT_ARCHIVES: ${SCRS_SNAPSHOT_ARCHIVES:-false}
      SCRS_RESCAN_INTERVAL_HOURS: ${SCRS_RESCAN_INTERVAL_HOURS:-0}
      SCRS_REMEDIATION_ENABLED: ${SCRS_REMEDIATION_ENABLED:-true}
      SCRS_SCANNER_API_TOKEN: ${SCRS_SCANNER_API_TOKEN:?Set a separate random scanner service token}
      # Outbound webhooks are delivered from the worker (OUT-001/002).
      SCRS_PUBLIC_BASE_URL: ${SCRS_PUBLIC_BASE_URL:-}
      SCRS_WEBHOOK_PRIVATE_HOSTS: ${SCRS_WEBHOOK_PRIVATE_HOSTS:-}
      SCRS_EVENT_MAX_BYTES: ${SCRS_EVENT_MAX_BYTES:-1048576}
      SCRS_EVENT_FIELD_MAX: ${SCRS_EVENT_FIELD_MAX:-512}
      SCRS_EVENT_REDACT: ${SCRS_EVENT_REDACT:-}
    depends_on:
      scrs-storage-init:
        condition: service_completed_successfully
      scrs-scanner:
        condition: service_healthy
    networks: [default, scanning]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    labels: ["traefik.enable=false"]

  scrs-scanner:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["scanner"]
    restart: unless-stopped
    environment:
      SCRS_SCANNER_API_TOKEN: ${SCRS_SCANNER_API_TOKEN:?Set SCRS_SCANNER_API_TOKEN}
      SCRS_OSV_DB: /feeds/current
      SCRS_WORK_ROOT: /work
      SCRS_CLAMD_ADDRESS: ${SCRS_CLAMD_ADDRESS:-scrs-clamav:3310}
      SCRS_INDICATOR_FILE: ${SCRS_INDICATOR_FILE:-}
      SCRS_REMEDIATION_ENABLED: ${SCRS_REMEDIATION_ENABLED:-true}
      SCRS_REMEDIATION_PROXY: http://scrs-egress-proxy:8082
      SCRS_MAX_IMAGE_BYTES: ${SCRS_MAX_IMAGE_BYTES:-419430400}
    networks: [scanning]
    volumes: ["scrs-feeds:/feeds:ro"]
    # Holds one extracted repository or one streamed image archive at a time.
    tmpfs: ["/work:size=1073741824,mode=1777,noexec,nosuid"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${SCRS_SCANNER_MEMORY:-3g}
    cpus: 2
    pids_limit: 128
    labels: ["traefik.enable=false"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrs", "scanner-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      # First deploy waits for feed-sync to download and validate the OSV
      # archives (npm alone is ~220 MiB); the worker starts once this is healthy.
      start_period: 15m
      start_interval: 10s

  scrs-clamav:
    user: clamav
    entrypoint: /init-unprivileged
    cap_drop: [ALL]
    image: ${SCRS_CLAMAV_IMAGE:-clamav/clamav:1.5.4-debian13-slim@sha256:76a9c3b63764b78178dc68fa7efcceca0cde2c8c9d4f925a8e697cb4511f8fdc}
    restart: unless-stopped
    networks: [default, scanning]
    volumes: ["scrs-clamav-signatures:/var/lib/clamav"]
    mem_limit: ${SCRS_CLAMAV_MEMORY:-4g}
    cpus: 2
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    labels: ["traefik.enable=false"]

  # Installs the embedded YARA ruleset into ClamAV's database volume after
  # ClamAV has created and owns it, then asks clamd to reload. Runs as the
  # clamav uid of the pinned official image (1000). Re-runs on each deploy.
  scrs-yara-rules:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["yara-install"]
    user: "1000:1000"
    restart: "no"
    environment:
      SCRS_CLAMAV_DATABASE: /clamav-db
      SCRS_CLAMD_ADDRESS: ${SCRS_CLAMD_ADDRESS:-scrs-clamav:3310}
    depends_on:
      scrs-clamav:
        condition: service_started
    networks: [scanning]
    volumes: ["scrs-clamav-signatures:/clamav-db"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    labels: ["traefik.enable=false"]

  scrs-egress-proxy:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["egress-proxy"]
    restart: unless-stopped
    networks: [default, scanning]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 32
    labels: ["traefik.enable=false"]

  scrs-feed-sync:
    image: ${SCRS_IMAGE:?Set SCRS_IMAGE}
    command: ["feed-sync", "--loop"]
    user: "0:0"
    restart: unless-stopped
    environment:
      SCRS_FEED_ROOT: /feeds
      SCRS_OSV_ECOSYSTEMS: ${SCRS_OSV_ECOSYSTEMS:-npm,Go}
    volumes: ["scrs-feeds:/feeds"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    labels: ["traefik.enable=false"]

volumes:
  scrs-clamav-signatures:
  scrs-feeds:


networks:
  scanning:
    internal: true
  proxy:
    external: true
    name: ${SCRS_TRAEFIK_NETWORK:-dokploy-network}

# Labels manage routing. Do not add a second Domains UI router or StripPrefix.
# Dokploy's existing Traefik owns ACME storage, challenge handling and renewal.
