name: SCRS validation

on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Race tests, lint, contracts and deployment configuration
        run: make qa
      - name: Pinned upstream scanner and untrusted repository regressions
        run: make scanner-test
      - name: PostgreSQL, Redis, authorization and restore regressions
        run: make database-test
      - name: API image and disposable hosted-storage integration
        run: make storage-integration
      - name: Private ClamAV clean, EICAR and SCRS YARA ruleset
        run: make malware-test
      - name: Registry pull by digest and offline image inventory
        run: make image-scan-test
      - name: Go vulnerability assessment
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Scanner dependency vulnerability assessment
        working-directory: tools/osv
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 github.com/google/osv-scanner/v2/cmd/osv-scanner
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Cross-build SCRS API image without publishing
        run: docker build --platform linux/${{ matrix.arch }} -f deploy/Dockerfile.scrs -t scrs:ci-${{ matrix.arch }} .
