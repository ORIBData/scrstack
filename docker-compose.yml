services:
  clamav-rest:
    mem_reservation: 262144000
    mem_limit: 1048576000
    # Legacy internal scanner only; SCRS API deployment is deploy/compose.dokploy.yaml.
    build:
      context: .
      dockerfile: Dockerfile
    image: scrs-legacy:local
    environment:
      SCRS_SCANNER_API_TOKEN: ${SCRS_SCANNER_API_TOKEN:?Set a separate internal scanner token of at least 32 characters}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/"]
      interval: 60s
      timeout: 2s
      retries: 2
      # ClamAV and the virus DB load can take a while on cold start, so allow extra startup time
      # before Compose starts counting healthcheck failures against the container.
      start_period: 210s
