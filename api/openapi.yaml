openapi: 3.1.0
info:
  title: Supply Chain Risk Stack API
  version: 0.2.0
  description: >-
    Supply-chain risk assessments for GitHub repositories with offline OSV matching, CycloneDX SBOMs,
    ClamAV and YARA malware scanning, IOC matching, workflow and install-hook integrity checks,
    KEV/EPSS enrichment and a persistent risk register. Authenticated requests allow 120 calls per
    token per sliding minute (429 with Retry-After). Redis/auth-store outages fail closed with 503.
    Verdict precedence is fail > incomplete > warn > pass; a partial scan is never pass. Every
    response carries X-Request-Id. Outbound webhooks are signed with X-SCRS-Signature
    (sha256 HMAC of the exact body) and carry Idempotency-Key (event id). Guided npm and Maven
    remediation plans never write to repositories.
servers:
  - url: /scrs/v1
paths:
  /webhooks/github:
    post:
      operationId: githubPushWebhook
      summary: Direct GitHub delivery (HMAC); same processing as /ingest/github
      description: Requires X-Hub-Signature-256, X-GitHub-Delivery UUID and X-GitHub-Event. push and pull_request (opened, synchronize, reopened) queue assessments; push, delete, create, repository, member and organization events raise integrity alerts (force push, ref deletion, branch churn, mass deletion, default-branch, visibility and membership changes, campaign patterns). Other event types are acknowledged with 200. Delivery replay is idempotent for 24 hours.
      responses:
        '202': {description: Push durably queued with raw event}
        '200': {description: Replay, ping, deleted-ref or non-branch (tag) push acknowledgement}
        '401': {description: Invalid provider signature}
        '409': {description: Same delivery ID with different payload}
        '422': {description: Ambiguous connection}
        '503': {description: Webhook secret not configured}
  /feeds/indicators:
    get:
      operationId: activeIndicators
      security: [{bearerAuth: []}]
      summary: Read active versioned IOC bundle (admin)
      responses:
        '200': {description: Version and normalized indicators}
        '404': {description: No active bundle}
    put:
      operationId: importIndicators
      security: [{bearerAuth: []}]
      summary: Atomically import and activate immutable IOC version (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version, indicators]
              properties:
                version: {type: string, minLength: 1, maxLength: 128}
                indicators:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    additionalProperties: false
                    required: [id, type, value, valid_until]
                    properties:
                      id: {type: string, maxLength: 128}
                      type: {type: string, enum: [sha256, domain]}
                      value: {type: string}
                      valid_until: {type: string, format: date-time}
      responses:
        '201': {description: Activated and audited; previous version retained}
        '400': {description: Invalid indicators}
        '409': {description: Version already exists}
  /assessments/{id}/files:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentFiles
      summary: File hash, size and malware status; source content is excluded
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Bounded file evidence inventory}
        '409': {description: File evidence unavailable}
  /assessments/{id}/remediations:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: automaticRemediationPlans
      summary: Automatic child plans and dispatch state for this assessment
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Manifest, child assessment ID, dispatch state and job status}
  /settings/retention:
    get:
      operationId: getRetention
      security: [{bearerAuth: []}]
      summary: Read raw-ingress retention policy and ETag (admin)
      responses:
        '200': {description: revision and inbound_event_days; zero keeps forever}
    put:
      operationId: setRetention
      security: [{bearerAuth: []}]
      summary: Update raw-ingress retention policy atomically (admin)
      parameters: [{name: If-Match, in: header, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [inbound_event_days], properties: {inbound_event_days: {type: integer, minimum: 0, maximum: 36500}}}
      responses:
        '200': {description: Saved policy with new ETag}
        '409': {description: Policy revision changed}
        '428': {description: If-Match required}
  /settings/retention:preview:
    post:
      operationId: previewRetention
      security: [{bearerAuth: []}]
      summary: Count raw events eligible for removal and stored JSON bytes (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [inbound_event_days], properties: {inbound_event_days: {type: integer, minimum: 0, maximum: 36500}}}
      responses:
        '200': {description: rows and bytes; excludes pending/running assessment events}
  /settings/retention:purge:
    post:
      operationId: purgeIngressEvents
      security: [{bearerAuth: []}]
      summary: Purge at most 1000 eligible raw events under the saved policy (admin)
      description: Preserves assessments, findings, audit records and all S3 artifacts. Default policy keeps forever. Scheduling and other retention classes are not supported yet.
      parameters: [{name: If-Match, in: header, required: true, schema: {type: string}}]
      responses:
        '200': {description: deleted_events count; purge audited atomically}
        '409': {description: Stale policy revision}
        '428': {description: If-Match required}
  /assessments:
    post:
      operationId: createAssessment
      summary: Queue assessment of a discovered, permitted GitHub repository (write or trigger)
      security: [{bearerAuth: []}]
      parameters:
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}, description: Actor-scoped replay key retained for 24 hours}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target]
              properties:
                connection: {type: string, description: Connection name or UUID; required when ambiguous}
                target:
                  type: object
                  additionalProperties: false
                  required: [type, repository]
                  properties:
                    type: {type: string, enum: [git]}
                    repository: {type: string, example: organization/repository}
                    ref: {type: string, default: HEAD}
                    commit: {type: string, pattern: '^[a-fA-F0-9]{40}$'}
                    pull_request:
                      type: object
                      description: Assess a PR head commit (commit required); ref becomes pull/<number>; base_ref is the new-versus-existing baseline
                      required: [number, base_ref]
                      properties:
                        number: {type: integer, minimum: 1}
                        base_ref: {type: string}
                        head_ref: {type: string}
                        title: {type: string, maxLength: 512}
                notify: {type: array, maxItems: 10, items: {type: string}, description: Restrict completion events to these webhook subscription names (TRG-008)}
                trigger:
                  type: object
                  additionalProperties: false
                  properties:
                    origin: {type: string, maxLength: 100}
                    event: {type: string, maxLength: 100}
                    delivery_id: {type: string, maxLength: 128}
                    actor: {type: string, maxLength: 100}
      responses:
        '202': {description: Durably queued; Location identifies the assessment}
        '200': {description: Idempotent replay}
        '400': {description: Invalid or unsupported target}
        '404': {description: Asset not registered or outside scope}
        '409': {description: Idempotency key reused for different request}
        '422': {description: Multiple connections match}
        '429': {description: Queue capacity or token rate limit reached}
    get:
      operationId: listAssessments
      summary: List jobs; trigger-only callers see only their own jobs
      security: [{bearerAuth: []}]
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: string, enum: [queued, running, succeeded, failed, cancelled, superseded]}}
        - {name: verdict, in: query, schema: {type: string, enum: [pass, warn, fail, incomplete]}}
        - {name: ref, in: query, schema: {type: string}}
        - {name: commit, in: query, schema: {type: string, pattern: '^[a-fA-F0-9]{40}$'}}
        - {name: actor, in: query, schema: {type: string}, description: Claimed actor (INT-016)}
        - {name: created_after, in: query, schema: {type: string, format: date-time}}
        - {name: created_before, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Up to 100 items with next_cursor}
  /assessments/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAssessment
      summary: Read status, revision, coverage, counts (including new and waived), diff and verdict
      security: [{bearerAuth: []}]
      parameters:
        - {name: wait, in: query, schema: {type: integer, minimum: 0, maximum: 60}, description: Long-poll while queued or running (TRG-009)}
      responses:
        '200': {description: Assessment; succeeded describes execution and does not imply a pass verdict}
        '404': {description: Assessment unavailable to caller}
    delete:
      operationId: cancelAssessment
      summary: Cancel a pending job without deleting history (write or own trigger job)
      security: [{bearerAuth: []}]
      responses:
        '204': {description: Cancelled; stale workers cannot publish results}
        '409': {description: Job already terminal}
  /register:
    get:
      operationId: listFindings
      summary: Persistent finding register (read or write)
      security: [{bearerAuth: []}]
      parameters:
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Up to 100 findings with next_cursor}
  /register/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: transitionFinding
      summary: Audit a status change; accepted, suppressed and false_positive require admin
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: {type: string, enum: [open, triaged, in_progress, accepted, suppressed, false_positive]}
                reason: {type: string, minLength: 8, maxLength: 2000}
                expires_at: {type: string, format: date-time, description: Required only for accepted; future and at most 90 days}
      responses:
        '204': {description: Status and audit event persisted atomically}
        '400': {description: Invalid transition or expiry}
        '403': {description: Insufficient scope}
  /register/{id}/events:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: findingEvents
      security: [{bearerAuth: []}]
      summary: Latest 100 detection and status events
      responses:
        '200': {description: Events newest first}
  /remediation/capabilities:
    get:
      operationId: remediationCapabilities
      security: [{bearerAuth: []}]
      summary: Runtime capability and enablement; npm in-place and Maven override
      responses:
        '200': {description: Capability matrix; repository_writes is always false}
  /assets/{id}/remediations:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: createRemediationPlan
      security: [{bearerAuth: []}]
      summary: Queue advice for a prior assessed npm package-lock.json at its exact commit (write)
      parameters: [{name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assessment_id, manifest]
              properties:
                assessment_id: {type: string, format: uuid}
                manifest: {type: string, example: package-lock.json, description: package-lock.json (npm) or pom.xml (Maven)}
                strategy: {type: string, enum: [in-place, override], description: Defaults to in-place for npm and override for Maven}
      responses:
        '202': {description: Plan queued with assessment Location}
        '200': {description: Idempotent replay}
        '400': {description: Unsupported manifest or parent assessment}
        '503': {description: Remediation sandbox disabled}
  /assessments/{id}/components:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentComponents
      security: [{bearerAuth: []}]
      summary: Component inventory with ordinal cursor
      responses:
        '200': {description: Authorized assessment artifact or page}
        '404': {description: Assessment unavailable to caller}
        '409': {description: Artifact not yet available}
  /assessments/{id}/findings:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentFindings
      security: [{bearerAuth: []}]
      summary: Immutable detection snapshots with UUID cursor
      responses:
        '200': {description: Authorized assessment artifact or page}
        '404': {description: Assessment unavailable to caller}
        '409': {description: Artifact not yet available}
  /assessments/{id}/sbom:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentSbom
      security: [{bearerAuth: []}]
      summary: CycloneDX 1.6 JSON with SHA256 ETag; format=cyclonedx-json
      responses:
        '200': {description: Authorized assessment artifact or page}
        '404': {description: Assessment unavailable to caller}
        '409': {description: Artifact not yet available}
  /assessments/{id}/report:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentReport
      security: [{bearerAuth: []}]
      summary: Assessment summary in JSON or format=md; coverage remains explicit
      responses:
        '200': {description: Authorized assessment artifact or page}
        '404': {description: Assessment unavailable to caller}
        '409': {description: Artifact not yet available}
  /assessments/{id}/remediation:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentRemediation
      security: [{bearerAuth: []}]
      summary: Guided remediation JSON advice; never applies changes to the provider
      responses:
        '200': {description: Authorized assessment artifact or page}
        '404': {description: Assessment unavailable to caller}
        '409': {description: Artifact not yet available}
  /tokens:
    get:
      operationId: listTokens
      summary: List token metadata without secret values or hashes (admin only)
      security: [{bearerAuth: []}]
      parameters: [{name: cursor, in: query, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Up to 100 items and next_cursor}
        '401': {description: Unauthorized}
        '403': {description: Admin scope required}
    post:
      operationId: createToken
      summary: Create a scoped token; secret is shown once (admin only)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: {type: string, minLength: 1, maxLength: 100}
                scopes:
                  type: array
                  minItems: 1
                  maxItems: 5
                  uniqueItems: true
                  items: {type: string, enum: [read, write, admin, trigger, 'ingest:relay']}
                ip_allow_list: {type: array, maxItems: 32, items: {type: string, description: IPv4 or IPv6 CIDR}}
                expires_at: {type: string, format: date-time}
      responses:
        '201': {description: One-time token value and metadata}
        '400': {description: Invalid scopes, expiry or IP list}
        '401': {description: Unauthorized}
        '403': {description: Admin scope required}
        '409': {description: Token name already exists}
  /tokens/{id}:
    delete:
      operationId: revokeToken
      summary: Revoke a managed token; bootstrap is rotated through the environment
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '204': {description: Token revoked}
        '401': {description: Unauthorized}
        '403': {description: Admin scope required}
        '409': {description: Unknown or protected bootstrap token}
  /assets:
    get:
      operationId: listAssets
      summary: Page through discovered assets with connection and in-scope flags
      security: [{bearerAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      responses:
        '200': { description: Asset page with items and next_cursor }
        '401': { description: Missing or invalid admin token }
  /connections:
    get:
      operationId: listConnections
      summary: List provider connections without credentials (admin only; next page in X-Next-Cursor header)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {name: cursor, in: query, schema: {type: string}}
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Connection list
          headers:
            X-Next-Cursor: {description: Opaque cursor for the next page; absent on final page, schema: {type: string}}
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Connection' }
        '401': { description: Missing or invalid admin token }
    post:
      operationId: createConnection
      summary: Create a provider connection
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConnection' }
      responses:
        '201':
          description: Connection created; credential omitted from response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '400': { description: Invalid connection }
        '401': { description: Missing or invalid admin token }
        '409': { description: Connection name already exists }
  /connections/{id}:
    get:
      operationId: getConnection
      summary: Get one connection without its credential
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200':
          description: Connection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Connection' }
        '401': { description: Missing or invalid admin token }
        '404': { description: Connection not found }
    patch:
      operationId: updateConnection
      summary: Change scope or enabled state and withdraw asset eligibility until rediscovery
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                scope: {$ref: '#/components/schemas/Scope'}
                enabled: {type: boolean}
      responses:
        '200': {description: Updated connection with no credentials}
        '400': {description: Invalid input}
        '401': {description: Unauthorized}
        '403': {description: Admin scope required}
        '404': {description: Connection not found}
        '409': {description: Concurrent update; retry}
    delete:
      operationId: disableConnection
      summary: Disable connection while retaining assets and audit history
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Disabled connection}
        '401': {description: Unauthorized}
        '403': {description: Admin scope required}
        '404': {description: Connection not found}
        '409': {description: Concurrent update; retry}
  /connections/{id}:rotate-credential:
    post:
      operationId: rotateConnectionCredential
      summary: Replace encrypted credential and invalidate discovery eligibility
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: {type: object, writeOnly: true}
      responses:
        '200': {description: Updated connection without credential}
        '400': {description: Invalid credential}
        '401': {description: Unauthorized}
        '403': {description: Admin scope required}
        '404': {description: Connection not found}
        '409': {description: Concurrent update; retry}
  /connections/{id}:test:
    post:
      operationId: testConnection
      summary: Test credential and count visible resources
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': { description: Credential accepted and resource count returned }
        '401': { description: Missing or invalid admin token }
        '404': { description: Connection not found }
        '502': { description: Provider test failed }
  /connections/{id}:discover:
    post:
      operationId: discoverConnection
      summary: Discover accessible resources and mark matching assets in scope
      security: [{bearerAuth: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': { description: Discovery result }
        '401': { description: Missing or invalid admin token }
        '404': { description: Connection not found }
        '502': { description: Provider discovery failed }
  /system/healthz:
    get:
      operationId: getHealth
      summary: Process liveness
      responses:
        '200':
          description: Process is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /system/readyz:
    get:
      operationId: getReadiness
      summary: PostgreSQL, Redis and S3 readiness
      responses:
        '200':
          description: Configured backing services are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: A backing service is unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: unavailable
  /docs/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Download this OpenAPI contract
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string
  /docs:
    get:
      operationId: getSwaggerUI
      summary: Swagger UI
      responses:
        '200':
          description: Interactive API documentation
          content:
            text/html:
              schema:
                type: string
  /ingest/github:
    post:
      operationId: ingestGitHub
      summary: GitHub events in direct (X-Hub-Signature-256) or relay mode (Bearer ingest:relay token, SCRS_RELAY_ENABLED=true)
      description: Relay mode lets automation such as n8n forward GitHub's unchanged JSON body with X-GitHub-Event and X-GitHub-Delivery. Processing, idempotency and responses match /webhooks/github; the entry mode is recorded on the raw event.
      security: [{bearerAuth: []}, {}]
      responses:
        '202': {description: Assessment queued}
        '200': {description: Replay, acknowledgement, out-of-scope or integrity-only event}
        '401': {description: Invalid signature or token}
        '403': {description: Token lacks ingest:relay}
        '503': {description: Relay disabled or webhook secret not configured}
  /webhooks:
    get:
      operationId: listWebhookSubscriptions
      summary: Outbound webhook subscriptions (admin); secrets are never returned
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Subscriptions}
    post:
      operationId: createWebhookSubscription
      summary: Create a subscription; returns its signing secret once (admin)
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, url, events]
              properties:
                name: {type: string, maxLength: 100}
                url: {type: string, description: https URL to a public host; http or private addresses only for hosts in SCRS_WEBHOOK_PRIVATE_HOSTS}
                events: {type: array, items: {type: string, enum: [assessment.completed, assessment.failed, finding.created, finding.status_changed, integrity.alert, feed.stale, connection.degraded, maintenance.completed, ping]}}
                profile: {type: string, enum: [summary, full, agent], default: summary, description: full and agent replace assessment.completed data with the context document (OUT-005)}
                egress_ack: {type: boolean, description: Required for the agent profile}
                include_contacts: {type: boolean, default: false}
      responses:
        '201': {description: Subscription and one-time secret}
        '400': {description: URL, events or profile rejected}
        '409': {description: Name exists}
  /webhooks/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getWebhookSubscription
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Subscription with ETag revision}
    patch:
      operationId: updateWebhookSubscription
      summary: Change url, events, profile, egress_ack, include_contacts or enabled (If-Match required)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated}
        '409': {description: Stale revision}
        '428': {description: If-Match missing}
    delete:
      operationId: disableWebhookSubscription
      summary: Disable and keep the delivery log (If-Match required)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Disabled}
  /webhooks/{id}:rotate-secret:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: rotateWebhookSecret
      security: [{bearerAuth: []}]
      responses:
        '200': {description: New secret, returned once}
  /webhooks/{id}:test:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: pingWebhookSubscription
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Ping event queued}
  /webhooks/{id}/deliveries:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: listWebhookDeliveries
      summary: Delivery log; deliveries are dead-lettered after 8 attempts
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [pending, sending, delivered, dead]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Up to 100 deliveries with next_cursor}
  /webhooks/{id}/deliveries/{delivery}:redeliver:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: delivery, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: redeliverWebhook
      summary: Requeue a delivered or dead delivery with the same event id
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Requeued}
        '409': {description: Delivery still pending}
  /assessments:batch:
    post:
      operationId: batchAssessments
      summary: Queue up to 100 targets with per-item idempotency keys (write or trigger, TRG-011)
      security: [{bearerAuth: []}]
      responses:
        '207': {description: Per-item status, assessment_id or error}
        '400': {description: Empty or oversized batch}
  /assessments/latest:
    get:
      operationId: latestAssessment
      summary: Newest assessment of an exact commit (UC13); never treat incomplete as pass
      security: [{bearerAuth: []}]
      parameters:
        - {name: commit, in: query, required: true, schema: {type: string, pattern: '^[a-fA-F0-9]{40}$'}}
        - {name: repository, in: query, schema: {type: string}}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Assessment}
        '404': {description: No assessment of that commit}
  /assessments/{id}/context:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentContext
      summary: Full or agent context document (OUT-005 to OUT-007) with untrusted_paths and a size cap
      security: [{bearerAuth: []}]
      parameters:
        - {name: profile, in: query, schema: {type: string, enum: [full, agent], default: full}}
      responses:
        '200': {description: Context document}
  /assessments/{id}/vex:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentVEX
      summary: OpenVEX 0.2.0 statements from register triage
      security: [{bearerAuth: []}]
      responses:
        '200': {description: OpenVEX document}
  /assessments/{id}/snapshot:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: assessmentSnapshot
      summary: Download the stored source archive (admin; SCRS_SNAPSHOT_ARCHIVES=true)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Integrity-verified gzip tarball}
        '409': {description: No snapshot stored}
  /assets/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getAsset
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Asset with owner, environment, criticality, exposure, labels and ETag}
    patch:
      operationId: updateAsset
      summary: Set owner_id (or null), environment, criticality 0-5, exposure, labels (write, If-Match)
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated}
        '400': {description: Invalid attribute or unknown owner}
        '409': {description: Stale revision}
  /assets/{id}/last-known-good:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: lastKnownGood
      summary: Newest passing revision of a ref with no open integrity entry (INT-017)
      security: [{bearerAuth: []}]
      parameters:
        - {name: ref, in: query, required: true, schema: {type: string}}
      responses:
        '200': {description: Commit and assessment}
        '404': {description: No qualifying revision}
  /owners:
    get:
      operationId: listOwners
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Owners}
    post:
      operationId: createOwner
      summary: Create an owner (write); contacts are excluded from event payloads unless opted in
      security: [{bearerAuth: []}]
      responses:
        '201': {description: Owner}
        '409': {description: Name exists}
  /owners/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      operationId: updateOwner
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Updated (If-Match required)}
  /system/metrics:
    get:
      operationId: metrics
      summary: Prometheus metrics (read scope); queue, verdict and delivery values come from PostgreSQL
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Prometheus text format}
  /maintenance/run:
    post:
      operationId: runMaintenance
      summary: Apply retention and expire idempotency keys now (admin); also runs hourly in the worker
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Maintenance report}
  /maintenance/rescan:
    post:
      operationId: rescanDefaultBranches
      summary: Queue default-branch assessments of all in-scope repositories (admin)
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Count queued}
  /maintenance/redeliver-dead:
    post:
      operationId: redeliverDeadWebhooks
      security: [{bearerAuth: []}]
      responses:
        '202': {description: Count requeued}
  /events/inbound:
    get:
      operationId: listInboundEvents
      summary: Stored raw deliveries and triggers (admin); filter by claimed actor or event type
      security: [{bearerAuth: []}]
      parameters:
        - {name: actor, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Up to 100 events with next_cursor}
  /events/inbound/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      operationId: getInboundEvent
      security: [{bearerAuth: []}]
      responses:
        '200': {description: Event including raw body}
  /events/inbound/{id}:replay:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      operationId: replayInboundEvent
      summary: Re-assess the revision an event produced, as a new assessment (admin)
      security: [{bearerAuth: []}]
      responses:
        '202': {description: New assessment queued}
        '409': {description: Event produced no assessment}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Scope:
      type: object
      required: [include]
      properties:
        include: {type: array, items: {type: string}}
        exclude: {type: array, items: {type: string}}
    Connection:
      type: object
      required: [id, provider, name, config, scope, status, enabled]
      properties:
        enabled: {type: boolean}
        id: {type: string, format: uuid}
        provider: {type: string, enum: [github, dockerhub, gar]}
        name: {type: string}
        config: {type: object, additionalProperties: true}
        scope: { $ref: '#/components/schemas/Scope' }
        status: {type: object, additionalProperties: true}
    CreateConnection:
      type: object
      required: [provider, name, config, scope, credential]
      properties:
        provider: {type: string, enum: [github, dockerhub, gar]}
        name: {type: string}
        config: {type: object, additionalProperties: true}
        scope: { $ref: '#/components/schemas/Scope' }
        credential:
          type: object
          additionalProperties: true
          writeOnly: true
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
