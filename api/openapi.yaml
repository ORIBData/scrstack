openapi: 3.1.0
info:
  title: Software Supply Chain Risk Stack (SCRS) API
  version: 0.5.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  summary: Software supply-chain risk assessments, SBOM and MBOM, risk register and automation for repositories and container images.
  description: |
    SCRS (Software Supply Chain Risk Stack) assesses GitHub/GitLab repositories and container
    images (Docker Hub, Google Artifact Registry, Harbor, any OCI registry) with offline OSV
    matching, ClamAV + YARA malware scanning, YARA-X rulesets, IOC matching (manual, STIX 2.1 and
    TAXII 2.1 sources), integrity rules and KEV/EPSS enrichment, and keeps a persistent risk
    register. Each assessed revision has a CycloneDX **SBOM** (what the software contains) and a
    CycloneDX **MBOM** (how it is built: build definitions and pinned inputs).

    **E2E QA.** Repositories with a QA profile get Karate API, UI and load runs against their
    deployed environment after each successful assessment, on a runner the operator hosts. Results,
    OpenAPI coverage and report-only `qa_*` findings are stored with the assessment; LLM providers
    (OpenAI, Anthropic, Gemini, Azure OpenAI and compatible APIs) draft tests for approval.

    **Automation.** External services such as n8n trigger assessments with `POST /assessments`
    (inbound) and receive results through signed outbound webhooks. Put correlation data in
    `trigger.context`; it is echoed in `assessment.completed`. Provider and registry webhooks are
    per connection: `POST /connections/{id}:webhook` sets a connection's secret, and its receiver is
    `/ingest/<provider>/<connection>` (registries: `/ingest/registry/<provider>/<connection>`).
    Outbound subscriptions can be scoped to connections.

    **Authentication.** Send `Authorization: Bearer <token>`. Token scopes:
    `read` (view), `write` (trigger, triage, edit assets), `trigger` (trigger and view own
    assessments only), `ingest:relay` (automation relays) and `admin` (everything). Each operation
    states the scope it needs; `admin` satisfies every scope.

    **Limits and errors.** 120 requests per token per sliding minute (`429` with `Retry-After`).
    Errors are `{"error": "<message>"}`. If Redis or the token store is unavailable, requests fail
    closed with `503`. Every response carries `X-Request-Id`.

    **Concurrency.** Mutable resources return an `ETag` revision; send it back in `If-Match`
    (`428` when missing, `409` when stale). `POST` triggers accept `Idempotency-Key` (24 h replay
    returns `200` and `Idempotent-Replayed: true`).

    **Verdicts.** `fail` > `incomplete` > `warn` > `pass`. A partial scan is never `pass`.

    **Pagination.** List endpoints return `{items, next_cursor}`; pass `cursor=<next_cursor>`
    until it is empty. The connection list returns the cursor in the `X-Next-Cursor` header.

    **Outbound webhooks** carry `X-SCRS-Signature` (`sha256=` HMAC of the exact body),
    `X-SCRS-Auth` (static header for receivers like n8n Header Auth), `X-SCRS-Event` and
    `Idempotency-Key` (event id).
servers:
  - url: /scrs/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: Health, readiness, metrics and these docs.
  - name: Tokens
    description: API tokens and their scopes (admin).
  - name: Connections
    description: Provider connections (GitHub, GitLab, Docker Hub, GAR, Harbor, OCI) and discovery (admin).
  - name: Assets
    description: Discovered repositories and images, their owners and operator attributes.
  - name: Mirrors
    description: Git history bundles of repository assets for incident restore.
  - name: Assessments
    description: Trigger, track and list supply-chain assessments.
  - name: Assessment results
    description: Findings, components, SBOM, reports and machine-readable documents of one assessment.
  - name: Imports
    description: Record external scanner reports (Trivy, SARIF) as assessments.
  - name: Risk register
    description: Deduplicated findings across assessments and their triage lifecycle.
  - name: Remediation
    description: Guided npm and Maven fix plans. Plans are advice; SCRS never writes to repositories.
  - name: Ingest
    description: Provider and registry events (direct webhooks or relayed through automation such as n8n).
  - name: Webhook subscriptions
    description: Outbound event subscriptions, delivery log and redelivery (admin).
  - name: Threat intelligence
    description: Versioned indicator-of-compromise bundles (admin).
  - name: Operations
    description: Maintenance, inbound event log and retention (admin).
  - name: E2E QA
    description: Karate API, integration, UI and load testing of each assessed repository against its deployed environment, with API coverage, report-only findings and LLM-drafted tests.
  - name: Licences
    description: Licence inventory, normalisation, categories and policy by distribution model, third-party notices. A policy aid, not legal advice.
  - name: Compliance reports
    description: OWASP Top 10, CWE Top 25, PCI DSS and imported DISA STIG evidence reports from framework packs, as JSON, CSV, Markdown or PDF. Evidence for assessors, not certification.
  - name: Integrations
    description: Optional export of SCRS-generated SBOMs to OWASP Dependency-Track. SCRS never depends on it being reachable.
  - name: Live events
    description: Server-sent events for frontends (OUT-004). Fire-and-forget notices of committed events; webhooks remain the guaranteed delivery path.
  - name: SAST
    description: Bundled static analyzers (gosec, Bandit, OpenGrep, Bearer) and Go reachability, run in the scrs-sast sandbox without SCRS secrets.
  - name: LLM providers
    description: Model endpoints (OpenAI, Anthropic, Gemini, Azure OpenAI, Mistral, Groq, DeepSeek, xAI, OpenRouter, Together, Ollama or any OpenAI-compatible server) that draft QA tests (admin).
paths:
  # ---------------------------------------------------------------- System
  /system/healthz:
    get:
      tags: [System]
      operationId: health
      summary: Liveness probe
      description: Returns `ok` while the process is serving. No authentication.
      security: []
      responses:
        '200': {description: Process is alive, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
  /system/readyz:
    get:
      tags: [System]
      operationId: readiness
      summary: Readiness probe
      description: Checks PostgreSQL, Redis and S3 (cached for 10 s). Use for load-balancer health. No authentication.
      security: []
      responses:
        '200': {description: Backing services reachable, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '503': {description: A backing service is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
  /system/metrics:
    get:
      tags: [System]
      operationId: metrics
      summary: Prometheus metrics
      description: Request, queue-depth, verdict, trigger and webhook-delivery metrics in Prometheus text format. Scope `read`.
      responses:
        '200': {description: Prometheus exposition, content: {text/plain: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /system/github-webhooks:
    get:
      tags: [System]
      operationId: githubWebhookChecks
      summary: GitHub webhook delivery check state
      description: |
        Latest delivery check of each GitHub connection. GitHub never retries a failed webhook delivery, so SCRS reads its own
        webhook's delivery log every `SCRS_GITHUB_HOOK_CHECK_MINUTES` (default 5), requests redelivery of failed events with
        5/10/20/40-minute backoff (at most five attempts, within GitHub's three-day log), and reports webhook configuration
        that would drop force-push and other integrity events. `degraded` and `failed` states also emit `connection.degraded`.
        Scope `read`.
      responses:
        '200': {description: Checks, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/GitHubWebhookCheck'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /system/github-webhooks:check:
    post:
      tags: [System]
      operationId: runGitHubWebhookCheck
      summary: Run the GitHub webhook delivery check now
      description: Runs the scheduled delivery check immediately and returns its result. Returns 409 while another replica is checking. Scope `admin`.
      responses:
        '200': {description: Checks, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/GitHubWebhookCheck'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /docs:
    get:
      tags: [System]
      operationId: apiDocs
      summary: Swagger UI
      description: 'Interactive documentation for this API. Served only while `SCRS_SWAGGER_DOCS_ENABLE=true` (the default); with `false`, this path, its assets and `/docs/openapi.yaml` return 404 like an unknown route, even with a valid token. When enabled, it is public unless `SCRS_DOCS_PUBLIC=false` (then any valid token).'
      security: []
      responses:
        '200': {description: HTML page, content: {text/html: {schema: {type: string}}}}
        '401': {description: '`SCRS_DOCS_PUBLIC=false` and no valid token'}
        '404': {description: 'Docs disabled (`SCRS_SWAGGER_DOCS_ENABLE=false`)'}
  /docs/openapi.yaml:
    get:
      tags: [System]
      operationId: openAPIDocument
      summary: OpenAPI document
      description: 'This contract in YAML, for client generation (for example openapi-typescript or orval). Served only while `SCRS_SWAGGER_DOCS_ENABLE=true`, under the same access rule as `/docs`.'
      security: []
      responses:
        '200': {description: OpenAPI 3.1 YAML, content: {application/yaml: {schema: {type: string}}}}
        '401': {description: '`SCRS_DOCS_PUBLIC=false` and no valid token'}
        '404': {description: 'Docs disabled (`SCRS_SWAGGER_DOCS_ENABLE=false`)'}

  # ---------------------------------------------------------------- Tokens
  /tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: List API tokens
      description: Token metadata only; secrets are never returned after creation. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Page of tokens
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Tokens]
      operationId: createToken
      summary: Create an API token
      description: Returns the token secret once. Optionally restrict client IPs (`ip_allow_list`) and set an expiry. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: {type: string, maxLength: 100, example: backoffice-reader}
                scopes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Scope'}}
                ip_allow_list: {type: array, items: {type: string, description: IP or CIDR}, example: ['203.0.113.0/24']}
                expires_at: {type: [string, 'null'], format: date-time}
      responses:
        '201':
          description: Token created; store `token` now
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string, description: Secret bearer token (shown once)}
                  metadata: {$ref: '#/components/schemas/Token'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tokens/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Tokens]
      operationId: revokeToken
      summary: Revoke an API token
      description: Revocation is immediate. The bootstrap token is rotated through the environment instead. Scope `admin`.
      responses:
        '204': {description: Revoked}
        '409': {description: Unknown token or bootstrap token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Connections
  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List connections
      description: Connections without credentials, ordered by name. The next page cursor is in `X-Next-Cursor`. Scope `admin`.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {name: cursor, in: query, schema: {type: string}, description: 'Value of the previous `X-Next-Cursor` header'}
      responses:
        '200':
          description: Connections
          headers: {X-Next-Cursor: {schema: {type: string}, description: Present when more pages exist}}
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Connection'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Connections]
      operationId: createConnection
      summary: Create a connection
      description: |
        Stores provider config and an AES-GCM encrypted credential. `config` and `credential` depend on the provider:
        - `github`: config `{organization, auth_type: github_app|fine_grained_pat|oauth_app_token, app_id?, installation_id?, webhook_source?: app|org}`, credential `{private_key_pem}` or `{token}`. `webhook_source` selects the webhook the delivery check reads (default `app` for GitHub Apps, `org` for tokens); `org` needs the organization webhooks permission (read and write).
        - `gitlab`: config `{group, base_url?}` (subgroups allowed, default https://gitlab.com), credential `{token}` (read_api + read_repository)
        - `dockerhub`: config `{namespace, identifier}`, credential `{token}`
        - `gar`: config `{project, location}`, credential `{service_account_json}`
        - `harbor`: config `{url, project, username}` (robot account), credential `{token}`
        - `oci`: config `{registry, namespace?, username?, repositories?}`, credential `{token}` or `{}` for anonymous. List `repositories` for registries without a catalog (GHCR).

        Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
            examples:
              gitlab: {value: {provider: gitlab, name: gitlab-platform, config: {group: acme/platform}, scope: {include: ['acme/platform/**']}, credential: {token: glpat-xxxx}}}
              harbor: {value: {provider: harbor, name: harbor-apps, config: {url: 'https://harbor.example.com', project: apps, username: 'robot$scrs'}, scope: {include: ['harbor.example.com/apps/*']}, credential: {token: '...'}}}
      responses:
        '201':
          description: Created
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get a connection
      description: Configuration, scope and last check status; never the credential. Scope `admin`.
      responses:
        '200': {description: Connection, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Connections]
      operationId: updateConnection
      summary: Change scope or enable/disable
      description: Changing scope or disabling invalidates queued work for the old configuration. Send at least one field. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: {$ref: '#/components/schemas/ConnectionScope'}
                enabled: {type: boolean}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Connections]
      operationId: disableConnection
      summary: Disable a connection
      description: Soft delete. The connection is disabled and its history kept as audit evidence. Scope `admin`.
      responses:
        '200': {description: Disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:rotate-credential:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: rotateConnectionCredential
      summary: Replace the stored credential
      description: Validates the credential shape for the provider and re-encrypts it. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: {type: object, description: 'Provider credential, as in createConnection'}
      responses:
        '200': {description: Rotated, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:webhook:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: setConnectionWebhook
      summary: Set or rotate a connection's webhook secret
      description: |
        Each GitHub, GitLab, Harbor, Docker Hub, GAR and OCI connection has its own inbound webhook secret and receiver URL. The secret is sealed with `SCRS_MASTER_KEY`, separately from the provider credential, so rotating it re-scopes no assets and invalidates no assessments.
        By default SCRS generates a 64-character secret and returns it once with `receiver_url` and provider-specific `setup` instructions. You can supply `secret` instead (32–256 printable characters). `hook_url` (GitHub only) names the public URL GitHub calls when it is a relay, so the delivery check finds the hook; `""` clears it. Send only `hook_url` with `rotate_secret: false` to keep the current secret. Scope `admin`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                rotate_secret: {type: boolean, description: 'Default true, except when only hook_url changes on a connection that already has a secret'}
                secret: {type: string, minLength: 32, maxLength: 256}
                hook_url: {type: string}
      responses:
        '200':
          description: Webhook updated; store `webhook_secret` now
          content:
            application/json:
              schema:
                type: object
                properties:
                  connection: {$ref: '#/components/schemas/Connection'}
                  receiver_url: {type: string}
                  webhook_secret: {type: string, description: Present only when the secret was set or rotated}
                  setup: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:test:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Test provider access
      description: Lists resources with the stored credential without changing the inventory. Scope `admin`.
      responses:
        '200':
          description: Provider reachable
          content: {application/json: {schema: {type: object, properties: {connection_id: {type: string, format: uuid}, resource_count: {type: integer}}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {description: Provider rejected the request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /connections/{id}:discover:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: discoverConnection
      summary: Discover assets
      description: Lists the provider's repositories or images and reconciles the asset inventory. Resources that disappeared lose eligibility but keep their history. Scope `admin`.
      responses:
        '200':
          description: Inventory reconciled
          content: {application/json: {schema: {type: object, properties: {connection: {type: string}, discovered: {type: integer}, in_scope: {type: integer}}}}}
        '502': {description: Provider rejected the request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Assets
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List assets
      description: All discovered repositories and images ordered by locator. Check `flags.in_scope` and `flags.accessible` for eligibility. Scope `read`.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Page of assets, content: {application/json: {schema: {$ref: '#/components/schemas/AssetPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset
      description: Asset with owner and attributes. The `ETag` header is the revision for updates. Scope `read` or `write`.
      responses:
        '200':
          description: Asset
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Update owner and attributes
      description: Sets owner, environment, criticality, exposure and labels. The label `mirror=true` opts the asset into scheduled git mirrors. Requires `If-Match`. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetChange'}}}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/last-known-good:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: lastKnownGood
      summary: Last known good revision
      description: Newest `pass` SCRS assessment of a ref with no open integrity finding against it. Imports never count. Use it as the restore target after an incident. Scope `read` or `write`.
      parameters: [{name: ref, in: query, required: true, schema: {type: string}, example: main}]
      responses:
        '200':
          description: Revision and its assessment
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset_id: {type: string, format: uuid}
                  ref: {type: string}
                  commit: {type: string}
                  assessment: {$ref: '#/components/schemas/Assessment'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /owners:
    get:
      tags: [Assets]
      operationId: listOwners
      summary: List owners
      description: Accountable contacts that assets can reference. Scope `read` or `write`.
      responses:
        '200': {description: Owners, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Owner'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Assets]
      operationId: createOwner
      summary: Create an owner
      description: Names are unique. Contact fields are excluded from outbound events unless a subscription opts in. Scope `write`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OwnerInput'}}}
      responses:
        '201':
          description: Created
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Owner'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /owners/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      tags: [Assets]
      operationId: updateOwner
      summary: Replace an owner's fields
      description: Requires `If-Match` with the owner's revision. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OwnerInput'}}}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Owner'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Mirrors
  /assets/{id}/mirrors:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Mirrors]
      operationId: listMirrors
      summary: List git mirrors of an asset
      description: The 50 newest mirror jobs and bundles, newest first. Bundles beyond `SCRS_MIRROR_KEEP` and older than `SCRS_MIRROR_MIN_AGE_DAYS` show `pruned`; the newest bundle before an open integrity finding is never pruned. Scope `read` or `write`.
      responses:
        '200': {description: Mirrors, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Mirror'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Mirrors]
      operationId: requestMirror
      summary: Mirror a repository now
      description: Queues a git bundle of every branch and tag of a GitHub or GitLab asset. If a mirror is already queued or running, returns it with `200`. Scope `write`.
      responses:
        '202': {description: Mirror queued, content: {application/json: {schema: {$ref: '#/components/schemas/Mirror'}}}}
        '200': {description: A mirror is already in progress, content: {application/json: {schema: {$ref: '#/components/schemas/Mirror'}}}}
        '404': {description: Not an in-scope git repository asset, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/mirrors/{mirror}/bundle:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: mirror, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Mirrors]
      operationId: downloadMirror
      summary: Download a git bundle
      description: Streams the bundle. Verify it against `X-Content-SHA256`, then restore with `git clone <file>.bundle`. Scope `admin`.
      responses:
        '200':
          description: Git bundle (v2)
          headers: {X-Content-SHA256: {schema: {type: string}, description: SHA-256 recorded when the bundle was stored}}
          content: {application/x-git-bundle: {schema: {type: string, format: binary}}}
        '409': {description: Mirror not succeeded or pruned, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Object store unavailable or object size mismatch, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Assessments
  /assessments:
    post:
      tags: [Assessments]
      operationId: createAssessment
      summary: Trigger an assessment
      description: |
        Queues an assessment of one in-scope asset. This is also the inbound endpoint for automation (n8n, CI, ticketing): use a `trigger` token restricted with `ip_allow_list`, the caller's event id as `Idempotency-Key`, and `trigger.context` for correlation data returned in `assessment.completed`. Git targets resolve `ref` to an immutable commit (or pin `commit`); image targets resolve `ref` (tag) to a manifest digest (or pin `commit` = `sha256:` digest).
        Poll `GET /assessments/{id}?wait=30`, or subscribe to `assessment.completed`. Scope `write` or `trigger`.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssessmentRequest'}
            examples:
              branch: {value: {target: {type: git, repository: acme/api, ref: main}}}
              automation: {value: {target: {type: git, repository: acme/api, ref: main, commit: 0123456789abcdef0123456789abcdef01234567}, trigger: {origin: n8n, event: release.requested, delivery_id: exec-4711, actor: release-bot, context: {ticket: CHG-1042}}}}
              gitlab: {value: {target: {type: git, provider: gitlab, repository: acme/platform/api, ref: main}}}
              pullRequest: {value: {target: {type: git, repository: acme/api, commit: 0123456789abcdef0123456789abcdef01234567, pull_request: {number: 42, base_ref: main}}}}
              image: {value: {target: {type: image, repository: docker.io/acme/api, ref: '1.4.2', platform: linux/amd64}}}
      responses:
        '202':
          description: Queued
          headers:
            Location: {schema: {type: string}}
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Asset not discovered or out of scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Idempotency key reused with a different body, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'Several connections match; set `connection`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      tags: [Assessments]
      operationId: listAssessments
      summary: List assessments
      description: Newest first, filterable. `trigger`-only tokens see only their own assessments. Scope `read`, `write` or `trigger`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AssessmentStatus'}}
        - {name: verdict, in: query, schema: {$ref: '#/components/schemas/Verdict'}}
        - {name: ref, in: query, schema: {type: string}}
        - {name: commit, in: query, schema: {type: string}, description: Resolved commit SHA or image digest}
        - {name: actor, in: query, schema: {type: string}, description: Requesting token name}
        - {name: created_after, in: query, schema: {type: string, format: date-time}}
        - {name: created_before, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Page of assessments, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments:batch:
    post:
      tags: [Assessments]
      operationId: createAssessmentBatch
      summary: Trigger up to 100 assessments
      description: Each item has its own idempotency key and result; one failing item never fails the others. Always `207`. Scope `write` or `trigger`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [request]
                    properties:
                      idempotency_key: {type: string, maxLength: 128}
                      request: {$ref: '#/components/schemas/AssessmentRequest'}
      responses:
        '207':
          description: Per-item results
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer}
                        status: {type: integer, description: HTTP status this item would have received}
                        assessment_id: {type: string, format: uuid}
                        location: {type: string}
                        error: {type: string}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/latest:
    get:
      tags: [Assessments]
      operationId: latestAssessment
      summary: Latest assessment for an asset or commit
      description: The newest assessment matching `asset_id`, `repository` and/or `commit`, for example to show a PR or release gate. Scope `read`, `write` or `trigger`.
      parameters:
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
        - {name: repository, in: query, schema: {type: string}}
        - {name: commit, in: query, schema: {type: string}}
      responses:
        '200': {description: Assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessments]
      operationId: getAssessment
      summary: Get an assessment
      description: Status, verdict, stage coverage, counts and component diff. With `wait`, holds the request up to that many seconds until the assessment finishes (long-poll). Scope `read`, `write` or `trigger` (own).
      parameters: [{name: wait, in: query, schema: {type: integer, minimum: 0, maximum: 60}}]
      responses:
        '200': {description: Assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Assessments]
      operationId: cancelAssessment
      summary: Cancel a queued or running assessment
      description: Finished assessments cannot be cancelled. Scope `write`, or `trigger` for own assessments.
      responses:
        '204': {description: Cancelled}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Already finished, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Assessment results
  /assessments/{id}/findings:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentFindings
      summary: Findings of an assessment
      description: Findings as detected in this assessment, each marked `new` or `existing` against the baseline. Scope `read`, `write` or `trigger` (own).
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Page of findings, content: {application/json: {schema: {$ref: '#/components/schemas/FindingPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/components:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentComponents
      summary: Components (packages) of an assessment
      description: Package inventory with ecosystem, version, PURL and manifest path. Scope `read`, `write` or `trigger` (own).
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Page of components
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Component'}}, next_cursor: {type: string}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/files:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentFiles
      summary: File evidence
      description: Path, size, SHA-256 and malware status per file. Source content is never stored. Image assessments list only flagged layer files. Scope `read`, `write` or `trigger` (own).
      responses:
        '200': {description: File evidence, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FileEvidence'}}}}}
        '409': {description: File evidence unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/sbom:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentSBOM
      summary: SBOM (CycloneDX or SPDX)
      description: 'The assessment''s SBOM (SBM-011). `cyclonedx-json` (default) is the stored CycloneDX 1.6 document SCRS generated from its component model, integrity-checked against `sbom_sha256` (`ETag`); `cyclonedx-xml` is the same document as XML; `spdx-json` is SPDX 2.3 generated from the same components (SBM-010), with declared and concluded licences, so both formats list the same packages. Documents name the SCRS version and generation time (also in `X-SCRS-Version` and `X-SCRS-Generated-At`). Scope `read`, `write` or `trigger` (own).'
      parameters: [{$ref: '#/components/parameters/SBOMFormat'}]
      responses:
        '200': {$ref: '#/components/responses/SBOM'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: 'SBOM not available (failed, partial or imported assessment)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/report:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentReport
      summary: Human-readable report
      description: Markdown summary with `format=md`; otherwise the assessment JSON. Scope `read`, `write` or `trigger` (own).
      parameters: [{name: format, in: query, schema: {type: string, enum: [md, json]}}]
      responses:
        '200':
          description: Report
          content:
            text/markdown: {schema: {type: string}}
            application/json: {schema: {$ref: '#/components/schemas/Assessment'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/context:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentContext
      summary: Context document for automation and AI agents
      description: Size-capped, redacted JSON with verdict, gate rule, findings and guidance. `agent` marks repository-controlled text as untrusted. Contacts only with `include_contacts=true` and `admin`. Scope `read`, `write` or `trigger` (own).
      parameters:
        - {name: profile, in: query, schema: {type: string, enum: [full, agent], default: full}}
        - {name: include_contacts, in: query, schema: {type: boolean}}
      responses:
        '200': {description: Context document, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/mbom:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentMBOM
      summary: CycloneDX MBOM (manufacturing BOM)
      description: CycloneDX 1.6 Manufacturing Bill of Materials of the assessed revision. Lists the produced artifact (commit or image digest), the build definitions and pinned inputs SCRS observed (CI workflows, Dockerfiles, build scripts, lockfiles) with SHA-256, the verifying tools and a link to the SBOM. It is declared, not observed, build data; use SLSA attestations for provenance. Scope `read`, `write` or `trigger` (own).
      responses:
        '200': {description: MBOM, content: {application/vnd.cyclonedx+json: {schema: {type: object}}}}
        '409': {description: Assessment not succeeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/vex:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentVEX
      summary: OpenVEX document
      description: OpenVEX 0.2.0 statements derived from register triage (affected, not_affected, fixed, under_investigation). Scope `read`, `write` or `trigger` (own).
      responses:
        '200': {description: OpenVEX, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/snapshot:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessment results]
      operationId: assessmentSnapshot
      summary: Download the scanned source archive
      description: The exact tar.gz SCRS scanned, when `SCRS_SNAPSHOT_ARCHIVES=true`. Scope `admin`.
      responses:
        '200': {description: Source archive, content: {application/gzip: {schema: {type: string, format: binary}}}}
        '409': {description: Snapshot not stored for this assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/remediation:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Remediation]
      operationId: remediationPlan
      summary: Remediation plan result
      description: The plan produced by a remediation assessment (changed manifest, upgrades, residual risk). Scope `read`, `write` or `trigger` (own).
      responses:
        '200': {description: Plan, content: {application/json: {schema: {type: object}}}}
        '409': {description: Plan not available, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/remediations:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Remediation]
      operationId: automaticRemediationPlans
      summary: Automatic plans for an assessment
      description: Fix plans dispatched automatically for this assessment's manifests, with dispatch and job status. Scope `read`, `write` or `trigger` (own).
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    manifest: {type: string}
                    dispatch_status: {type: string}
                    assessment_id: {type: [string, 'null'], format: uuid}
                    job_status: {type: [string, 'null']}
                    error: {type: string}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Imports
  /assessments:import:
    post:
      tags: [Imports]
      operationId: importReport
      summary: Import a Trivy or SARIF report
      description: |
        Records an external scan of one in-scope asset revision as a completed assessment (stage `import`). Findings join the register and the verdict gate.
        - `trivy`: Trivy JSON (`SchemaVersion: 2`): vulnerabilities, misconfigurations, secrets. Secret values are discarded.
        - `sarif`: SARIF 2.1.0 from Semgrep, CodeQL and similar tools, as `code` findings. Severity comes from `security-severity`, else from `level`.

        Imported findings are closed only by a later import of the same tool (same SARIF tool name) for the same ref with `replace_previous: true`, which declares the report the tool's full result: findings it no longer lists are marked fixed. Leave it `false` for partial runs such as secrets only. SCRS's own scans never close imported findings, and imports never close SCRS findings or serve as a baseline or last-known-good.
        Body limit 16 MiB; two imports are processed at a time, others get `429` with `Retry-After`. Scope `write` or `trigger`; `replace_previous: true` closes findings and requires `write`. While another assessment of the asset is running the import returns `409` with `Retry-After`.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target, format, report]
              properties:
                target: {$ref: '#/components/schemas/Target'}
                connection: {type: string}
                format: {type: string, enum: [trivy, sarif]}
                notify: {type: array, maxItems: 10, items: {type: string}}
                replace_previous: {type: boolean, default: false, description: This report is the tool's full result for the ref; the tool's earlier findings absent from it are marked fixed}
                report: {type: object, description: The unmodified Trivy JSON or SARIF document}
            example:
              target: {type: git, repository: acme/api, ref: main, commit: 0123456789abcdef0123456789abcdef01234567}
              format: trivy
              report: {SchemaVersion: 2, Results: []}
      responses:
        '201':
          description: Imported and completed
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '400': {description: 'Invalid report, format or missing `target.commit`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Asset not discovered or out of scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: 'Idempotency-Key reused with a different body, or another assessment of the asset is running (retry after `Retry-After`)', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Risk register
  /register:
    get:
      tags: [Risk register]
      operationId: listRegister
      summary: List register entries
      description: Deduplicated findings across all assessments with current lifecycle status. Scope `read` or `write`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Page of register entries, content: {application/json: {schema: {$ref: '#/components/schemas/FindingPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /register/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      tags: [Risk register]
      operationId: transitionFinding
      summary: Change a finding's status
      description: |
        Triage with a reason (8 to 2000 characters). `open`, `triaged` and `in_progress` need `write`. `accepted` (a waiver, requires `expires_at` within 90 days), `suppressed` and `false_positive` need `admin`.
        Malicious content never gates below `warn`, even when waived.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: {type: string, enum: [open, triaged, in_progress, accepted, suppressed, false_positive]}
                reason: {type: string, minLength: 8, maxLength: 2000}
                expires_at: {type: string, format: date-time, description: Required for accepted; at most 90 days ahead}
      responses:
        '204': {description: Transitioned and audited}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /register/{id}/events:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Risk register]
      operationId: findingHistory
      summary: Finding history
      description: The 100 newest lifecycle events (detected, transitions, fixed by scan or import) with actor and details. Scope `read` or `write`.
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: {type: integer}
                    action: {type: string}
                    actor_id: {type: [string, 'null'], format: uuid}
                    details: {type: object}
                    created_at: {type: string, format: date-time}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Remediation
  /remediation/capabilities:
    get:
      tags: [Remediation]
      operationId: remediationCapabilities
      summary: Supported fix-plan ecosystems
      description: Whether remediation is enabled and which manifests and strategies are supported. Scope `read` or `write`.
      responses:
        '200': {description: Capabilities, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/remediations:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Remediation]
      operationId: requestRemediation
      summary: Request a fix plan
      description: Queues a sandboxed plan for one manifest of a completed assessment (`package-lock.json` with `in-place`, or `pom.xml` with `override`). Fetch the result from `/assessments/{id}/remediation`. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [assessment_id, manifest, strategy]
              properties:
                assessment_id: {type: string, format: uuid}
                manifest: {type: string, examples: [package-lock.json]}
                strategy: {type: string, enum: [in-place, override]}
      responses:
        '202': {description: Plan queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '503': {description: Remediation disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Ingest
  /webhooks/github:
    post:
      tags: [Ingest]
      operationId: githubWebhook
      summary: GitHub webhook (direct)
      description: Same as `/ingest/github` in direct mode. Requires `X-Hub-Signature-256` (secret `SCRS_GITHUB_WEBHOOK_SECRET`).
      security: []
      parameters: [{$ref: '#/components/parameters/GitHubEvent'}, {$ref: '#/components/parameters/GitHubDelivery'}, {$ref: '#/components/parameters/GitHubSignature'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Assessment queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '200': {description: 'Replay, ping, ignored event, or integrity signals only', content: {application/json: {schema: {$ref: '#/components/schemas/IngestOutcome'}}}}
        '401': {description: Invalid signature, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Webhook secret not configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /ingest/github:
    post:
      tags: [Ingest]
      operationId: ingestGitHub
      summary: GitHub events (direct or relay)
      description: |
        Shared receiver for deployments that set `SCRS_GITHUB_WEBHOOK_SECRET`; prefer each connection's own receiver, `/ingest/github/{connection}`. Without `Authorization`, GitHub calls directly and `X-Hub-Signature-256` is required. With a bearer token (scope `ingest:relay`, `SCRS_RELAY_ENABLED=true`), automation relays the unchanged body. A forwarded signature is verified when `SCRS_GITHUB_WEBHOOK_SECRET` is configured; otherwise the relay token alone is trusted.
        `push` and `pull_request` (opened, synchronize, reopened) queue assessments. `push`, `delete`, `create`, `repository`, `member` and `organization` raise integrity alerts (force push, deletions, branch churn, mass deletion, visibility and membership changes, campaign patterns). Other events return `200`.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GitHubEvent'}, {$ref: '#/components/parameters/GitHubDelivery'}, {$ref: '#/components/parameters/GitHubSignature'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Assessment queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '200': {description: 'Replay, ping, ignored event, or integrity signals only', content: {application/json: {schema: {$ref: '#/components/schemas/IngestOutcome'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid provider signature or token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Same delivery id with a different body, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Ingest concurrency limit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Webhook secret not configured or relay disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /ingest/gitlab:
    post:
      tags: [Ingest]
      operationId: ingestGitLab
      summary: GitLab events (direct or relay)
      description: |
        Shared receiver for deployments that set `SCRS_GITLAB_WEBHOOK_SECRET`; prefer each connection's own receiver, `/ingest/gitlab/{connection}`. Without `Authorization`, GitLab calls directly with `X-Gitlab-Token` equal to `SCRS_GITLAB_WEBHOOK_SECRET`. With a bearer token (scope `ingest:relay`), a relay forwards the body; a forwarded `X-Gitlab-Token` is verified when the secret is configured, otherwise the relay token alone is trusted.
        GitLab's `Idempotency-Key` header (stable across retries of one delivery) is the idempotency key; `X-Gitlab-Event-UUID`, which recursive hooks share, is the fallback. One of the two is required. Push Hook and Merge Request Hook (open, reopen, update with new commits) queue assessments. Pushes raise ref-deletion, branch-churn, mass-deletion and pattern alerts. Tag pushes raise alerts only. Other hooks return `200`.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: X-Gitlab-Event, in: header, required: true, schema: {type: string, enum: [Push Hook, Tag Push Hook, Merge Request Hook]}}
        - {name: Idempotency-Key, in: header, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$'}, description: Sent by GitLab 17.4 and later; preferred delivery id}
        - {name: X-Gitlab-Event-UUID, in: header, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$'}, description: Delivery id when `Idempotency-Key` is absent}
        - {name: X-Gitlab-Token, in: header, schema: {type: string}, description: Shared secret (required in direct mode)}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Assessment queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '200': {description: 'Replay, ignored event, or integrity signals only', content: {application/json: {schema: {$ref: '#/components/schemas/IngestOutcome'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: GitLab secret not configured or relay disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /ingest/github/{connection}:
    parameters: [{name: connection, in: path, required: true, schema: {type: string}, description: Connection name}]
    post:
      tags: [Ingest]
      operationId: ingestGitHubConnection
      summary: GitHub events for one connection
      description: |
        A GitHub connection's own receiver. Direct deliveries are verified with that connection's webhook secret (`X-Hub-Signature-256`), set with `POST /connections/{id}:webhook`. An unknown, disabled or unconfigured connection answers `401` like a bad signature. With a bearer token (scope `ingest:relay`), a relay forwards the body; a forwarded signature is checked against the connection's secret.
        Events behave as on `/ingest/github`, but only reach that connection's repositories: an event for a repository outside it is acknowledged as out of scope.
      security: [{}, {bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/GitHubEvent'}, {$ref: '#/components/parameters/GitHubDelivery'}, {$ref: '#/components/parameters/GitHubSignature'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Assessment queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '200': {description: 'Replay, ping, ignored event, out of scope, or integrity signals only', content: {application/json: {schema: {$ref: '#/components/schemas/IngestOutcome'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid signature or unknown connection, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {description: Ingest concurrency limit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Relay disabled or secret store unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /ingest/gitlab/{connection}:
    parameters: [{name: connection, in: path, required: true, schema: {type: string}, description: Connection name}]
    post:
      tags: [Ingest]
      operationId: ingestGitLabConnection
      summary: GitLab events for one connection
      description: |
        A GitLab connection's own receiver: `X-Gitlab-Token` must equal that connection's webhook secret. Relays use a bearer token (scope `ingest:relay`); a forwarded `X-Gitlab-Token` is checked against the connection's secret. Events behave as on `/ingest/gitlab` but only reach that connection's projects. Unknown, disabled or unconfigured connections answer `401`.
      security: [{}, {bearerAuth: []}]
      parameters:
        - {name: X-Gitlab-Event, in: header, required: true, schema: {type: string, enum: [Push Hook, Tag Push Hook, Merge Request Hook]}}
        - {name: Idempotency-Key, in: header, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$'}}
        - {name: X-Gitlab-Event-UUID, in: header, schema: {type: string, pattern: '^[A-Za-z0-9._:-]{8,128}$'}}
        - {name: X-Gitlab-Token, in: header, schema: {type: string}, description: The connection's webhook secret (direct mode)}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: Assessment queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '200': {description: 'Replay, ignored event, out of scope, or integrity signals only', content: {application/json: {schema: {$ref: '#/components/schemas/IngestOutcome'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid token or unknown connection, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Relay disabled or secret store unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /ingest/registry/{provider}/{connection}:
    parameters:
      - {name: provider, in: path, required: true, schema: {type: string, enum: [harbor, dockerhub, gar, oci]}}
      - {name: connection, in: path, required: true, schema: {type: string}, description: Connection name}
    post:
      tags: [Ingest]
      operationId: ingestRegistryConnection
      summary: Registry push events for one connection
      description: |
        A registry connection's own receiver, authenticated by that connection's webhook secret rather than an API token. Send it as `Authorization: Bearer <secret>` (Harbor Auth Header, OCI Distribution notification headers), as `X-SCRS-Webhook-Token`, or as `?token=<secret>` for Docker Hub and Pub/Sub push, which cannot send headers (keep proxy access logs from recording query strings). Pushes queue image assessments as on `/ingest/registry/{provider}`, only for that connection's images. Does not need `SCRS_RELAY_ENABLED`.
      security: [{}]
      parameters:
        - {name: token, in: query, schema: {type: string}, description: The connection's webhook secret, for senders that cannot set headers}
        - {name: X-SCRS-Webhook-Token, in: header, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202': {description: At least one assessment queued, content: {application/json: {schema: {$ref: '#/components/schemas/RegistryIngestResult'}}}}
        '200': {description: Nothing new queued (replay, out of scope, or not a push), content: {application/json: {schema: {$ref: '#/components/schemas/RegistryIngestResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {description: Invalid token or unknown connection, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '404': {description: Unknown registry provider, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Secret store unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /ingest/registry/{provider}:
    parameters:
      - {name: provider, in: path, required: true, schema: {type: string, enum: [harbor, dockerhub, gar, oci]}}
    post:
      tags: [Ingest]
      operationId: ingestRegistry
      summary: Registry push events
      description: |
        Queues an image assessment per pushed manifest, pinned to the pushed digest when the registry reports it. Accepted payloads:
        - `harbor`: Harbor webhook `PUSH_ARTIFACT`. Set the token as the webhook Auth Header.
        - `dockerhub`: Docker Hub webhook (tag only; resolved at scan time)
        - `gar`: Artifact Registry Pub/Sub message (push envelope or decoded data) with `action: INSERT`
        - `oci`: CNCF Distribution notifications (registry:2, Zot, Nexus)

        This shared relay receiver needs an API token (scope `ingest:relay`, `SCRS_RELAY_ENABLED=true`). Registries can instead call their connection's own receiver, `/ingest/registry/{provider}/{connection}`, with the connection's webhook secret. Retries of the same body replay the same assessments.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '202':
          description: At least one assessment queued
          content: {application/json: {schema: {$ref: '#/components/schemas/RegistryIngestResult'}}}
        '200':
          description: Nothing new queued (replay, out of scope, or not a push)
          content: {application/json: {schema: {$ref: '#/components/schemas/RegistryIngestResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Unknown registry provider, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Relay ingestion disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Webhook subscriptions
  /webhooks:
    get:
      tags: [Webhook subscriptions]
      operationId: listSubscriptions
      summary: List subscriptions
      description: Subscriptions without secrets. Scope `admin`.
      responses:
        '200': {description: Subscriptions, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Subscription'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Webhook subscriptions]
      operationId: createSubscription
      summary: Create a subscription
      description: |
        Delivers selected events to an HTTPS URL that resolves to a public address. HTTP and private addresses work only for hosts in `SCRS_WEBHOOK_PRIVATE_HOSTS` (for example an n8n container).
        Returns the signing secret and the `X-SCRS-Auth` header value once. The `full` and `agent` profiles send the assessment context document and require `egress_ack: true`. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, url, events]
              properties:
                name: {type: string, maxLength: 100}
                url: {type: string, format: uri}
                events: {type: array, minItems: 1, items: {$ref: '#/components/schemas/EventType'}}
                profile: {type: string, enum: [summary, full, agent], default: summary}
                egress_ack: {type: boolean, description: Acknowledge that full/agent payloads leave SCRS}
                include_contacts: {type: boolean, description: Include owner contact fields}
                connections: {type: array, maxItems: 50, items: {type: string, format: uuid}, description: 'Deliver only events about these connections (their assessments, findings, QA runs, integrity alerts and health). Platform events without a connection, such as feed.stale and maintenance.completed, still arrive. Empty or omitted means every connection'}
      responses:
        '201':
          description: Created; store `secret` and `auth_header` now
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionSecret'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Webhook subscriptions]
      operationId: getSubscription
      summary: Get a subscription
      description: Subscription settings and revision (`ETag`); the secret is never returned. Scope `admin`.
      responses:
        '200':
          description: Subscription
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Webhook subscriptions]
      operationId: updateSubscription
      summary: Update a subscription
      description: Change URL, events, profile, connection scope or enabled state. Requires `If-Match`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                url: {type: string, format: uri}
                events: {type: array, items: {$ref: '#/components/schemas/EventType'}}
                profile: {type: string, enum: [summary, full, agent]}
                egress_ack: {type: boolean}
                include_contacts: {type: boolean}
                enabled: {type: boolean}
                connections: {type: array, maxItems: 50, items: {type: string, format: uuid}, description: Replaces the connection scope; an empty list removes it}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Webhook subscriptions]
      operationId: disableSubscription
      summary: Disable a subscription
      description: Soft delete. Disables delivery and keeps the delivery log as audit evidence. Requires `If-Match`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: Disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Subscription'}}}}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/{id}:rotate-secret:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Webhook subscriptions]
      operationId: rotateSubscriptionSecret
      summary: Rotate the signing secret
      description: Returns the new secret and `X-SCRS-Auth` value once; the old ones stop working immediately. Scope `admin`.
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: {type: string}
                  auth_header: {$ref: '#/components/schemas/AuthHeader'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/{id}:test:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Webhook subscriptions]
      operationId: testSubscription
      summary: Send a ping event
      description: Queues a signed `ping` to this subscription; check the delivery log for the result. Scope `admin`.
      responses:
        '202': {description: Ping queued, content: {application/json: {schema: {type: object, properties: {event_id: {type: string, format: uuid}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/{id}/deliveries:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Webhook subscriptions]
      operationId: listDeliveries
      summary: Delivery log
      description: Newest first, with attempts, last HTTP status and error. Scope `admin`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [pending, sending, delivered, dead]}}
      responses:
        '200':
          description: Page of deliveries
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Delivery'}}, next_cursor: {type: string}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/{id}/deliveries/{delivery}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: delivery, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Webhook subscriptions]
      operationId: getDelivery
      summary: Get one delivery
      description: Includes the payload. Scope `admin`.
      responses:
        '200': {description: Delivery, content: {application/json: {schema: {$ref: '#/components/schemas/Delivery'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /webhooks/{id}/deliveries/{delivery}:redeliver:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: delivery, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      tags: [Webhook subscriptions]
      operationId: redeliver
      summary: Redeliver an event
      description: Requeues a delivered or dead delivery with the same event id, so receivers deduplicate it. Scope `admin`.
      responses:
        '202': {description: Requeued}
        '404': {$ref: '#/components/responses/NotFound'}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Threat intelligence
  /feeds/indicators:
    get:
      tags: [Threat intelligence]
      operationId: activeIndicators
      summary: Active indicator bundle
      description: |
        The bundle last activated with PUT. Its indicators form the `bundle` indicator source (mode `block`), which scans
        and event pattern matching use alongside every other enabled source. Scope `admin`.
      responses:
        '200': {description: Bundle, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorBundle'}}}}
        '404': {description: No active bundle (IOC stage reports skipped and verdicts stay incomplete), content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Threat intelligence]
      operationId: importIndicators
      summary: Import and activate an indicator bundle
      description: |
        Atomically activates a new immutable version, which replaces the indicators of the `bundle` source; previous versions
        are retained. Creates that source in mode `block` if it does not exist, otherwise keeps its mode. Max 4 MiB, 10000
        indicators. Prefer `/intel/indicator-sources` for new feeds. Scope `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorBundle'}}}
      responses:
        '201': {description: Activated, content: {application/json: {schema: {type: object, properties: {version: {type: string}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Version already exists, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Bundle too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/yara-rulesets:
    get:
      tags: [Threat intelligence]
      operationId: listYaraRulesets
      summary: YARA rulesets
      description: |
        Team rules written in the Web UI (`custom`) and third-party packs (`external`, for example YARA Forge), without their
        rule text. Enabled rulesets run with YARA-X (modules `pe`, `elf`, `math`, `hash`, `dotnet` and others) on every
        repository file and every container image layer file, including files a later layer deletes. Scope `read` or `write`.
      responses:
        '200': {description: Rulesets, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/YaraRuleset'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Threat intelligence]
      operationId: createYaraRuleset
      summary: Create a YARA ruleset
      description: |
        Compiles the rules with YARA-X, then stores them. New rulesets default to mode `hunt`: matches are recorded as
        `yara_hunt` findings and never change a verdict. Scope `write` for `hunt`; `admin` to create in `alert` (findings gate
        by severity like vulnerabilities, from rule meta `severity` or the ruleset default) or `block` (any match fails the
        assessment like malware). `include` directives are rejected. Max 16 MiB per ruleset, 32 MiB and 200 rulesets enabled.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/YaraRulesetInput'}}}
      responses:
        '201': {description: Created, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/YaraRulesetResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Name exists, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Rules do not compile, or the enabled pack would exceed its limits, content: {application/json: {schema: {$ref: '#/components/schemas/RuleCompileError'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/yara-rulesets:validate:
    post:
      tags: [Threat intelligence]
      operationId: validateYaraRules
      summary: Compile YARA rules without saving
      description: For the Web UI rule editor. Returns warnings (for example slow patterns) or, with 422, located compile errors. Scope `write`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [rules], properties: {rules: {type: string}}}}}
      responses:
        '200': {description: Rules compile, content: {application/json: {schema: {type: object, properties: {valid: {type: boolean}, rule_count: {type: integer}, warnings: {type: array, items: {$ref: '#/components/schemas/RuleDiagnostic'}}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {description: Rules do not compile, content: {application/json: {schema: {$ref: '#/components/schemas/RuleCompileError'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/yara-rulesets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Threat intelligence]
      operationId: getYaraRuleset
      summary: YARA ruleset with its rules
      description: One ruleset including its rule text, with an ETag for updates. Scope `read` or `write`.
      responses:
        '200': {description: Ruleset, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/YaraRuleset'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Threat intelligence]
      operationId: updateYaraRuleset
      summary: Change a YARA ruleset
      description: |
        Partial update at the If-Match revision; changed rules are compiled first. `write` may change rulesets that are
        `hunt` before and after the change; promoting to `alert` or `block`, or changing a ruleset in those modes, needs
        `admin`. Mode changes are audited as `yara_ruleset.mode_changed`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/YaraRulesetChange'}}}
      responses:
        '200': {description: Updated, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/YaraRulesetResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Rules do not compile, content: {application/json: {schema: {$ref: '#/components/schemas/RuleCompileError'}}}}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Threat intelligence]
      operationId: deleteYaraRuleset
      summary: Delete a YARA ruleset
      description: Removes the ruleset; its findings close on the next complete scan. `write` for `hunt` rulesets, otherwise `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/yara-rulesets/{id}:hunt:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Threat intelligence]
      operationId: huntYaraRuleset
      summary: Retro-hunt with a ruleset
      description: Queues a rescan of the default branch of every in-scope repository so enabled rules run against current code. Rescans already queued in the same window are not repeated. Scope `write`.
      responses:
        '202': {description: Rescans queued, content: {application/json: {schema: {type: object, properties: {rescans_queued: {type: integer}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Ruleset disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources:
    get:
      tags: [Threat intelligence]
      operationId: listIndicatorSources
      summary: Indicator sources
      description: |
        Each source holds its own indicators and mode. Scans and GitHub event pattern matching use the unexpired indicators of
        every enabled source whose confidence is at or above the source's `min_confidence` (indicators without confidence always
        qualify). Scope `read` or `write`.
      responses:
        '200': {description: Sources, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/IndicatorSource'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Threat intelligence]
      operationId: createIndicatorSource
      summary: Create an indicator source
      description: |
        Creates an empty source; import indicators next. New sources default to mode `hunt`: matches are recorded as `ioc_hunt`
        findings and never change a verdict. Scope `write` for `hunt`; `admin` to create in `alert` (`ioc_alert` findings gate
        by the source severity like vulnerabilities) or `block` (`ioc_match`, any match fails the assessment like malware).
        Sources of kind `taxii` poll a TAXII 2.1 collection and need `admin` for every change; give their settings and
        credential in `taxii`. The credential is encrypted with `SCRS_MASTER_KEY` and never returned.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSourceInput'}}}
      responses:
        '201': {description: Created, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSource'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Name exists, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Threat intelligence]
      operationId: getIndicatorSource
      summary: Indicator source
      description: One source with its last import, and an ETag for updates. Scope `read` or `write`.
      responses:
        '200': {description: Source, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSource'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Threat intelligence]
      operationId: updateIndicatorSource
      summary: Change an indicator source
      description: |
        Partial update at the If-Match revision (imports also advance the revision). `write` may change sources that are `hunt`
        before and after the change; promoting to `alert` or `block`, or changing a source in those modes, needs `admin`. Mode
        changes are audited as `indicator_source.mode_changed`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSourceChange'}}}
      responses:
        '200': {description: Updated, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSource'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {description: Enabling the source would exceed the scan bundle limit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Threat intelligence]
      operationId: deleteIndicatorSource
      summary: Delete an indicator source
      description: Removes the source and its indicators; its findings close on the next complete scan. `write` for `hunt` sources, otherwise `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}/indicators:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Threat intelligence]
      operationId: listSourceIndicators
      summary: A source's indicators
      description: The source's indicators as a bundle, with values normalized and the version of the last import. Scope `read` or `write`.
      responses:
        '200': {description: Indicators, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorBundle'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Threat intelligence]
      operationId: importSourceIndicators
      summary: Replace a source's indicators
      description: |
        Atomically replaces every indicator of the source with the bundle. Defanged values (`hxxp`, `[.]`) are accepted and
        normalized. Max 16 MiB and 50000 indicators per import; all enabled sources together may hold 100000 unexpired
        indicators. `write` for `hunt` sources, otherwise `admin`. Audited as `indicator_source.imported`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorBundle'}}}
      responses:
        '200': {description: Imported, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSource'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {description: Bundle too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Enabled sources would exceed the scan bundle limit, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:import-stix:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Threat intelligence]
      operationId: importSTIXBundle
      summary: Upload a STIX 2.1 bundle
      description: |
        For sources of kind `stix`. Indicator objects whose patterns can be checked against files at rest become indicators:
        `file:hashes` (MD5, SHA-1, SHA-256), `file:name`, `domain-name:value`, `ipv4-addr:value` and `ipv6-addr:value` (single addresses) and
        `url:value`, compared with `=` or `IN`. Alternatives joined by OR are imported separately; in an AND with a file hash,
        the hash is used. `pattern_type: yara` patterns are compiled into the ruleset `stix_<source>`, which follows the
        source's mode, severity and enabled flag and is rebuilt on every upload. Everything else (patterns that join
        observations, time windows, network traffic and other runtime objects, other pattern types, revoked and expired
        indicators) is counted in the report by reason. Without `merge`, the upload replaces all the source's indicators;
        with `merge=true` it replaces only what the bundle's indicator objects produced before, so revoked objects are
        removed. Max 32 MiB, 50000 indicators and 200 YARA patterns. `taxii` sources also accept uploads, for a backfill
        from an export. `write` for `hunt` sources of kind `stix`, otherwise `admin`.
      parameters:
        - {name: merge, in: query, schema: {type: boolean, default: false}}
        - {name: valid_days, in: query, description: Expiry for indicators without valid_until, schema: {type: integer, minimum: 1, maximum: 3650, default: 180}}
      requestBody:
        required: true
        content:
          application/stix+json: {schema: {$ref: '#/components/schemas/STIXBundle'}}
          application/json: {schema: {$ref: '#/components/schemas/STIXBundle'}}
      responses:
        '200': {description: Imported, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/STIXImportResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: The source is not of kind stix, or another ruleset has the name stix_<source>, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Bundle too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: The combined YARA patterns do not compile, or a scan limit would be exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/RuleCompileError'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:import-csv:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Threat intelligence]
      operationId: importIndicatorCSV
      summary: Import indicators from CSV
      description: |
        Loads a CSV export into a manual source (TIF-005). The header row names columns; map them with `value_column` (default `value`), `type_column`, `first_seen_column`, `confidence_column`, `label_column` and `valid_until_column`. Without a type, `type` sets one for every row, otherwise each value's type is detected (MD5, SHA-1, SHA-256, IPv4, IPv6, URL, purl, domain). Defanged values are accepted. `valid_days` (default 180) sets the expiry from the first-seen date when a row has none. The label becomes part of the indicator ID, and so of the finding's advisory ID.
        Rows that do not parse are skipped and reported (first 50). `merge=true` keeps the source's other indicators; otherwise the CSV replaces them. Scope `write` for hunt sources, `admin` for alert and block.
      parameters:
        - {name: merge, in: query, schema: {type: boolean, default: false}}
        - {name: type, in: query, schema: {type: string, enum: [sha256, sha1, md5, domain, ipv4, ipv6, url, purl, workflow_step_name, file_path_regex, file_content_regex]}}
        - {name: valid_days, in: query, schema: {type: integer, minimum: 1, maximum: 3650, default: 180}}
        - {name: delimiter, in: query, schema: {type: string, enum: [comma, tab, semicolon], default: comma}}
        - {name: value_column, in: query, schema: {type: string}}
        - {name: type_column, in: query, schema: {type: string}}
        - {name: first_seen_column, in: query, schema: {type: string}}
        - {name: confidence_column, in: query, schema: {type: string}}
        - {name: label_column, in: query, schema: {type: string}}
        - {name: valid_until_column, in: query, schema: {type: string}}
      requestBody: {required: true, content: {text/csv: {schema: {type: string}}}}
      responses:
        '200':
          description: Imported
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object, properties: {source: {$ref: '#/components/schemas/IndicatorSource'}, merged: {type: boolean}, report: {type: object, properties: {rows: {type: integer}, accepted: {type: integer}, skipped: {type: integer}, problems: {type: array, items: {type: object, properties: {row: {type: integer}, reason: {type: string}}}}}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Not a manual source, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: CSV over 16 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Indicator limits exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerability-sources:
    get:
      tags: [Threat intelligence]
      operationId: listVulnerabilitySources
      summary: List vulnerability and advisory sources
      description: |
        Every advisory source (VUL-001): OSV.dev dumps, OpenSSF malicious packages, CISA KEV and FIRST EPSS (downloaded by `scrs-feed-sync`), the NVD CVE API 2.0 and the CVE Program's CVE Services API (synced by the worker for CVEs the register references), and imported VEX statements. Each lists its licence and terms, schedule, last sync and success, record count, lag and failures. A source with no success within twice its schedule is `stale` and raises `feed.stale` once (VUL-010). Scope `read` or `write`.
      responses:
        '200': {description: Sources, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/VulnerabilitySource'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerability-sources/{key}:
    parameters: [{name: key, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Threat intelligence]
      operationId: getVulnerabilitySource
      summary: Get one advisory source
      description: One source with its health. The `ETag` is the revision for `If-Match`. Scope `read` or `write`.
      responses:
        '200': {description: Source, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySource'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Threat intelligence]
      operationId: updateVulnerabilitySource
      summary: Enable, disable or reschedule a source
      description: Changes `enabled` or `schedule_minutes` (15 to 10080) of a worker-synced source (`nvd`, `cve_program`). Enabling a licence-restricted source needs `acknowledge_terms` set to true (VUL-011). Every change is audited. Sources downloaded by `scrs-feed-sync` answer `409`. Requires `If-Match`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {enabled: {type: boolean}, schedule_minutes: {type: integer, minimum: 15, maximum: 10080}, acknowledge_terms: {type: boolean}}}}}}
      responses:
        '200': {description: Changed, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySource'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Stale revision, managed by feed-sync, or terms not acknowledged, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerability-sources/{key}:sync:
    parameters: [{name: key, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Threat intelligence]
      operationId: syncVulnerabilitySource
      summary: Sync an advisory source now
      description: Makes a worker-synced source (`nvd`, `cve_program`) due now. Set `SCRS_NVD_API_KEY` on the worker for the NVD's higher rate limit. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {queued: {type: boolean}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Managed by scrs-feed-sync, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerabilities/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'CVE, GHSA or other advisory id'}
    get:
      tags: [Threat intelligence]
      operationId: getVulnerability
      summary: Everything known about a vulnerability
      description: |
        The vulnerability's records from every synced origin in OSV schema (`nvd`, `cve5`; VUL-002), each with the original kept verbatim server-side; every CVSS vector and score offered with its source (`severity_sources`, VUL-004); CWEs; and vendor statements from imported VEX documents (VUL-009), filtered to a product with `purl` (a statement without a version applies to every version). Statements are attributed inputs and never close a finding. Scope `read` or `write`.
      parameters: [{name: purl, in: query, schema: {type: string}}]
      responses:
        '200':
          description: Vulnerability
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  records: {type: array, items: {type: object}}
                  severity_sources: {type: array, items: {type: object, properties: {version: {type: string}, vector: {type: string}, base_score: {type: number}, base_severity: {type: string}, source: {type: string}, type: {type: string}}}}
                  cwe: {type: array, items: {type: string}}
                  vendor_statements: {type: array, items: {$ref: '#/components/schemas/VendorStatement'}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vex-documents:
    get:
      tags: [Threat intelligence]
      operationId: listVEXDocuments
      summary: List imported VEX documents
      description: Imported OpenVEX, CycloneDX VEX and CSAF documents, newest first, with publisher, statement count and digest. Scope `read` or `write`.
      responses:
        '200': {description: Documents, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/VEXDocument'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Threat intelligence]
      operationId: importVEX
      summary: Import a VEX document
      description: |
        Stores the vendor and maintainer statements of an OpenVEX, CycloneDX VEX or CSAF 2.0 (`csaf_vex` or `csaf_security_advisory`) document (VUL-009), one per vulnerability and product (purl, or product name when the document gives none). CycloneDX analysis states map to `not_affected`, `affected`, `fixed` and `under_investigation`. The same document (by SHA-256) imported twice is `409`. Up to 16 MiB and 20000 statements. Scope `write`.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '201': {description: Imported, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/VEXDocument'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Already imported, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Over 16 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vex-documents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Threat intelligence]
      operationId: deleteVEXDocument
      summary: Delete a VEX document
      description: Removes the document and its statements. Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vex-statements:
    get:
      tags: [Threat intelligence]
      operationId: listVendorStatements
      summary: Find vendor statements
      description: Statements about a `vulnerability` and/or a product `purl` (a versionless statement purl matches every version), newest first, up to 500. Scope `read` or `write`.
      parameters:
        - {name: vulnerability, in: query, schema: {type: string}}
        - {name: purl, in: query, schema: {type: string}}
      responses:
        '200': {description: Statements, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/VendorStatement'}}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}/taxii:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Threat intelligence]
      operationId: getTAXIIFeed
      summary: TAXII feed settings and poll state
      description: Settings, cursor and the last poll's outcome of a `taxii` source. The credential is never returned. Scope `read` or `write`.
      responses:
        '200': {description: Feed, content: {application/json: {schema: {$ref: '#/components/schemas/TAXIIFeed'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Threat intelligence]
      operationId: updateTAXIIFeed
      summary: Change a TAXII feed
      description: |
        Changes settings; omitted fields are unchanged. Any credential field (`api_key`, `username`, `password`, `cert_pem`,
        `key_pem`) replaces the whole credential, so send all the parts the feed needs. A new `api_root` or `collection`, or
        `reset_cursor`, restarts from the beginning of the collection. The next poll is due at once. Scope `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TAXIIFeedInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/TAXIIFeed'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:poll:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Threat intelligence]
      operationId: pollTAXIIFeed
      summary: Poll a TAXII feed now
      description: Makes the feed due; the worker polls it within `SCRS_TAXII_POLL_SECONDS`. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {queued: {type: boolean}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Threat intelligence]
      operationId: testTAXIIFeed
      summary: Check a TAXII feed's settings
      description: Reads the collection resource with the stored URL, credential and certificates, and reports whether the collection can be read. Scope `admin`.
      responses:
        '200': {description: Reached, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean, description: The collection allows reading}, collection: {type: object, properties: {id: {type: string}, title: {type: string}, can_read: {type: boolean}, can_write: {type: boolean}}}}}}}}
        '502': {description: The server could not be reached or refused the request, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, error: {type: string}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:hunt:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Threat intelligence]
      operationId: huntIndicatorSource
      summary: Retro-hunt with a source
      description: Queues a rescan of the default branch of every in-scope repository so enabled indicators are checked against current code. Rescans already queued in the same window are not repeated. Scope `write`.
      responses:
        '202': {description: Rescans queued, content: {application/json: {schema: {type: object, properties: {rescans_queued: {type: integer}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Source disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Operations
  /maintenance/run:
    post:
      tags: [Operations]
      operationId: runMaintenance
      summary: Run maintenance now
      description: Applies retention, expires idempotency keys and purges old deliveries. Concurrent runs are skipped. Scope `admin`.
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceReport'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/rescan:
    post:
      tags: [Operations]
      operationId: rescanDefaultBranches
      summary: Rescan default branches
      description: Queues a rescan of every in-scope repository's default branch that has no recent assessment. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {rescans_queued: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/redeliver-dead:
    post:
      tags: [Operations]
      operationId: redeliverDead
      summary: Requeue all dead deliveries
      description: Use after a receiver outage. Scope `admin`.
      responses:
        '202': {description: Requeued, content: {application/json: {schema: {type: object, properties: {deliveries_requeued: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/reset:
    post:
      tags: [Operations]
      operationId: resetData
      summary: Reset one scope of data
      description: |
        Scoped reset (MNT-001), audited. `feed_state` clears TAXII cursors and NVD/CVE sync state so the next runs resync from scratch. `indicators` deletes every indicator of `source_id`. `asset_findings` deletes one asset's register entries and their history (`asset_id`); assets on legal hold are refused. `confirm` must repeat the scope. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, confirm]
              properties:
                scope: {type: string, enum: [feed_state, indicators, asset_findings]}
                confirm: {type: string, description: The scope name again}
                asset_id: {type: string, format: uuid}
                source_id: {type: string, format: uuid}
      responses:
        '200': {description: Reset, content: {application/json: {schema: {type: object, properties: {scope: {type: string}, removed: {type: object, additionalProperties: {type: integer}}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: The asset is on legal hold, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/rebuild:
    post:
      tags: [Operations]
      operationId: rebuildDerived
      summary: Re-assess current revisions
      description: Queues the newest successful assessment of every tracked asset and ref (last 180 days) again (MNT-002), so findings, scores, KEV/EPSS, indicator and rule matches are recomputed against current feeds. Pull requests are left to their own events. Audited. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {type: object, properties: {assessments_queued: {type: integer}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/update-sensors:
    post:
      tags: [Operations]
      operationId: updateSensors
      summary: Refresh feeds now
      description: Makes every enabled TAXII feed and NVD/CVE Program sync due now (MNT-003) and returns the vulnerability sources with their freshness. OSV, KEV, EPSS and ClamAV signatures refresh on their own schedules in `scrs-feed-sync` and `scrs-clamav`. Audited. Scope `admin`.
      responses:
        '202': {description: Due now, content: {application/json: {schema: {type: object, properties: {due_now: {type: object, additionalProperties: {type: integer}}, sources: {type: array, items: {$ref: '#/components/schemas/VulnerabilitySource'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/schedule:
    get:
      tags: [Operations]
      operationId: maintenanceSchedule
      summary: Scheduled jobs and their last runs
      description: Each scheduled job (maintenance and retention, TAXII polling, advisory sync, feed monitor, GitHub delivery check) with interval, last start, finish, status, detail and next run, plus every feed source's schedule and health (MNT-005). Scope `admin`.
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {type: object, properties: {job: {type: string}, interval_seconds: {type: integer}, last_started_at: {type: [string, 'null'], format: date-time}, last_finished_at: {type: [string, 'null'], format: date-time}, last_status: {type: string}, last_detail: {type: object}, next_run_at: {type: [string, 'null'], format: date-time}}}}
                  feeds: {type: array, items: {type: object}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/versions:
    get:
      tags: [Operations]
      operationId: platformVersions
      summary: Platform versions and update check
      description: The SCRS build (version, Go, VCS revision), feed freshness, the Karate runner's versions, and the newest published release when `SCRS_RELEASE_FEED_URL` names an https JSON feed with `tag_name` or `version` (MNT-004). Scope `admin`.
      responses:
        '200': {description: Versions, content: {application/json: {schema: {type: object, properties: {scrs: {type: object}, feeds: {type: object}, qa_runner: {type: object}, latest_release: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- SAST and reachability (M9)
  /sast/analyzers:
    get:
      tags: [SAST]
      operationId: listSASTAnalyzers
      summary: Bundled analyzers
      description: The analyzers in the scrs-sast image (SAST-009) with version, languages, licence, rules licence, whether they may leave CreditChek (`redistributable`), rule count and whether this deployment enables them (`SCRS_SAST_ANALYZERS`), plus the reachability tool. Read live from the service; `service` is `unconfigured` or `unavailable` when it cannot be asked, and then only static metadata is returned. Scope `read` or `write`.
      responses:
        '200': {description: Analyzers, content: {application/json: {schema: {type: object, properties: {service: {type: string, enum: [ok, unavailable, unconfigured]}, enabled_by_default: {type: boolean}, analyzers: {type: array, items: {$ref: '#/components/schemas/SASTAnalyzer'}}, reachability: {$ref: '#/components/schemas/SASTAnalyzer'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reachability/capabilities:
    get:
      tags: [SAST]
      operationId: reachabilityCapabilities
      summary: Reachability capabilities
      description: Ecosystems, methods and tool versions for reachability (REA-007). Go uses the govulncheck call graph; every other ecosystem reports `unsupported`. A failed or skipped analysis is `unknown`, never `not_reachable` (REA-003). Scope `read` or `write`.
      responses:
        '200': {description: Capabilities, content: {application/json: {schema: {type: object, properties: {enabled_by_default: {type: boolean}, capabilities: {type: array, items: {type: object}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sast/settings:
    get:
      tags: [SAST]
      operationId: getSASTSettings
      summary: Deployment SAST settings
      description: Rules disabled everywhere (`tool:rule`, globs allowed, for example `bearer:javascript_express_helmet_missing` or `gosec:G104`) and paths excluded everywhere (globs such as `docs/**`). Scope `read` or `write`.
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SASTSettings'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [SAST]
      operationId: setSASTSettings
      summary: Replace deployment SAST settings
      description: Replaces the disabled rules and excludes; `If-Match` carries the revision (0 before the first change). Audited as `sast_settings.updated`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {disabled_rules: {type: array, maxItems: 500, items: {type: string}}, excludes: {type: array, maxItems: 200, items: {type: string}}}}}}}
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SASTSettings'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/sast:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [SAST]
      operationId: getAssetSAST
      summary: Asset SAST settings
      description: The asset's overrides (null fields inherit `SCRS_SAST_ENABLED` and `SCRS_REACHABILITY_ENABLED`) and the effective settings the next assessment uses, including enabled custom rulesets (SAST-002, REA-011). Scope `read` or `write`.
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object, properties: {settings: {$ref: '#/components/schemas/AssetSAST'}, effective: {type: object}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [SAST]
      operationId: setAssetSAST
      summary: Replace asset SAST settings
      description: Turns SAST and reachability on or off for the asset, selects analyzers, and adds disabled rules and excludes. `If-Match` carries the revision (0 before the first change). Audited. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetSAST'}}}}
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AssetSAST'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sast/rulesets:
    get:
      tags: [SAST]
      operationId: listSASTRulesets
      summary: Custom OpenGrep rulesets
      description: Uploaded rulesets without their bodies. Enabled rulesets run with the bundled OpenGrep rules on every SAST assessment (SAST-007). Scope `read` or `write`.
      responses:
        '200': {description: Rulesets, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/SASTRuleset'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [SAST]
      operationId: saveSASTRuleset
      summary: Upload a custom ruleset
      description: Stores or replaces (by name) an OpenGrep/Semgrep rule document after the scrs-sast service compiles it (`opengrep validate`). Audited as `sast_ruleset.saved`. Scope `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, rules]
              properties:
                name: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$'}
                description: {type: string, maxLength: 500}
                enabled: {type: boolean, default: true}
                rules: {type: string, maxLength: 1048576, description: OpenGrep rule YAML}
      responses:
        '201': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/SASTRuleset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {description: Rules do not compile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Validation service failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: SAST service not configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sast/rulesets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [SAST]
      operationId: getSASTRuleset
      summary: Get a ruleset
      description: One ruleset with its rule YAML. Scope `read` or `write`.
      responses:
        '200': {description: Ruleset, content: {application/json: {schema: {$ref: '#/components/schemas/SASTRuleset'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [SAST]
      operationId: deleteSASTRuleset
      summary: Delete a ruleset
      description: Removes a ruleset. Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Licences (M8)
  /policies/gate:
    get:
      tags: [Licences]
      operationId: getGatePolicy
      summary: Default gate rules
      description: The fixed verdict rules (TRG-006) as text. The gate is not configurable in this release; licence entries follow the licence policy. Scope `read` or `write`.
      responses:
        '200': {description: Gate rules, content: {application/json: {schema: {type: object, properties: {kind: {const: gate}, builtin: {type: boolean}, policy: {type: object}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /policies/license:
    get:
      tags: [Licences]
      operationId: getLicensePolicy
      summary: Active licence policy
      description: The licence policy applied to every assessment (LIC-004, LIC-005). Until an admin stores one it is the built-in `corporate-default` at revision 0. Licence data is a policy aid, not legal advice; counsel reviews the default before it is made enforcing. Scope `read` or `write`.
      responses:
        '200':
          description: Policy and revision
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LicensePolicyRecord'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Licences]
      operationId: setLicensePolicy
      summary: Replace the licence policy
      description: Stores a policy validated against `GET /schemas/license-policy`. `If-Match` must carry the current revision (0 for corporate-default). Set `enforcing` to true only after counsel review; until then licence entries cap the verdict at `warn`. Audited as `license_policy.updated`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LicensePolicy'}}}}
      responses:
        '200':
          description: Stored policy
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LicensePolicyRecord'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /policies/license:evaluate:
    post:
      tags: [Licences]
      operationId: evaluateLicense
      summary: Try a licence against the policy
      description: Normalises licence text to an SPDX expression (LIC-002) and decides it under the active policy for a distribution model, without recording anything. Useful when counsel reviews rules. Scope `read` or `write`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                expression: {type: string, maxLength: 2000, examples: ['Apache License, Version 2.0', 'MIT OR AGPL-3.0-only']}
                distribution: {$ref: '#/components/schemas/Distribution'}
                asset_id: {type: string, format: uuid}
                purl: {type: string, maxLength: 512}
                path: {type: string, maxLength: 512}
                dev: {type: boolean}
                project_license: {type: string, maxLength: 2000, description: 'Adds the outbound check (LIC-005): can this licence be combined into a project released under project_license?', examples: [GPL-2.0-only]}
      responses:
        '200':
          description: Normalised expression and decision
          content: {application/json: {schema: {type: object, properties: {normalized: {$ref: '#/components/schemas/NormalizedLicense'}, policy: {type: string}, policy_revision: {type: integer}, enforcing: {type: boolean}, decision: {$ref: '#/components/schemas/LicenseDecision'}, outbound: {$ref: '#/components/schemas/OutboundCompatibility'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /licenses/categories:
    get:
      tags: [Licences]
      operationId: getLicenseCategories
      summary: Licence categories
      description: Category of every SPDX License List licence and SCRS LicenseRef (LIC-003), with operator overrides and the override revision. Categories are permissive, public_domain, weak_copyleft, strong_copyleft, network_copyleft, source_available_restricted, non_commercial, proprietary and unknown. Scope `read` or `write`.
      responses:
        '200':
          description: Category mapping
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LicenseCategories'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Licences]
      operationId: setLicenseCategories
      summary: Replace category overrides
      description: Stores a new revision of the overrides (SPDX id or LicenseRef to category); the shipped mapping applies to every id not overridden. Versioned and audited as `license_categories.updated` with each change. Requires `If-Match` with the current revision. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [overrides]
              properties:
                overrides: {type: object, maxProperties: 2000, additionalProperties: {$ref: '#/components/schemas/LicenseCategory'}}
                note: {type: string, maxLength: 500}
      responses:
        '200':
          description: New revision
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {type: object, properties: {version: {type: string}, revision: {type: integer}, overrides: {type: object, additionalProperties: {type: string}}, counts: {type: object, additionalProperties: {type: integer}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /licenses/categories/history:
    get:
      tags: [Licences]
      operationId: listLicenseCategoryHistory
      summary: Category override history
      description: Stored override revisions, newest first (up to 100). Scope `read` or `write`.
      responses:
        '200': {description: Revisions, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {revision: {type: integer}, overrides: {type: object, additionalProperties: {type: string}}, note: {type: string}, created_by: {type: string, format: uuid}, created_at: {type: string, format: date-time}}}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/licenses:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Licences]
      operationId: assetLicenses
      summary: Asset licence inventory
      description: Components of the asset's newest successful assessment (of `ref`, when given) with licence expression, category, source (`declared`, `detected`, `metadata`, `none` or `unresolved`), confidence, the current policy result and the register status and waiver of each licence entry (LIC-006, LIC-007). Scope `read` or `write`.
      parameters: [{name: ref, in: query, schema: {type: string}}]
      responses:
        '200': {description: Inventory, content: {application/json: {schema: {$ref: '#/components/schemas/LicenseInventory'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/licenses/notices:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Licences]
      operationId: assetLicenseNotices
      summary: Third-party notices file
      description: A THIRD-PARTY-NOTICES text file (LIC-009) for the asset's newest assessed revision, with each component's licence, the copyright lines SCRS recorded and links to the licence texts. Development-only dependencies are omitted unless `include_dev=true`. A starting point, not legal advice. Scope `read` or `write`.
      parameters:
        - {name: ref, in: query, schema: {type: string}}
        - {name: include_dev, in: query, schema: {type: boolean, default: false}}
      responses:
        '200': {description: Notices, content: {text/plain: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/licenses:
    get:
      tags: [Licences]
      operationId: licenseReport
      summary: Licence report
      description: Licence inventory of one asset (`asset_id`) or of every assessed asset, as JSON, CSV (one row per component; cells that start with a formula character are quoted) or Markdown (LIC-007). Scope `read` or `write`.
      parameters:
        - {name: asset_id, in: query, schema: {type: string, format: uuid}}
        - {name: format, in: query, schema: {type: string, enum: [json, csv, md], default: json}}
      responses:
        '200':
          description: Report
          content:
            application/json: {schema: {type: object, properties: {generated_at: {type: string, format: date-time}, scrs_version: {type: string}, statement: {type: string}, assets: {type: array, items: {$ref: '#/components/schemas/LicenseInventory'}}}}}
            text/csv: {schema: {type: string}}
            text/markdown: {schema: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sboms/{id}/download:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'SBOM SHA-256 (`sbom_sha256` of an assessment) or the assessment id'}
    get:
      tags: [Assessment results]
      operationId: downloadSBOM
      summary: Download an SBOM
      description: The same export as `GET /assessments/{id}/sbom` (SBM-011), addressed by SBOM digest so a pipeline can fetch the document it recorded. Scope `read` or `write`.
      parameters: [{$ref: '#/components/parameters/SBOMFormat'}]
      responses:
        '200': {$ref: '#/components/responses/SBOM'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: SBOM not available, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Compliance reports (M8)
  /reports/frameworks:
    get:
      tags: [Compliance reports]
      operationId: listFrameworks
      summary: List framework packs
      description: Shipped packs (OWASP Top 10 2021 and 2025, CWE Top 25 2024 and 2025, PCI DSS v4.0.1 requirement 6.3) and uploaded CWE-mapping packs (CMP-001). Each pack names the source of its mapping. Scope `read` or `write`.
      responses:
        '200': {description: Packs, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/FrameworkPack'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Compliance reports]
      operationId: uploadFramework
      summary: Upload a framework pack
      description: Stores or replaces a custom `cwe_mapping` pack validated against `GET /schemas/framework-pack` (CMP-005). Shipped pack ids are reserved. Audited. Scope `admin`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkPack'}}}}
      responses:
        '201': {description: Stored pack, content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkPack'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/frameworks/stig:
    post:
      tags: [Compliance reports]
      operationId: importSTIG
      summary: Import a DISA STIG benchmark
      description: 'Imports a DISA STIG from its XCCDF benchmark (the `*-xccdf.xml` file, or the zip DISA publishes; at most 40 MiB) as a `stig` pack (CMP-004). Each rule becomes a category keyed by its STIG id, with its CAT severity, vulnerability and rule ids and CCIs. SCRS applies its starter mapping for the Application Security and Development STIG (CWE ids and finding types for the rules its scans can give evidence for); `mapping_unmatched` lists starter entries the benchmark does not contain. Download the pack, adjust the mapping and upload it with `POST /reports/frameworks`. SCRS bundles no DISA content, and reports never mark a rule "Not a Finding". The XML parser resolves no external entities. Audited. Scope `admin`.'
      requestBody:
        required: true
        content:
          application/xml: {schema: {type: string}}
          application/zip: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: Imported pack
          headers: {Location: {schema: {type: string}}}
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack: {$ref: '#/components/schemas/FrameworkPack'}
                  rules_mapped: {type: integer, description: Rules SCRS findings can give evidence for}
                  mapping_unmatched: {type: array, items: {type: string}, description: Starter-mapping STIG ids missing from this benchmark}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Benchmark too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /frameworks/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Compliance reports]
      operationId: getFramework
      summary: Get a framework pack
      description: One shipped or uploaded pack with its categories and CWE ids. Scope `read` or `write`.
      responses:
        '200': {description: Pack, content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkPack'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Compliance reports]
      operationId: deleteFramework
      summary: Delete an uploaded pack
      description: Removes an uploaded pack; shipped packs cannot be deleted. Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports:
    get:
      tags: [Compliance reports]
      operationId: listReports
      summary: List evidence reports
      description: Report jobs newest first, 50 per page. Scope `read` or `write`.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Reports, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ReportJob'}}, next_cursor: {type: string}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Compliance reports]
      operationId: createReport
      summary: Request an evidence report
      description: Queues a framework evidence report for one asset, one owner's assets or the portfolio over a window of at most 366 days (default the last 90), as JSON, CSV or Markdown (CMP-006). The worker records the data time, SCRS version, scope, advisory feed freshness and the file's SHA-256, and stores the file in S3 under the `reports` retention class. Reports list assets lacking a recent SBOM, count unmapped findings and contain no compliance verdict. Poll `GET /reports/{id}`. Scope `write`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportRequest'}}}}
      responses:
        '202':
          description: Queued
          headers: {Location: {schema: {type: string}}, Retry-After: {schema: {type: integer}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportJob'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Compliance reports]
      operationId: getReport
      summary: Get a report job
      description: Status, data time, SCRS version, feed freshness, summary counts and SHA-256 of one report. `Retry-After` is set while it is queued or running. Scope `read` or `write`.
      responses:
        '200': {description: Report job, content: {application/json: {schema: {$ref: '#/components/schemas/ReportJob'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/{id}/download:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Compliance reports]
      operationId: downloadReport
      summary: Download a report
      description: The report file, integrity-checked against its stored SHA-256 (also in `ETag` and `X-SCRS-Report-SHA256`). Scope `read` or `write`.
      responses:
        '200':
          description: Report file
          headers: {ETag: {schema: {type: string}}, X-SCRS-Report-SHA256: {schema: {type: string}}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/EvidenceReport'}}
            text/csv: {schema: {type: string}}
            text/markdown: {schema: {type: string}}
            application/pdf: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Report not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track:
    get:
      tags: [Integrations]
      operationId: getDependencyTrack
      summary: Dependency-Track export settings
      description: The export settings; the API key is write-only (`api_key_set`). Scope `read` or `write`.
      responses:
        '200': {description: Settings, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DTrackSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Integrations]
      operationId: setDependencyTrack
      summary: Configure the Dependency-Track export
      description: 'While enabled, every completed scan with an SBOM queues an upload in the same transaction; the worker pushes it with `PUT /api/v1/bom` (project = asset locator, version = ref, auto-created), retrying transient failures with backoff for about two days. The key needs BOM_UPLOAD and PROJECT_CREATION_UPLOAD and is sealed with the master key; omit `api_key` to keep the stored one. Requires `If-Match`. Audited without the key. Scope `admin`.'
      parameters: [{name: If-Match, in: header, required: true, schema: {type: string}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean}
                url: {type: string, maxLength: 500}
                api_key: {type: string, minLength: 16, maxLength: 256, writeOnly: true}
                parent_uuid: {type: string, format: uuid}
      responses:
        '200': {description: Settings, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DTrackSettings'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale revision, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '428': {description: If-Match required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track:test:
    post:
      tags: [Integrations]
      operationId: testDependencyTrack
      summary: Test the Dependency-Track connection
      description: Reads the server version, then checks the stored key holds BOM upload permission. Sends no SBOM. Scope `admin`.
      responses:
        '200': {description: Result, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean}, version: {type: string}, error: {type: string}}}}}}
        '409': {description: No URL or key stored, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track/uploads:
    get:
      tags: [Integrations]
      operationId: listDependencyTrackUploads
      summary: List SBOM uploads
      description: Uploads, newest first; finished ones are kept 90 days. Scope `read` or `write`.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [queued, sending, uploaded, failed]}}
        - {name: cursor, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Uploads, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/DTrackUpload'}}, next_cursor: {type: string}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track/uploads/{id}/retry:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Integrations]
      operationId: retryDependencyTrackUpload
      summary: Retry a failed upload
      description: Requeues a failed upload (for example after fixing the key). Audited. Scope `admin`.
      responses:
        '204': {description: Requeued}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events:
    get:
      tags: [Live events]
      operationId: streamEvents
      summary: Stream live events
      description: 'A `text/event-stream` of notices for committed events (OUT-004): `id` is the event id, `event` its type, `data` a JSON object with id, type, time, connection and asset ids and `refs` (ids to fetch; never evidence or secrets). The stream opens with `ready`, sends a comment heartbeat every 20 s, and ends after 10 minutes with `reconnect` so revoked tokens stop receiving; clients reconnect. Missed events are not replayed: reload state on connect and on `resync`. Use a client that can send the Authorization header (fetch streaming); tokens never go in the URL. At most 5 streams per token and 200 per API instance (SCRS_EVENTS_STREAMS_PER_TOKEN, SCRS_EVENTS_MAX_STREAMS). Scope `read` or `write`.'
      parameters:
        - {name: types, in: query, description: Comma-separated event types (default all), schema: {type: string, examples: ['assessment.completed,finding.created']}}
      responses:
        '200': {description: Event stream, content: {text/event-stream: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Too many streams or requests, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Live events unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /schemas/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, enum: [license-policy, framework-pack]}}
    get:
      tags: [Licences]
      operationId: getDocumentSchema
      summary: Policy and pack JSON Schemas
      description: JSON Schema (draft 2020-12) of the licence policy (`license-policy`, LIC-004) or of an uploaded framework pack (`framework-pack`, CMP-005). Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: JSON Schema, content: {application/schema+json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /audit:
    get:
      tags: [Operations]
      operationId: listAudit
      summary: Query the audit log
      description: Audit records newest first (OBS-002), 100 per page (`limit` up to 500). Filter by `action` (exact, or a prefix ending in `*` such as `connection.*`), `target_id`, `actor_id`, `since` and `until` (RFC 3339). Page with `cursor` set to the previous `next_cursor`. Scope `admin`.
      parameters:
        - {name: action, in: query, schema: {type: string}}
        - {name: target_id, in: query, schema: {type: string, format: uuid}}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}}
        - {name: since, in: query, schema: {type: string, format: date-time}}
        - {name: until, in: query, schema: {type: string, format: date-time}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Audit records, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}}, next_cursor: {type: string}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /schemas/events:
    get:
      tags: [Webhook subscriptions]
      operationId: listEventSchemas
      summary: List event schemas
      description: Every outbound event type with its schema versions and links (OUT-008). Payload version is also in the `X-SCRS-Event-Version` header. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Event types, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {type: {$ref: '#/components/schemas/EventType'}, versions: {type: array, items: {type: integer}}, link: {type: string}}}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /schemas/events/{type}/{version}:
    parameters:
      - {name: type, in: path, required: true, schema: {$ref: '#/components/schemas/EventType'}}
      - {name: version, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Webhook subscriptions]
      operationId: getEventSchema
      summary: Get one event JSON Schema
      description: The JSON Schema (draft 2020-12) of an event type and version, describing the `event` envelope and `data` (for `assessment.completed`, both the summary and the full/agent context profiles). Data objects allow added properties; a breaking change raises the version. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: JSON Schema, content: {application/schema+json: {schema: {type: object}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events/inbound:
    get:
      tags: [Operations]
      operationId: listInboundEvents
      summary: Inbound event log
      description: Raw provider events and triggers SCRS received, newest first. GitLab and registry events are prefixed (`gitlab:push`, `registry:harbor`). Scope `admin`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: actor, in: query, schema: {type: string}}
        - {name: event_type, in: query, schema: {type: string}}
      responses:
        '200':
          description: Page of events
          content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/InboundEvent'}}, next_cursor: {type: string}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events/inbound/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Operations]
      operationId: getInboundEvent
      summary: Get an inbound event
      description: Includes the raw body. Scope `admin`.
      responses:
        '200': {description: Event, content: {application/json: {schema: {$ref: '#/components/schemas/InboundEvent'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events/inbound/{id}:replay:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Operations]
      operationId: replayInboundEvent
      summary: Replay an event's assessment
      description: Queues a new assessment with the original request pinned to the originally resolved revision. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '409': {description: Event did not create an assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /settings/retention:
    get:
      tags: [Operations]
      operationId: getRetention
      summary: Get the retention policy
      description: |
        The policy (RET-001). `classes` lists every data class: its policy `days` (null = not set), `effective_days` and its `source` (`policy`, or `default` from `SCRS_RETENTION_DEFAULT_<CLASS>_DAYS`), its guard, and the last purge. Zero keeps forever. Open register entries, the current revision of each tracked ref and assets on legal hold are never purged; the audit log keeps at least 365 days. `inbound_event_days` and `webhook_delivery_days` are the original fields for their classes. Scope `admin`.
      responses:
        '200':
          description: Policy
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Retention'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Operations]
      operationId: setRetention
      summary: Set the retention policy
      description: Applies the given classes atomically and audits old and new values (RET-002); classes not named keep their setting. Requires `If-Match`. Preview first with `:preview`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                classes: {type: object, additionalProperties: {type: [integer, 'null'], minimum: 0, maximum: 36500}, description: 'Class to days; null = not set (environment default); 0 = keep forever. audit_log needs 0 or at least 365'}
                inbound_event_days: {type: integer, minimum: 0, description: Shorthand for classes.inbound_events}
                webhook_delivery_days: {type: integer, minimum: 0, description: Shorthand for classes.webhook_deliveries}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Retention'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /settings/retention:preview:
    post:
      tags: [Operations]
      operationId: previewRetention
      summary: Preview what a retention change deletes
      description: Counts what proposed values would delete now, without deleting (RET-003). Send `classes` for per-class counts, or `inbound_event_days` for the original rows-and-bytes preview. Scope `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {classes: {type: object, additionalProperties: {type: [integer, 'null']}}, inbound_event_days: {type: integer, minimum: 0}}}}}
      responses:
        '200': {description: Counts, content: {application/json: {schema: {type: object, properties: {classes: {type: object, additionalProperties: {type: integer}}, rows: {type: integer}, bytes: {type: integer}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /settings/retention:purge:
    post:
      tags: [Operations]
      operationId: purgeRetention
      summary: Apply the retention policy now
      description: Purges every class past its effective retention in bounded batches, deletes the purged objects from S3 and audits the counts (RET-005, RET-007). Hourly maintenance does the same on schedule. Requires `If-Match` with the policy revision you previewed. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: Deleted, content: {application/json: {schema: {type: object, properties: {deleted_events: {type: integer}, purged: {type: object, additionalProperties: {type: integer}}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- E2E QA (Karate)
  /assets/{id}/qa/profile:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: getQAProfile
      summary: Get a repository's QA profile
      description: The Karate settings of a GitHub or GitLab asset. Variable values are write-only; `variable_names` lists them. The `ETag` is the revision for `If-Match`. Scope `read` or `write`.
      responses:
        '200': {description: Profile, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfile'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [E2E QA]
      operationId: putQAProfile
      summary: Create or replace a repository's QA profile
      description: |
        Sets where QA runs test (`base_url`, a deployed staging or preview environment), which Karate suites run (`test_path` in the repository, `tags`), the secrets the tests receive as `QA_<NAME>` environment variables, an optional load profile and the LLM provider that drafts tests. Omitted fields take defaults; omitting `variables` keeps the stored ones. Replacing an existing profile needs `If-Match`. With `auto_run`, every successful assessment of a matching ref queues a functional run. Scope `admin`, because the runner calls `base_url` with these secrets.
      parameters: [{name: If-Match, in: header, schema: {type: string}, description: 'Required when the profile exists: its ETag revision'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfileInput'}, examples: {staging: {value: {base_url: 'https://api.staging.example.com', environment: staging, refs: [main, 'release/*'], test_path: karate, openapi_path: api/openapi.yaml, variables: {API_TOKEN: '…'}, auth: {header: Authorization, variable: API_TOKEN, prefix: 'Bearer '}, perf: {features: [perf/browse.feature], users: 20, ramp_seconds: 30, duration_seconds: 120, p95_millis: 800, max_error_percent: 1, auto_run: false}}}}}}}
      responses:
        '201': {description: Created, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfile'}}}}
        '200': {description: Replaced, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Not an in-scope GitHub or GitLab repository, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {description: Secret encryption unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [E2E QA]
      operationId: deleteQAProfile
      summary: Remove a repository's QA profile
      description: Stops automatic QA runs for the asset. Past runs, reports, findings and generated suites are kept. Scope `admin`.
      responses:
        '204': {description: Removed}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/qa/runs:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: listQARuns
      summary: List a repository's QA runs
      description: The 50 newest runs, newest first. Page with `before` set to the previous response's `next_before`. Scope `read` or `write`.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [functional, performance]}}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/QARunStatus'}}
        - {name: before, in: query, schema: {type: string, format: date-time}}
      responses:
        '200': {description: Runs, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QARun'}}, next_before: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [E2E QA]
      operationId: createQARun
      summary: Run QA tests now
      description: Queues a functional or performance run of the latest successful git assessment of the asset, or of `assessment_id`. A commit whose verdict is `fail` is never sent to the runner. `include_drafts` also runs draft generated features (admin only). Scope `write` or `trigger`.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/QARunRequest'}}}}
      responses:
        '202': {description: Queued, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/QARun'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: No enabled profile, no successful assessment, or the verdict is fail, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/qa/coverage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: qaCoverageHistory
      summary: API coverage history of a repository
      description: Finished functional runs with API coverage, oldest first, for trend charts. Coverage is the share of documented OpenAPI operations that the tests called. Scope `read` or `write`.
      parameters:
        - {name: ref, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200': {description: History, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QACoveragePoint'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/qa/generations:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: listQAGenerations
      summary: List a repository's test generations
      description: The 50 newest generations with their token usage and accepted and rejected file counts. Scope `read` or `write`.
      responses:
        '200': {description: Generations, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QAGeneration'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [E2E QA]
      operationId: createQAGeneration
      summary: Draft tests with the profile's LLM
      description: |
        Queues test generation at the latest successful assessment. `api` sends the OpenAPI document's operations (untested ones first) to the profile's LLM provider and stores Karate features as drafts; they run only after approval. `unit` sends source files that have no tests (Go, TypeScript, JavaScript, Python, Java, Kotlin) and stores unit tests for developers to download and commit; it needs `allow_source_upload` on the profile. Every file passes static checks first; failing files are stored `rejected` with their problems. Scope `write`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QAGenerationRequest'}}}}
      responses:
        '202': {description: Queued, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAGeneration'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: No profile, provider, successful assessment, or source upload not allowed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/qa/suites:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: listQASuites
      summary: List generated test files
      description: Generated files of the asset without their content, by path. Filter by `kind` (api or unit) and `status` (draft, approved, rejected, superseded). Scope `read` or `write`.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [api, unit]}}
        - {name: status, in: query, schema: {type: string, enum: [draft, approved, rejected, superseded]}}
      responses:
        '200': {description: Suites, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QASuite'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}/qa:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: assessmentQARuns
      summary: QA runs of an assessment
      description: Functional and performance runs of the assessed commit, newest first. A run is `skipped` when the assessment's verdict was `fail`. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Runs, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QARun'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runner:
    get:
      tags: [E2E QA]
      operationId: qaRunnerStatus
      summary: Karate runner status
      description: Whether the API process has a runner configured and can reach it, with the runner's Karate version, Gatling support, slots and queue. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Runner status, content: {application/json: {schema: {$ref: '#/components/schemas/QARunnerStatus'}}}}
        '502': {description: Runner unreachable, content: {application/json: {schema: {$ref: '#/components/schemas/QARunnerStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: getQARun
      summary: Get a QA run
      description: Status, scenario counts, coverage summary and load statistics of one run. Poll until `status` is passed, failed, error, cancelled or skipped, or subscribe to `qa.completed` and `qa.failed`. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/QARun'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/scenarios:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: listQAScenarios
      summary: Scenarios of a QA run
      description: Executed Karate scenarios with outcome, duration, tags and failure reason, 500 per page. Filter with `status=failed`. Scope `read`, `write` or `trigger`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [passed, failed, skipped]}}
      responses:
        '200': {description: Scenarios, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QAScenario'}}, next_cursor: {type: string}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/coverage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: getQACoverage
      summary: API coverage of a QA run
      description: Every documented operation with the number of test calls and response statuses seen, plus called paths the document does not describe. Present when the commit had an OpenAPI document. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Coverage, content: {application/json: {schema: {$ref: '#/components/schemas/QACoverage'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/report:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: downloadQAReport
      summary: Download a QA run's reports
      description: The runner's report archive (gzip tar) with `result.json`, `console.log`, Karate HTML, JUnit XML and JSON Lines reports, or the Gatling report. Secret values and credential headers are redacted by the runner. Verify against `X-Content-SHA256`. Scope `read`, `write` or `trigger`.
      responses:
        '200':
          description: Report archive
          headers: {X-Content-SHA256: {schema: {type: string}}}
          content: {application/gzip: {schema: {type: string, format: binary}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: The run has no stored report, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Object store unavailable or integrity check failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}:cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [E2E QA]
      operationId: cancelQARun
      summary: Cancel a QA run
      description: Stops a queued or active run; the worker also removes the job from the runner. Finished runs cannot be cancelled. Scope `write` or `trigger`.
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/QARun'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/generations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: getQAGeneration
      summary: Get a test generation and its files
      description: The generation's status, provider, model, token usage and every file it produced (without content). Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Generation, content: {application/json: {schema: {type: object, properties: {generation: {$ref: '#/components/schemas/QAGeneration'}, suites: {type: array, items: {$ref: '#/components/schemas/QASuite'}}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/generations/{id}/files:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: downloadQAGeneration
      summary: Download a generation's files
      description: A gzip tar with drafts and approved files under `files/` at their repository paths, rejected and superseded ones under their status, and `MANIFEST.json` with each file's status and problems. Use it to commit generated unit tests. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Files, content: {application/gzip: {schema: {type: string, format: binary}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/suites/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [E2E QA]
      operationId: getQASuite
      summary: Get a generated test file
      description: One generated file with its content, the operations or source file it covers, its static-check problems and its review. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Suite, content: {application/json: {schema: {$ref: '#/components/schemas/QASuite'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/suites/{id}:approve:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [E2E QA]
      operationId: approveQASuite
      summary: Approve a generated test file
      description: Approves a draft without problems. Approved API features run in every later functional run of the asset (suite `generated`); approving replaces the previously approved file at the same path. Scope `admin`, since approved features run against the target.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/QAReview'}}}}
      responses:
        '200': {description: Approved, content: {application/json: {schema: {$ref: '#/components/schemas/QASuite'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Not a draft, or the draft has problems, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/suites/{id}:reject:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [E2E QA]
      operationId: rejectQASuite
      summary: Reject a generated test file
      description: Marks a draft rejected with an optional note; it never runs. Scope `write`.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/QAReview'}}}}
      responses:
        '200': {description: Rejected, content: {application/json: {schema: {$ref: '#/components/schemas/QASuite'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Not a draft, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- LLM providers
  /llm/presets:
    get:
      tags: [LLM providers]
      operationId: listLLMPresets
      summary: List supported LLM provider kinds
      description: Each provider kind with its wire protocol (OpenAI chat completions, Anthropic Messages or Gemini generateContent), default inference URL, and whether a base URL or API key is required. Scope `read` or `write`.
      responses:
        '200': {description: Presets, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/LLMPreset'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers:
    get:
      tags: [LLM providers]
      operationId: listLLMProviders
      summary: List LLM providers
      description: Configured model endpoints by name. Keys are never returned; `has_api_key` tells whether one is stored. Scope `read` or `write`.
      responses:
        '200': {description: Providers, content: {application/json: {schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/LLMProvider'}}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [LLM providers]
      operationId: createLLMProvider
      summary: Add an LLM provider
      description: |
        Stores a model endpoint for test generation. `base_url` defaults to the kind's inference URL and can point at a regional endpoint, Azure resource, gateway or self-hosted server (plain http only for hosts in `SCRS_LLM_PRIVATE_HOSTS`). The API key is sealed with `SCRS_MASTER_KEY`. Scope `admin`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProviderInput'}, examples: {openai: {value: {name: openai-main, kind: openai, model: gpt-5.1, api_key: 'sk-…'}}, anthropic: {value: {name: claude, kind: anthropic, model: claude-sonnet-5-5, max_tokens: 16000, api_key: 'sk-ant-…'}}, azure: {value: {name: azure-eu, kind: azure_openai, base_url: 'https://acme.openai.azure.com/openai/v1', model: gpt-5-deployment, api_key: '…'}}, ollama: {value: {name: local, kind: ollama, base_url: 'http://gpu-box:11434/v1', model: 'qwen3-coder:30b'}}}}}}
      responses:
        '201': {description: Created, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {description: Secret encryption unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [LLM providers]
      operationId: getLLMProvider
      summary: Get an LLM provider
      description: One provider's settings and last connectivity check. The `ETag` is the revision for `If-Match`. Scope `read` or `write`.
      responses:
        '200': {description: Provider, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [LLM providers]
      operationId: updateLLMProvider
      summary: Change an LLM provider
      description: Changes the given fields; `api_key` replaces the stored key and an empty string removes it. `clear_temperature` removes a set temperature. The name cannot change. Requires `If-Match`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProviderInput'}}}}
      responses:
        '200': {description: Changed, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [LLM providers]
      operationId: deleteLLMProvider
      summary: Delete an LLM provider
      description: Removes the provider and its key. QA profiles that used it lose their provider; past generations keep its name. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers/{id}:test:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [LLM providers]
      operationId: testLLMProvider
      summary: Check an LLM provider
      description: Sends a one-line prompt with the stored settings and key and reports the reply, model, latency and token usage, or the provider's error. The outcome is kept as `last_test_at` and `last_test_error`. Scope `admin`.
      responses:
        '200': {description: The provider answered, content: {application/json: {schema: {$ref: '#/components/schemas/LLMTestResult'}}}}
        '502': {description: The provider failed, content: {application/json: {schema: {$ref: '#/components/schemas/LLMTestResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: SCRS API token. Create with POST /tokens.
  headers:
    ETag:
      description: Resource revision; send back in `If-Match`.
      schema: {type: string, examples: ['"3"']}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: '`next_cursor` from the previous page'}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: 'ETag revision, for example "3"'}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}, description: Replays within 24 h return the original result}
    SBOMFormat: {name: format, in: query, schema: {type: string, enum: [cyclonedx-json, cyclonedx-xml, spdx-json], default: cyclonedx-json}}
    GitHubEvent: {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
    GitHubDelivery: {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string, format: uuid}}
    GitHubSignature: {name: X-Hub-Signature-256, in: header, schema: {type: string}, description: 'sha256=<hex HMAC of the body> (required in direct mode)'}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Missing or invalid bearer token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Token lacks the required scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found or not visible to this token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflicts with current state or revision, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    PreconditionRequired: {description: If-Match header required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SBOM:
      description: SBOM document
      headers:
        ETag: {schema: {type: string}, description: SHA-256 of the stored CycloneDX JSON document}
        X-SCRS-Version: {schema: {type: string}}
        X-SCRS-Generated-At: {schema: {type: string, format: date-time}}
      content:
        application/vnd.cyclonedx+json: {schema: {type: object}}
        application/vnd.cyclonedx+xml: {schema: {type: string}}
        application/spdx+json: {schema: {type: object}}
    RateLimited:
      description: Rate or capacity limit; retry after the given seconds
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      type: object
      required: [error]
      properties: {error: {type: string}}
    Status:
      type: object
      properties: {status: {type: string, enum: [ok, unavailable]}}
    Scope: {type: string, enum: [read, write, trigger, ingest:relay, admin]}
    YaraRulesetInput:
      type: object
      required: [name, rules]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: Namespace in findings (`YARA:<name>:<rule>`); cannot change}
        kind: {type: string, enum: [custom, external], default: custom}
        description: {type: string, maxLength: 1000}
        mode: {type: string, enum: [hunt, alert, block], default: hunt}
        severity: {type: string, enum: [critical, high, medium, low, info], default: medium, description: Used when a rule has no `severity` meta}
        enabled: {type: boolean, default: true}
        rules: {type: string, maxLength: 16777216}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
    YaraRulesetChange:
      type: object
      additionalProperties: false
      properties:
        description: {type: string, maxLength: 1000}
        mode: {type: string, enum: [hunt, alert, block]}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        enabled: {type: boolean}
        rules: {type: string, maxLength: 16777216}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
    IndicatorSourceInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: Prefix of finding advisory IDs (`<name>:<indicator id>`); cannot change}
        kind: {type: string, enum: [manual, stix, taxii], default: manual, description: '`manual` sources import SCRS bundles with PUT; `stix` sources import STIX 2.1 with `:import-stix`; `taxii` sources poll a TAXII 2.1 collection (scope `admin`)'}
        description: {type: string, maxLength: 1000}
        mode: {type: string, enum: [hunt, alert, block], default: hunt}
        severity: {type: string, enum: [critical, high, medium, low, info], default: high, description: Severity of `ioc_alert` and `ioc_hunt` findings}
        min_confidence: {type: integer, minimum: 0, maximum: 100, default: 0}
        enabled: {type: boolean, default: true}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
        taxii: {$ref: '#/components/schemas/TAXIIFeedInput'}
    TAXIIFeedInput:
      type: object
      additionalProperties: false
      description: |
        Required with kind `taxii`. Examples: OpenCTI `auth_type: api_key` with `api_key: "Bearer <token>"`; MISP `api_key`
        with the MISP auth key; vendors often `auth_header: X-API-Key`; CISA AIS a client certificate (`cert_pem`, `key_pem`),
        with `basic` if AIS issued a username. Credential fields are write-only.
      properties:
        api_root: {type: string, format: uri, description: 'TAXII API root, https, ending in /'}
        collection: {type: string, maxLength: 256, description: Collection id}
        auth_type: {type: string, enum: [none, api_key, basic], default: none}
        auth_header: {type: string, default: Authorization, description: Header that carries `api_key`}
        api_key: {type: string, writeOnly: true, description: Full header value}
        username: {type: string, writeOnly: true}
        password: {type: string, writeOnly: true}
        cert_pem: {type: string, writeOnly: true, description: Client certificate (PEM); works with any auth_type}
        key_pem: {type: string, writeOnly: true, description: Client private key (PEM)}
        ca_pem: {type: string, description: 'CA certificates (PEM) for the server, instead of the system roots'}
        interval_minutes: {type: integer, minimum: 5, maximum: 10080, default: 60}
        page_size: {type: integer, minimum: 1, maximum: 10000, default: 1000}
        valid_days: {type: integer, minimum: 1, maximum: 3650, default: 180, description: Expiry for indicators without valid_until}
        reset_cursor: {type: boolean, description: PATCH only; poll the collection from the start}
    TAXIIFeed:
      type: object
      properties:
        source_id: {type: string, format: uuid}
        api_root: {type: string}
        collection: {type: string}
        auth_type: {type: string, enum: [none, api_key, basic]}
        auth_header: {type: string}
        client_cert: {type: boolean}
        ca_pem: {type: string}
        interval_minutes: {type: integer}
        page_size: {type: integer}
        valid_days: {type: integer}
        cursor: {type: string, description: 'added_after for the next poll (the last X-TAXII-Date-Added-Last)'}
        next_poll_at: {type: string, format: date-time}
        last_poll_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        last_error: {type: string}
        failures: {type: integer, description: 'Consecutive failures; the third emits feed.stale'}
        objects_polled: {type: integer}
    IndicatorSourceChange:
      type: object
      additionalProperties: false
      properties:
        description: {type: string, maxLength: 1000}
        mode: {type: string, enum: [hunt, alert, block]}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        min_confidence: {type: integer, minimum: 0, maximum: 100}
        enabled: {type: boolean}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
    STIXBundle:
      type: object
      required: [type, id, objects]
      properties:
        type: {type: string, const: bundle}
        id: {type: string, pattern: '^bundle--'}
        objects: {type: array, maxItems: 200000, items: {type: object, description: STIX 2.1 objects; only indicator objects are read}}
    STIXImportResult:
      type: object
      properties:
        source: {$ref: '#/components/schemas/IndicatorSource'}
        yara_ruleset: {oneOf: [{$ref: '#/components/schemas/YaraRuleset'}, {type: 'null'}]}
        report:
          type: object
          properties:
            objects: {type: integer}
            indicators: {type: integer, description: Indicator objects in the bundle}
            imported: {type: integer, description: SCRS indicators produced}
            yara_patterns: {type: integer, description: YARA patterns that compile on their own}
            partial: {type: integer, description: Patterns where only some OR alternatives could be checked}
            skipped:
              type: object
              additionalProperties: {type: integer}
              description: 'Counts by reason: revoked, expired, superseded, unsupported_version, unsupported_pattern_type, combines_observations, time_window, unsupported_object, unsupported_hash, unsupported_operator, unsupported_value, combines_conditions, invalid_pattern, invalid_yara, too_many_yara, duplicate_rule_name, ruleset_full, too_many_indicators'
            samples:
              type: array
              maxItems: 50
              items: {type: object, properties: {id: {type: string}, reason: {type: string}, detail: {type: string}}}
    IndicatorSource:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [manual, stix, taxii]}
        description: {type: string}
        mode: {type: string, enum: [hunt, alert, block]}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        min_confidence: {type: integer}
        enabled: {type: boolean}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
        version: {type: string, description: Version of the last import}
        indicator_count: {type: integer}
        imported_at: {type: [string, 'null'], format: date-time}
        yara_ruleset_id: {type: [string, 'null'], format: uuid, description: 'The `stix_<source>` ruleset built from the source''s YARA patterns'}
        taxii: {$ref: '#/components/schemas/TAXIIFeed', description: Present for kind `taxii` on list, get and create}
        revision: {type: integer}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    YaraRuleOrigin:
      type: object
      additionalProperties: false
      description: Attribution for third-party packs
      properties:
        vendor: {type: string, maxLength: 100}
        url: {type: string, format: uri, description: https only}
        version: {type: string, maxLength: 100}
        license: {type: string, maxLength: 100, description: 'SPDX identifier, for example DRL-1.1'}
    YaraRuleset:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string, enum: [custom, external]}
        description: {type: string}
        mode: {type: string, enum: [hunt, alert, block]}
        severity: {type: string, enum: [critical, high, medium, low, info]}
        enabled: {type: boolean}
        rules: {type: string, description: Present on single-ruleset reads only}
        sha256: {type: string}
        rule_count: {type: integer}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
        revision: {type: integer}
        created_by: {type: [string, 'null'], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    YaraRulesetResult:
      allOf:
        - $ref: '#/components/schemas/YaraRuleset'
        - type: object
          properties:
            warnings: {type: array, items: {$ref: '#/components/schemas/RuleDiagnostic'}}
    RuleDiagnostic:
      type: object
      properties:
        level: {type: string, enum: [error, warning]}
        code: {type: string, description: 'YARA-X code, for example E025 or slow_pattern'}
        message: {type: string}
        line: {type: integer}
        column: {type: integer}
    RuleCompileError:
      type: object
      properties:
        error: {type: string}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/RuleDiagnostic'}}
    GitHubWebhookCheck:
      type: object
      properties:
        connection_id: {type: string, format: uuid}
        connection: {type: string}
        source: {type: string, enum: [app, org], description: 'GitHub App webhook or organization webhook (connection `webhook_source`)'}
        state: {type: string, enum: [unchecked, ok, degraded, failed]}
        checked_at: {type: string, format: date-time}
        last_success_at: {type: string, format: date-time, description: The next check reads deliveries from here (minus 15 minutes), so failed checks lose nothing}
        window_start: {type: string, format: date-time}
        hooks: {type: integer, description: Webhooks pointing at SCRS}
        deliveries_scanned: {type: integer}
        redelivered: {type: integer}
        retrying: {type: integer, description: Failed events waiting for their next redelivery attempt}
        abandoned: {type: integer, description: Events that could not be redelivered; rescan the affected repositories}
        rejected: {type: integer, description: 'Newly seen deliveries SCRS rejected (for example HTTP 401 for a secret mismatch); not redelivered'}
        problems: {type: array, items: {type: string}}
    Token:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string, description: 'First characters of the secret, for identification'}
        scopes: {type: array, items: {$ref: '#/components/schemas/Scope'}}
        ip_allow_list: {type: array, items: {type: string}}
        expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        last_used_at: {type: [string, 'null'], format: date-time}
        revoked_at: {type: [string, 'null'], format: date-time}
    TokenPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Token'}}
        next_cursor: {type: string}
    Provider: {type: string, enum: [github, gitlab, dockerhub, gar, harbor, oci]}
    ConnectionScope:
      type: object
      required: [include]
      properties:
        include: {type: array, maxItems: 100, items: {type: string}, description: 'Locator globs; `/**` matches any depth', example: ['acme/*', 'docker.io/acme/*']}
        exclude: {type: array, items: {type: string}}
    ConnectionInput:
      type: object
      additionalProperties: false
      required: [provider, name, config, scope, credential]
      properties:
        provider: {$ref: '#/components/schemas/Provider'}
        name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$', maxLength: 100}
        config: {type: object}
        scope: {$ref: '#/components/schemas/ConnectionScope'}
        credential: {type: object, description: Encrypted at rest and never returned}
    Connection:
      type: object
      properties:
        id: {type: string, format: uuid}
        provider: {$ref: '#/components/schemas/Provider'}
        name: {type: string}
        config: {type: object}
        scope: {$ref: '#/components/schemas/ConnectionScope'}
        status: {type: object, description: 'Last check: state (pending, ok, degraded, disabled), checked_at, counts'}
        enabled: {type: boolean}
        webhook: {$ref: '#/components/schemas/ConnectionWebhook'}
    ConnectionWebhook:
      type: object
      description: Inbound webhook state of GitHub, GitLab and registry connections. The secret is never returned after it is set
      properties:
        configured: {type: boolean}
        path: {type: string, examples: ['/scrs/v1/ingest/github/acme-github']}
        hook_url: {type: string, description: GitHub only; the public hook URL when GitHub calls a relay rather than path}
        rotated_at: {type: string, format: date-time}
    AssetType: {type: string, enum: [github_repo, gitlab_repo, container_image]}
    Asset:
      type: object
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/AssetType'}
        locator: {type: string, description: 'owner/repo, group/subgroup/project, or registry/repository', example: acme/api}
        connection_id: {type: string, format: uuid}
        flags: {type: object, description: 'discovered, accessible, in_scope'}
        owner_id: {type: [string, 'null'], format: uuid}
        environment: {type: string, enum: ['', dev, stg, prod]}
        criticality: {type: integer, minimum: 0, maximum: 5}
        exposure: {type: string, enum: ['', internet, internal, offline]}
        labels: {type: object, additionalProperties: {type: string}}
        legal_hold: {type: boolean, description: Excluded from every retention class and from asset_findings resets}
        distribution: {$ref: '#/components/schemas/Distribution'}
        revision: {type: integer}
    AssetPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Asset'}}
        next_cursor: {type: string}
    AssetChange:
      type: object
      additionalProperties: false
      properties:
        owner_id: {type: [string, 'null'], format: uuid}
        environment: {type: string, enum: ['', dev, stg, prod]}
        criticality: {type: integer, minimum: 0, maximum: 5}
        exposure: {type: string, enum: ['', internet, internal, offline]}
        labels: {type: object, maxProperties: 50, additionalProperties: {type: string, maxLength: 256}}
        legal_hold: {type: boolean, description: Needs admin scope}
        distribution: {$ref: '#/components/schemas/Distribution', description: Needs admin scope; selects the licence policy column}
    OwnerInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 100}
        email: {type: string, format: email}
        team: {type: string}
        chat: {type: string}
        secondary_contact: {type: string}
    Owner:
      allOf:
        - $ref: '#/components/schemas/OwnerInput'
        - type: object
          properties:
            id: {type: string, format: uuid}
            revision: {type: integer}
    Mirror:
      type: object
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running, succeeded, failed, pruned]}
        sha256: {type: string}
        size_bytes: {type: integer}
        refs: {type: integer, description: Branches and tags in the bundle}
        head: {type: string, description: Commit of HEAD at mirror time}
        error: {type: string}
        requested_by: {type: string}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
    Target:
      type: object
      required: [type, repository]
      properties:
        type: {type: string, enum: [git, image]}
        repository: {type: string, description: 'Asset locator: owner/repo, group/sub/project, or registry/repository'}
        provider: {type: string, enum: [github, gitlab], description: Git targets only; disambiguates equal paths}
        ref: {type: string, description: 'Branch (git) or tag (image). Default HEAD / latest'}
        commit: {type: string, description: '40-hex commit (git) or sha256: manifest digest (image)'}
        platform: {type: string, default: linux/amd64, description: Image targets only}
        pull_request:
          type: object
          required: [number, base_ref]
          properties:
            number: {type: integer}
            base_ref: {type: string}
            head_ref: {type: string}
            title: {type: string}
    AssessmentRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target: {$ref: '#/components/schemas/Target'}
        connection: {type: string, description: Connection name or id when several match}
        notify: {type: array, maxItems: 10, items: {type: string}, description: Deliver completion events only to these subscription names}
        trigger: {$ref: '#/components/schemas/Trigger'}
    Trigger:
      type: object
      additionalProperties: false
      description: Who triggered the assessment and why. Echoed in outbound events; never affects the scan.
      properties:
        origin: {type: string, maxLength: 100, example: n8n, description: 'Your system name. Values SCRS assigns itself are rejected with `400`: `replay`, `scheduler` and anything starting with `github_`, `gitlab_`, `registry_` or `import_`'}
        event: {type: string, maxLength: 100, example: release.requested}
        delivery_id: {type: string, maxLength: 128, description: Caller's event or execution id}
        actor: {type: string, maxLength: 100, description: Claimed human or bot behind the request}
        context:
          type: object
          maxProperties: 20
          description: 'Correlation data (ticket, change request, n8n execution). Keys match ^[a-z0-9][a-z0-9._-]{0,62}$; values are at most 256 printable characters.'
          additionalProperties: {type: string, maxLength: 256}
          example: {ticket: CHG-1042, n8n.execution: '4711'}
    AssessmentStatus: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
    Verdict: {type: string, enum: [pass, warn, fail, incomplete]}
    Stage:
      type: object
      properties:
        name: {type: string, examples: [inventory, malware, yara, ioc, integrity, import]}
        status: {type: string, enum: [ok, partial, skipped, failed]}
        detail: {type: string}
    Assessment:
      type: object
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        connection_id: {type: string, format: uuid}
        request:
          allOf:
            - $ref: '#/components/schemas/AssessmentRequest'
            - type: object
              properties:
                import: {type: object, description: 'Present on imported assessments, properties: {format: {type: string}, tool: {type: string}, tool_version: {type: string}}'}
        requested_by: {type: string}
        status: {$ref: '#/components/schemas/AssessmentStatus'}
        verdict: {$ref: '#/components/schemas/Verdict'}
        resolved_commit: {type: string}
        ref_moved: {type: boolean, description: The ref moved past this commit during the scan}
        stages: {type: array, items: {$ref: '#/components/schemas/Stage'}}
        counts: {type: object, additionalProperties: {type: integer}, description: 'total, new, waived and per-severity counts'}
        created_at: {type: string, format: date-time}
        completed_at: {type: [string, 'null'], format: date-time}
        error: {type: string}
        attempts: {type: integer}
        sbom_sha256: {type: string}
        diff: {type: object, description: Components added and removed since the baseline}
        request_id: {type: string}
    AssessmentPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Assessment'}}
        next_cursor: {type: string}
    Component:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        ecosystem: {type: string}
        purl: {type: string}
        path: {type: string}
        dependency_groups: {type: array, items: {type: string}, description: 'Lockfile dependency groups, such as dev'}
        license: {$ref: '#/components/schemas/ComponentLicense'}
    SASTAnalyzer:
      type: object
      properties:
        name: {type: string, enum: [gosec, bandit, opengrep, bearer, govulncheck]}
        version: {type: string}
        languages: {type: array, items: {type: string}}
        license: {type: string}
        rules_license: {type: string}
        redistributable: {type: boolean, description: 'false: internal use only (Elastic License 2.0, Commons Clause); excluded from any build that leaves CreditChek (SAST-010)'}
        needs_network: {type: boolean}
        executes_project_code: {type: boolean}
        rule_count: {type: integer, description: -1 when the tool does not report it}
        enabled: {type: boolean}
    SASTSettings:
      type: object
      properties:
        disabled_rules: {type: array, items: {type: string}}
        excludes: {type: array, items: {type: string}}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
    AssetSAST:
      type: object
      additionalProperties: false
      properties:
        enabled: {type: [boolean, 'null'], description: null inherits SCRS_SAST_ENABLED}
        reachability: {type: [boolean, 'null'], description: null inherits SCRS_REACHABILITY_ENABLED}
        analyzers: {type: [array, 'null'], items: {type: string, enum: [gosec, bandit, opengrep, bearer]}, description: null runs every enabled analyzer}
        disabled_rules: {type: array, maxItems: 500, items: {type: string}}
        excludes: {type: array, maxItems: 200, items: {type: string}}
        revision: {type: integer, readOnly: true}
    SASTRuleset:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        sha256: {type: string}
        enabled: {type: boolean}
        revision: {type: integer}
        size: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        body: {type: string, description: Rule YAML (single ruleset only)}
    Distribution:
      type: string
      enum: [internal, saas, distributed]
      description: How the asset reaches users (LIC-005); selects the licence policy column. Default `saas`.
    LicenseCategory:
      type: string
      enum: [permissive, public_domain, weak_copyleft, strong_copyleft, network_copyleft, source_available_restricted, non_commercial, proprietary, unknown]
    LicenseEffect:
      type: string
      enum: [allow, review, deny]
    ComponentLicense:
      type: object
      description: A component's licence and where SCRS found it (LIC-001).
      properties:
        expression: {type: string, description: Normalised SPDX license expression or NOASSERTION, examples: ['MIT OR Apache-2.0']}
        source: {type: string, enum: [declared, detected, metadata, none], description: 'declared: lockfile, manifest or OS package database; detected: licence file text; metadata: deps.dev; none: nothing found'}
        declared: {type: string, description: Licence text as found, when it differs from the expression}
        confidence: {type: number, minimum: 0, maximum: 1, description: For detected licences}
        evidence: {type: string, description: File the licence came from, or deps.dev}
        copyright: {type: array, items: {type: string}}
        refs: {type: object, additionalProperties: {type: string}, description: Original text of each LicenseRef-scrs-<hash> in the expression}
    NormalizedLicense:
      type: object
      properties:
        expression: {type: string}
        refs: {type: object, additionalProperties: {type: string}}
        exact: {type: boolean, description: The input was already a valid SPDX expression}
    LicenseRule:
      type: object
      additionalProperties: false
      required: [effect]
      description: Matches by licence id, category or package URL prefix, optionally narrowed by paths, scope (dev or runtime), assets and distributions. Rules apply in order; the first match decides a licence.
      properties:
        effect: {$ref: '#/components/schemas/LicenseEffect'}
        licenses: {type: array, maxItems: 200, items: {type: string}}
        categories: {type: array, maxItems: 9, items: {$ref: '#/components/schemas/LicenseCategory'}}
        packages: {type: array, maxItems: 200, items: {type: string, pattern: '^pkg:'}}
        paths: {type: array, maxItems: 50, items: {type: string}}
        scope: {type: string, enum: [dev, runtime]}
        assets: {type: array, maxItems: 200, items: {type: string, format: uuid}}
        distributions: {type: array, items: {$ref: '#/components/schemas/Distribution'}}
        reason: {type: string, maxLength: 500}
    LicensePolicy:
      type: object
      additionalProperties: false
      required: [name, default, matrix]
      description: Licence policy (LIC-004). Full schema at `GET /schemas/license-policy`. AND takes the strictest result of its licences, OR the most lenient.
      properties:
        name: {type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,63}$'}
        description: {type: string, maxLength: 1000}
        enforcing: {type: boolean, description: 'false: deny warns, review does not gate. true: deny fails, review warns (LIC-008)'}
        default: {$ref: '#/components/schemas/LicenseEffect'}
        severity: {type: object, properties: {deny: {type: string}, review: {type: string}}}
        matrix: {type: object, description: Category to distribution to effect, additionalProperties: {type: object, additionalProperties: {$ref: '#/components/schemas/LicenseEffect'}}}
        rules: {type: array, maxItems: 500, items: {$ref: '#/components/schemas/LicenseRule'}}
    LicensePolicyRecord:
      type: object
      properties:
        kind: {const: license}
        policy: {$ref: '#/components/schemas/LicensePolicy'}
        revision: {type: integer, description: 0 while corporate-default applies}
        builtin: {type: boolean}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string, format: uuid}
    LicenseDecision:
      type: object
      properties:
        effect: {$ref: '#/components/schemas/LicenseEffect'}
        expression: {type: string}
        category: {$ref: '#/components/schemas/LicenseCategory'}
        basis: {type: string, description: '`rule:<n>`, `matrix:<category>/<distribution>` or `default`'}
        reason: {type: string}
        licenses: {type: array, items: {type: string}, description: The licences that decided the outcome}
    LicenseCategories:
      type: object
      properties:
        version: {type: string, description: Shipped mapping version}
        source: {type: string}
        spdx_license_list_version: {type: string}
        revision: {type: integer, description: Override revision (0 for none)}
        updated_at: {type: [string, 'null'], format: date-time}
        counts: {type: object, additionalProperties: {type: integer}}
        categories: {type: object, additionalProperties: {$ref: '#/components/schemas/LicenseCategory'}}
        overrides: {type: object, additionalProperties: {$ref: '#/components/schemas/LicenseCategory'}}
        builtin_refs: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}}}}
        category_names: {type: array, items: {$ref: '#/components/schemas/LicenseCategory'}}
    LicenseRow:
      type: object
      properties:
        asset_id: {type: string, format: uuid}
        asset: {type: string}
        assessment_id: {type: string, format: uuid}
        name: {type: string}
        version: {type: string}
        ecosystem: {type: string}
        purl: {type: string}
        path: {type: string}
        dev: {type: boolean}
        expression: {type: string}
        category: {$ref: '#/components/schemas/LicenseCategory'}
        source: {type: string, enum: [declared, detected, metadata, none, unresolved]}
        confidence: {type: number}
        policy_result: {$ref: '#/components/schemas/LicenseEffect'}
        policy_basis: {type: string}
        finding_id: {type: string, format: uuid}
        status: {type: string}
        waiver_until: {type: string, format: date-time}
        license: {$ref: '#/components/schemas/ComponentLicense'}
    LicenseInventory:
      type: object
      properties:
        asset_id: {type: string, format: uuid}
        asset: {type: string}
        distribution: {$ref: '#/components/schemas/Distribution'}
        assessment_id: {type: [string, 'null'], format: uuid}
        revision: {type: string}
        ref: {type: string}
        assessed_at: {type: string, format: date-time}
        policy: {type: string}
        enforcing: {type: boolean}
        counts: {type: object, additionalProperties: {type: integer}, description: By policy result and by category}
        distribution_hint: {type: string}
        project_license: {$ref: '#/components/schemas/ComponentLicense'}
        outbound: {type: object, additionalProperties: {type: integer}, description: 'Runtime dependencies by outbound effect (allow, review, deny) against the repository''s own licence (LIC-005); present when that licence is a known open-source licence'}
        items: {type: array, items: {$ref: '#/components/schemas/LicenseRow'}}
    OutboundCompatibility:
      type: object
      description: 'Outbound-licence compatibility (LIC-005): a conservative policy aid, not legal advice.'
      properties:
        effect: {type: string, enum: [allow, review, deny]}
        project_license: {type: string}
        dependency_license: {type: string}
        category: {type: string}
        licenses: {type: array, items: {type: string}}
        reason: {type: string}
    DTrackSettings:
      type: object
      properties:
        enabled: {type: boolean}
        url: {type: string, description: 'Dependency-Track API base URL: https, or http for a host in SCRS_DTRACK_PRIVATE_HOSTS'}
        api_key_set: {type: boolean, readOnly: true}
        parent_uuid: {type: string, format: uuid, description: Optional parent project for created projects}
        revision: {type: integer, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    DTrackUpload:
      type: object
      properties:
        id: {type: string, format: uuid}
        assessment_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        project_name: {type: string, description: The asset locator}
        project_version: {type: string, description: The assessed ref (else the commit or digest)}
        status: {type: string, enum: [queued, sending, uploaded, failed]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        token: {type: string, description: Dependency-Track processing token}
        error: {type: string}
        created_at: {type: string, format: date-time}
        uploaded_at: {type: string, format: date-time}
    FrameworkPack:
      type: object
      description: A versioned framework data pack (CMP-001). Uploads use kind `cwe_mapping`, or `stig` for an edited imported STIG; schema at `GET /schemas/framework-pack`.
      required: [id, name, version, kind]
      properties:
        id: {type: string, examples: [owasp-top10-2025]}
        name: {type: string}
        version: {type: string}
        kind: {type: string, enum: [cwe_mapping, pci_dss, stig]}
        benchmark: {type: object, description: stig only, properties: {id: {type: string}, title: {type: string}, version: {type: string}, release: {type: string}}}
        source: {type: string, description: Where the mapping comes from}
        url: {type: string}
        builtin: {type: boolean, readOnly: true}
        categories: {type: array, items: {type: object, properties: {id: {type: string}, name: {type: string}, cwes: {type: array, items: {type: integer}}, severity: {type: string, enum: [CAT I, CAT II, CAT III], description: stig only}, vuln_id: {type: string}, rule_id: {type: string}, ccis: {type: array, items: {type: string}}}}}
        type_categories: {type: object, additionalProperties: {type: string}, description: Finding types without a CWE of their own (vulnerable or malicious dependency, integrity, secret, misconfiguration) mapped to a category}
        type_categories_note: {type: string}
        requirements: {type: array, items: {type: object, properties: {id: {type: string}, title: {type: string}, evidence: {type: string}}}}
    ReportScope:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [asset, owner, portfolio]}
        id: {type: string, format: uuid, description: Asset or owner id; omit for the portfolio}
        name: {type: string, readOnly: true}
    ReportRequest:
      type: object
      additionalProperties: false
      required: [framework, scope]
      properties:
        framework: {type: string, examples: [owasp-top10-2025, pci-dss-4.0.1]}
        scope: {$ref: '#/components/schemas/ReportScope'}
        since: {type: string, format: date-time, description: Default 90 days before until}
        until: {type: string, format: date-time, description: Default now}
        format: {type: string, enum: [json, csv, md, pdf], default: json, description: 'pdf is an A4 text layout with the same content as md; the same report always produces the same bytes'}
        params:
          type: object
          additionalProperties: false
          properties:
            sbom_max_age_days: {type: integer, minimum: 0, maximum: 3650, description: An asset without an SBOM this recent is a gap (default 30)}
            sla_critical_days: {type: integer, minimum: 0, maximum: 3650, description: PCI DSS 6.3.3 patch window for critical (default 30)}
            sla_high_days: {type: integer, minimum: 0, maximum: 3650, description: Patch window for high (default 90)}
    ReportJob:
      type: object
      properties:
        id: {type: string, format: uuid}
        framework: {type: string}
        scope: {$ref: '#/components/schemas/ReportScope'}
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        format: {type: string, enum: [json, csv, md, pdf]}
        params: {type: object}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        sha256: {type: string}
        size: {type: integer}
        data_as_of: {type: string, format: date-time}
        scrs_version: {type: string}
        feed_freshness: {type: array, items: {type: object, properties: {key: {type: string}, name: {type: string}, last_success_at: {type: [string, 'null'], format: date-time}, stale: {type: boolean}}}}
        summary: {type: object, description: 'assets, gaps, findings_considered, open, unmapped counts'}
        error: {type: string}
        requested_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    EvidenceReport:
      type: object
      description: A built evidence report. `statement` says it is not a certification; there is no verdict field.
      properties:
        report: {type: object, description: 'id, framework, scope, since, until, data_as_of, scrs_version, format, params'}
        statement: {type: string}
        feed_freshness: {type: array, items: {type: object}}
        assets: {type: array, items: {type: object}}
        gaps: {type: array, items: {type: object, properties: {asset_id: {type: string, format: uuid}, locator: {type: string}, reason: {type: string}}}}
        totals: {type: object}
        categories: {type: array, items: {type: object}, description: Per category open, opened and closed in window, by severity, CWE counts and weekly trend}
        unmapped: {type: object, properties: {no_cwe: {type: integer}, cwe_outside_pack: {type: integer}, top_outside_pack: {type: array, items: {type: object}}}}
        requirements: {type: array, items: {type: object}, description: PCI DSS 6.3.1, 6.3.2 and 6.3.3 evidence metrics}
        stig:
          type: object
          description: 'STIG packs only. Each category also carries `severity` (CAT I to III) and `evidence`: open_findings, no_open_findings (SCRS scans cover the rule and report nothing open) or not_evidenced (manual review). These are not STIG checklist statuses.'
          properties:
            benchmark: {type: object}
            rules: {type: integer}
            rules_by_evidence: {type: object, additionalProperties: {type: integer}}
            rules_with_open_findings_by_cat: {type: object, additionalProperties: {type: integer}}
    Finding:
      type: object
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        fingerprint: {type: string}
        ref: {type: string}
        type: {type: string, enum: [vulnerability, malicious_dependency, malware, ioc_match, integrity, posture, misconfiguration, secret, code, yara_match, yara_alert, yara_hunt, ioc_alert, ioc_hunt, qa_failure, qa_untested, qa_performance, qa_config, qa_unconfigured, license, sast], description: 'Threat-intelligence types carry the source mode. `yara_match` and `ioc_match` (block) fail like malware, `yara_alert` and `ioc_alert` gate by severity, `yara_hunt` and `ioc_hunt` never gate. E2E QA types (`qa_*`) are report-only and never gate. `license` entries (advisory id `SCRS-LICENSE:<expression>`, or `SCRS-LICENSE-OUTBOUND:<project licence>:<expression>` for a runtime dependency incompatible with, or needing review against, the licence of the repository itself in a SaaS or distributed asset) follow the licence policy: report-only, a deny warns; enforcing, deny fails and review warns. `sast` entries (advisory id `<tool>:<rule>`, evidence with tool, rule, CWE ids, path and lines, code hash, data-flow steps and `suppressed_in_code`; no code) gate only when new: a new critical fails, a new high warns; inline-suppressed entries never gate, and a suppression added for an open entry raises integrity entry `SCRS-SAST-SUPPRESSION-ADDED`. Vulnerability evidence carries `reachability` (status reachable, imported_only, not_reachable, unknown or unsupported; method, tool, confidence, file-and-line trace) when reachability ran; reachable adds 10 to the score and not reachable subtracts 15, known-exploited entries keep at least 45, and nothing is closed for being unreachable'}
        advisory_id: {type: string, description: 'For YARA findings `YARA:<ruleset>:<rule>`'}
        title: {type: string}
        severity: {type: string, enum: [critical, high, medium, low, info, unknown]}
        score: {type: integer, minimum: 0, maximum: 100}
        status: {type: string, enum: [open, triaged, in_progress, accepted, suppressed, false_positive, fixed]}
        component: {$ref: '#/components/schemas/Component'}
        evidence: {type: object}
        guidance: {type: object, description: 'summary, reference, kev, epss; for vulnerabilities fixed_versions, safe_versions (ascending, at most ten), smallest_safe_upgrade, latest_safe and safe_basis (advisories checked, whether the full local mirror set was used, and whether registry version lists or only advisory fixes were candidates) (VUL-008)'}
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        waiver_until: {type: string, format: date-time}
        change: {type: string, enum: [new, existing]}
    FindingPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Finding'}}
        next_cursor: {type: string}
    FileEvidence:
      type: object
      properties:
        path: {type: string}
        sha256: {type: string}
        size: {type: integer}
        malware: {type: string, enum: [clean, infected, error, skipped, skipped_oversize]}
    IngestOutcome:
      type: object
      properties:
        status: {type: string, examples: [ignored_event, recorded, ignored_out_of_scope]}
        integrity_signals: {type: integer}
    RegistryIngestResult:
      type: object
      properties:
        status: {type: string}
        items:
          type: array
          items:
            type: object
            properties:
              locator: {type: string}
              tag: {type: string}
              digest: {type: string}
              status: {type: string, enum: [queued, replayed, ignored_out_of_scope, invalid_reference, ambiguous_connection]}
              assessment_id: {type: string, format: uuid}
    EventType: {type: string, enum: [assessment.completed, assessment.failed, finding.created, finding.status_changed, finding.rescored, malicious_dependency.reported, integrity.alert, feed.stale, connection.degraded, maintenance.completed, qa.completed, qa.failed, ping]}
    AuthHeader:
      type: object
      description: Configure as Header Auth in n8n (name and value).
      properties:
        name: {type: string, const: X-SCRS-Auth}
        value: {type: string}
    Subscription:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        url: {type: string}
        events: {type: array, items: {$ref: '#/components/schemas/EventType'}}
        profile: {type: string, enum: [summary, full, agent]}
        egress_ack: {type: boolean}
        include_contacts: {type: boolean}
        connections: {type: array, items: {type: string, format: uuid}, description: Connection scope; empty receives every connection's events}
        enabled: {type: boolean}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    SubscriptionSecret:
      type: object
      properties:
        secret: {type: string, description: HMAC signing secret (shown once)}
        auth_header: {$ref: '#/components/schemas/AuthHeader'}
        subscription: {$ref: '#/components/schemas/Subscription'}
    Delivery:
      type: object
      properties:
        id: {type: string, format: uuid}
        subscription_id: {type: string, format: uuid}
        event_id: {type: string, format: uuid}
        event_type: {$ref: '#/components/schemas/EventType'}
        status: {type: string, enum: [pending, sending, delivered, dead]}
        attempts: {type: integer}
        next_attempt_at: {type: string, format: date-time}
        last_status: {type: integer}
        last_error: {type: string}
        created_at: {type: string, format: date-time}
        delivered_at: {type: [string, 'null'], format: date-time}
        payload: {type: object}
    IndicatorBundle:
      type: object
      additionalProperties: false
      required: [version, indicators]
      properties:
        version: {type: string, minLength: 1, maxLength: 128}
        indicators:
          type: array
          maxItems: 50000
          description: At most 10000 on `PUT /feeds/indicators`
          items:
            type: object
            additionalProperties: false
            required: [id, type, value, valid_until]
            properties:
              id: {type: string, maxLength: 128, description: Unique within the bundle}
              type: {type: string, enum: [sha256, sha1, md5, domain, ipv4, ipv6, url, purl, workflow_step_name, file_path_regex, file_content_regex, git_branch_regex, commit_message_regex, pr_title_regex]}
              value: {type: string, description: 'Defanged domains, addresses and URLs (`[.]`, `hxxp`) are normalized. URLs are http, https or ftp and match exactly after lower-casing the scheme and host and dropping the fragment.'}
              valid_until: {type: string, format: date-time}
              confidence: {type: integer, minimum: 0, maximum: 100, description: 'As in STIX 2.1; compared with the source''s `min_confidence`'}
    InboundEvent:
      type: object
      properties:
        id: {type: string, format: uuid}
        assessment_id: {type: [string, 'null'], format: uuid}
        mode: {type: string, enum: [direct, relay, trigger]}
        event_type: {type: string}
        created_at: {type: string, format: date-time}
        body: {type: object}
    Retention:
      type: object
      properties:
        revision: {type: integer}
        inbound_event_days: {type: integer}
        webhook_delivery_days: {type: integer}
        classes:
          type: array
          items:
            type: object
            properties:
              class: {type: string, enum: [inbound_events, webhook_deliveries, closed_findings, scan_artifacts, sbom_documents, source_snapshots, remediation_plans, qa_reports, reports, expired_indicators, audit_log]}
              description: {type: string}
              guard: {type: string, description: What the class never purges}
              days: {type: [integer, 'null']}
              effective_days: {type: integer}
              source: {type: string, enum: [policy, default]}
              minimum_days: {type: integer}
              last_purged_at: {type: [string, 'null'], format: date-time}
              last_purged_count: {type: integer}
    MaintenanceReport:
      type: object
      properties:
        inbound_events_purged: {type: integer}
        webhook_deliveries_purged: {type: integer}
        idempotency_keys_expired: {type: integer}
        rescans_queued: {type: integer}
        skipped_concurrent_run: {type: boolean}
        purged: {type: object, additionalProperties: {type: integer}, description: Rows removed per retention class}
        objects_deleted: {type: integer}
        object_errors: {type: integer}
        orphans_deleted: {type: integer, description: 'Unreferenced artifacts older than 24 hours removed by the daily orphan sweep (an upload whose database write never committed)'}
    AuditEntry:
      type: object
      properties:
        id: {type: integer}
        occurred_at: {type: string, format: date-time}
        action: {type: string}
        target_id: {type: [string, 'null'], format: uuid}
        details: {type: object}
    VulnerabilitySource:
      type: object
      properties:
        key: {type: string, enum: [osv, malicious_packages, kev, epss, nvd, cve_program, vex]}
        name: {type: string}
        kind: {type: string}
        url: {type: string}
        managed_by: {type: string, enum: [feed-sync, worker, operator]}
        schedule_minutes: {type: integer}
        licence: {type: string}
        terms_url: {type: string}
        restricted: {type: boolean, description: Licence restricts use; enabling needs acknowledge_terms}
        enabled: {type: boolean}
        state: {type: object}
        last_sync_at: {type: [string, 'null'], format: date-time}
        last_success_at: {type: [string, 'null'], format: date-time}
        next_sync_at: {type: string, format: date-time}
        record_count: {type: integer}
        last_error: {type: string}
        failures: {type: integer}
        stale: {type: boolean, description: No success within twice the schedule (raises feed.stale once)}
        lag_seconds: {type: [integer, 'null']}
        revision: {type: integer}
    VendorStatement:
      type: object
      properties:
        vulnerability: {type: string}
        purl: {type: string}
        product: {type: string}
        status: {type: string, enum: [not_affected, affected, fixed, under_investigation]}
        justification: {type: string}
        impact: {type: string}
        action: {type: string}
        document_id: {type: string, format: uuid}
        format: {type: string, enum: [openvex, cyclonedx, csaf]}
        publisher: {type: string}
        issued_at: {type: [string, 'null'], format: date-time}
    VEXDocument:
      type: object
      properties:
        id: {type: string, format: uuid}
        format: {type: string, enum: [openvex, cyclonedx, csaf]}
        publisher: {type: string}
        title: {type: string}
        issued_at: {type: [string, 'null'], format: date-time}
        sha256: {type: string}
        statements: {type: integer}
        imported_by: {type: string}
        imported_at: {type: string, format: date-time}
    QAAuth:
      type: object
      description: Header added to every generated request, valued `prefix` + the variable's value
      properties:
        header: {type: string, examples: [Authorization]}
        variable: {type: string, description: Name of one of the profile's variables}
        prefix: {type: string, maxLength: 32, examples: ['Bearer ']}
    QAPerf:
      type: object
      required: [features, users, duration_seconds, p95_millis]
      description: Load profile run with karate-gatling; a breached threshold fails the run
      properties:
        features: {type: array, items: {type: string}, maxItems: 20, description: Feature paths relative to `test_path`}
        users: {type: integer, minimum: 1, maximum: 500}
        ramp_seconds: {type: integer, minimum: 0, maximum: 3600}
        duration_seconds: {type: integer, minimum: 5, maximum: 3600}
        p95_millis: {type: integer, minimum: 1, maximum: 600000}
        max_error_percent: {type: integer, minimum: 0, maximum: 100}
        auto_run: {type: boolean, description: Run after every passing functional run}
    QAProfileInput:
      type: object
      required: [base_url]
      properties:
        enabled: {type: boolean, default: true}
        auto_run: {type: boolean, default: true, description: Queue a functional run after each successful assessment of a matching ref}
        refs: {type: array, items: {type: string}, maxItems: 20, description: 'Refs or patterns (main, release/*, pull/*); empty means every ref'}
        base_url: {type: string, format: uri, description: Deployed environment the tests call (SCRS_BASE_URL / baseUrl)}
        environment: {type: string, description: karate.env}
        tags: {type: array, items: {type: string}, maxItems: 8, description: 'Karate tag expressions for the repository suite, for example @smoke or ~@slow'}
        threads: {type: integer, minimum: 1, maximum: 16, default: 1}
        timeout_seconds: {type: integer, minimum: 60, maximum: 7200, default: 900}
        test_path: {type: string, default: karate, description: Repository directory holding the Karate project; empty for the root}
        openapi_path: {type: string, description: OpenAPI document path; empty finds openapi.yaml, openapi.json, swagger.yaml or swagger.json}
        auth: {$ref: '#/components/schemas/QAAuth'}
        variables: {type: object, additionalProperties: {type: string}, description: 'Secrets passed to tests as QA_<NAME> environment variables and redacted from reports; write-only, omitted keeps the stored set'}
        perf: {oneOf: [{$ref: '#/components/schemas/QAPerf'}, {type: 'null'}]}
        llm_provider_id: {type: [string, 'null'], format: uuid}
        allow_source_upload: {type: boolean, default: false, description: Allow unit-test generation to send source files to the LLM provider}
    QAProfile:
      allOf:
        - {$ref: '#/components/schemas/QAProfileInput'}
        - type: object
          properties:
            asset_id: {type: string, format: uuid}
            variable_names: {type: array, items: {type: string}}
            revision: {type: integer}
            updated_at: {type: string, format: date-time}
    QARunStatus: {type: string, enum: [queued, submitted, running, passed, failed, error, cancelled, skipped]}
    QARunRequest:
      type: object
      properties:
        kind: {type: string, enum: [functional, performance], default: functional}
        assessment_id: {type: string, format: uuid, description: Defaults to the latest successful git assessment of the asset}
        include_drafts: {type: boolean, description: Also run draft generated features (admin)}
    QASummary:
      type: object
      properties:
        features: {type: integer}
        scenarios: {type: integer}
        passed: {type: integer}
        failed: {type: integer}
        skipped: {type: integer}
        duration_ms: {type: integer}
        karate_version: {type: string}
    QAPerfStats:
      type: object
      properties:
        requests: {type: integer}
        ok: {type: integer}
        ko: {type: integer}
        min_ms: {type: number}
        mean_ms: {type: number}
        max_ms: {type: number}
        p50_ms: {type: number}
        p75_ms: {type: number}
        p95_ms: {type: number}
        p99_ms: {type: number}
        throughput_rps: {type: number}
        assertions: {type: array, items: {type: object, properties: {description: {type: string}, passed: {type: boolean}, actual: {type: number}}}}
    QARun:
      type: object
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        assessment_id: {type: [string, 'null'], format: uuid}
        kind: {type: string, enum: [functional, performance]}
        trigger: {type: string, enum: [assessment, manual, functional_pass]}
        requested_by: {type: string}
        ref: {type: string}
        commit: {type: string}
        include_drafts: {type: boolean}
        status: {$ref: '#/components/schemas/QARunStatus'}
        attempts: {type: integer}
        base_url: {type: string}
        summary: {$ref: '#/components/schemas/QASummary'}
        coverage: {type: object, properties: {total: {type: integer}, covered: {type: integer}, percent: {type: number}, spec: {type: string}, problems: {type: array, items: {type: string}}}}
        perf: {$ref: '#/components/schemas/QAPerfStats'}
        report_sha256: {type: string}
        error: {type: string}
        created_at: {type: string, format: date-time}
        submitted_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    QAScenario:
      type: object
      properties:
        suite: {type: string, enum: [repo, generated]}
        feature: {type: string}
        name: {type: string}
        line: {type: integer}
        tags: {type: array, items: {type: string}}
        status: {type: string, enum: [passed, failed, skipped]}
        duration_ms: {type: integer}
        error: {type: string}
    QACoverage:
      type: object
      properties:
        total: {type: integer, description: Documented operations, less deprecated ones}
        covered: {type: integer}
        percent: {type: number}
        spec: {type: string}
        problems: {type: array, items: {type: string}}
        operations:
          type: array
          items:
            type: object
            properties:
              method: {type: string}
              path: {type: string}
              operation_id: {type: string}
              summary: {type: string}
              deprecated: {type: boolean}
              hits: {type: integer}
              statuses: {type: array, items: {type: integer}}
        unmatched: {type: array, items: {type: string}, description: Called paths no operation describes (first 50)}
    QACoveragePoint:
      type: object
      properties:
        run_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        ref: {type: string}
        commit: {type: string}
        status: {type: string}
        total: {type: integer}
        covered: {type: integer}
        percent: {type: number}
        passed: {type: integer}
        failed: {type: integer}
    QAGenerationRequest:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [api, unit]}
        max_operations: {type: integer, minimum: 1, maximum: 200, default: 30}
        operations: {type: array, items: {type: string}, description: 'Only these operations, as "GET /users/{id}"'}
        max_files: {type: integer, minimum: 1, maximum: 20, default: 5}
        paths: {type: array, items: {type: string}, description: Only these source files (unit)}
    QAGeneration:
      type: object
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        kind: {type: string, enum: [api, unit]}
        provider_id: {type: [string, 'null'], format: uuid}
        provider_name: {type: string}
        model: {type: string}
        assessment_id: {type: string, format: uuid}
        ref: {type: string}
        commit: {type: string}
        options: {$ref: '#/components/schemas/QAGenerationRequest'}
        status: {type: string, enum: [queued, running, succeeded, failed]}
        requested_by: {type: string}
        attempts: {type: integer}
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        accepted: {type: integer}
        rejected: {type: integer}
        error: {type: string}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    QASuite:
      type: object
      properties:
        id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        generation_id: {type: string, format: uuid}
        kind: {type: string, enum: [api, unit]}
        path: {type: string}
        source: {type: string, description: Operations (api) or source file (unit) the file covers}
        content: {type: string, description: 'Present on GET /qa/suites/{id}'}
        sha256: {type: string}
        status: {type: string, enum: [draft, approved, rejected, superseded]}
        problems: {type: array, items: {type: string}}
        reviewed_by: {type: string}
        reviewed_at: {type: string, format: date-time}
        note: {type: string}
        created_at: {type: string, format: date-time}
    QAReview:
      type: object
      properties: {note: {type: string, maxLength: 1000}}
    QARunnerStatus:
      type: object
      properties:
        configured: {type: boolean}
        reachable: {type: boolean}
        error: {type: string}
        runner: {type: object, properties: {karate: {type: string}, gatling: {type: boolean}, slots: {type: integer}, queued: {type: integer}, running: {type: integer}}}
    LLMPreset:
      type: object
      properties:
        kind: {type: string}
        protocol: {type: string, enum: [openai, anthropic, gemini]}
        base_url: {type: string}
        base_url_required: {type: boolean}
        api_key_optional: {type: boolean}
    LLMProviderInput:
      type: object
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_-]{1,62}$', description: Required on create; cannot change}
        kind: {type: string, enum: [openai, azure_openai, anthropic, gemini, mistral, groq, deepseek, xai, openrouter, together, ollama, openai_compatible]}
        base_url: {type: string, description: Defaults to the kind's inference URL; required for azure_openai and openai_compatible}
        model: {type: string, description: Model or deployment name}
        max_tokens: {type: integer, minimum: 256, maximum: 131072, default: 8192}
        temperature: {type: number, minimum: 0, maximum: 2}
        clear_temperature: {type: boolean}
        enabled: {type: boolean, default: true}
        api_key: {type: string, writeOnly: true}
    LLMProvider:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        kind: {type: string}
        base_url: {type: string}
        model: {type: string}
        max_tokens: {type: integer}
        temperature: {type: [number, 'null']}
        enabled: {type: boolean}
        has_api_key: {type: boolean}
        revision: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        last_test_at: {type: [string, 'null'], format: date-time}
        last_test_error: {type: string}
    LLMTestResult:
      type: object
      properties:
        ok: {type: boolean}
        model: {type: string}
        reply: {type: string}
        latency_ms: {type: integer}
        input_tokens: {type: integer}
        output_tokens: {type: integer}
        error: {type: string}
