      summary: Reject a generated test file
      description: Marks a draft rejected with an optional note; it never runs. Scope `write`.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/QAReview'}, example: {"note": "Asserts the wrong status code."}}}}
      responses:
