      description: 'Assessed revisions of one asset, newest first.'
      type: object
      example: {"items": [{"ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "assessments": 2, "verdict": "fail", "imported": false, "has_sbom": true, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:33:12Z"}, {"ref": "v1.4.0", "commit": "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "assessment_id": "d4f6b8a0-2c1e-4a73-9b5d-8e0f1a2c3b66", "assessments": 1, "verdict": "pass", "imported": false, "has_sbom": true, "created_at": "2026-11-02T14:00:00Z", "completed_at": "2026-11-02T14:02:40Z"}], "next_before": ""}
      properties:
        items:
          description: 'Revisions.'
          type: array
          items:
            type: object
            properties:
              ref: {type: string, description: 'Branch, tag or image tag.'}
              commit: {type: string, description: 'Commit SHA or image digest.'}
              assessment_id: {type: string, format: uuid, description: The newest successful assessment of this revision}
              assessments: {type: integer, description: Successful assessments of this revision}
              verdict: {type: string, enum: [pass, warn, fail, incomplete], description: 'Verdict of the newest assessment of that revision.'}
              imported: {type: boolean, description: '`true` when the result was imported from another scanner.'}
              has_sbom: {type: boolean, description: '`true` when an SBOM can be downloaded.'}
              created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
              completed_at: {type: string, format: date-time, description: 'When the assessment finished (RFC 3339, UTC).'}
        next_before: {type: string, description: Pass as `before` for the next page; empty on the last page}
    SBOMDiff:
      description: 'Differences between the packages of two assessed revisions.'
      type: object
      example: {"from": {"assessment_id": "d4f6b8a0-2c1e-4a73-9b5d-8e0f1a2c3b66", "ref": "v1.4.0", "commit": "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "components": 212}, "to": {"assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "components": 215}, "added": [{"name": "left-pad-ng", "ecosystem": "npm", "versions": ["1.0.2"]}], "removed": [{"name": "request", "ecosystem": "npm", "versions": ["2.88.2"]}], "changed": [{"name": "lodash", "ecosystem": "npm", "from_versions": ["4.17.20"], "to_versions": ["4.17.21"]}], "license_changed": [{"name": "sharp", "ecosystem": "npm", "from_license": "Apache-2.0", "to_license": "LGPL-3.0-only"}], "unchanged": 209, "totals": {"added": 1, "removed": 1, "changed": 1, "license_changed": 1}, "truncated": false}
      properties:
        from: {type: object, properties: {assessment_id: {type: string, format: uuid, description: 'Assessment of the older revision.'}, ref: {type: string, description: 'Branch or tag of the older revision.'}, commit: {type: string, description: 'Commit of the older revision.'}, components: {type: integer, description: 'Number of packages in the older revision.'}}, description: 'The older of the two compared revisions.'}
        to: {type: object, properties: {assessment_id: {type: string, format: uuid, description: 'Assessment of the newer revision.'}, ref: {type: string, description: 'Branch or tag of the newer revision.'}, commit: {type: string, description: 'Commit of the newer revision.'}, components: {type: integer, description: 'Number of packages in the newer revision.'}}, description: 'The newer of the two compared revisions.'}
        added: {type: array, items: {type: object, properties: {name: {type: string, description: 'Name of a package that is new in the newer revision.'}, ecosystem: {type: string, description: 'Package ecosystem, for example `npm`, `maven`, `golang`.'}, versions: {type: array, items: {type: string}, description: 'Versions present (for added or removed packages).'}, from_versions: {type: array, items: {type: string}, description: 'Versions in the older revision.'}, to_versions: {type: array, items: {type: string}, description: 'Versions in the newer revision.'}, from_license: {type: string, description: 'Licence in the older revision.'}, to_license: {type: string, description: 'Licence in the newer revision.'}, dev: {type: boolean, description: Only development dependencies}}}, description: 'Packages only in the newer revision.'}
        removed: {type: array, items: {type: object, properties: {name: {type: string, description: 'Name of a package that is gone from the newer revision.'}, ecosystem: {type: string, description: 'Package ecosystem, for example `npm`, `maven`, `golang`.'}, versions: {type: array, items: {type: string}, description: 'Versions present (for added or removed packages).'}, from_versions: {type: array, items: {type: string}, description: 'Versions in the older revision.'}, to_versions: {type: array, items: {type: string}, description: 'Versions in the newer revision.'}, from_license: {type: string, description: 'Licence in the older revision.'}, to_license: {type: string, description: 'Licence in the newer revision.'}, dev: {type: boolean, description: Only development dependencies}}}, description: 'Packages only in the older revision.'}
        changed: {type: array, items: {type: object, properties: {name: {type: string, description: 'Name of a package whose version changed.'}, ecosystem: {type: string, description: 'Package ecosystem, for example `npm`, `maven`, `golang`.'}, versions: {type: array, items: {type: string}, description: 'Versions present (for added or removed packages).'}, from_versions: {type: array, items: {type: string}, description: 'Versions in the older revision.'}, to_versions: {type: array, items: {type: string}, description: 'Versions in the newer revision.'}, from_license: {type: string, description: 'Licence in the older revision.'}, to_license: {type: string, description: 'Licence in the newer revision.'}, dev: {type: boolean, description: Only development dependencies}}}, description: 'Packages whose version changed.'}
        license_changed: {type: array, items: {type: object, properties: {name: {type: string, description: 'Name of a package whose licence changed.'}, ecosystem: {type: string, description: 'Package ecosystem, for example `npm`, `maven`, `golang`.'}, versions: {type: array, items: {type: string}, description: 'Versions present (for added or removed packages).'}, from_versions: {type: array, items: {type: string}, description: 'Versions in the older revision.'}, to_versions: {type: array, items: {type: string}, description: 'Versions in the newer revision.'}, from_license: {type: string, description: 'Licence in the older revision.'}, to_license: {type: string, description: 'Licence in the newer revision.'}, dev: {type: boolean, description: Only development dependencies}}}, description: 'Packages whose licence changed.'}
        unchanged: {type: integer, description: 'Packages identical in both revisions.'}
        totals: {type: object, additionalProperties: {type: integer}, description: 'Counts of added, removed, changed and licence-changed packages, before any truncation.'}
        truncated: {type: boolean, description: '`true` when lists were cut to the response limit.'}
    AdvisoryPage:
      description: 'One page of advisories from the local OSV, NVD and CVE feeds.'
      type: object
      example: {"items": [{"id": "x_SCRS-2026-0001", "origin": "local", "summary": "Internal package acme-utils 2.3.1 published with a backdoor", "aliases": ["INC-2291"], "modified": "2026-11-16T09:30:00Z", "withdrawn": false}, {"id": "CVE-2021-23337", "origin": "nvd", "summary": "Command injection in lodash", "aliases": ["GHSA-35jh-r3h4-6jhm"], "modified": "2026-10-01T08:00:00Z", "withdrawn": false}], "next_cursor": ""}
      properties:
        items:
          description: 'Advisories on this page.'
          type: array
          items:
            type: object
            properties:
              id: {type: string, description: 'Advisory ID, for example `GHSA-...` or `CVE-...`.'}
              origin: {type: string, enum: [nvd, cve5, local], description: 'Feed it came from: `nvd`, `cve5` or `local` (written through this API).'}
              summary: {type: string, description: 'One-line summary shown in lists and search.'}
              aliases: {type: array, items: {type: string}, description: 'Other IDs for the same issue.'}
              modified: {type: string, format: date-time, description: 'When the advisory last changed (RFC 3339, UTC).'}
              withdrawn: {type: boolean, description: '`true` when the publisher withdrew it.'}
        next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}
    LocalAdvisoryInput:
      description: 'Body to record your own advisory in OSV form, for example for an unpublished vulnerability.'
      type: object
      example: {"summary": "Internal package acme-utils 2.3.1 published with a backdoor", "details": "Version 2.3.1 was published from a compromised CI token and exfiltrates environment variables on install.", "aliases": ["INC-2291"], "cwe": ["CWE-506"], "affected": [{"package": {"ecosystem": "npm", "name": "acme-utils"}, "versions": ["2.3.1"]}], "references": [{"type": "REPORT", "url": "https://wiki.example.com/incidents/INC-2291"}]}
      additionalProperties: false
      required: [summary, affected]
      properties:
        summary: {type: string, minLength: 3, maxLength: 200, description: 'One-line summary of the problem, shown in lists and in findings.'}
        details: {type: string, maxLength: 8000, description: 'Longer explanation (Markdown).'}
        aliases: {type: array, maxItems: 20, items: {type: string, maxLength: 128}, description: 'Other IDs for the same issue.'}
        cwe: {type: array, maxItems: 20, items: {type: string, example: CWE-506}, description: 'Related CWE IDs, for example `CWE-79`.'}
        severity:
          description: 'Optional CVSS scores for the advisory, at most one per scoring system (`type`).'
          type: array
          maxItems: 4
          items:
            type: object
            required: [type, score]
            properties:
              type: {type: string, enum: [CVSS_V2, CVSS_V3, CVSS_V4], description: 'Scoring system: `CVSS_V2`, `CVSS_V3` or `CVSS_V4`.'}
              score: {type: string, description: 'CVSS vector string, for example `CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H`.'}
        affected:
          description: 'Packages and versions affected.'
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [package]
            properties:
              package:
                description: 'The package that is affected.'
                type: object
                additionalProperties: false
                required: [ecosystem, name]
                properties:
                  ecosystem: {type: string, example: npm, description: 'Package ecosystem, for example `npm`.'}
                  name: {type: string, maxLength: 214, description: 'Package name as its ecosystem spells it. Matching ignores case.'}
                  purl: {type: string, maxLength: 500, description: 'Package URL, as an alternative to ecosystem and name.'}
              versions: {type: array, maxItems: 500, items: {type: string, maxLength: 100}, description: 'Exact affected versions. Give `versions`, `ranges` or both, or `all_versions` alone'}
              ranges:
                type: array
                maxItems: 20
                description: Semantic-version intervals for npm, Go, crates.io, NuGet, Hex and Pub
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    introduced: {type: string, example: 1.0.0, description: 'First affected version; empty or 0 means from the first release'}
                    fixed: {type: string, example: 1.2.3, description: 'First unaffected version (exclusive); not with `last_affected`'}
                    last_affected: {type: string, description: 'Last affected version (inclusive); not with `fixed`'}
              all_versions: {type: boolean, description: 'Every release is affected; cannot be combined with `versions` or `ranges`'}
        malicious: {type: boolean, default: false, description: 'The package is malicious (a compromised release, a backdoor): entries are `malicious_dependency`, critical, and fail the verdict'}
        rating: {type: string, enum: [critical, high, medium, low], default: high, description: Severity of the `vulnerability` entries; ignored when `malicious`}
        references:
          description: 'Links to related material.'
          type: array
          maxItems: 50
          items:
            type: object
            required: [type, url]
            properties:
              type: {type: string, enum: [ADVISORY, ARTICLE, DETECTION, DISCUSSION, REPORT, FIX, INTRODUCED, GIT, PACKAGE, EVIDENCE, WEB], description: 'What the link is, for example `ADVISORY`, `FIX` or `WEB`.'}
              url: {type: string, maxLength: 500, description: 'Link to the reference. Must be an http or https address.'}
    AdvisoryAffected:
      description: 'Assessed revisions that contain a package an advisory affects.'
      type: object
      example: {"items": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "ref": "main", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "component": {"name": "acme-utils", "version": "2.3.1", "ecosystem": "npm", "purl": "pkg:npm/acme-utils@2.3.1", "path": "package-lock.json", "license": {"spdx": "MIT"}}}], "truncated": false}
      properties:
        items:
          description: 'Assets and refs whose newest inventory contains an affected package.'
          type: array
          items:
            type: object
            properties:
              asset_id: {type: string, format: uuid, description: 'Asset that contains the affected package.'}
              locator: {type: string, description: 'Repository or image name of that asset.'}
              ref: {type: string, description: 'Branch or tag of the affected revision.'}
              assessment_id: {type: string, format: uuid, description: 'Assessment that saw the package.'}
              commit: {type: string, description: 'Commit SHA or image digest.'}
              component: {$ref: '#/components/schemas/Component'}
        truncated: {type: boolean, description: '`true` when more matches exist than were returned.'}
    AssetChange:
      description: 'Fields to change on an asset; send only what changes. Needs `If-Match`.'
      type: object
      additionalProperties: false
      properties:
        owner_id: {type: [string, 'null'], format: uuid, description: 'Owner (`/owners`) responsible for this asset, or `null` when unassigned. Send `null` to clear it.'}
        environment: {type: string, enum: ['', dev, stg, prod], description: 'Where the asset runs: `dev`, `stg` or `prod`. Empty means not set.'}
        criticality: {type: integer, minimum: 0, maximum: 5, description: 'Business criticality from 0 (not set) to 5 (most critical). It is context for prioritising and appears in agent and export output.'}
        exposure: {type: string, enum: ['', internet, internal, offline], description: 'How reachable the asset is: `internet`, `internal` or `offline`. Empty means not set.'}
        labels: {type: object, maxProperties: 50, additionalProperties: {type: string, maxLength: 256}, description: 'Replaces all labels.'}
        legal_hold: {type: boolean, description: 'Keeps the asset out of every retention purge and reset. Needs scope `admin` to set.'}
        distribution: {$ref: '#/components/schemas/Distribution', description: 'How the software reaches users, which picks the licence policy column. Needs scope `admin` to set.'}
    OwnerInput:
      description: 'Body to create or change an owner (a person or team that assets are assigned to).'
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, maxLength: 100, description: 'Display name.'}
        email: {type: string, format: email, description: 'Contact email.'}
        team: {type: string, description: 'Team name.'}
        chat: {type: string, description: 'Chat channel or handle.'}
        secondary_contact: {type: string, description: 'Fallback contact. Shared with event subscribers only when the subscription sets `include_contacts`.'}
    Owner:
      example: {"id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "name": "Payments platform", "email": "payments@example.com", "team": "Payments", "chat": "#payments-eng", "secondary_contact": "oncall-payments@example.com", "revision": 2}
      description: 'An owner of assets.'
      type: object
      required: [id, name, revision]
      properties:
        id: {type: string, format: uuid, description: 'Owner ID.'}
        name: {type: string, maxLength: 100, description: 'Display name.'}
        email: {type: string, format: email, description: 'Contact email.'}
        team: {type: string, description: 'Team name.'}
        chat: {type: string, description: 'Chat channel or handle.'}
        secondary_contact: {type: string, description: 'Fallback contact. Shared with event subscribers only when the subscription sets `include_contacts`.'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
    Mirror:
      example: {"id": "8a3f5c21-7d94-4b0e-a6f1-2c9d0e1b4a73", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "status": "succeeded", "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "size_bytes": 48211004, "refs": 14, "head": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "error": "", "requested_by": "scrs", "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:31:12Z"}
      description: 'A git history bundle of a repository, kept so the repository can be restored after an incident.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Mirror ID. Download the bundle with `GET /assets/{id}/mirrors/{mirror}/bundle`.'}
        asset_id: {type: string, format: uuid, description: 'Repository this bundle was made from.'}
        status: {type: string, enum: [queued, running, succeeded, failed, pruned], description: '`queued`, `running`, `succeeded`, `failed`, or `pruned` when retention removed the bundle.'}
        sha256: {type: string, description: 'SHA-256 of the bundle, to verify a download.'}
        size_bytes: {type: integer, description: 'Bundle size in bytes.'}
        refs: {type: integer, description: Branches and tags in the bundle}
        head: {type: string, description: Commit of HEAD at mirror time}
        error: {type: string, description: 'Why it failed. Empty otherwise.'}
        requested_by: {type: string, description: 'Token name that asked for it, or `scrs` for scheduled mirrors.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        completed_at: {type: [string, 'null'], format: date-time, description: 'When it finished, or `null` while queued or running.'}
    Target:
      description: 'What to assess: a git repository at a ref or commit, a container image, or an uploaded archive.'
      type: object
      required: [type, repository]
      properties:
        type: {type: string, enum: [git, image, upload], description: '`upload` assesses an archive sent with `POST /uploads`: set `repository` to the asset locator (`upload/<name>`) and `commit` to the upload''s `commit`'}
        repository: {type: string, description: 'Asset locator: owner/repo, group/sub/project, or registry/repository'}
        provider: {type: string, enum: [github, gitlab], description: Git targets only; disambiguates equal paths}
        ref: {type: string, description: 'Branch (git) or tag (image). Default HEAD / latest'}
        commit: {type: string, description: '40-hex commit (git) or sha256: manifest digest (image)'}
        platform: {type: string, default: linux/amd64, description: 'Container images only: picks one platform of a multi-architecture image, for example `linux/arm64`. Leave empty for the registry default.'}
        pull_request:
          description: 'Assess a pull request or merge request head. `ref` becomes `pull/<number>` and the base branch is the baseline for new versus existing findings.'
          type: object
          required: [number, base_ref]
          properties:
            number: {type: integer, description: 'Pull request or merge request number.'}
            base_ref: {type: string, description: 'Branch it merges into.'}
            head_ref: {type: string, description: 'Branch it comes from.'}
            title: {type: string, description: 'Title, shown in results and events.'}
    AssessmentRequest:
      description: 'Body to start an assessment. Only `target` is required.'
      type: object
      example: {"target": {"type": "git", "repository": "acme/api", "ref": "main"}, "notify": ["n8n-prod"], "trigger": {"origin": "n8n", "event": "release.requested", "context": {"ticket": "CHG-1042"}}}
      additionalProperties: false
      required: [target]
      properties:
        target: {$ref: '#/components/schemas/Target'}
        connection: {type: string, description: Connection name or id when several match}
        notify: {type: array, maxItems: 10, items: {type: string}, description: Deliver completion events only to these subscription names}
        trigger: {$ref: '#/components/schemas/Trigger'}
        skip_qa: {type: boolean, default: false, description: 'Exempt this assessment from QA. By default an assessment of an asset with an enabled, `auto_run` QA profile also queues its functional and lint runs (a `fail` verdict records them as `skipped`). Set `true` for a security-only assessment.'}
        import:
          type: object
          readOnly: true
          description: 'Set by SCRS on assessments created by `POST /assessments:import`. Never send it here: use the import endpoint.'
          properties:
            format: {type: string, description: 'Report format that was imported, for example `trivy` or `sarif`.'}
            tool: {type: string, description: 'Scanner that produced the report.'}
            tool_version: {type: string, description: 'Scanner version, when the report states it.'}
            replace_previous: {type: boolean, description: 'Whether this report replaced the same tool''s earlier findings for the ref.'}
    Trigger:
      type: object
      additionalProperties: false
      description: Who triggered the assessment and why. Echoed in outbound events; never affects the scan.
      properties:
        origin: {type: string, maxLength: 100, example: n8n, description: 'Your system name. Values SCRS assigns itself are rejected with `400`: `replay`, `scheduler` and anything starting with `github_`, `gitlab_`, `registry_` or `import_`'}
        event: {type: string, maxLength: 100, example: release.requested, description: 'What happened in your system, for example `release.requested` or `pull_request.opened`.'}
        delivery_id: {type: string, maxLength: 128, description: Caller's event or execution id}
        actor: {type: string, maxLength: 100, description: Claimed human or bot behind the request}
        context:
          type: object
          maxProperties: 20
          description: 'Correlation data (ticket, change request, n8n execution). Keys match ^[a-z0-9][a-z0-9._-]{0,62}$; values are at most 256 printable characters.'
          additionalProperties: {type: string, maxLength: 256}
          example: {ticket: CHG-1042, n8n.execution: '4711'}
    AssessmentStatus: {type: string, enum: [queued, running, succeeded, failed, cancelled], description: 'Where an assessment is: `queued` waiting, `running`, `succeeded` (a verdict exists), `failed` (it could not run; see `error`) or `cancelled`.'}
    Verdict: {type: string, enum: [pass, warn, fail, incomplete], description: 'Outcome of an assessment, worst first: `fail`, `incomplete` (a stage could not finish), `warn`, `pass`. A partial scan is never `pass`.'}
    Stage:
      description: 'One step of the assessment pipeline and how it went.'
      type: object
      properties:
        name: {type: string, examples: [inventory, malware, yara, ioc, integrity, import], description: 'Stage name, for example `integrity`, `inventory`, `malware`, `yara`, `sast`, `license` or `sbom`.'}
        status: {type: string, enum: [ok, partial, skipped, failed], description: '`ok` finished; `partial` finished with gaps; `skipped` did not apply; `failed` could not run.'}
        detail: {type: string, description: 'Short explanation, especially for `partial` and `failed`.'}
    Assessment:
      description: 'One assessment of one revision of an asset: its state, verdict inputs and counts. Findings, SBOM and reports are separate calls under `/assessments/{id}`.'
      type: object
      example: {"id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "request": {"target": {"type": "git", "repository": "acme/api", "ref": "main"}, "trigger": {"origin": "n8n", "event": "release.requested", "context": {"ticket": "CHG-1042"}}}, "requested_by": "ci-pipeline", "status": "succeeded", "verdict": "fail", "resolved_commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "ref_moved": false, "stages": [{"name": "inventory", "status": "ok"}, {"name": "malware", "status": "ok"}, {"name": "ioc", "status": "ok"}], "counts": {"total": 7, "new": 2, "waived": 0, "critical": 0, "high": 2, "medium": 3, "low": 2}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:33:12Z", "attempts": 1, "sbom_sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "request_id": "req_01HZX3"}
      properties:
        id: {type: string, format: uuid, description: 'Assessment ID. Also its job ID.'}
        asset_id: {type: string, format: uuid, description: 'Asset that was assessed.'}
        connection_id: {type: string, format: uuid, description: 'Connection used to fetch the source.'}
        request:
          description: 'The request as accepted, with the commit or digest filled in.'
          $ref: '#/components/schemas/AssessmentRequest'
        requested_by: {type: string, description: 'Token name or system that started it.'}
