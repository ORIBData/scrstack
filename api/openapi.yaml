openapi: 3.1.0
info:
  title: Software Supply Chain Risk Stack (SCRS) API
  version: 0.5.0
  license:
    name: MIT
    url: https://opensource.org/license/mit
  summary: Software supply-chain risk assessments, SBOM and MBOM, risk register and automation for repositories and container images.
  description: |
    **SCRS** (Software Supply Chain Risk Stack) checks the code and container images a company ships:
    GitHub and GitLab repositories, and images in Docker Hub, Google Artifact Registry, Harbor or any
    OCI registry. It reads what they contain (SBOM), how they are built (MBOM), matches them against
    vulnerability, malware and threat data, keeps one **risk register** of what it found, and can run
    functional, load and lint **QA** against a deployed environment. This contract is the source of truth
    for the back office, the design files and automation such as n8n. Every path is relative to `/scrs/v1`.

    ## Start here

    Every tag below opens with the flow its screens follow, the states to show and a recipe where one helps.

    | You are building | Open these tags |
    | --- | --- |
    | A dashboard or risk screens | **Risk register**, **Assets**, **Assessments**, **Assessment results**, **System** |
    | QA screens or a QA pipeline | **QA setup**, **QA runs**, **QA test generation** |
    | An n8n workflow | **Assessments**, **Webhook subscriptions**, **Ingest**, **Jobs** |
    | Settings and administration | **Connections**, **Tokens**, **Maintenance**, **Retention**, **LLM providers**, **Indicators of compromise** |

    ## Calling the API

    Send `Authorization: Bearer <token>` on every call except the public ones (`/system/healthz`,
    `/system/readyz`, `/docs`, and webhook receivers that check a signature or connection secret).
    An operation lists the scopes it accepts in `security`; the token needs **any one** of them, and `admin` passes all.
    `401` means a missing or bad token, `403` a token without the scope (do not retry).

    | Scope | Can | Typical holder |
    | --- | --- | --- |
    | `read` | View everything except settings and secrets. | Dashboards, auditors |
    | `write` | `read`, plus start assessments, triage findings, edit assets, QA and SAST settings. | Engineers, CI, n8n |
    | `trigger` | Queue assessments and QA runs and read the ones it started. | Narrow automation |
    | `qa` | Read and start QA only. No assessments, findings or settings. | A QA pipeline |
    | `ingest:relay` | Forward provider webhooks to `/ingest/*`. | A relay in front of SCRS |
    | `admin` | Everything: tokens, connections, retention, audit log, waivers, secrets. | Platform owners |

    Give each integration its own token with the narrowest scope, an `ip_allow_list` and an expiry. Its name is stored as `requested_by`.

    ## Conventions

    | Topic | Rule |
    | --- | --- |
    | Errors | `{"error": "<message>"}` with the HTTP status. Show the message; log `X-Request-Id` for support. |
    | Rate limit | 120 requests per token per minute. `429` carries `Retry-After` (seconds). |
    | Lists | `{items, next_cursor}`; pass `cursor=<next_cursor>` until it is empty. A list under an unknown asset or assessment answers `200` with empty `items`, not `404`. |
    | Changing things | Send the `ETag` back in `If-Match` on `PATCH` and `PUT`: `428` if missing, `409` if stale (reload, re-apply). |
    | Safe retries | Assessments, remediation plans and GitLab ingest accept `Idempotency-Key`. Other `POST`s do not deduplicate. |
    | Long-running work | Answers `202` with a `job_id`; see the **Jobs** tag. |
    | Times, IDs, secrets | RFC 3339 UTC; UUIDs; credentials are write-only (read `has_api_key`, `prefix`). |
    | Compatibility | Ignore properties you do not know; new ones are added without a version change. |
servers:
  - url: /scrs/v1
security:
  - bearerAuth: []
tags:
  - name: System
    description: |
      Health, readiness, metrics, platform status and this documentation.

      `GET /system/healthz` and `/system/readyz` are public probes for load balancers. `GET /system/status` (token) rolls up the database, Redis, storage, scanner, SAST and QA runner for a status banner; each component is `ok`, `degraded`, `down` or `not_configured`. Changes arrive as `system.degraded` and `system.recovered` events.
  - name: Tokens
    description: |
      Create, list and revoke API tokens (admin).

      A token has scopes (`read`, `write`, `trigger`, `qa`, `ingest:relay`, `admin`), an optional IP allow-list and an optional expiry. The secret is returned once, by `POST /tokens`. Give each integration its own token so the audit log and `requested_by` say who did what.
  - name: Connections
    description: |
      Accounts SCRS reads from: GitHub, GitLab, Docker Hub, Google Artifact Registry, Harbor and any OCI registry (admin).

      Set-up order: `POST /connections` (credential is write-only), `POST /connections/{id}:test`, `POST /connections/{id}:discover`, then `POST /connections/{id}:webhook` for the receiver URL and secret. The connection `scope` (include and exclude patterns) decides which discovered assets are assessed.
  - name: Assets
    description: |
      The repositories, images and uploaded archives SCRS knows about, with the business context you give them.

      Discovery fills the list; `PATCH /assets/{id}` sets owner, environment, criticality, exposure and labels (needs `If-Match`). Add what discovery does not list with `POST /assets`, `POST /assets:import` or `POST /uploads`. Per asset you also find revisions, SBOM diff, links between an image and its repository and the GitHub Actions check. Owners are under `/owners`.
  - name: Mirrors
    description: 'Git history bundles of repository assets, kept so a repository can be restored after an incident. Request one with `POST /assets/{id}/mirrors`, poll it as a job, then download the bundle and check it against `X-Content-SHA256`.'
  - name: Assessments
    description: |
      Start, follow and list assessments.

      **Recipe (n8n, CI).** `POST /assessments` with `{"target": {"type": "git", "repository": "acme/api", "ref": "main"}, "trigger": {"origin": "n8n"}}` and an `Idempotency-Key` (a `trigger` token is enough). It answers `202`. Wait with `GET /assessments/{id}?wait=30`, or subscribe to `assessment.completed`. `POST /assessments:batch` starts many. Send `skip_qa` to keep QA out.

      **States.** `status`: `queued`, `running`, `succeeded` (a verdict exists), `failed`, `cancelled`. `verdict`, worst first: `fail`, `incomplete` (a stage could not finish), `warn`, `pass`. A partial scan is never `pass`.
  - name: Assessment results
    description: |
      What one assessment found: `findings`, `components` (packages), `files`, the SBOM and MBOM downloads, VEX, a Markdown `report` and the JSON `context` for automation and AI agents.

      Open the verdict first (`GET /assessments/{id}`), then the tab the screen needs. `trigger` tokens can read only the assessments they started.
  - name: Imports
    description: 'Record a report from another scanner (Trivy JSON or SARIF) as an assessment, so its findings join the same register. `POST /assessments:import`.'
  - name: Jobs
    description: |
      The one place to follow any long-running work: assessments, QA runs and generations, AI summaries and reviews, reports, mirrors and Dependency-Track uploads.

      The starting call answers `202` with a `Location`, a `job_id` and a `status_url`. Then either wait on the resource (`GET /assessments/{id}?wait=30`), poll `GET /jobs/{job_id}` (same shape for every kind: `queued`, `running`, then `succeeded`, `failed` or `cancelled`), or be told by an event (`POST /webhooks`, or `GET /events` in a browser). Cancel with `POST /jobs/{id}:cancel`.
  - name: Live events
    description: |
      Server-sent events for a browser UI: short notices that something changed (`GET /events`).

      Events carry ids to fetch, not full payloads, and missed events are not replayed: reload the screen when you connect and on `resync`. Webhooks remain the guaranteed delivery path. A browser `EventSource` cannot send an `Authorization` header, so read the stream with `fetch`.
  - name: Risk register
    description: |
      One list of findings across all assessments, deduplicated, with their triage lifecycle.

      **Screens.** `GET /register` (filter by asset, status, severity, type, assignee), `GET /register/summary`, `/timeseries` and `/top-assets` for the dashboard, `GET /register/export` for a download.

      **Triage.** `PATCH /register/{id}` (status plus a `reason` of 8 to 2000 characters; waiving needs `admin`), `PUT /register/{id}/assignee`, `POST /register/{id}/comments`, history in `GET /register/{id}/events`.

      **States.** `severity`: `critical`, `high`, `medium`, `low`, `info`, `unknown`. `status`: `open`, `triaged`, `in_progress`, `accepted` (until `waiver_until`), `suppressed`, `false_positive`, `fixed`.
  - name: Remediation
    description: 'Guided fix plans for npm (`package-lock.json`) and Maven (`pom.xml`) manifests. `POST /assets/{id}/remediations` queues a plan; read it from `GET /assessments/{id}/remediation`. A plan is advice; SCRS never writes to a repository.'
  - name: Advisories and summaries
    description: |
      A language model writes an **assessment summary** (headline, risk level, priorities) and an **advisory** (explanation, action, urgency) for an assessment's most important findings. It sees findings and advisory text only, never code.

      Flow: `POST /assessments/{id}/summaries` with a `provider_id`, poll `GET /summary-jobs/{id}`, then read `GET /assets/{id}/chronicle`. The chronicle is the asset's history of written documents, oldest first; a new one *supersedes* the old (`superseded_at`, `supersedes`). Every document has `origin: llm` and a `provenance` (model, provider, prompt version, what the guard removed), and is not verified.

      Described: vulnerabilities (SCRS's own and Dependency-Track's), malicious dependencies, licence, integrity and configuration findings. Only counted, not described: code analysis (SAST), secret detection, AI review entries, malware, YARA and IOC matches, and QA entries.
  - name: AI review
    description: |
      A language model reads the source of an assessed commit and reports risks and bugs as report-only register entries of type `ai_review`, marked `unverified`. They never change a verdict.

      Source goes only to a provider whose `source_allowed` is true (see **LLM providers**). Flow: `POST /assets/{id}/ai-reviews`, poll `GET /ai-reviews/{id}`, then list entries with `GET /register?asset_id=&type=ai_review`.
  - name: QA setup
    description: |
      Where and how a repository is tested. `PUT /assets/{id}/qa/profile` sets the environment, what to run (functional, performance, lint with `lint.tools`) and `auto_run`. `GET /qa/runner` lists what the QA runner has installed.

      The profile `gate` (admin) decides whether manual QA needs a passed assessment (`assessment`, default) or runs on its own against a ref (`none`). A token with only the `qa` scope can start and read QA and nothing else.

      The QA runner is a separate service with its own token. `GET /qa/runner` says whether it is reachable and which linters it has. It does no vulnerability, malware or SBOM work.
  - name: QA runs
    description: |
      Start, follow and read QA runs.

      **Recipe: QA without a security assessment.** An admin sets `"gate": "none"` in the profile. Then `POST /assets/{id}/qa/runs` with `{"kind": "full", "ref": "main"}` (`full` runs everything the profile configures and answers with the runs). Poll `GET /qa/runs/{id}`, then read `/scenarios`, `/coverage` and `/report`. Lint and test failures become `qa_*` entries in the risk register and never change a verdict.

      **States.** `queued`, `submitted`, `running`, then `passed` or `failed` (tests ran), `error` (could not run), `cancelled`, `skipped` (the assessment verdict was `fail`).
  - name: QA test generation
    description: 'Tests drafted by the profile''s LLM provider. `POST /assets/{id}/qa/generations` drafts Karate API features from the OpenAPI document (`api`) or unit tests for source files that have none (`unit`). Review each file, then `POST /qa/suites/{id}:approve` (admin) or `:reject`. Drafts never run; approved API features run in every later functional run.'
  - name: SAST
    description: Static analysis of repository source with bundled analyzers (gosec, Bandit, OpenGrep, Bearer), Go call-graph reachability and npm and PyPI import-level reachability. They run in an isolated container without SCRS secrets. Settings apply platform-wide and per asset.
  - name: Licences
    description: Licence inventory per asset, the policy that decides allow, review or deny by how the software is distributed, category overrides and third-party notices. A policy aid, not legal advice.
  - name: Compliance reports
    description: |
      Evidence reports for OWASP Top 10, CWE Top 25, PCI DSS and imported DISA STIG, as JSON, CSV, Markdown or PDF. Evidence for assessors, not certification.

      Flow: `GET /reports/frameworks`, then `POST /reports` with a framework and a scope (asset, owner or portfolio); poll `GET /reports/{id}` until `succeeded`, then download it.
  - name: Webhook subscriptions
    description: |
      Outbound webhooks: SCRS sends signed events to your URL (admin).

      **Recipe (n8n).** `POST /webhooks` with the events you want and an HTTPS URL. Keep the signing secret and the `X-SCRS-Auth` value shown once. Each delivery carries `X-SCRS-Signature` (`sha256=` HMAC of the exact body), `X-SCRS-Auth` (for n8n Header Auth), `X-SCRS-Event` and `Idempotency-Key`. Profile `summary` sends ids and counts; `full` and `agent` send the whole context.

      **Email.** A `mailto:` URL sends the same events as email (summary profile, SMTP configured). `POST /webhooks/{id}:test` sends a `ping`; a `dead` delivery can be redelivered.
  - name: Ingest
    description: |
      Where GitHub, GitLab and registries send events (push, pull request, image push). These calls queue assessments; a person does not call them.

      Each connection has its own receiver (`/ingest/<provider>/<connection>`; registries `/ingest/registry/<provider>/<connection>`), set up with `POST /connections/{id}:webhook` and checked by signature or secret. Automation such as n8n can forward the unchanged body with an `ingest:relay` token.
  - name: Integrations
    description: Optional two-way link to OWASP Dependency-Track. SCRS uploads each SBOM and, when enabled, reads back what Dependency-Track found and shares triage decisions. SCRS never depends on it being reachable.
  - name: Indicators of compromise
    description: |
      Indicators SCRS matches against what it scans, from manual lists, STIX or CSV files or a TAXII feed.

      Each source has a mode: `hunt` records matches without changing a verdict, `alert` gates by severity, `block` fails the verdict on any match. `alert` and `block` need `admin`. Order: create a source, import or poll it, then `:hunt` to rescan every in-scope repository against it.
  - name: YARA rulesets
    description: 'Rules that run with YARA-X on every repository file and container image layer file. Check rules with `POST /intel/yara-rulesets:validate`, save them, and use `:hunt` to rescan every in-scope repository with them. Rulesets have the same `hunt`, `alert` and `block` modes as indicator sources.'
  - name: Vulnerability data and VEX
    description: 'Where vulnerability and advisory data comes from. Check sources and trigger a sync (`/intel/vulnerability-sources`), write local advisories for your own packages (`/advisories`), and import VEX documents that mark findings as not affected (`/intel/vex-documents`).'
  - name: Policies
    description: 'Optional checks applied to every assessment (admin). `/policies/dependencies` flags very new packages and look-alike package names. `/policies/integrity` sets the behavioural and size signals that raise an integrity alert from pushes. Both start off and change from the next assessment.'
  - name: LLM providers
    description: |
      Model services that draft QA tests, summarise assessments and review code (admin): OpenAI, Anthropic, Gemini, Azure OpenAI, Mistral, Groq, DeepSeek, xAI, OpenRouter, Together, Ollama or any OpenAI-compatible server. `GET /llm/presets` lists known services.

      **Where code may go.** `locality` is `local` (a model server you run; its host is in `SCRS_LLM_PRIVATE_HOSTS`) or `hosted`. `source_allowed` says whether source code may be sent. A `local` provider always may. A `hosted` one may only after the platform switch `SCRS_LLM_ALLOW_SOURCE_TO_HOSTED=true` is on and an administrator has called `POST /llm/providers/{id}:allow-source` with a `note` that records why. `:revoke-source` withdraws it, and so does changing the provider's `base_url`. Both steps are audited. Summaries and advisories never send code: the model sees only finding IDs, titles, severities, package names and versions, fixed versions and upstream advisory text.

      **Declared in the environment.** Providers can be declared at deploy time (`SCRS_LLM_PROVIDERS`, `SCRS_LLM_PROVIDER_<NAME>_*`). They show `managed_by_environment: true`; an administrator can only enable or disable them here.

      **Screening and trust.** Every prompt and answer passes a guard that redacts credentials, keys, tokens and the platform's own secrets and removes images, scripts and tracking links from answers. It is a safety net, not a guarantee. Model output is not verified: findings are report-only `ai_review` entries marked `unverified` and never change a verdict.

      **Budget.** Model work stops at the assessment's token ceiling (`SCRS_LLM_ASSESSMENT_INPUT_TOKENS`, `SCRS_LLM_ASSESSMENT_OUTPUT_TOKENS`) and says so in `incomplete`. A hosted provider, billed per token, also has a monthly cap across all its work (`SCRS_LLM_MONTHLY_INPUT_TOKENS`, `SCRS_LLM_MONTHLY_OUTPUT_TOKENS`, calendar month UTC); work resumes next month or when you raise it. A self-hosted provider has no cap. An answer cut off at the provider's `max_tokens` does not count as a review of that file.
  - name: Incidents
    description: 'Evidence for a suspected account compromise. `POST /incidents` takes one to twenty logins and a time window, collects the branches, pull requests and signals they touched (read-only) and by default queues fresh scans. It contains nothing: suspending accounts and rotating secrets stay manual.'
  - name: Maintenance
    description: 'Platform upkeep (admin): run retention now, rescan default branches, re-assess current revisions, requeue dead webhook deliveries, refresh feeds, reset one scope of data, and read the job schedule and component versions.'
  - name: Retention
    description: 'How long each kind of data is kept (admin). Read and change with `GET` and `PUT /settings/retention`; preview what a change would remove with `POST /settings/retention:preview` before saving or purging.'
  - name: Audit and inbound events
    description: 'The audit log of administrative actions (`GET /audit`) and the log of provider webhooks SCRS received, with replay (`/events/inbound`).'
paths:
  # ---------------------------------------------------------------- System
  /system/healthz:
    get:
      tags: [System]
      operationId: health
      summary: Liveness probe
      description: Returns `ok` while the process is serving. No authentication. For per-component state use `GET /system/status`.
      security: []
      responses:
        '200': {description: Process is alive, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
  /system/readyz:
    get:
      tags: [System]
      operationId: readiness
      summary: Readiness probe
      description: Checks PostgreSQL, Redis and S3 (cached for 10 s). Use for load-balancer health. No authentication.
      security: []
      responses:
        '200': {description: Backing services reachable, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
        '503': {description: A backing service is unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Status'}}}}
  /system/status:
    get:
      tags: [System]
      operationId: platformStatus
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Platform status
      description: |
        Per-component state for a frontend status view. The call always answers `200`; read `status`. Each component is `ok`, `degraded`, `down` or `not_configured`.

        **Components**
        - `api`, `postgres`, `redis`, `s3`, `scanner`, `sast` and `qa_runner`.
        - `worker`: from its last heartbeat; `down` after 15 minutes of silence.
        - `feeds`: stale enabled vulnerability sources.
        - `dependency_track`, the optional link: `not_configured` while it is off, `down` when the server is unreachable, `degraded` after failed uploads or imports in the last 24 hours, a backlog older than 15 minutes, or a failed findings sync.

        **Overall `status`.** `down` when PostgreSQL, Redis or S3 is down; `degraded` when any other configured component is not `ok`; `ok` otherwise.

        **Notes.** A change of overall status is also pushed as the `system.degraded` and `system.recovered` events, announced once after it holds for about 90 seconds. Details are fixed phrases without addresses or error text. Probes run concurrently and the answer is cached for 10 seconds. Scope `read` or `write`.
      responses:
        '200': {description: Platform status, content: {application/json: {schema: {$ref: '#/components/schemas/PlatformStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /system/metrics:
    get:
      tags: [System]
      operationId: metrics
      security: [{bearerAuth: [read]}]
      summary: Prometheus metrics
      description: Request, queue-depth, verdict, trigger and webhook-delivery metrics in Prometheus text format. Scope `read`.
      responses:
        '200': {description: Prometheus exposition, content: {text/plain: {schema: {type: string}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /system/github-webhooks:
    get:
      tags: [System]
      operationId: githubWebhookChecks
      security: [{bearerAuth: [read]}]
      summary: GitHub webhook delivery check state
      description: |
        Latest delivery check of each GitHub connection. GitHub never retries a failed webhook delivery, so SCRS reads its own
        webhook's delivery log every `SCRS_GITHUB_HOOK_CHECK_MINUTES` (default 5), requests redelivery of failed events with
        5/10/20/40-minute backoff (at most five attempts, within GitHub's three-day log), and reports webhook configuration
        that would drop force-push and other integrity events. `degraded` and `failed` states also emit `connection.degraded`.
        Scope `read`.
      responses:
        '200': {description: Checks, content: {application/json: {example: {"items": [{"connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "connection": "acme-github", "source": "org", "state": "ok", "checked_at": "2026-11-16T09:30:00Z", "last_success_at": "2026-11-16T09:30:00Z", "window_start": "2026-11-15T09:30:00Z", "hooks": 1, "deliveries_scanned": 64, "redelivered": 0, "retrying": 0, "abandoned": 0, "rejected": 0, "problems": []}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/GitHubWebhookCheck'}, description: 'One check result per GitHub connection.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /system/github-webhooks:check:
    post:
      tags: [System]
      operationId: runGitHubWebhookCheck
      security: [{bearerAuth: [admin]}]
      summary: Run the GitHub webhook delivery check now
      description: Runs the scheduled delivery check immediately and returns its result. Returns 409 while another replica is checking. Scope `admin`.
      responses:
        '200': {description: Checks, content: {application/json: {example: {"items": [{"connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "connection": "acme-github", "source": "org", "state": "ok", "checked_at": "2026-11-16T09:30:00Z", "last_success_at": "2026-11-16T09:30:00Z", "window_start": "2026-11-15T09:30:00Z", "hooks": 1, "deliveries_scanned": 64, "redelivered": 0, "retrying": 0, "abandoned": 0, "rejected": 0, "problems": []}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/GitHubWebhookCheck'}, description: 'One check result per GitHub connection.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /docs:
    get:
      tags: [System]
      operationId: apiDocs
      summary: Swagger UI
      description: 'Interactive documentation for this API. Served only while `SCRS_SWAGGER_DOCS_ENABLE=true` (the default); with `false`, this path, its assets and `/docs/openapi.yaml` return 404 like an unknown route, even with a valid token. When enabled, it is public unless `SCRS_DOCS_PUBLIC=false` (then any valid token).'
      security: []
      responses:
        '200': {description: HTML page, content: {text/html: {schema: {type: string}}}}
        '401': {description: '`SCRS_DOCS_PUBLIC=false` and no valid token'}
        '404': {description: 'Docs disabled (`SCRS_SWAGGER_DOCS_ENABLE=false`)'}
  /docs/openapi.yaml:
    get:
      tags: [System]
      operationId: openAPIDocument
      summary: OpenAPI document
      description: 'This contract in YAML, for client generation (for example openapi-typescript or orval). Served only while `SCRS_SWAGGER_DOCS_ENABLE=true`, under the same access rule as `/docs`.'
      security: []
      responses:
        '200': {description: OpenAPI 3.1 YAML, content: {application/yaml: {schema: {type: string}}}}
        '401': {description: '`SCRS_DOCS_PUBLIC=false` and no valid token'}
        '404': {description: 'Docs disabled (`SCRS_SWAGGER_DOCS_ENABLE=false`)'}

  # ---------------------------------------------------------------- Tokens
  /tokens:
    get:
      tags: [Tokens]
      operationId: listTokens
      security: [{bearerAuth: [admin]}]
      summary: List API tokens
      description: Token metadata only; secrets are never returned after creation. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200':
          description: Page of tokens
          content: {application/json: {schema: {$ref: '#/components/schemas/TokenPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Tokens]
      operationId: createToken
      security: [{bearerAuth: [admin]}]
      summary: Create an API token
      description: Returns the token secret once. Optionally restrict client IPs (`ip_allow_list`) and set an expiry. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "qa-pipeline", "scopes": ["qa"], "ip_allow_list": ["203.0.113.0/24"], "expires_at": "2027-06-30T00:00:00Z"}
            schema:
              type: object
              additionalProperties: false
              required: [name, scopes]
              properties:
                name: {type: string, maxLength: 100, example: backoffice-reader, description: 'Name shown in audit logs and stored as `requested_by` on what the token starts. Unique; not `bootstrap`.'}
                scopes: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Scope'}, description: 'Permissions to grant (1 to 6). Give an automation system only what it needs, for example `qa` for a QA pipeline.'}
                ip_allow_list: {type: array, items: {type: string, description: IP or CIDR}, example: ['203.0.113.0/24'], description: 'CIDR ranges that may use the token, for example `203.0.113.0/24`. Leave empty for any address.'}
                expires_at: {type: [string, 'null'], format: date-time, description: 'When the token stops working (RFC 3339, UTC). Omit or `null` for no expiry.'}
      responses:
        '201':
          description: Token created; store `token` now
          content:
            application/json:
              example: {"token": "scrs_9fK2Vb7Lq3Xn8TzR5mWc1HdY4sPgJe6A", "metadata": {"id": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "name": "frontend-dashboard", "prefix": "scrs_9fK2", "scopes": ["read"], "ip_allow_list": ["203.0.113.0/24"], "expires_at": "2027-02-01T00:00:00Z", "created_at": "2026-11-16T09:30:00Z", "last_used_at": "2026-11-16T09:30:00Z", "revoked_at": null}}
              schema:
                type: object
                properties:
                  token: {type: string, description: Secret bearer token (shown once)}
                  metadata: {$ref: '#/components/schemas/Token'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /tokens/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Tokens]
      operationId: revokeToken
      security: [{bearerAuth: [admin]}]
      summary: Revoke an API token
      description: Revocation is immediate. The bootstrap token is rotated through the environment instead. Scope `admin`.
      responses:
        '204': {description: Revoked}
        '409': {description: Unknown token or bootstrap token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Connections
  /connections:
    get:
      tags: [Connections]
      operationId: listConnections
      security: [{bearerAuth: [admin]}]
      summary: List connections
      description: Connections without credentials, ordered by name. The next page cursor is in `X-Next-Cursor`. Scope `admin`.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {name: cursor, in: query, schema: {type: string}, description: 'Value of the previous `X-Next-Cursor` header'}
      responses:
        '200':
          description: Connections
          headers: {X-Next-Cursor: {schema: {type: string}, description: Present when more pages exist}}
          content: {application/json: {example: [{"id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "provider": "github", "name": "acme-github", "config": {"org": "acme"}, "scope": {"include": ["acme/*"], "exclude": ["acme/archive-*"]}, "status": {"state": "ok", "checked_at": "2026-11-16T09:30:00Z", "counts": {"discovered": 42, "in_scope": 31}}, "enabled": true, "webhook": {"configured": true, "path": "/scrs/v1/ingest/github/acme-github", "rotated_at": "2026-11-16T09:30:00Z"}}], schema: {type: array, items: {$ref: '#/components/schemas/Connection'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Connections]
      operationId: createConnection
      security: [{bearerAuth: [admin]}]
      summary: Create a connection
      description: |
        Stores a provider's settings and an AES-GCM encrypted credential. The credential is write-only: it is never returned. `config` and `credential` depend on the provider.

        | Provider | `config` | `credential` |
        | --- | --- | --- |
        | `github` | `{organization, auth_type: github_app\|fine_grained_pat\|oauth_app_token, app_id?, installation_id?, webhook_source?: app\|org}` | `{private_key_pem}` or `{token}` |
        | `gitlab` | `{group, base_url?}` (subgroups allowed; default `https://gitlab.com`) | `{token}` with `read_api` and `read_repository` |
        | `dockerhub` | `{namespace, identifier}` | `{token}` |
        | `gar` | `{project, location}` | `{service_account_json}` |
        | `harbor` | `{url, project, username}` (a robot account) | `{token}` |
        | `oci` | `{registry, namespace?, username?, repositories?}` | `{token}`, or `{}` for anonymous |

        - GitHub `webhook_source` picks the webhook the delivery check reads: default `app` for GitHub Apps, `org` for tokens. `org` needs the organization webhooks permission (read and write).
        - For an `oci` registry without a catalog (GHCR), list the `repositories` to assess.

        After creating, call `POST /connections/{id}:test`, then `:discover`. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConnectionInput'}
            examples:
              gitlab: {value: {provider: gitlab, name: gitlab-platform, config: {group: acme/platform}, scope: {include: ['acme/platform/**']}, credential: {token: glpat-xxxx}}}
              harbor: {value: {provider: harbor, name: harbor-apps, config: {url: 'https://harbor.example.com', project: apps, username: 'robot$scrs'}, scope: {include: ['harbor.example.com/apps/*']}, credential: {token: '...'}}}
      responses:
        '201':
          description: Created
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Connections]
      operationId: getConnection
      security: [{bearerAuth: [admin]}]
      summary: Get a connection
      description: Configuration, scope and last check status; never the credential. Scope `admin`.
      responses:
        '200': {description: Connection, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Connections]
      operationId: updateConnection
      security: [{bearerAuth: [admin]}]
      summary: Change scope or enable/disable
      description: Changing scope or disabling invalidates queued work for the old configuration. Send at least one field. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"enabled": false}
            schema:
              type: object
              additionalProperties: false
              properties:
                scope: {$ref: '#/components/schemas/ConnectionScope'}
                enabled: {type: boolean, description: '`false` stops discovery and assessments through the connection without deleting it.'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Connections]
      operationId: disableConnection
      security: [{bearerAuth: [admin]}]
      summary: Disable a connection
      description: Soft delete. The connection is disabled and its history kept as audit evidence. Scope `admin`.
      responses:
        '200': {description: Disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:rotate-credential:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: rotateConnectionCredential
      security: [{bearerAuth: [admin]}]
      summary: Replace the stored credential
      description: Validates the credential shape for the provider and re-encrypts it. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"credential": {"token": "<new provider token>"}}
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: {type: object, description: 'Provider credential, as in createConnection'}
      responses:
        '200': {description: Rotated, content: {application/json: {schema: {$ref: '#/components/schemas/Connection'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:webhook:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: setConnectionWebhook
      security: [{bearerAuth: [admin]}]
      summary: Set or rotate a connection's webhook secret
      description: |
        Each GitHub, GitLab, Harbor, Docker Hub, GAR and OCI connection has its own inbound webhook secret and receiver URL. The secret is sealed with `SCRS_MASTER_KEY`, separately from the provider credential, so rotating it re-scopes no assets and invalidates no assessments.
        By default SCRS generates a 64-character secret and returns it once with `receiver_url` and provider-specific `setup` instructions. You can supply `secret` instead (32–256 printable characters). `hook_url` (GitHub only) names the public URL GitHub calls when it is a relay, so the delivery check finds the hook; `""` clears it. Send only `hook_url` with `rotate_secret: false` to keep the current secret. Scope `admin`.
      requestBody:
        content:
          application/json:
            example: {"rotate_secret": true}
            schema:
              type: object
              additionalProperties: false
              properties:
                rotate_secret: {type: boolean, description: 'Default true, except when only hook_url changes on a connection that already has a secret'}
                secret: {type: string, minLength: 32, maxLength: 256, description: 'Your own secret (32 to 256 printable characters). Omit to have SCRS generate a 64-character one and return it once.'}
                hook_url: {type: string, description: 'GitHub only: the public URL GitHub calls when a relay sits in front of SCRS, so the delivery check can find the hook. `""` clears it.'}
      responses:
        '200':
          description: Webhook updated; store `webhook_secret` now
          content:
            application/json:
              example: {"connection": {"id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "provider": "github", "name": "acme-github", "config": {"org": "acme"}, "scope": {"include": ["acme/*"], "exclude": ["acme/archive-*"]}, "status": {"state": "ok", "checked_at": "2026-11-16T09:30:00Z", "counts": {"discovered": 42, "in_scope": 31}}, "enabled": true, "webhook": {"configured": true, "path": "/scrs/v1/ingest/github/acme-github", "rotated_at": "2026-11-16T09:30:00Z"}}, "receiver_url": "https://scrs.example.com/scrs/v1/ingest/github/acme-github", "webhook_secret": "whsec_4f1e0c7a9b2d58163e0a7c4b9d1f2a38", "setup": "In the provider, add a webhook with this URL and secret, content type application/json."}
              schema:
                type: object
                properties:
                  connection: {$ref: '#/components/schemas/Connection'}
                  receiver_url: {type: string, description: 'The URL to enter in the provider''s webhook settings.'}
                  webhook_secret: {type: string, description: Present only when the secret was set or rotated}
                  setup: {type: string, description: 'Step-by-step instructions for that provider.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /connections/{id}:test:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: testConnection
      security: [{bearerAuth: [admin]}]
      summary: Test provider access
      description: Lists resources with the stored credential without changing the inventory. Scope `admin`.
      responses:
        '200':
          description: Provider reachable
          content: {application/json: {example: {"connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "resource_count": 42}, schema: {type: object, properties: {connection_id: {type: string, format: uuid, description: 'Connection tested.'}, resource_count: {type: integer, description: 'Repositories or images the credential can see.'}}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {description: Provider rejected the request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /connections/{id}:discover:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Connections]
      operationId: discoverConnection
      security: [{bearerAuth: [admin]}]
      summary: Discover assets
      description: Lists the provider's repositories or images and reconciles the asset inventory. Resources that disappeared lose eligibility but keep their history. Scope `admin`.
      responses:
        '200':
          description: Inventory reconciled
          content: {application/json: {example: {"connection": "acme-github", "discovered": 42, "in_scope": 37}, schema: {type: object, properties: {connection: {type: string, description: 'Connection name.'}, discovered: {type: integer, description: 'Assets found.'}, in_scope: {type: integer, description: 'Of those, assets inside the connection''s scope that will be assessed.'}}}}}
        '502': {description: Provider rejected the request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Assets
  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      security: [{bearerAuth: [read]}]
      summary: List assets
      description: All discovered repositories and images ordered by locator. Check `flags.in_scope` and `flags.accessible` for eligibility. Scope `read`.
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Page of assets, content: {application/json: {schema: {$ref: '#/components/schemas/AssetPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Assets]
      operationId: createAsset
      security: [{bearerAuth: [write]}]
      summary: Register an asset by hand
      description: |
        Registers one repository or image under an existing connection when discovery has not listed it, optionally with its owner and attributes. `type` defaults to the connection's own (`github_repo`, `gitlab_repo` or `container_image`). The asset is created with `flags.manual` true and is `in_scope` only when the connection's scope matches its locator. Discovery never marks a manual asset inaccessible; it only follows the current scope. Registering a locator that exists returns `200` with the existing asset (git hosts compare case-insensitively). `distribution` and `legal_hold` need `admin`. Scope `write`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetCreate'}, example: {"connection": "github-acme", "locator": "acme/api", "type": "github_repo", "environment": "prod", "criticality": 4, "exposure": "internet", "labels": {"team": "payments"}}}}
      responses:
        '201':
          description: Created
          headers: {ETag: {$ref: '#/components/headers/ETag'}, Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}
        '200':
          description: The asset already exists
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets:import:
    post:
      tags: [Assets]
      operationId: importAssets
      security: [{bearerAuth: [write]}]
      summary: Register many assets
      description: |
        Registers 1 to 500 assets under one connection, each with its own result (`created`, `exists` or `invalid`); one invalid item never fails the rest. Items follow `POST /assets`. Answers `207`. Scope `write`; `distribution` and `legal_hold` need `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetImport'}, example: {"connection": "github-acme", "items": [{"locator": "acme/api", "environment": "prod", "criticality": 4}, {"locator": "acme/web", "environment": "stg"}]}}}
      responses:
        '207':
          description: One result per item
          content: {application/json: {schema: {$ref: '#/components/schemas/AssetImportResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: getAsset
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Get an asset
      description: Asset with owner and attributes. The `ETag` header is the revision for updates. Scope `read` or `write`.
      responses:
        '200':
          description: Asset
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Assets]
      operationId: deleteAsset
      security: [{bearerAuth: [admin]}]
      summary: Delete a manually registered asset
      description: |
        Removes an asset registered with `POST /assets` or `POST /assets:import` that nothing refers to. An asset discovered by its connection answers `409`: narrow the connection's scope instead, or it would reappear at the next discovery. An asset with assessments, findings, settings or a legal hold also answers `409`; its history is kept. An `uploaded` asset follows the same rule and is deleted together with its archives; one that has been assessed answers `409` (delete its uploads, or set the `uploaded_archives` retention class). Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Assets]
      operationId: updateAsset
      security: [{bearerAuth: [write]}]
      summary: Update owner and attributes
      description: Sets owner, environment, criticality, exposure and labels. The label `mirror=true` opts the asset into scheduled git mirrors. Requires `If-Match`. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetChange'}, example: {"environment": "prod", "criticality": 5, "labels": {"team": "payments"}}}}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Asset'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /uploads:
    post:
      tags: [Assets]
      operationId: uploadSource
      security: [{bearerAuth: [write]}]
      summary: Upload a source archive
      description: |
        Assesses source code that is not in a connected repository, such as a vendor drop or a build output. The scan, register, SBOM, licences and SAST work as for a repository; QA runs and remediation plans do not apply. Audited. Scope `write`.

        **Request.** `multipart/form-data` with `name` (the asset becomes `upload/<name>`; lowercase letters, digits, `.`, `_`, `-`; at most 100 characters), `file` (a gzip-compressed tar of at most 64 MiB), optional `ref` (a label for this version, default `upload`) and optional `assess` (`false` stores the archive without scanning it). Send `Idempotency-Key` so a retry queues one assessment.

        **What happens.** The first upload for a name creates an asset of type `uploaded`, in scope, on a built-in connection that `GET /connections` does not list. Each distinct archive is a revision whose `commit` is the first 40 hex digits of its SHA-256; uploading the same archive again returns the existing upload (`200`) and queues another assessment. If the asset already has a running assessment, the archive is kept and `assessment_error` says so; queue it later with `POST /assessments` and `target.type` `upload`. Archives stay until `DELETE /assets/{id}/uploads/{upload}` or the `uploaded_archives` retention class removes those replaced by a newer upload with the same `ref`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name: {type: string, maxLength: 100, example: vendor-portal, description: 'Asset name; the asset becomes `upload/<name>`. Lowercase letters, digits, `.`, `_` and `-`, up to 100 characters.'}
                ref: {type: string, maxLength: 128, example: v2.3.0, description: 'Label for this version, for example a build number. Default `upload`.'}
                assess: {type: string, enum: ['true', 'false'], default: 'true', description: '`true` (default) queues an assessment straight away; `false` only stores the archive.'}
                file: {type: string, format: binary, description: 'The source: a gzip-compressed tar archive of at most 64 MiB.'}
      responses:
        '201':
          description: New archive stored; the assessment is queued unless `assess` was false
          headers: {Location: {schema: {type: string}, description: The queued assessment}}
          content: {application/json: {schema: {$ref: '#/components/schemas/UploadResult'}}}
        '200':
          description: This archive was already uploaded for the asset
          content: {application/json: {schema: {$ref: '#/components/schemas/UploadResult'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: The archive is larger than 64 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '415': {description: The body is not multipart/form-data, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: The file is not a gzip-compressed tar archive, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {description: Object storage refused the archive, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Object storage is not configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /assets/{id}/uploads:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: listAssetUploads
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Archives uploaded for an asset
      description: The archives of an `uploaded` asset, newest first (at most 200), each with its SHA-256, size, original file name, label and uploader. The archive itself is not returned. `404` for an asset that is not an uploaded one. Scope `read` or `write`.
      responses:
        '200': {description: Uploads, content: {application/json: {schema: {$ref: '#/components/schemas/UploadPage'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/uploads/{upload}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: upload, in: path, required: true, schema: {type: string, format: uuid}, description: 'The upload id from `GET /assets/{id}/uploads`'}
    delete:
      tags: [Assets]
      operationId: deleteUpload
      security: [{bearerAuth: [admin]}]
      summary: Delete an uploaded archive
      description: |
        Removes the stored archive and its record. Assessments that scanned it keep their results, SBOMs and findings; the archive can no longer be scanned again, so a rebuild of that revision fails. The object is deleted unless another upload of the same bytes uses it. Answers `409` when the asset is under legal hold or an assessment of the archive is queued or running (`Retry-After` is set). Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/actions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: getAssetActions
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: GitHub Actions inventory of a repository
      description: |
        What the last check found: whether Actions is enabled, the workflow list, and per workflow the run numbers seen and any missing between the lowest and highest (a deleted run leaves a hole). `available` is false, with a `reason`, when the credential lacks the read-only Actions permission; `error` is set when the last attempt failed outright, and the other fields then show the last good reading. `404` until a check has run. Checks run on a schedule when `SCRS_ACTIONS_SWEEP_INTERVAL_HOURS` is set, or on demand with `POST /assets/{id}/actions:check`. Scope `read` or `write`.
      responses:
        '200': {description: The inventory, content: {application/json: {schema: {$ref: '#/components/schemas/ActionsState'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/actions:check:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Assets]
      operationId: checkAssetActions
      security: [{bearerAuth: [write]}]
      summary: Read a repository's Actions inventory now
      description: |
        Reads GitHub's Actions API with the connection's credential (read-only: the repository's Actions permissions, its workflows and up to 500 recent runs of each of up to 30 workflows) and stores the result. It sets the asset's `flags.actions_unused` when Actions is off or there are no workflows, and raises `integrity` entries: `actions_workflows_changed` (low) when the workflow list differs from the previous reading, and `run_number_gap` (medium, high when another integrity entry of medium severity or more is open for the asset and was seen in the last week) for holes in run numbers. Legitimate run deletions cause false positives. A hole already reported does not raise again. Only GitHub repositories of an enabled connection qualify (`409` otherwise); a GitHub outage answers `502`. Scope `write`.
      responses:
        '200': {description: The stored inventory, content: {application/json: {schema: {$ref: '#/components/schemas/ActionsState'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {description: GitHub could not be read, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /assets/{id}/links:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: listAssetLinks
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Image-to-source links of an asset
      description: |
        A container image lists the repository it was built from (`direction: out`); a repository, or an uploaded source, lists the images built from it (`direction: in`). A link comes from `source: manual` (set with `POST`) or `oci_label`: the worker reads the image's `org.opencontainers.image.source` label at each assessment and links the image to the GitHub or GitLab repository asset it names when exactly one is known. A label is the publisher's claim, not proof, and a label link that no longer matches the image's current label is removed at its next assessment; a manual link never is. Entries of an image carry `source_repository`. Scope `read` or `write`.
      responses:
        '200': {description: Links, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLinkList'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Assets]
      operationId: addAssetLink
      security: [{bearerAuth: [write]}]
      summary: Link an image to its source
      description: |
        Records that this container image was built from a repository. Name the repository by `to_asset_id`, or by `repository` (`owner/name`, or the GitLab group path; `provider` narrows it when both hosts have that path). The image must be a `container_image` and the target a `github_repo`, `gitlab_repo` or `uploaded` asset. Linking again returns the existing link (`200`). A repository path that matches several assets answers `409`. Audited. Scope `write`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [kind], properties: {kind: {type: string, enum: [built_from], description: 'Link type. Only `built_from`: this asset (an image) was built from the other.'}, to_asset_id: {type: string, format: uuid, description: 'The repository asset the image was built from. Use this or `repository`.'}, repository: {type: string, maxLength: 300, example: acme/api, description: 'Repository locator (`owner/repo`) when you do not have its asset ID.'}, provider: {type: string, enum: [github, gitlab], description: 'Provider of that repository when the locator alone is ambiguous.'}}}, example: {"kind": "built_from", "repository": "acme/api", "provider": "github"}}}
      responses:
        '201': {description: Linked, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLink'}}}}
        '200': {description: Already linked, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLink'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/links/{to}:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: to, in: path, required: true, schema: {type: string, format: uuid}, description: The repository asset the image is linked to}
    delete:
      tags: [Assets]
      operationId: removeAssetLink
      security: [{bearerAuth: [write]}]
      summary: Remove an image-to-source link
      description: Removes the link from this image to that repository, whether it was set by hand or from a label (a label link returns at the next assessment if the label still names it). Audited. Scope `write`.
      parameters: [{name: kind, in: query, schema: {type: string, enum: [built_from], default: built_from}, description: 'Link type to remove. Only `built_from` exists.'}]
      responses:
        '204': {description: Removed}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: listAssetRevisions
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Assessed revisions of an asset
      description: |
        Each revision (ref and commit) with a successful assessment, newest first, described by its newest successful assessment: its verdict, how many assessments covered it, whether it was imported and whether an SBOM exists. Page with `next_before` as `before`. Compare two revisions' components with the assessment ids. Scope `read` or `write`.
      parameters:
        - {name: ref, in: query, schema: {type: string, maxLength: 255}, description: 'Only revisions of this branch or tag.'}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: Only revisions assessed before this time}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: 'Most revisions to return (1 to 200).'}
      responses:
        '200': {description: Revisions, content: {application/json: {schema: {$ref: '#/components/schemas/AssetRevisionPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/sbom-diff:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: diffAssetSBOM
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Compare the packages of two revisions
      description: |
        Compares the components of two successful assessments of the same asset. `from` and `to` each name a revision: a commit or image digest (the newest successful assessment of it is used) or an assessment id of this asset. `GET /assets/{id}/revisions` lists the candidates. Packages are matched by ecosystem and name. `added` and `removed` are packages present on one side only; `changed` have a different set of versions; `license_changed` keep their versions but declare a different licence expression. `unchanged` counts the rest. Each list is cut at `limit` entries (default 500, at most 5000), with `totals` and `truncated` showing what was cut. Scope `read` or `write`.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string}, description: 'Commit, image digest (`sha256:...`) or assessment id'}
        - {name: to, in: query, required: true, schema: {type: string}, description: 'Commit, image digest (`sha256:...`) or assessment id'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 5000, default: 500}, description: 'Most packages to list in each section (1 to 5000). `truncated` says when the list was cut.'}
      responses:
        '200': {description: The differences, content: {application/json: {schema: {$ref: '#/components/schemas/SBOMDiff'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: 'No successful assessment of this asset matches `from` or `to`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/last-known-good:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assets]
      operationId: lastKnownGood
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Last known good revision
      description: Newest `pass` SCRS assessment of a ref with no open integrity finding against it. Imports never count. Use it as the restore target after an incident. Scope `read` or `write`.
      parameters: [{name: ref, in: query, required: true, schema: {type: string}, example: main, description: 'Branch or tag whose newest passing revision you want.'}]
      responses:
        '200':
          description: Revision and its assessment
          content:
            application/json:
              example: {"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "assessment": {"id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "request": {"target": {"type": "git", "repository": "acme/api", "ref": "main"}, "trigger": {"origin": "n8n", "event": "release.requested", "context": {"ticket": "CHG-1042"}}}, "requested_by": "ci-pipeline", "status": "succeeded", "verdict": "fail", "resolved_commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "ref_moved": false, "stages": [{"name": "inventory", "status": "ok"}, {"name": "malware", "status": "ok"}, {"name": "ioc", "status": "ok"}], "counts": {"total": 7, "new": 2, "waived": 0, "critical": 0, "high": 2, "medium": 3, "low": 2}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:33:12Z", "attempts": 1, "sbom_sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "request_id": "req_01HZX3"}}
              schema:
                type: object
                properties:
                  asset_id: {type: string, format: uuid, description: 'Asset.'}
                  ref: {type: string, description: 'Branch or tag looked at.'}
                  commit: {type: string, description: 'Commit SHA of the newest revision that passed.'}
                  assessment: {$ref: '#/components/schemas/Assessment'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /owners:
    get:
      tags: [Assets]
      operationId: listOwners
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List owners
      description: Accountable contacts that assets can reference. Scope `read` or `write`.
      responses:
        '200': {description: Owners, content: {application/json: {example: {"items": [{"id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "name": "Payments platform", "email": "payments@example.com", "team": "Payments", "chat": "#payments-eng", "secondary_contact": "oncall-payments@example.com", "revision": 2}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Owner'}, description: 'Owners.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Assets]
      operationId: createOwner
      security: [{bearerAuth: [write]}]
      summary: Create an owner
      description: Names are unique. Contact fields are excluded from outbound events unless a subscription opts in. Scope `write`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OwnerInput'}, example: {"name": "Payments team", "email": "payments@example.com", "team": "payments", "chat": "#payments-sec"}}}
      responses:
        '201':
          description: Created
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Owner'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /owners/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      tags: [Assets]
      operationId: updateOwner
      security: [{bearerAuth: [write]}]
      summary: Replace an owner's fields
      description: Requires `If-Match` with the owner's revision. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OwnerInput'}, example: {"name": "Payments team", "email": "payments-security@example.com"}}}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Owner'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Mirrors
  /assets/{id}/mirrors:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Mirrors]
      operationId: listMirrors
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List git mirrors of an asset
      description: The 50 newest mirror jobs and bundles, newest first. Bundles beyond `SCRS_MIRROR_KEEP` and older than `SCRS_MIRROR_MIN_AGE_DAYS` show `pruned`; the newest bundle before an open integrity finding is never pruned. Scope `read` or `write`.
      responses:
        '200': {description: Mirrors, content: {application/json: {example: {"items": [{"id": "8a3f5c21-7d94-4b0e-a6f1-2c9d0e1b4a73", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "status": "succeeded", "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "size_bytes": 48211004, "refs": 14, "head": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "error": "", "requested_by": "scrs", "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:31:12Z"}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/Mirror'}, description: 'Mirrors, newest first.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Mirrors]
      operationId: requestMirror
      security: [{bearerAuth: [write]}]
      summary: Mirror a repository now
      description: Queues a git bundle of every branch and tag of a GitHub or GitLab asset. If a mirror is already queued or running, returns it with `200`. Scope `write`.
      responses:
        '202': {description: Mirror queued, content: {application/json: {schema: {$ref: '#/components/schemas/Mirror'}}}}
        '200': {description: A mirror is already in progress, content: {application/json: {schema: {$ref: '#/components/schemas/Mirror'}}}}
        '404': {description: Not an in-scope git repository asset, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/mirrors/{mirror}/bundle:
    parameters:
      - {$ref: '#/components/parameters/Id'}
      - {name: mirror, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      tags: [Mirrors]
      operationId: downloadMirror
      security: [{bearerAuth: [admin]}]
      summary: Download a git bundle
      description: Streams the bundle. Verify it against `X-Content-SHA256`, then restore with `git clone <file>.bundle`. Scope `admin`.
      responses:
        '200':
          description: Git bundle (v2)
          headers: {X-Content-SHA256: {schema: {type: string}, description: SHA-256 recorded when the bundle was stored}}
          content: {application/x-git-bundle: {schema: {type: string, format: binary}}}
        '409': {description: Mirror not succeeded or pruned, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Object store unavailable or object size mismatch, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Assessments
  /assessments:
    post:
      tags: [Assessments]
      operationId: createAssessment
      security: [{bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Trigger an assessment
      description: |
        Queues an assessment of one in-scope asset. This is also the inbound endpoint for automation (n8n, CI, ticketing): use a `trigger` token restricted with `ip_allow_list`, the caller's event id as `Idempotency-Key`, and `trigger.context` for correlation data returned in `assessment.completed`. Git targets resolve `ref` to an immutable commit (or pin `commit`); image targets resolve `ref` (tag) to a manifest digest (or pin `commit` = `sha256:` digest).
        QA is part of the assessment of an asset with an enabled, `auto_run` QA profile: its functional and lint runs are queued when the assessment finishes. Send `skip_qa: true` for a security-only assessment. QA alone, with no assessment, is `POST /assets/{id}/qa/runs` on a profile with `gate: none`.
        Poll `GET /assessments/{id}?wait=30`, or subscribe to `assessment.completed`. Scope `write` or `trigger`.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AssessmentRequest'}
            examples:
              branch: {value: {target: {type: git, repository: acme/api, ref: main}}}
              automation: {value: {target: {type: git, repository: acme/api, ref: main, commit: 0123456789abcdef0123456789abcdef01234567}, trigger: {origin: n8n, event: release.requested, delivery_id: exec-4711, actor: release-bot, context: {ticket: CHG-1042}}}}
              gitlab: {value: {target: {type: git, provider: gitlab, repository: acme/platform/api, ref: main}}}
              pullRequest: {value: {target: {type: git, repository: acme/api, commit: 0123456789abcdef0123456789abcdef01234567, pull_request: {number: 42, base_ref: main}}}}
              image: {value: {target: {type: image, repository: docker.io/acme/api, ref: '1.4.2', platform: linux/amd64}}}
      responses:
        '202':
          description: Queued
          headers:
            Location: {schema: {type: string}}
            Retry-After: {schema: {type: integer}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}
        '200': {description: Idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Asset not discovered or out of scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {description: Idempotency key reused with a different body, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'Several connections match; set `connection`', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      tags: [Assessments]
      operationId: listAssessments
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: List assessments
      description: Newest first, filterable. `trigger`-only tokens see only their own assessments. Scope `read`, `write` or `trigger`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}, description: 'Only entries for this asset (the `id` from `GET /assets`).'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/AssessmentStatus'}, description: 'Only assessments in this state.'}
        - {name: verdict, in: query, schema: {$ref: '#/components/schemas/Verdict'}, description: 'Only assessments with this verdict.'}
        - {name: ref, in: query, schema: {type: string}, description: 'Only assessments of this branch or tag.'}
        - {name: commit, in: query, schema: {type: string}, description: Resolved commit SHA or image digest}
        - {name: actor, in: query, schema: {type: string}, description: Requesting token name}
        - {name: created_after, in: query, schema: {type: string, format: date-time}, description: 'Only assessments created at or after this time (RFC 3339, UTC).'}
        - {name: created_before, in: query, schema: {type: string, format: date-time}, description: 'Only assessments created before this time (RFC 3339, UTC).'}
      responses:
        '200': {description: Page of assessments, content: {application/json: {schema: {$ref: '#/components/schemas/AssessmentPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments:batch:
    post:
      tags: [Assessments]
      operationId: createAssessmentBatch
      security: [{bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Trigger up to 100 assessments
      description: Each item has its own idempotency key and result; one failing item never fails the others. Always `207`. Scope `write` or `trigger`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"items": [{"idempotency_key": "release-1042-api", "request": {"target": {"type": "git", "repository": "acme/api", "ref": "main"}}}, {"idempotency_key": "release-1042-web", "request": {"target": {"type": "git", "repository": "acme/web", "ref": "main"}}}]}
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                items:
                  description: 'Assessment requests, each shaped like the body of `POST /assessments`. Up to the documented batch limit.'
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    additionalProperties: false
                    required: [request]
                    properties:
                      idempotency_key: {type: string, maxLength: 128, description: 'This item''s own idempotency key, so a retry of the batch does not duplicate it.'}
                      request: {$ref: '#/components/schemas/AssessmentRequest'}
      responses:
        '207':
          description: Per-item results
          content:
            application/json:
              example: {"items": [{"index": 0, "status": 202, "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "location": "/assessments/c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44"}, {"index": 1, "status": 400, "error": "target.repository is required"}]}
              schema:
                type: object
                properties:
                  items:
                    description: 'One result per request item, in the same order.'
                    type: array
                    items:
                      type: object
                      properties:
                        index: {type: integer, description: 'Position of the request item, from 0.'}
                        status: {type: integer, description: HTTP status this item would have received}
                        assessment_id: {type: string, format: uuid, description: 'Assessment created, when it was accepted.'}
                        location: {type: string, description: 'Path of the new assessment.'}
                        error: {type: string, description: 'Why the item was rejected. Empty on success.'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/latest:
    get:
      tags: [Assessments]
      operationId: latestAssessment
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Latest assessment for an asset or commit
      description: The newest assessment matching `asset_id`, `repository` and/or `commit`, for example to show a PR or release gate. Scope `read`, `write` or `trigger`.
      parameters:
        - {name: asset_id, in: query, schema: {type: string, format: uuid}, description: 'Asset to look up. Use this or `repository`.'}
        - {name: repository, in: query, schema: {type: string}, description: 'Repository locator (`owner/repo`) to look up. Use this or `asset_id`.'}
        - {name: commit, in: query, schema: {type: string}, description: 'Only the newest assessment of this commit SHA (or image digest).'}
      responses:
        '200': {description: Assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assessments/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Assessments]
      operationId: getAssessment
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Get an assessment
      description: Status, verdict, stage coverage, counts and component diff. With `wait`, holds the request up to that many seconds until the assessment finishes (long-poll). Scope `read`, `write` or `trigger` (own).
      parameters: [{name: wait, in: query, schema: {type: integer, minimum: 0, maximum: 60}, description: 'Seconds (0 to 60) to hold the request open until the assessment finishes. Use it instead of polling in a loop.'}]
      responses:
        '200': {description: Assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Assessments]
      operationId: cancelAssessment
      security: [{bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Cancel a queued or running assessment
      description: Finished assessments cannot be cancelled. Scope `write`, or `trigger` for own assessments.
      responses:
        '204': {description: Cancelled}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Already finished, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
