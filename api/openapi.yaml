      tags: [Assessment results]
      operationId: downloadSBOM
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Download an SBOM
      description: The same export as `GET /assessments/{id}/sbom`, addressed by SBOM digest so a pipeline can fetch the document it recorded. Scope `read` or `write`.
      parameters: [{$ref: '#/components/parameters/SBOMFormat'}]
      responses:
        '200': {$ref: '#/components/responses/SBOM'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: SBOM not available, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Compliance reports (M8)
  /reports/frameworks:
    get:
      tags: [Compliance reports]
      operationId: listFrameworks
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List framework packs
      description: Shipped packs (OWASP Top 10 2021 and 2025, CWE Top 25 2024 and 2025, PCI DSS v4.0.1 requirement 6.3) and uploaded CWE-mapping packs. Each pack names the source of its mapping. Scope `read` or `write`.
      responses:
        '200': {description: Packs, content: {application/json: {example: {"items": [{"id": "owasp-top10-2021", "name": "OWASP Top 10", "version": "2021", "kind": "cwe_mapping", "source": "OWASP", "url": "https://owasp.org/Top10/", "builtin": true, "categories": [{"id": "A03", "name": "Injection", "cwes": [79, 89, 94]}], "type_categories": {"secret": "A02"}, "type_categories_note": "Entry types with no CWE are mapped by type."}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/FrameworkPack'}, description: 'Framework packs.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Compliance reports]
      operationId: uploadFramework
      security: [{bearerAuth: [admin]}]
      summary: Upload a framework pack
      description: Stores or replaces a custom `cwe_mapping` pack validated against `GET /schemas/framework-pack`. Shipped pack ids are reserved. Audited. Scope `admin`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkPack'}}}}
      responses:
        '201': {description: Stored pack, content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkPack'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/frameworks/stig:
    post:
      tags: [Compliance reports]
      operationId: importSTIG
      security: [{bearerAuth: [admin]}]
      summary: Import a DISA STIG benchmark
      description: 'Imports a DISA STIG from its XCCDF benchmark (the `*-xccdf.xml` file, or the zip DISA publishes; at most 40 MiB) as a `stig` pack. Each rule becomes a category keyed by its STIG id, with its CAT severity, vulnerability and rule ids and CCIs. SCRS applies its starter mapping for the Application Security and Development STIG (CWE ids and finding types for the rules its scans can give evidence for); `mapping_unmatched` lists starter entries the benchmark does not contain. Download the pack, adjust the mapping and upload it with `POST /reports/frameworks`. SCRS bundles no DISA content, and reports never mark a rule "Not a Finding". The XML parser resolves no external entities. Audited. Scope `admin`.'
      requestBody:
        required: true
        content:
          application/xml: {schema: {type: string}}
          application/zip: {schema: {type: string, format: binary}}
      responses:
        '201':
          description: Imported pack
          headers: {Location: {schema: {type: string}}}
          content:
            application/json:
              example: {"pack": {"id": "owasp-top10-2021", "name": "OWASP Top 10", "version": "2021", "kind": "cwe_mapping", "source": "OWASP", "url": "https://owasp.org/Top10/", "builtin": true, "categories": [{"id": "A03", "name": "Injection", "cwes": [79, 89, 94]}], "type_categories": {"secret": "A02"}, "type_categories_note": "Entry types with no CWE are mapped by type."}, "rules_mapped": 182, "mapping_unmatched": ["V-999999"]}
              schema:
                type: object
                properties:
                  pack: {$ref: '#/components/schemas/FrameworkPack'}
                  rules_mapped: {type: integer, description: Rules SCRS findings can give evidence for}
                  mapping_unmatched: {type: array, items: {type: string}, description: Starter-mapping STIG ids missing from this benchmark}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '413': {description: Benchmark too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /frameworks/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Compliance reports]
      operationId: getFramework
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Get a framework pack
      description: One shipped or uploaded pack with its categories and CWE ids. Scope `read` or `write`.
      responses:
        '200': {description: Pack, content: {application/json: {schema: {$ref: '#/components/schemas/FrameworkPack'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [Compliance reports]
      operationId: deleteFramework
      security: [{bearerAuth: [admin]}]
      summary: Delete an uploaded pack
      description: Removes an uploaded pack; shipped packs cannot be deleted. Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports:
    get:
      tags: [Compliance reports]
      operationId: listReports
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List evidence reports
      description: Report jobs newest first, 50 per page. Scope `read` or `write`.
      parameters: [{$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Reports, content: {application/json: {example: {"items": [{"id": "b8c0d2e4-1f3a-4b5c-8d7e-9a0b1c2d3e4f", "framework": "owasp-top10-2025", "scope": {"kind": "owner", "id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "name": "Payments team"}, "since": "2026-08-18T00:00:00Z", "until": "2026-11-16T09:30:00Z", "format": "pdf", "status": "succeeded", "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "size": 48213, "data_as_of": "2026-11-16T09:30:00Z", "scrs_version": "1.0.0", "summary": {"assets": 12, "gaps": 2, "findings_considered": 64, "open": 19, "unmapped": 3}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:30:41Z"}], "next_cursor": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/ReportJob'}, description: 'Reports, newest first.'}, next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Compliance reports]
      operationId: createReport
      security: [{bearerAuth: [write]}]
      summary: Request an evidence report
      description: Queues a framework evidence report for one asset, one owner's assets or the portfolio over a window of at most 366 days (default the last 90), as JSON, CSV or Markdown. The worker records the data time, SCRS version, scope, advisory feed freshness and the file's SHA-256, and stores the file in S3 under the `reports` retention class. Reports list assets lacking a recent SBOM, count unmapped findings and contain no compliance verdict. Poll `GET /reports/{id}`. Scope `write`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ReportRequest'}, example: {"framework": "owasp-top10-2021", "scope": {"kind": "portfolio"}, "format": "pdf"}}}}
      responses:
        '202':
          description: Queued
          headers: {Location: {schema: {type: string}}, Retry-After: {schema: {type: integer}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/ReportJob'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Compliance reports]
      operationId: getReport
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Get a report job
      description: Status, data time, SCRS version, feed freshness, summary counts and SHA-256 of one report. `Retry-After` is set while it is queued or running. Scope `read` or `write`.
      responses:
        '200': {description: Report job, content: {application/json: {schema: {$ref: '#/components/schemas/ReportJob'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/{id}/download:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Compliance reports]
      operationId: downloadReport
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Download a report
      description: The report file, integrity-checked against its stored SHA-256 (also in `ETag` and `X-SCRS-Report-SHA256`). Scope `read` or `write`.
      responses:
        '200':
          description: Report file
          headers: {ETag: {schema: {type: string}}, X-SCRS-Report-SHA256: {schema: {type: string}}}
          content:
            application/json: {schema: {$ref: '#/components/schemas/EvidenceReport'}}
            text/csv: {schema: {type: string}}
            text/markdown: {schema: {type: string}}
            application/pdf: {schema: {type: string, format: binary}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Report not ready, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track:
    get:
      tags: [Integrations]
      operationId: getDependencyTrack
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Dependency-Track export settings
      description: The export settings; the API key is write-only (`api_key_set`). Scope `read` or `write`.
      responses:
        '200': {description: Settings, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DTrackSettings'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Integrations]
      operationId: setDependencyTrack
      security: [{bearerAuth: [admin]}]
      summary: Configure the Dependency-Track export
      description: |
        While enabled, every completed scan with an SBOM queues an upload; the worker sends it with `PUT /api/v1/bom` and retries for about two days. The body replaces all settings. Requires `If-Match`. Omit `api_key` to keep the stored one (sealed with the master key). Audited without the key. Scope `admin`.

        **What is uploaded.** The project is `<provider>/<locator>` (`github/org/app`, `image/ghcr.io/org/app`), so equal paths on two providers never share a project. The version is the ref, or the digest for an untagged image. Commit-only and pull request scans are skipped unless `upload_commit_only` or `upload_pull_requests` is set. The default branch is sent as `isLatest`. `tags` replace the tags of every project SCRS uploads to.

        **Findings back** (`import_findings`). About every 30 minutes SCRS reads each project's findings. One that SCRS also reports (same package URL, and the same vulnerability ID or an alias) joins the existing register entry. The rest become report-only `dt_vulnerability` entries that never change a verdict and close when Dependency-Track stops reporting them. See `GET /integrations/dependency-track/findings`.

        **Triage sync** (`sync_triage`, needs `import_findings`). A decision made in the register is written to Dependency-Track as an analysis at the next sync. Dependency-Track's own analysis is imported only while the register entry is `open` and SCRS has written nothing for it: the register wins once it has a decision.

        **API key permissions.** `BOM_UPLOAD` and `PROJECT_CREATION_UPLOAD`; add `VIEW_PORTFOLIO` and `VIEW_VULNERABILITY` for `import_findings`, `VULNERABILITY_ANALYSIS` for `sync_triage` and `PORTFOLIO_MANAGEMENT` for `tags`. `POST /integrations/dependency-track:test` checks the set your settings need.
      parameters: [{name: If-Match, in: header, required: true, schema: {type: string}, description: 'Revision from the last read. Send it back to change the settings; `428` when missing, `409` when stale.'}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"enabled": true, "url": "https://dtrack.example.com", "api_key": "<Dependency-Track API key>", "import_findings": true, "sync_triage": false}
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: {type: boolean, description: 'Upload each SBOM to Dependency-Track.'}
                url: {type: string, maxLength: 500, description: 'Dependency-Track API base URL.'}
                api_key: {type: string, minLength: 16, maxLength: 256, writeOnly: true, description: 'API key. Write-only; leave out to keep the stored one.'}
                parent_uuid: {type: string, format: uuid, description: 'Parent project for projects SCRS creates.'}
                import_findings: {type: boolean, default: false, description: 'Read Dependency-Track''s findings back into the register'}
                sync_triage: {type: boolean, default: false, description: Share triage decisions both ways; needs import_findings}
                upload_pull_requests: {type: boolean, default: false, description: 'Also upload pull request scans, each as its own project version'}
                upload_commit_only: {type: boolean, default: false, description: 'Also upload git scans that have no ref, each commit as its own project version'}
                tags: {type: array, maxItems: 10, items: {type: string, pattern: '^[a-z0-9][a-z0-9._:-]{0,63}$'}, description: 'Tags set on every project SCRS uploads to; needs PORTFOLIO_MANAGEMENT'}
      responses:
        '200': {description: Settings, headers: {ETag: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/DTrackSettings'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {description: Stale revision, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '428': {description: If-Match required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track:test:
    post:
      tags: [Integrations]
      operationId: testDependencyTrack
      security: [{bearerAuth: [admin]}]
      summary: Test the Dependency-Track connection
      description: Reads the server version, then reads the stored key's team permissions (`GET /api/v1/team/self`) and requires the set the current settings need, namely `BOM_UPLOAD` and `PROJECT_CREATION_UPLOAD`, plus `VIEW_PORTFOLIO` and `VIEW_VULNERABILITY` with `import_findings`, `VULNERABILITY_ANALYSIS` with `sync_triage`, and `PORTFOLIO_MANAGEMENT` with `tags`. `ok` is false and `missing_permissions` names what the key's team lacks. A valid key without those permissions is reported here instead of failing its first upload. Without `VIEW_PORTFOLIO` an upload can only end as `unconfirmed`. Sends no SBOM. Scope `admin`.
      responses:
        '200': {description: Result, content: {application/json: {example: {"ok": true, "version": "4.12.0", "permissions": ["BOM_UPLOAD", "PROJECT_CREATION_UPLOAD", "VIEW_PORTFOLIO"], "missing_permissions": [], "required_permissions": ["BOM_UPLOAD", "PROJECT_CREATION_UPLOAD"]}, schema: {type: object, properties: {ok: {type: boolean, description: '`true` when the key works and has the permissions SCRS needs.'}, version: {type: string, description: 'Dependency-Track version.'}, permissions: {type: array, items: {type: string}, description: Permissions of the key's team}, missing_permissions: {type: array, items: {type: string}, description: 'Permissions the key lacks.'}, required_permissions: {type: array, items: {type: string}, description: 'Permissions the enabled features need.'}, error: {type: string, description: 'Why the test failed. Empty on success.'}}}}}}
        '409': {description: No URL or key stored, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track/uploads:
    get:
      tags: [Integrations]
      operationId: listDependencyTrackUploads
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List SBOM uploads
      description: Uploads, newest first; finished ones are kept 90 days. `status` is SCRS's side (queued, sending, uploaded, failed). For an `uploaded` one, `processing` is Dependency-Track's side. Scope `read` or `write`.
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [queued, sending, uploaded, failed]}, description: 'Only uploads in this state.'}
        - {name: cursor, in: query, schema: {type: string, format: uuid}, description: 'Upload ID to continue after. Pass the previous page''s `next_cursor`.'}
      responses:
        '200': {description: Uploads, content: {application/json: {example: {"items": [{"id": "2c8e4a60-9d13-4f57-b0a2-6e1d3c5f7a89", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "project_name": "github/acme/api", "project_version": "main", "status": "uploaded", "attempts": 1, "next_attempt_at": "2026-11-16T09:30:00Z", "token": "2d1f3a4b-5c6d-4e7f-8091-a2b3c4d5e6f7", "error": "", "created_at": "2026-11-16T09:30:00Z", "uploaded_at": "2026-11-16T09:30:04Z", "processing": "processed", "processing_error": "", "processed_at": "2026-11-16T09:30:20Z"}], "next_cursor": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/DTrackUpload'}, description: 'Uploads, newest first.'}, next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track/findings:
    get:
      tags: [Integrations]
      operationId: listDependencyTrackFindings
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Dependency-Track findings and their register entries
      description: |
        What Dependency-Track reported for the projects SCRS uploaded (needs `import_findings`), one row per Dependency-Track finding. `matched` is true when SCRS's own scan reports the same vulnerability on the same package: both findings point at one register entry (`finding_id`), which is how a frontend shows "also found by Dependency-Track". `matched=false` rows are only in Dependency-Track and have their own `dt_vulnerability` register entry. `analyzer` is the Dependency-Track analyzer that found it (for example `TRIVY_ANALYZER` or `OSV_ANALYZER`), and `ids` lists the vulnerability ID and its aliases. `analysis_state` and `suppressed` are Dependency-Track's triage; `pushed_status` is the register status last shared with it. Ordered by `id`; pass `next_cursor` as `cursor`. Scope `read` or `write`.
      parameters:
        - {name: asset_id, in: query, schema: {type: string, format: uuid}, description: 'Only findings of this asset.'}
        - {name: matched, in: query, schema: {type: boolean}, description: '`true` for findings SCRS also has in its register, `false` for those it does not.'}
        - {name: cursor, in: query, schema: {type: string, format: uuid}, description: 'Finding ID to continue after. Pass the previous page''s `next_cursor`.'}
      responses:
        '200': {description: Findings, content: {application/json: {example: {"items": [{"id": "9a1b3c5d-7e2f-4a60-8b4c-0d1e2f3a4b5c", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "project": "github/acme/api", "version": "main", "finding_id": "4f8e2d1c-aaaa-bbbb-cccc-0123456789ab", "matched": false, "vulnerability_id": "GHSA-35jh-r3h4-6jhm", "vulnerability_source": "GITHUB", "analyzer": "OSSINDEX", "ids": ["GHSA-35jh-r3h4-6jhm", "CVE-2021-23337"], "purl": "pkg:npm/lodash@4.17.20", "severity": "high", "analysis_state": "NOT_SET", "suppressed": false, "pushed_status": "", "first_seen": "2026-11-16T09:30:00Z", "last_seen": "2026-11-16T09:30:00Z"}], "next_cursor": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/DTrackFinding'}, description: 'Findings.'}, next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track:sync:
    post:
      tags: [Integrations]
      operationId: syncDependencyTrack
      security: [{bearerAuth: [admin]}]
      summary: Read Dependency-Track findings now
      description: Makes every uploaded project due for a findings sync at once, instead of waiting up to 30 minutes. The worker does the work, so the call returns at once; watch `dependency_track` in `GET /system/status` and `GET /integrations/dependency-track/findings`. Needs `import_findings`. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {example: {"projects_queued": 3}, schema: {type: object, properties: {projects_queued: {type: integer, description: 'Projects queued for a finding sync.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /integrations/dependency-track/uploads/{id}/retry:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Integrations]
      operationId: retryDependencyTrackUpload
      security: [{bearerAuth: [admin]}]
      summary: Retry a failed upload
      description: Requeues a failed upload (for example after fixing the key). Audited. Scope `admin`.
      responses:
        '204': {description: Requeued}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events:
    get:
      tags: [Live events]
      operationId: streamEvents
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Stream live events
      description: 'A `text/event-stream` of notices for committed events: `id` is the event id, `event` its type, `data` a JSON object with id, type, time, connection and asset ids and `refs` (ids to fetch; never evidence or secrets). The stream opens with `ready`, sends a comment heartbeat every 20 s, and ends after 10 minutes with `reconnect` so revoked tokens stop receiving; clients reconnect. Missed events are not replayed: reload state on connect and on `resync`. Platform health arrives as `system.degraded` and `system.recovered` (not tied to a connection, so every stream receives them): on either, call `GET /system/status` for the component detail. Use a client that can send the Authorization header (fetch streaming); tokens never go in the URL. At most 5 streams per token and 200 per API instance (SCRS_EVENTS_STREAMS_PER_TOKEN, SCRS_EVENTS_MAX_STREAMS). Scope `read` or `write`.'
      parameters:
        - {name: types, in: query, description: Comma-separated event types (default all), schema: {type: string, examples: ['assessment.completed,finding.created']}}
      responses:
        '200': {description: Event stream, content: {text/event-stream: {schema: {type: string}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Too many streams or requests, headers: {Retry-After: {schema: {type: integer}}}, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: Live events unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  /schemas/{name}:
    parameters:
      - {name: name, in: path, required: true, schema: {type: string, enum: [license-policy, framework-pack]}}
    get:
      tags: [Licences]
      operationId: getDocumentSchema
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Policy and pack JSON Schemas
      description: JSON Schema (draft 2020-12) of the licence policy (`license-policy`) or of an uploaded framework pack (`framework-pack`). Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: JSON Schema, content: {application/schema+json: {schema: {type: object, description: 'A JSON Schema (draft 2020-12).'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /audit:
    get:
      tags: [Audit and inbound events]
      operationId: listAudit
      security: [{bearerAuth: [admin]}]
      summary: Query the audit log
      description: Audit records newest first, 100 per page (`limit` up to 500). Filter by `action` (exact, or a prefix ending in `*` such as `connection.*`), `target_id`, `actor_id`, `since` and `until` (RFC 3339). Page with `cursor` set to the previous `next_cursor`. Scope `admin`.
      parameters:
        - {name: action, in: query, schema: {type: string}, description: 'Exact action, or a prefix ending in `*` such as `connection.*`.'}
        - {name: target_id, in: query, schema: {type: string, format: uuid}, description: 'Only entries about this ID (asset, token, connection and so on).'}
        - {name: actor_id, in: query, schema: {type: string, format: uuid}, description: 'Only entries made by this token.'}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: 'Only entries from this time on (RFC 3339, UTC).'}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: 'Only entries before this time (RFC 3339, UTC).'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}, description: 'Most entries to return (1 to 500).'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Audit records, content: {application/json: {example: {"items": [{"id": 1042, "occurred_at": "2026-11-16T09:30:00Z", "action": "connection.updated", "target_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "details": {"actor": "admin-console"}}], "next_cursor": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AuditEntry'}, description: 'Entries, newest first.'}, next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /schemas/events:
    get:
      tags: [Webhook subscriptions]
      operationId: listEventSchemas
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: List event schemas
      description: Every outbound event type with its schema versions and links. Payload version is also in the `X-SCRS-Event-Version` header. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: Event types, content: {application/json: {example: {"items": [{"type": "assessment.completed", "versions": [1], "link": "https://scrs.example.com/scrs/v1/schemas/events/assessment.completed/1"}]}, schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {type: {$ref: '#/components/schemas/EventType'}, versions: {type: array, items: {type: integer}, description: 'Schema versions available.'}, link: {type: string, description: 'Path of the newest schema.'}}}, description: 'Event types with published schemas.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /schemas/events/{type}/{version}:
    parameters:
      - {name: type, in: path, required: true, schema: {$ref: '#/components/schemas/EventType'}}
      - {name: version, in: path, required: true, schema: {type: integer}}
    get:
      tags: [Webhook subscriptions]
      operationId: getEventSchema
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}]
      summary: Get one event JSON Schema
      description: The JSON Schema (draft 2020-12) of an event type and version, describing the `event` envelope and `data` (for `assessment.completed`, both the summary and the full/agent context profiles). Data objects allow added properties; a breaking change raises the version. Scope `read`, `write` or `trigger`.
      responses:
        '200': {description: JSON Schema, content: {application/schema+json: {schema: {type: object, description: 'A JSON Schema (draft 2020-12) of one event type and version.'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events/inbound:
    get:
      tags: [Audit and inbound events]
      operationId: listInboundEvents
      security: [{bearerAuth: [admin]}]
      summary: Inbound event log
      description: Raw provider events and triggers SCRS received, newest first. GitLab and registry events are prefixed (`gitlab:push`, `registry:harbor`). Scope `admin`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: actor, in: query, schema: {type: string}, description: 'Only events sent by this user name.'}
        - {name: event_type, in: query, schema: {type: string}, description: 'Only this provider event, for example `push`.'}
      responses:
        '200':
          description: Page of events
          content: {application/json: {example: {"items": [{"id": "f0a2c4e6-8b1d-4357-9a6c-2e4f6b8d0a13", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "mode": "direct", "event_type": "push", "created_at": "2026-11-16T09:30:00Z", "body": {"ref": "refs/heads/main", "repository": {"full_name": "acme/api"}}}], "next_cursor": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/InboundEvent'}, description: 'Events, newest first.'}, next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events/inbound/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Audit and inbound events]
      operationId: getInboundEvent
      security: [{bearerAuth: [admin]}]
      summary: Get an inbound event
      description: 'One stored webhook or registry delivery with its raw body, exactly as received (provider headers are not kept), the assessment it started if any, and how it arrived (`direct` or `relay`). The body can name people and repositories, so it needs `admin`. Replay it with `POST /events/inbound/{id}:replay`. Scope `admin`.'
      responses:
        '200': {description: Event, content: {application/json: {schema: {$ref: '#/components/schemas/InboundEvent'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /events/inbound/{id}:replay:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Audit and inbound events]
      operationId: replayInboundEvent
      security: [{bearerAuth: [admin]}]
      summary: Replay an event's assessment
      description: Queues a new assessment with the original request pinned to the originally resolved revision. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {schema: {$ref: '#/components/schemas/Assessment'}}}}
        '409': {description: Event did not create an assessment, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /settings/retention:
    get:
      tags: [Retention]
      operationId: getRetention
      security: [{bearerAuth: [admin]}]
      summary: Get the retention policy
      description: |
        The policy. `classes` lists every data class: its policy `days` (null = not set), `effective_days` and its `source` (`policy`, or `default` from `SCRS_RETENTION_DEFAULT_<CLASS>_DAYS`), its guard, and the last purge. Zero keeps forever. Open register entries, the current revision of each tracked ref and assets on legal hold are never purged; the audit log keeps at least 365 days. `inbound_event_days` and `webhook_delivery_days` are the original fields for their classes. Scope `admin`.
      responses:
        '200':
          description: Policy
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Retention'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Retention]
      operationId: setRetention
      security: [{bearerAuth: [admin]}]
      summary: Set the retention policy
      description: Applies the given classes atomically and audits old and new values; classes not named keep their setting. Requires `If-Match`. Preview first with `:preview`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"classes": {"closed_findings": 365, "qa_reports": 180}, "inbound_event_days": 30, "webhook_delivery_days": 30}
            schema:
              type: object
              additionalProperties: false
              properties:
                classes: {type: object, additionalProperties: {type: [integer, 'null'], minimum: 0, maximum: 36500}, description: 'Class to days; null = not set (environment default); 0 = keep forever. audit_log needs 0 or at least 365'}
                inbound_event_days: {type: integer, minimum: 0, description: Shorthand for classes.inbound_events}
                webhook_delivery_days: {type: integer, minimum: 0, description: Shorthand for classes.webhook_deliveries}
      responses:
        '200':
          description: Updated
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Retention'}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /settings/retention:preview:
    post:
      tags: [Retention]
      operationId: previewRetention
      security: [{bearerAuth: [admin]}]
      summary: Preview what a retention change deletes
      description: Counts what proposed values would delete now, without deleting. Send `classes` for per-class counts, or `inbound_event_days` for the original rows-and-bytes preview. Scope `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {classes: {type: object, additionalProperties: {type: [integer, 'null']}, description: 'Days to try for each class, keyed by class name. Nothing is deleted.'}, inbound_event_days: {type: integer, minimum: 0, description: 'Days to try for raw inbound events.'}}}, example: {"classes": {"qa_reports": 90}}}}
      responses:
        '200': {description: Counts, content: {application/json: {example: {"classes": {"inbound_events": 128, "closed_findings": 12}, "rows": 140, "bytes": 18433024}, schema: {type: object, properties: {classes: {type: object, additionalProperties: {type: integer}, description: 'What each class would remove.'}, rows: {type: integer, description: 'Records that would be removed.'}, bytes: {type: integer, description: 'Storage that would be freed.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /settings/retention:purge:
    post:
      tags: [Retention]
      operationId: purgeRetention
      security: [{bearerAuth: [admin]}]
      summary: Apply the retention policy now
      description: Purges every class past its effective retention in bounded batches, deletes the purged objects from S3 and audits the counts. Hourly maintenance does the same on schedule. Requires `If-Match` with the policy revision you previewed. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '200': {description: Deleted, content: {application/json: {example: {"deleted_events": 128, "purged": {"closed_findings": 12}}, schema: {type: object, properties: {deleted_events: {type: integer, description: 'Inbound events removed.'}, purged: {type: object, additionalProperties: {type: integer}, description: 'Records removed per class.'}}}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- E2E QA (Karate)
  /assets/{id}/qa/profile:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA setup]
      operationId: getQAProfile
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [qa]}]
      summary: Get a repository's QA profile
      description: 'Returns a repository''s QA settings: where tests run (`base_url`), which Karate suites, which linters (`lint`), whether AI triage is on (`ai_triage`) and the load profile. Secret values are never returned, only their names in `variable_names`. Back office: fill the settings form from this and send the `ETag` back as `If-Match` when saving. `404` means no profile yet, so nothing runs automatically for this repository. Scope `read`, `write` or `qa`.'
      responses:
        '200': {description: Profile, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfile'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [QA setup]
      operationId: putQAProfile
      security: [{bearerAuth: [admin]}]
      summary: Create or replace a repository's QA profile
      description: |
        Creates or replaces the QA settings of a GitHub or GitLab repository. Scope `admin`, because the runner calls `base_url` with these secrets. Replacing an existing profile needs the `ETag` in `If-Match` (`428` without it, `409` if someone changed it first). Omitted fields take defaults; omitting `variables` keeps the stored secrets.

        One profile drives three kinds of run:
        - **Functional**: Karate tests against `base_url`, a deployed staging or preview environment (`test_path`, `tags`, `auth`, and `variables`, the secrets tests receive as `QA_<NAME>`).
        - **Performance**: a load test (`perf`).
        - **Lint**: linters over the assessed commit's source, no deployed target needed (`lint.tools`). Set `functional` to false for a lint-only profile, which needs no `base_url`. Call `GET /qa/runner` first to see which linters the runner has.

        With `auto_run` on, each successful assessment of a matching ref queues the runs. `gate: none` lets QA run without a security assessment (see `POST /assets/{id}/qa/runs`); the default `assessment` keeps the security gate in front of the runner. Add `ai_triage` with an `llm_provider_id` and a model summarises every finished run (see `POST /qa/runs/{id}/triage`).
      parameters: [{name: If-Match, in: header, schema: {type: string}, description: 'Required when the profile exists: its ETag revision'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfileInput'}, examples: {staging: {value: {base_url: 'https://api.staging.example.com', environment: staging, refs: [main, 'release/*'], test_path: karate, openapi_path: api/openapi.yaml, variables: {API_TOKEN: '…'}, auth: {header: Authorization, variable: API_TOKEN, prefix: 'Bearer '}, perf: {features: [perf/browse.feature], users: 20, ramp_seconds: 30, duration_seconds: 120, p95_millis: 800, max_error_percent: 1, auto_run: false}}}, lint_only: {summary: 'Lint and AI triage only, no deployed environment', value: {functional: false, refs: [main], lint: {tools: [ruff, mypy, bandit, eslint]}, ai_triage: true, llm_provider_id: 0e9a8b2c-6f41-4d0e-9c1a-5b7d3f2a1c80}}}}}}
      responses:
        '201': {description: Created, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfile'}}}}
        '200': {description: Replaced, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/QAProfile'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {description: Not an in-scope GitHub or GitLab repository, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '503': {description: Secret encryption unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [QA setup]
      operationId: deleteQAProfile
      security: [{bearerAuth: [admin]}]
      summary: Remove a repository's QA profile
      description: 'Turns QA off for the repository: no more automatic runs. Past runs, reports, register entries and generated test files are kept. To pause without deleting, `PUT` the profile with `enabled: false`. Scope `admin`.'
      responses:
        '204': {description: Removed}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/qa/runs:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA runs]
      operationId: listQARuns
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [qa]}]
      summary: List a repository's QA runs
      description: 'The 50 newest QA runs of the repository (functional, performance and lint), newest first. Filter by `kind` and `status`; page with `before` set to the previous response''s `next_before`. Back office: use it for the run history table, and open one run with `GET /qa/runs/{id}`. Scope `read`, `write` or `qa`.'
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [functional, performance, lint]}, description: 'Only runs of this kind.'}
        - {name: status, in: query, schema: {$ref: '#/components/schemas/QARunStatus'}, description: 'Only runs in this state.'}
        - {name: before, in: query, schema: {type: string, format: date-time}, description: 'Only runs created before this time. Pass the previous page''s `next_before`.'}
      responses:
        '200': {description: Runs, content: {application/json: {example: {"items": [{"id": "6d2f8b40-3a1c-4e97-b5d0-9c7e1a2f4b63", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "assessment_id": null, "kind": "functional", "trigger": "manual", "requested_by": "qa-pipeline", "ref": "main", "commit": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "include_drafts": false, "status": "passed", "attempts": 1, "base_url": "https://api.staging.example.com", "summary": {"features": 12, "scenarios": 48, "passed": 46, "failed": 2, "skipped": 0, "duration_ms": 83210, "karate_version": "1.5.1"}, "coverage": {"total": 120, "covered": 96, "percent": 80, "spec": "api/openapi.yaml", "problems": []}, "report_sha256": "3b7e0c91a5d24f68b1c9e0a7d3f52814c6a9b0e1d2f3a4b5c6d7e8f901a2b3c4", "error": "", "created_at": "2026-11-16T09:30:00Z", "submitted_at": "2026-11-16T09:30:00Z", "started_at": "2026-11-16T09:30:05Z", "completed_at": "2026-11-16T09:31:28Z"}], "next_before": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QARun'}, description: 'Runs, newest first.'}, next_before: {type: string, description: 'Pass as `before` to get older runs. Empty when there are none.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [QA runs]
      operationId: createQARun
      security: [{bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: Run QA tests now
      description: |
        Starts QA now, without waiting for an assessment. The answer is `202` with the run, its `job_id` and `status_url`. Poll `GET /qa/runs/{id}` or subscribe to `qa.completed` and `qa.failed`.

        **`kind`**: `functional` (default), `performance`, `lint` (uses the profile's `lint.tools`) or `full`, which queues every run the profile configures. For `full` the answer is `{runs: [...]}` with the first run's `job_id`.

        **What gets tested** depends on the profile's `gate`:
        - `assessment` (default): the latest successful git assessment, or `assessment_id`. A commit whose verdict is `fail` is refused.
        - `none`: no assessment needed. The run tests the head of `ref` (the default branch when empty) and records the commit it resolved.

        **Errors.**
        - `409`: no enabled profile, no successful assessment (gate `assessment`), or a commit whose verdict is `fail`.
        - `400`: the profile lacks what the run needs (a `base_url`, lint or perf settings), or `ref` is not covered by its `refs`.

        `include_drafts` also runs draft generated features (admin only). A `qa` token is enough for this call and reaches no assessment or setting. Scope `write`, `trigger` or `qa`.
      requestBody: {content: {application/json: {schema: {$ref: '#/components/schemas/QARunRequest'}, examples: {full_without_assessment: {summary: 'Full QA of a branch, no security assessment (profile gate none)', value: {kind: full, ref: main}}, lint_of_assessment: {summary: 'Lint the commit of one assessment', value: {kind: lint, assessment_id: 6f1d8a0e-3c52-4b7e-9a41-0d2e5c7b9f13}}}}}}
      responses:
        '202': {description: 'Queued. A `full` run answers `{runs: [...], job_id, status_url}`.', headers: {Location: {schema: {type: string}}}, content: {application/json: {example: {"runs": [{"id": "6d2f8b40-3a1c-4e97-b5d0-9c7e1a2f4b63", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "assessment_id": null, "kind": "functional", "trigger": "manual", "requested_by": "qa-pipeline", "ref": "main", "commit": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "include_drafts": false, "status": "queued", "attempts": 0, "base_url": "https://api.staging.example.com", "error": "", "created_at": "2026-11-16T09:30:00Z"}], "job_id": "6d2f8b40-3a1c-4e97-b5d0-9c7e1a2f4b63", "status_url": "/jobs/6d2f8b40-3a1c-4e97-b5d0-9c7e1a2f4b63"}, schema: {anyOf: [{$ref: '#/components/schemas/QARun'}, {type: object, properties: {runs: {type: array, items: {$ref: '#/components/schemas/QARun'}, description: 'Every run queued, functional first, then performance and lint.'}, job_id: {type: string, format: uuid, description: 'ID of the first run. Poll `GET /qa/runs/{id}` for each run in `runs`.'}, status_url: {type: string, description: 'Path to poll the first run as a job.'}}}]}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: 'No enabled profile, no successful assessment, or the verdict is fail', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/qa/coverage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA runs]
      operationId: qaCoverageHistory
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [qa]}]
      summary: API coverage history of a repository
      description: Finished functional runs that measured API coverage, oldest first, for a trend chart. Coverage is the share of documented OpenAPI operations that the tests called. Lint and performance runs have none. Scope `read`, `write` or `qa`.
      parameters:
        - {name: ref, in: query, schema: {type: string}, description: 'Only runs of this branch or tag.'}
