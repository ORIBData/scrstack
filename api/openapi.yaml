  # ---------------------------------------------------------------- LLM providers
  /llm/presets:
    get:
      tags: [LLM providers]
      operationId: listLLMPresets
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List supported LLM provider kinds
      description: Each provider kind with its wire protocol (OpenAI chat completions, Anthropic Messages or Gemini generateContent), default inference URL, and whether a base URL or API key is required. Scope `read` or `write`.
      responses:
        '200': {description: Presets, content: {application/json: {example: {"items": [{"kind": "anthropic", "protocol": "anthropic", "base_url": "https://api.anthropic.com", "base_url_required": false, "api_key_optional": false}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/LLMPreset'}, description: 'Known services.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers:
    get:
      tags: [LLM providers]
      operationId: listLLMProviders
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List LLM providers
      description: Configured model endpoints by name. Keys are never returned; `has_api_key` tells whether one is stored. `locality` says whether the provider is `local` (yours) or `hosted`; `source_allowed` says whether it may be sent source code. Scope `read` or `write`.
      responses:
        '200': {description: Providers, content: {application/json: {example: {"items": [{"id": "0e9a8b2c-6f41-4d0e-9c1a-5b7d3f2a1c80", "name": "local-qwen", "kind": "openai_compatible", "base_url": "https://model.example.com/v1", "model": "qwen2.5-coder-32b", "max_tokens": 4096, "temperature": 0.2, "enabled": true, "has_api_key": true, "revision": 2, "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z", "locality": "local", "source_allowed": true, "managed_by_environment": false}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/LLMProvider'}, description: 'Providers.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [LLM providers]
      operationId: createLLMProvider
      security: [{bearerAuth: [admin]}]
      summary: Add an LLM provider
      description: |
        Stores a model endpoint for test generation. `base_url` defaults to the kind's inference URL and can point at a regional endpoint, Azure resource, gateway or self-hosted server (plain http only for hosts in `SCRS_LLM_PRIVATE_HOSTS`). The API key is sealed with `SCRS_MASTER_KEY`. Scope `admin`.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProviderInput'}, examples: {openai: {value: {name: openai-main, kind: openai, model: gpt-5.1, api_key: 'sk-…'}}, anthropic: {value: {name: claude, kind: anthropic, model: claude-sonnet-5-5, max_tokens: 16000, api_key: 'sk-ant-…'}}, azure: {value: {name: azure-eu, kind: azure_openai, base_url: 'https://acme.openai.azure.com/openai/v1', model: gpt-5-deployment, api_key: '…'}}, ollama: {value: {name: local, kind: ollama, base_url: 'http://gpu-box:11434/v1', model: 'qwen3-coder:30b'}}}}}}
      responses:
        '201': {description: Created, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {description: Secret encryption unavailable, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [LLM providers]
      operationId: getLLMProvider
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Get an LLM provider
      description: One provider's settings and last connectivity check. The `ETag` is the revision for `If-Match`. Scope `read` or `write`.
      responses:
        '200': {description: Provider, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [LLM providers]
      operationId: updateLLMProvider
      security: [{bearerAuth: [admin]}]
      summary: Change an LLM provider
      description: Changes the given fields; `api_key` replaces the stored key and an empty string removes it. `clear_temperature` removes a set temperature. The name cannot change. Changing `kind` or `base_url` withdraws a source-code acknowledgement. A provider with `managed_by_environment` accepts only `enabled` (otherwise `409`). Requires `If-Match`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProviderInput'}, example: {"model": "gpt-5.1", "max_tokens": 8192}}}}
      responses:
        '200': {description: Changed, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [LLM providers]
      operationId: deleteLLMProvider
      security: [{bearerAuth: [admin]}]
      summary: Delete an LLM provider
      description: Removes the provider and its key. QA profiles that used it lose their provider; past generations keep its name. A provider with `managed_by_environment` cannot be deleted (`409`); remove it from `SCRS_LLM_PROVIDERS` instead. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers/{id}:allow-source:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [LLM providers]
      operationId: allowLLMProviderSource
      security: [{bearerAuth: [admin]}]
      summary: Allow source code to go to a hosted provider
      description: |
        Records that this **hosted** provider may be sent source code (AI review, unit-test generation). It is the second of two deliberate steps: the platform switch `SCRS_LLM_ALLOW_SOURCE_TO_HOSTED=true` must already be on, or the call answers `409`. A self-hosted provider needs no acknowledgement (`409`). `note` is required: it is the audit record of the decision, for example the agreement that covers the provider. The acknowledgement, who gave it and the note are shown on the provider and written to the audit log; changing the provider's `kind` or `base_url` withdraws it. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              additionalProperties: false
              properties:
                note: {type: string, minLength: 10, maxLength: 500, description: Why this provider may receive source code}
            example: {note: 'Zero-retention agreement signed 2026-11-01, covers source code'}
      responses:
        '200': {description: Acknowledged; `source_allowed` is now true, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'The platform switch is off, or the provider is self-hosted and needs none', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers/{id}:revoke-source:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [LLM providers]
      operationId: revokeLLMProviderSource
      security: [{bearerAuth: [admin]}]
      summary: Withdraw the source-code acknowledgement
      description: Removes the acknowledgement, so a hosted provider is no longer sent source code. Queued reviews that use it fail when the worker reaches them. Scope `admin`.
      responses:
        '200': {description: Withdrawn, content: {application/json: {schema: {$ref: '#/components/schemas/LLMProvider'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /llm/providers/{id}:test:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [LLM providers]
      operationId: testLLMProvider
      security: [{bearerAuth: [admin]}]
      summary: Check an LLM provider
      description: Sends a one-line prompt with the stored settings and key and reports the reply, model, latency and token usage, or the provider's error. The outcome is kept as `last_test_at` and `last_test_error`. Scope `admin`.
      responses:
        '200': {description: The provider answered, content: {application/json: {schema: {$ref: '#/components/schemas/LLMTestResult'}}}}
        '502': {description: The provider failed, content: {application/json: {schema: {$ref: '#/components/schemas/LLMTestResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: SCRS API token. Create with POST /tokens.
  headers:
    ETag:
      description: Resource revision; send back in `If-Match`.
      schema: {type: string, examples: ['"3"']}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}, description: 'ID of the resource in the path, as returned by the list or create call'}
    Cursor: {name: cursor, in: query, schema: {type: string}, description: '`next_cursor` from the previous page'}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 100}, description: 'Most items to return in one page (1 to 500)'}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: 'ETag revision, for example "3"'}
    IdempotencyKey: {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}, description: Replays within 24 h return the original result}
    SBOMFormat: {name: format, in: query, schema: {type: string, enum: [cyclonedx-json, cyclonedx-xml, spdx-json], default: cyclonedx-json}, description: 'SBOM format: CycloneDX 1.6 as JSON (default) or XML, or SPDX 2.3 as JSON'}
    GitHubEvent: {name: X-GitHub-Event, in: header, required: true, schema: {type: string}, description: 'GitHub event name, for example `push` or `pull_request`. Copy it from the original delivery when relaying'}
    GitHubDelivery: {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string, format: uuid}, description: 'GitHub delivery ID. SCRS uses it to recognise a repeated delivery. Copy it from the original delivery when relaying'}
    GitHubSignature: {name: X-Hub-Signature-256, in: header, schema: {type: string}, description: 'sha256=<hex HMAC of the body> (required in direct mode)'}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unauthorized: {description: Missing or invalid bearer token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: Token lacks the required scope, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Not found or not visible to this token, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: Conflicts with current state or revision, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    PreconditionRequired: {description: If-Match header required, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    SBOM:
      description: SBOM document
      headers:
        ETag: {schema: {type: string}, description: SHA-256 of the stored CycloneDX JSON document}
        X-SCRS-Version: {schema: {type: string}}
        X-SCRS-Generated-At: {schema: {type: string, format: date-time}}
      content:
        application/vnd.cyclonedx+json: {schema: {type: object}}
        application/vnd.cyclonedx+xml: {schema: {type: string}}
        application/spdx+json: {schema: {type: object}}
    RateLimited:
      description: Rate or capacity limit; retry after the given seconds
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
  schemas:
    Error:
      description: 'Every error response has this shape.'
      type: object
      example: {"error": "asset not found"}
      required: [error]
      properties: {error: {type: string, description: 'Human-readable reason. Show it to developers, not as a stable code: match on the HTTP status instead.'}}
    Status:
      example: {"status": "ok"}
      description: 'Liveness or readiness answer.'
      type: object
      properties: {status: {type: string, enum: [ok, unavailable], description: '`ok` when the probe passes; `unavailable` when a dependency is down (HTTP 503).'}}
    ComponentStatus:
      description: 'Health of one dependency (database, Redis, scanner, QA runner and so on).'
      type: object
      required: [status, checked_at]
      properties:
        status: {type: string, enum: [ok, degraded, down, not_configured], description: '`ok` healthy; `degraded` working with problems; `down` unreachable; `not_configured` switched off on purpose.'}
        detail: {type: string, description: A short fixed phrase when the component is not ok}
        checked_at: {type: string, format: date-time, description: 'When SCRS last probed it (RFC 3339, UTC).'}
        info: {type: object, additionalProperties: true, description: 'Non-sensitive facts such as analyzer counts, runner slots and queue, or the last worker heartbeat'}
    PlatformStatus:
      description: 'Roll-up of every dependency, for a status page or a back-office banner.'
      type: object
      example: {"status": "degraded", "checked_at": "2026-11-16T09:30:00Z", "components": {"database": {"status": "ok", "checked_at": "2026-11-16T09:30:00Z"}, "redis": {"status": "ok", "checked_at": "2026-11-16T09:30:00Z"}, "worker": {"status": "ok", "checked_at": "2026-11-16T09:30:00Z", "info": {"last_heartbeat": "2026-11-16T09:30:00Z"}}, "clamav": {"status": "degraded", "detail": "signatures older than 48 hours", "checked_at": "2026-11-16T09:30:00Z"}, "qa_runner": {"status": "not_configured", "checked_at": "2026-11-16T09:30:00Z"}}}
      required: [status, checked_at, components]
      properties:
        status: {type: string, enum: [ok, degraded, down], description: 'Worst state of any configured component: `ok`, `degraded` or `down`.'}
        checked_at: {type: string, format: date-time, description: 'When the roll-up was computed (RFC 3339, UTC).'}
        components: {type: object, additionalProperties: {$ref: '#/components/schemas/ComponentStatus'}, description: 'State of each component, keyed by name: `api`, `postgres`, `redis`, `s3`, `scanner`, `sast` and `qa_runner`.'}
    Scope: {type: string, enum: [read, write, trigger, qa, ingest:relay, admin], description: 'A token permission. A token needs any one of the scopes an operation lists; `admin` satisfies all of them.'}
    YaraRulesetInput:
      description: 'Body to create a YARA ruleset.'
      type: object
      required: [name, rules]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: Namespace in findings (`YARA:<name>:<rule>`); cannot change}
        kind: {type: string, enum: [custom, external], default: custom, description: '`custom` rules you write here, or `external` rules imported from a vendor.'}
        description: {type: string, maxLength: 1000, description: 'What the rules detect and where they came from.'}
        mode: {type: string, enum: [hunt, alert, block], default: hunt, description: '`hunt` (default) records matches and never changes a verdict; `alert` gates by severity like a vulnerability; `block` fails the verdict on any match. `alert` and `block` need `admin`.'}
        severity: {type: string, enum: [critical, high, medium, low, info], default: medium, description: Used when a rule has no `severity` meta}
        enabled: {type: boolean, default: true, description: 'Set `false` to keep the ruleset but skip it.'}
        rules: {type: string, maxLength: 16777216, description: 'YARA source text. Compile errors come back as `422` with `diagnostics`.'}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
    YaraRulesetChange:
      description: 'Fields to change on a YARA ruleset; send only what changes.'
      type: object
      additionalProperties: false
      properties:
        description: {type: string, maxLength: 1000, description: 'What the rules detect and where they came from.'}
        mode: {type: string, enum: [hunt, alert, block], description: '`hunt`, `alert` or `block`; `alert` and `block` need `admin`.'}
        severity: {type: string, enum: [critical, high, medium, low, info], description: 'Severity of a match.'}
        enabled: {type: boolean, description: 'Set `false` to skip the ruleset.'}
        rules: {type: string, maxLength: 16777216, description: 'Replacement YARA source; the previous version is replaced.'}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
    IndicatorSourceInput:
      description: 'Body to create a manual indicator source.'
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_]{0,62}$', description: Prefix of finding advisory IDs (`<name>:<indicator id>`); cannot change}
        kind: {type: string, enum: [manual, stix, taxii], default: manual, description: '`manual` sources import SCRS bundles with PUT; `stix` sources import STIX 2.1 with `:import-stix`; `taxii` sources poll a TAXII 2.1 collection (scope `admin`)'}
        description: {type: string, maxLength: 1000, description: 'Where the indicators come from and why they matter.'}
        mode: {type: string, enum: [hunt, alert, block], default: hunt, description: '`hunt` records matches only, `alert` also notifies, `block` fails the assessment verdict.'}
        severity: {type: string, enum: [critical, high, medium, low, info], default: high, description: Severity of `ioc_alert` and `ioc_hunt` findings}
        min_confidence: {type: integer, minimum: 0, maximum: 100, default: 0, description: 'Ignore indicators whose confidence is below this value (0 to 100).'}
        enabled: {type: boolean, default: true, description: 'Set `false` to keep the source but stop matching it.'}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
        taxii: {$ref: '#/components/schemas/TAXIIFeedInput'}
    TAXIIFeedInput:
      type: object
      additionalProperties: false
      description: |
        Required with kind `taxii`. Examples: OpenCTI `auth_type: api_key` with `api_key: "Bearer <token>"`; MISP `api_key`
        with the MISP auth key; vendors often `auth_header: X-API-Key`; CISA AIS a client certificate (`cert_pem`, `key_pem`),
        with `basic` if AIS issued a username. Credential fields are write-only.
      properties:
        api_root: {type: string, format: uri, description: 'TAXII API root, https, ending in /'}
        collection: {type: string, maxLength: 256, description: 'ID of the TAXII collection to read, from the server''s collection list.'}
        auth_type: {type: string, enum: [none, api_key, basic], default: none, description: '`none`, `api_key` (a header value) or `basic` (username and password).'}
        auth_header: {type: string, default: Authorization, description: Header that carries `api_key`}
        api_key: {type: string, writeOnly: true, description: 'Complete value sent in `auth_header`, including any prefix such as `Bearer `. Write-only.'}
        username: {type: string, writeOnly: true, description: 'Username for `basic` auth. Write-only.'}
        password: {type: string, writeOnly: true, description: 'Password for `basic` auth. Write-only.'}
        cert_pem: {type: string, writeOnly: true, description: Client certificate (PEM); works with any auth_type}
        key_pem: {type: string, writeOnly: true, description: Client private key (PEM)}
        ca_pem: {type: string, description: 'CA certificates (PEM) for the server, instead of the system roots'}
        interval_minutes: {type: integer, minimum: 5, maximum: 10080, default: 60, description: 'How often to poll (5 to 10080).'}
        page_size: {type: integer, minimum: 1, maximum: 10000, default: 1000, description: 'Objects requested per poll page (1 to 10000).'}
        valid_days: {type: integer, minimum: 1, maximum: 3650, default: 180, description: Expiry for indicators without valid_until}
        reset_cursor: {type: boolean, description: PATCH only; poll the collection from the start}
    TAXIIFeed:
      example: {"source_id": "a7c1e9d3-2b45-4f08-9c6a-1e3d5f7b9a02", "api_root": "https://taxii.example.com/api/", "collection": "91a7b528-80eb-42ed-a74d-c6fbd5a26116", "auth_type": "api_key", "auth_header": "X-API-Key", "client_cert": false, "ca_pem": "", "interval_minutes": 60, "page_size": 500, "valid_days": 90, "cursor": "2026-11-16T08:00:00Z", "next_poll_at": "2026-11-16T10:30:00Z", "last_poll_at": "2026-11-16T09:30:00Z", "last_success_at": "2026-11-16T09:30:00Z", "last_error": "", "failures": 0, "objects_polled": 1280}
      description: 'A TAXII collection linked to an indicator source, with its polling state.'
      type: object
      properties:
        source_id: {type: string, format: uuid, description: 'The indicator source this feed fills.'}
        api_root: {type: string, description: 'Base URL of the TAXII API root, `https`, ending in `/`.'}
        collection: {type: string, description: 'Collection ID or alias on that API root.'}
        auth_type: {type: string, enum: [none, api_key, basic], description: 'How SCRS authenticates: `none`, `api_key` or `basic`. Secrets are never returned.'}
        auth_header: {type: string, description: 'Header name used for `api_key` auth.'}
        client_cert: {type: boolean, description: '`true` when a client certificate is configured for mutual TLS.'}
        ca_pem: {type: string, description: 'Private CA bundle (PEM) trusted for this server, if one was set.'}
        interval_minutes: {type: integer, description: 'Minutes between polls.'}
        page_size: {type: integer, description: 'Objects requested per page.'}
        valid_days: {type: integer, description: 'Days an indicator stays valid when it has no `valid_until`.'}
        cursor: {type: string, description: 'added_after for the next poll (the last X-TAXII-Date-Added-Last)'}
        next_poll_at: {type: string, format: date-time, description: 'When the next poll is due (RFC 3339, UTC).'}
        last_poll_at: {type: [string, 'null'], format: date-time, description: 'When the last poll started, or `null` before the first.'}
        last_success_at: {type: [string, 'null'], format: date-time, description: 'When a poll last succeeded, or `null`.'}
        last_error: {type: string, description: 'Why the last poll failed. Empty after a success.'}
        failures: {type: integer, description: 'Consecutive failures; the third emits feed.stale'}
        objects_polled: {type: integer, description: 'Total objects read from this collection so far.'}
    IndicatorSourceChange:
      description: 'Fields to change on an indicator source; send only what changes.'
      type: object
      additionalProperties: false
      properties:
        description: {type: string, maxLength: 1000, description: 'Where the indicators come from and why they matter.'}
        mode: {type: string, enum: [hunt, alert, block], description: '`hunt`, `alert` or `block` (`alert` and `block` need `admin`).'}
        severity: {type: string, enum: [critical, high, medium, low, info], description: 'Severity given to a match.'}
        min_confidence: {type: integer, minimum: 0, maximum: 100, description: 'Ignore indicators below this confidence (0 to 100).'}
        enabled: {type: boolean, description: 'Set `false` to stop matching this source.'}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
    STIXBundle:
      description: 'A STIX 2.1 bundle. Only `indicator` objects are read.'
      type: object
      required: [type, id, objects]
      properties:
        type: {type: string, const: bundle, description: 'Always `bundle`.'}
        id: {type: string, pattern: '^bundle--', description: 'Bundle identifier, `bundle--<uuid>`.'}
        objects: {type: array, maxItems: 200000, items: {type: object, description: STIX 2.1 objects; only indicator objects are read}, description: 'The STIX objects. Up to 200000.'}
    STIXImportResult:
      example: {"source": {"id": "a7c1e9d3-2b45-4f08-9c6a-1e3d5f7b9a02", "name": "internal-blocklist", "kind": "manual", "mode": "hunt", "severity": "high", "min_confidence": 50, "enabled": true, "origin": {"vendor": "Security team", "url": "https://intel.example.com", "version": "2026-11", "license": "internal"}, "version": "2026-11-16", "indicator_count": 42, "imported_at": "2026-11-16T09:30:00Z", "yara_ruleset_id": null, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}, "yara_ruleset": {"id": "3c9a1f7e-5d20-4b84-a6e1-0f2b8d4c7a95", "name": "team-rules", "kind": "custom", "mode": "hunt", "severity": "high", "enabled": true, "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "rule_count": 3, "origin": {"vendor": "Security team", "url": "", "version": "", "license": "internal"}, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}, "report": {"objects": 120, "indicators": 80, "imported": 74, "yara_patterns": 2, "partial": 1, "skipped": {"unsupported_pattern": 5, "revoked": 1}, "samples": [{"id": "indicator--1f2e3d4c", "reason": "unsupported_pattern", "detail": "pattern joins observations with FOLLOWEDBY"}]}}
      description: 'What a STIX import created and what it skipped.'
      type: object
      properties:
        source: {$ref: '#/components/schemas/IndicatorSource'}
        yara_ruleset: {oneOf: [{$ref: '#/components/schemas/YaraRuleset'}, {type: 'null'}], description: 'The YARA ruleset built from YARA patterns in the bundle, or `null` when there were none.'}
        report:
          description: 'Counts for the import.'
          type: object
          properties:
            objects: {type: integer, description: 'STIX objects found in the bundle, of every type.'}
            indicators: {type: integer, description: Indicator objects in the bundle}
            imported: {type: integer, description: SCRS indicators produced}
            yara_patterns: {type: integer, description: YARA patterns that compile on their own}
            partial: {type: integer, description: Patterns where only some OR alternatives could be checked}
            skipped:
              type: object
              additionalProperties: {type: integer}
              description: 'Counts by reason: revoked, expired, superseded, unsupported_version, unsupported_pattern_type, combines_observations, time_window, unsupported_object, unsupported_hash, unsupported_operator, unsupported_value, combines_conditions, invalid_pattern, invalid_yara, too_many_yara, duplicate_rule_name, ruleset_full, too_many_indicators'
            samples:
              description: 'Up to a few examples of objects that were skipped.'
              type: array
              maxItems: 50
              items: {type: object, properties: {id: {type: string, description: 'STIX id of the skipped object.'}, reason: {type: string, description: 'Short code for why it was skipped.'}, detail: {type: string, description: 'Explanation of the skip.'}}}
    IndicatorSource:
      example: {"id": "a7c1e9d3-2b45-4f08-9c6a-1e3d5f7b9a02", "name": "internal-blocklist", "kind": "manual", "mode": "hunt", "severity": "high", "min_confidence": 50, "enabled": true, "origin": {"vendor": "Security team", "url": "https://intel.example.com", "version": "2026-11", "license": "internal"}, "version": "2026-11-16", "indicator_count": 42, "imported_at": "2026-11-16T09:30:00Z", "yara_ruleset_id": null, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}
      description: 'A set of indicators of compromise (manual, STIX import or TAXII feed) and how a match is treated.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Indicator source ID, used in `/intel/indicator-sources/{id}`.'}
        name: {type: string, description: 'Unique name of the source.'}
        kind: {type: string, enum: [manual, stix, taxii], description: 'How indicators arrive: `manual`, `stix` (uploaded bundle) or `taxii` (polled feed).'}
        description: {type: string, description: 'Where the indicators come from and why they matter.'}
        mode: {type: string, enum: [hunt, alert, block], description: '`hunt` records matches only, `alert` also notifies, `block` fails the assessment verdict.'}
        severity: {type: string, enum: [critical, high, medium, low, info], description: 'Severity given to a match from this source.'}
        min_confidence: {type: integer, description: 'Indicators below this confidence (0 to 100) are ignored.'}
        enabled: {type: boolean, description: '`false` stops matching without deleting the indicators.'}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
        version: {type: string, description: Version of the last import}
        indicator_count: {type: integer, description: 'Number of indicators currently stored.'}
        imported_at: {type: [string, 'null'], format: date-time, description: 'When the last import finished, or `null`.'}
        yara_ruleset_id: {type: [string, 'null'], format: uuid, description: 'The `stix_<source>` ruleset built from the source''s YARA patterns'}
        taxii: {$ref: '#/components/schemas/TAXIIFeed', description: 'Present for kind `taxii` on list, get and create'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        created_by: {type: [string, 'null'], format: uuid, description: 'Token that created it, or `null`.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        updated_at: {type: string, format: date-time, description: 'When the record last changed (RFC 3339, UTC).'}
    YaraRuleOrigin:
      type: object
      additionalProperties: false
      description: Attribution for third-party packs
      properties:
        vendor: {type: string, maxLength: 100, description: 'Publisher of the rules.'}
        url: {type: string, format: uri, description: 'Where the rules came from (an `https` address).'}
        version: {type: string, maxLength: 100, description: 'Version or release of the rules.'}
        license: {type: string, maxLength: 100, description: 'SPDX identifier, for example DRL-1.1'}
    YaraRuleset:
      example: {"id": "3c9a1f7e-5d20-4b84-a6e1-0f2b8d4c7a95", "name": "team-rules", "kind": "custom", "mode": "hunt", "severity": "high", "enabled": true, "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "rule_count": 3, "origin": {"vendor": "Security team", "url": "", "version": "", "license": "internal"}, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}
      description: 'A set of YARA rules applied to scanned files, with its current mode.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Ruleset ID, used in `/intel/yara-rulesets/{id}`.'}
        name: {type: string, description: 'Unique name shown in lists and findings.'}
        kind: {type: string, enum: [custom, external], description: '`custom` (written here) or `external` (imported).'}
        description: {type: string, description: 'What the rules detect.'}
        mode: {type: string, enum: [hunt, alert, block], description: '`hunt` records matches and never changes a verdict; `alert` gates by severity; `block` fails the verdict on any match.'}
        severity: {type: string, enum: [critical, high, medium, low, info], description: 'Severity of a match.'}
        enabled: {type: boolean, description: '`false` skips the ruleset.'}
        rules: {type: string, description: Present on single-ruleset reads only}
        sha256: {type: string, description: 'SHA-256 of the rule source, to detect changes.'}
        rule_count: {type: integer, description: 'Number of rules in the set.'}
        origin: {$ref: '#/components/schemas/YaraRuleOrigin'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        created_by: {type: [string, 'null'], format: uuid, description: 'Token that created it, or `null`.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        updated_at: {type: string, format: date-time, description: 'When the record last changed (RFC 3339, UTC).'}
    YaraRulesetResult:
      example: {"id": "3c9a1f7e-5d20-4b84-a6e1-0f2b8d4c7a95", "name": "team-rules", "kind": "custom", "mode": "hunt", "severity": "high", "enabled": true, "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "rule_count": 3, "origin": {"vendor": "Security team", "url": "", "version": "", "license": "internal"}, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z", "warnings": [{"level": "warning", "code": "slow_pattern", "message": "This pattern is likely slow: it has no atom of three or more bytes.", "line": 14, "column": 9}]}
      description: 'A saved ruleset together with any compiler warnings.'
      allOf:
        - $ref: '#/components/schemas/YaraRuleset'
        - type: object
          properties:
            warnings: {type: array, items: {$ref: '#/components/schemas/RuleDiagnostic'}, description: 'Non-fatal compiler diagnostics. Fatal ones are returned as `RuleCompileError`.'}
    RuleDiagnostic:
      example: {"level": "warning", "code": "slow_pattern", "message": "This pattern is likely slow: it has no atom of three or more bytes.", "line": 14, "column": 9}
      description: 'One compiler message for YARA rule source.'
      type: object
      properties:
        level: {type: string, enum: [error, warning], description: '`error` blocks saving; `warning` does not.'}
        code: {type: string, description: 'YARA-X code, for example E025 or slow_pattern'}
        message: {type: string, description: 'What the compiler reported.'}
        line: {type: integer, description: 'Line in the rule source, from 1.'}
        column: {type: integer, description: 'Column in that line, from 1.'}
    RuleCompileError:
      description: 'Returned with `422` when YARA rules do not compile.'
      type: object
      properties:
        error: {type: string, description: 'Summary of the failure.'}
        diagnostics: {type: array, items: {$ref: '#/components/schemas/RuleDiagnostic'}, description: 'Each error or warning with its position, to underline in an editor.'}
    GitHubWebhookCheck:
      example: {"connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "connection": "acme-github", "source": "org", "state": "ok", "checked_at": "2026-11-16T09:30:00Z", "last_success_at": "2026-11-16T09:30:00Z", "window_start": "2026-11-15T09:30:00Z", "hooks": 1, "deliveries_scanned": 64, "redelivered": 0, "retrying": 0, "abandoned": 0, "rejected": 0, "problems": []}
      description: 'Result of checking whether GitHub is delivering webhooks to SCRS for one connection.'
      type: object
      properties:
        connection_id: {type: string, format: uuid, description: 'ID of the connection that was checked.'}
        connection: {type: string, description: 'Name of the connection that was checked.'}
        source: {type: string, enum: [app, org], description: 'GitHub App webhook or organization webhook (connection `webhook_source`)'}
        state: {type: string, enum: [unchecked, ok, degraded, failed], description: '`unchecked` not yet run; `ok` deliveries arrive; `degraded` some failed; `failed` none arrive or the check could not run.'}
        checked_at: {type: string, format: date-time, description: 'When the check ran (RFC 3339, UTC).'}
        last_success_at: {type: string, format: date-time, description: 'The next check reads deliveries from here (minus 15 minutes), so failed checks lose nothing'}
        window_start: {type: string, format: date-time, description: 'Start of the delivery window examined (RFC 3339, UTC).'}
        hooks: {type: integer, description: Webhooks pointing at SCRS}
        deliveries_scanned: {type: integer, description: 'Deliveries GitHub reported in that window.'}
        redelivered: {type: integer, description: 'Failed deliveries SCRS asked GitHub to send again.'}
        retrying: {type: integer, description: Failed events waiting for their next redelivery attempt}
        abandoned: {type: integer, description: Events that could not be redelivered; rescan the affected repositories}
        rejected: {type: integer, description: 'Newly seen deliveries SCRS rejected (for example HTTP 401 for a secret mismatch); not redelivered'}
        problems: {type: array, items: {type: string}, description: 'Human-readable issues found.'}
    Token:
      description: 'An API token. The secret is shown once, when it is created, and never again.'
      type: object
      example: {"id": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "name": "frontend-dashboard", "prefix": "scrs_9fK2", "scopes": ["read"], "ip_allow_list": ["203.0.113.0/24"], "expires_at": "2027-02-01T00:00:00Z", "created_at": "2026-11-16T09:30:00Z", "last_used_at": "2026-11-16T09:30:00Z", "revoked_at": null}
      properties:
        id: {type: string, format: uuid, description: 'Token ID, used to revoke it.'}
        name: {type: string, description: 'Name shown in audit logs and as `requested_by` on what the token starts.'}
        prefix: {type: string, description: 'First characters of the secret, for identification'}
        scopes: {type: array, items: {$ref: '#/components/schemas/Scope'}, description: 'Permissions the token holds.'}
        ip_allow_list: {type: array, items: {type: string}, description: 'CIDR ranges that may use it. Empty means any address.'}
        expires_at: {type: [string, 'null'], format: date-time, description: 'When it stops working, or `null` for no expiry.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        last_used_at: {type: [string, 'null'], format: date-time, description: 'When it last authenticated, or `null` if never.'}
        revoked_at: {type: [string, 'null'], format: date-time, description: 'When it was revoked, or `null` while active.'}
    TokenPage:
      example: {"items": [{"id": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "name": "frontend-dashboard", "prefix": "scrs_9fK2", "scopes": ["read"], "ip_allow_list": ["203.0.113.0/24"], "expires_at": "2027-02-01T00:00:00Z", "created_at": "2026-11-16T09:30:00Z", "last_used_at": "2026-11-16T09:30:00Z", "revoked_at": null}], "next_cursor": ""}
      description: 'One page of tokens.'
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Token'}, description: 'Tokens on this page.'}
        next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}
    Provider: {type: string, enum: [github, gitlab, dockerhub, gar, harbor, oci], description: 'Kind of source or registry a connection talks to.'}
    ConnectionScope:
      type: object
      description: 'Which repositories or images a connection may see. Only assets matching `include` and not `exclude` are in scope; everything else is ignored.'
      required: [include]
      properties:
        include: {type: array, maxItems: 100, items: {type: string}, description: 'Locator globs; `/**` matches any depth', example: ['acme/*', 'docker.io/acme/*']}
        exclude: {type: array, items: {type: string}, description: 'Patterns to leave out even when `include` matches, for example `acme/legacy-*`.'}
    ConnectionInput:
      description: 'Body to create a connection to a provider.'
      type: object
      additionalProperties: false
      required: [provider, name, config, scope, credential]
      properties:
        provider: {$ref: '#/components/schemas/Provider'}
        name: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$', maxLength: 100, description: 'Unique name. Used in webhook URLs and event routing.'}
        config: {type: object, description: 'Provider settings that are not secret (organisation, registry URL and so on); the fields depend on `provider`.'}
        scope: {$ref: '#/components/schemas/ConnectionScope'}
        credential: {type: object, description: Encrypted at rest and never returned}
    Connection:
      description: 'A configured link to a provider. Credentials are never returned.'
      type: object
      example: {"id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "provider": "github", "name": "acme-github", "config": {"org": "acme"}, "scope": {"include": ["acme/*"], "exclude": ["acme/archive-*"]}, "status": {"state": "ok", "checked_at": "2026-11-16T09:30:00Z", "counts": {"discovered": 42, "in_scope": 31}}, "enabled": true, "webhook": {"configured": true, "path": "/scrs/v1/ingest/github/acme-github", "rotated_at": "2026-11-16T09:30:00Z"}}
      properties:
        id: {type: string, format: uuid, description: 'Connection ID, used in `/connections/{id}`.'}
        provider: {$ref: '#/components/schemas/Provider'}
        name: {type: string, description: 'Unique name. Also accepted wherever a request names a connection.'}
        config: {type: object, description: 'Non-secret provider settings.'}
        scope: {$ref: '#/components/schemas/ConnectionScope'}
        status: {type: object, description: 'Last check: state (pending, ok, degraded, disabled), checked_at, counts'}
        enabled: {type: boolean, description: '`false` stops discovery and assessments through it.'}
        webhook: {$ref: '#/components/schemas/ConnectionWebhook'}
    ConnectionWebhook:
      type: object
      description: Inbound webhook state of GitHub, GitLab and registry connections. The secret is never returned after it is set
      properties:
        configured: {type: boolean, description: '`true` once a webhook secret has been set.'}
        path: {type: string, examples: ['/scrs/v1/ingest/github/acme-github'], description: 'Path of this connection''s webhook receiver, under `/ingest`.'}
        hook_url: {type: string, description: GitHub only; the public hook URL when GitHub calls a relay rather than path}
        rotated_at: {type: string, format: date-time, description: 'When the secret was last set (RFC 3339, UTC).'}
    AssetType: {type: string, enum: [github_repo, gitlab_repo, container_image, uploaded], description: '`uploaded` is a source archive sent with `POST /uploads`; it belongs to the built-in upload connection and has no repository behind it'}
    Asset:
      description: 'A repository, container image or uploaded archive that SCRS can assess, with its business context.'
      type: object
      example: {"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/api", "connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "flags": {"discovered": true, "manual": false, "accessible": true, "in_scope": true}, "owner_id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "environment": "prod", "criticality": 4, "exposure": "internet", "labels": {"team": "payments"}, "legal_hold": false, "revision": 3}
      properties:
        id: {type: string, format: uuid, description: 'Asset ID. Use it in every `/assets/{id}` path.'}
        type: {$ref: '#/components/schemas/AssetType'}
        locator: {type: string, description: 'owner/repo, group/subgroup/project, or registry/repository', example: acme/api}
        connection_id: {type: string, format: uuid, description: 'Connection it was discovered through.'}
        flags: {type: object, description: 'discovered, accessible, in_scope; manual for assets registered by hand; actions_unused for a GitHub repository whose last Actions check found Actions off or no workflows'}
        owner_id: {type: [string, 'null'], format: uuid, description: 'Owner (`/owners`) responsible for this asset, or `null` when unassigned.'}
        environment: {type: string, enum: ['', dev, stg, prod], description: 'Where the asset runs: `dev`, `stg` or `prod`. Empty means not set.'}
        criticality: {type: integer, minimum: 0, maximum: 5, description: 'Business criticality from 0 (not set) to 5 (most critical). It is context for prioritising and appears in agent and export output.'}
        exposure: {type: string, enum: ['', internet, internal, offline], description: 'How reachable the asset is: `internet`, `internal` or `offline`. Empty means not set.'}
        labels: {type: object, additionalProperties: {type: string}, description: 'Free-form key/value tags (up to 50). The label `mirror=true` opts a repository into scheduled git mirrors.'}
        legal_hold: {type: boolean, description: Excluded from every retention class and from asset_findings resets}
        distribution: {$ref: '#/components/schemas/Distribution'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
    AssetPage:
      description: 'One page of assets.'
      type: object
      example: {"items": [{"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/api", "connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "flags": {"discovered": true, "manual": false, "accessible": true, "in_scope": true}, "owner_id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "environment": "prod", "criticality": 4, "exposure": "internet", "labels": {"team": "payments"}, "legal_hold": false, "revision": 3}], "next_cursor": "eyJsIjoiYWNtZS9hcGkifQ"}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Asset'}, description: 'Assets on this page.'}
        next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}
    AssetCreate:
      description: 'Body to add an asset by hand when discovery has not found it.'
      type: object
      example: {"connection": "acme-github", "locator": "acme/legacy-billing", "owner_id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "environment": "prod", "criticality": 5, "labels": {"team": "billing"}}
      additionalProperties: false
      required: [connection, locator]
      properties:
        connection: {type: string, description: Name of an existing connection}
        locator: {type: string, maxLength: 300, example: org/repo, description: 'Where it lives: `owner/repo` for a repository, an image reference for a container.'}
        type: {type: string, enum: [github_repo, gitlab_repo, container_image], description: Defaults to the connection's own type}
        owner_id: {type: [string, 'null'], format: uuid, description: 'Owner (`/owners`) responsible for this asset, or `null` when unassigned.'}
        environment: {type: string, enum: ['', dev, stg, prod], description: 'Where the asset runs: `dev`, `stg` or `prod`. Empty means not set.'}
        criticality: {type: integer, minimum: 0, maximum: 5, description: 'Business criticality from 0 (not set) to 5 (most critical). It is context for prioritising and appears in agent and export output.'}
        exposure: {type: string, enum: ['', internet, internal, offline], description: 'How reachable the asset is: `internet`, `internal` or `offline`. Empty means not set.'}
        labels: {type: object, maxProperties: 50, additionalProperties: {type: string, maxLength: 256}, description: 'Free-form key/value tags (up to 50). The label `mirror=true` opts a repository into scheduled git mirrors.'}
        legal_hold: {type: boolean, description: 'Keeps the asset out of every retention purge and reset. Needs scope `admin` to set.'}
        distribution: {$ref: '#/components/schemas/Distribution', description: 'How the software reaches users, which picks the licence policy column. Needs scope `admin` to set.'}
    AssetImport:
      description: 'Body to add many assets in one call.'
      type: object
      example: {"connection": "acme-github", "items": [{"locator": "acme/api", "environment": "prod"}, {"locator": "acme/web", "environment": "stg"}, {"locator": ""}]}
      additionalProperties: false
      required: [connection, items]
      properties:
        connection: {type: string, description: 'Connection name or ID that owns them. Needed when several connections could match.'}
        items:
          description: 'Assets to add (up to the documented batch size).'
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required: [locator]
            properties:
              locator: {type: string, maxLength: 300, description: 'Where it lives: `owner/repo` or an image reference.'}
              type: {type: string, enum: [github_repo, gitlab_repo, container_image], description: 'What the asset is: a GitHub repository, a GitLab repository or a container image.'}
              owner_id: {type: [string, 'null'], format: uuid, description: 'Owner (`/owners`) responsible for this asset, or `null` when unassigned.'}
              environment: {type: string, enum: ['', dev, stg, prod], description: 'Where the asset runs: `dev`, `stg` or `prod`. Empty means not set.'}
              criticality: {type: integer, minimum: 0, maximum: 5, description: 'Business criticality from 0 (not set) to 5 (most critical). It is context for prioritising and appears in agent and export output.'}
              exposure: {type: string, enum: ['', internet, internal, offline], description: 'How reachable the asset is: `internet`, `internal` or `offline`. Empty means not set.'}
              labels: {type: object, maxProperties: 50, additionalProperties: {type: string, maxLength: 256}, description: 'Free-form key/value tags (up to 50). The label `mirror=true` opts a repository into scheduled git mirrors.'}
              legal_hold: {type: boolean, description: 'Keeps the asset out of every retention purge. Needs `admin`.'}
              distribution: {$ref: '#/components/schemas/Distribution'}
    AssetImportResult:
      description: 'Outcome of an asset import, one entry per input item in the same order.'
      type: object
      example: {"items": [{"index": 0, "status": "created", "in_scope": true, "asset": {"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/api", "connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "flags": {"discovered": true, "manual": false, "accessible": true, "in_scope": true}, "owner_id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "environment": "prod", "criticality": 4, "exposure": "internet", "labels": {"team": "payments"}, "legal_hold": false, "revision": 3}}, {"index": 1, "status": "exists", "in_scope": true, "asset": {"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/web", "connection_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "flags": {"discovered": true, "manual": false, "accessible": true, "in_scope": true}, "owner_id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "environment": "stg", "criticality": 4, "exposure": "internet", "labels": {"team": "payments"}, "legal_hold": false, "revision": 3}}, {"index": 2, "status": "invalid", "error": "locator is required"}]}
      properties:
        items:
          description: 'One result per item.'
          type: array
          items:
            type: object
            properties:
              index: {type: integer, description: 'Position of the item in the request, from 0.'}
              status: {type: string, enum: [created, exists, invalid], description: '`created` added; `exists` already known; `invalid` rejected, see `error`.'}
              error: {type: string, description: 'Why it was rejected. Empty otherwise.'}
              in_scope: {type: boolean, description: Whether the connection's scope matches the locator}
              asset: {$ref: '#/components/schemas/Asset'}
    AssetLink:
      description: 'A relationship between two assets, for example an image built from a repository.'
      type: object
      example: {"kind": "built_from", "direction": "out", "asset": {"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/api"}, "source": "oci_label", "created_at": "2026-11-17T12:00:00Z"}
      properties:
        kind: {type: string, enum: [built_from], description: 'Relationship type. Only `built_from` exists: this asset was built from the linked one.'}
        direction: {type: string, enum: [out, in], description: '`out`: this asset is the image and the other end is its source. `in`: this asset is the source and the other end is an image built from it'}
        asset:
          description: 'The other asset in the link.'
          type: object
          properties:
            id: {type: string, format: uuid, description: 'ID of the linked asset.'}
            type: {$ref: '#/components/schemas/AssetType'}
            locator: {type: string, description: 'Locator of the linked asset.'}
        source: {type: string, enum: [manual, oci_label], description: '`manual` set through the API, or `oci_label` read from the image''s labels.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
    AssetLinkList:
      example: {"items": [{"kind": "built_from", "direction": "out", "asset": {"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/api"}, "source": "oci_label", "created_at": "2026-11-17T12:00:00Z"}]}
      description: 'Links of one asset.'
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AssetLink'}, description: 'Links of the asset, in both directions (`direction`).'}
    ActionsState:
      description: 'Whether a repository''s GitHub Actions workflows ran recently, to catch workflows that were switched off.'
      type: object
      example: {"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "available": true, "enabled": true, "workflows": [{"id": 1001, "name": "CI", "path": ".github/workflows/ci.yml", "state": "active", "runs": 97, "min_run": 4, "max_run": 104, "missing": [31, 32], "missing_count": 2}], "runs_truncated": false, "checked_at": "2026-11-17T12:00:00Z"}
      properties:
        asset_id: {type: string, format: uuid, description: 'Repository whose GitHub Actions were checked.'}
        available: {type: boolean, description: False when the credential cannot read Actions}
        reason: {type: string, description: 'Why the check did not run, if it did not.'}
        enabled: {type: boolean, description: '`true` when Actions are enabled for the repository.'}
        workflows:
          description: 'Each workflow and how often it ran.'
          type: array
          items:
            type: object
            properties:
              id: {type: integer, description: 'GitHub''s numeric ID of the workflow.'}
              name: {type: string, description: 'Workflow name from its file.'}
              path: {type: string, description: 'Workflow file path in the repository.'}
              state: {type: string, description: 'GitHub workflow state, for example `active`.'}
              runs: {type: integer, description: 'Runs in the checked window.'}
              min_run: {type: integer, description: 'Smallest run number seen.'}
              max_run: {type: integer, description: 'Largest run number seen.'}
              missing: {type: array, items: {type: integer}, description: 'The first 50 run numbers absent between `min_run` and `max_run`; see `missing_count` for the total.'}
              missing_count: {type: integer, description: 'Run numbers absent between the smallest and largest. A gap can mean runs were deleted.'}
        runs_truncated: {type: boolean, description: A workflow has more runs than were read; only the newest are checked}
        error: {type: string, description: 'Why the check failed, if it did.'}
        checked_at: {type: string, format: date-time, description: 'When it ran (RFC 3339, UTC).'}
    IncidentRequest:
      description: 'Body to open an incident review of what given accounts did to your repositories.'
      type: object
      additionalProperties: false
      required: [actors, since]
      example: {"title": "Suspected token theft, mallory", "actors": ["mallory"], "since": "2026-11-10T00:00:00Z"}
      properties:
        title: {type: string, maxLength: 200, description: 'Short name for the incident.'}
        actors: {type: array, minItems: 1, maxItems: 20, items: {type: string, maxLength: 100}, description: 'GitHub or GitLab usernames to look into.'}
        since: {type: string, format: date-time, description: 'Look at activity from this time onward (RFC 3339, UTC).'}
        until: {type: string, format: date-time, description: 'Look at activity up to this time (RFC 3339, UTC). Defaults to now.'}
        reassess: {type: boolean, default: true, description: 'Queue new assessments of the commits those accounts touched.'}
        max_reassess: {type: integer, minimum: 1, maximum: 200, default: 50, description: 'Most assessments to queue (1 to 200).'}
    Incident:
      description: 'An incident review: what the named accounts touched since a time, and the assessments queued to recheck it.'
      type: object
      example: {"id": "e5a1c0de-7b42-4d3f-9a6e-0c8f1d2b3a47", "title": "Suspected token theft, mallory", "actors": ["mallory"], "since": "2026-11-10T00:00:00Z", "until": "2026-11-17T12:00:00Z", "created_by": "ir-lead", "created_at": "2026-11-17T12:00:00Z", "report": {"touched": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "verdict": "warn", "actor": "mallory", "at": "2026-11-16T09:30:00Z"}], "signals": [{"kind": "force_push", "severity": "high", "repository": "acme/api", "ref": "refs/heads/main", "actor": "mallory", "at": "2026-11-16T09:29:50Z"}], "branches": [], "pull_requests": [], "changes": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "advisory_id": "SCRS-WORKFLOW-CHANGE", "title": "Workflow file changed since prior assessed revision", "severity": "high", "path": ".github/workflows/ci.yml"}], "recovery": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "ref": "main", "last_known_good": {"commit": "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "assessment_id": "d4f6b8a0-2c1e-4a73-9b5d-8e0f1a2c3b66", "at": "2026-11-02T14:02:40Z"}, "mirrors": []}], "truncated": []}, "reassessments": [], "actors_note": "Actors are the identities named in provider events and in trigger.actor: claims, not verified identities."}
      properties:
        id: {type: string, format: uuid, description: 'Incident ID, used in `GET /incidents/{id}`.'}
        title: {type: string, description: 'Name given when the incident was created.'}
        actors: {type: array, items: {type: string}, description: 'Logins of the accounts that were reviewed.'}
        since: {type: string, format: date-time, description: 'Start of the activity window (RFC 3339, UTC).'}
        until: {type: string, format: date-time, description: 'End of the activity window (RFC 3339, UTC).'}
        created_by: {type: string, description: Name of the admin token}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        report:
          type: object
          description: Absent from the list. Each list holds at most 500 entries.
          properties:
            touched: {type: array, items: {type: object, properties: {asset_id: {type: string, format: uuid, description: 'Repository the account touched.'}, locator: {type: string, description: 'Name of that repository, for example `acme/api`.'}, ref: {type: string, description: 'Branch or tag it touched.'}, commit: {type: string, description: 'Commit it touched.'}, assessment_id: {type: string, format: uuid, description: 'Assessment of that commit.'}, verdict: {type: string, description: 'Verdict of that assessment.'}, actor: {type: string, description: 'Account that pushed it.'}, at: {type: string, format: date-time, description: 'When (RFC 3339, UTC).'}}}, description: 'Commits and refs the actors pushed to.'}
            signals: {type: array, items: {type: object, properties: {kind: {type: string, description: 'Signal type, for example `run_number_gap` or `actions_workflows_changed`.'}, severity: {type: string, description: 'Severity of the integrity signal.'}, repository: {type: string, description: 'Repository the signal is about.'}, ref: {type: string, description: 'Branch or tag the signal is about.'}, commit: {type: string, description: 'Commit that raised the signal.'}, actor: {type: string, description: 'Account that made the change, as the event claimed (never verified).'}, at: {type: string, format: date-time, description: 'When (RFC 3339, UTC).'}}}, description: 'Integrity signals raised for the actors.'}
            branches: {type: array, items: {type: object, properties: {repository: {type: string, description: 'Repository the branch event happened in.'}, ref: {type: string, description: 'Branch or tag that was created, changed or deleted.'}, event: {type: string, description: 'What happened (created, deleted).'}, actor: {type: string, description: 'Account that did it, as the provider reported it.'}, at: {type: string, format: date-time, description: 'When (RFC 3339, UTC).'}}}, description: 'Branch or tag creations and deletions.'}
            pull_requests: {type: array, items: {type: object, properties: {repository: {type: string, description: 'Repository the pull request belongs to.'}, ref: {type: string, description: 'Head branch of the pull request.'}, number: {type: integer, description: 'Pull request number.'}, title: {type: string, description: 'Pull request title as the provider sent it. Treat it as untrusted text.'}, event: {type: string, description: 'What happened (opened, merged and so on).'}, actor: {type: string, description: 'Account that opened or changed it, as the provider reported it.'}, at: {type: string, format: date-time, description: 'When (RFC 3339, UTC).'}}}, description: 'Pull requests the actors opened or changed.'}
            changes: {type: array, items: {type: object, properties: {asset_id: {type: string, format: uuid, description: 'Repository the finding is in.'}, locator: {type: string, description: 'Name of that repository, for example `acme/api`.'}, commit: {type: string, description: 'Commit in which the finding appeared.'}, assessment_id: {type: string, format: uuid, description: 'Assessment that found it.'}, advisory_id: {type: string, description: 'Advisory or rule ID.'}, title: {type: string, description: 'Title of the finding.'}, severity: {type: string, description: 'Severity of the finding.'}, path: {type: string, description: 'File or package path where it was found.'}}}, description: 'Findings that appeared in commits the actors touched.'}
            recovery: {type: array, items: {type: object, properties: {asset_id: {type: string, format: uuid, description: 'Repository that can be restored.'}, locator: {type: string, description: 'Name of that repository, for example `acme/api`.'}, ref: {type: string, description: 'Branch or tag to restore.'}, last_known_good: {type: [object, 'null'], properties: {commit: {type: string, description: 'Newest commit whose assessment did not fail.'}, assessment_id: {type: string, format: uuid, description: 'Assessment of that commit.'}, at: {type: string, format: date-time, description: 'When it was assessed (RFC 3339, UTC).'}}, description: 'Newest assessed revision that passed before the incident, or `null`.'}, mirrors: {type: array, items: {type: object, properties: {id: {type: string, format: uuid, description: 'Mirror ID. Download it with `GET /assets/{id}/mirrors/{mirror}/bundle`.'}, created_at: {type: string, format: date-time, description: 'When the mirror was taken (RFC 3339, UTC).'}, head: {type: string, description: 'Commit at the mirror''s head.'}, size_bytes: {type: integer, description: 'Bundle size in bytes.'}}}, description: 'Git mirrors that could restore the repository.'}}}, description: 'Restore points per repository.'}
            truncated: {type: array, items: {type: string}, description: Names of the lists that were cut at 500}
        reassessments: {type: array, items: {type: object, properties: {assessment_id: {type: string, format: uuid, description: 'Assessment queued by this incident.'}, asset_id: {type: string, format: uuid, description: 'Repository that assessment covers.'}, commit: {type: string, description: 'Commit that assessment covers.'}, ref: {type: string, description: 'Branch or tag that assessment covers.'}, status: {type: string, description: 'Current status of that assessment (`queued`, `running`, `succeeded`, `failed` or `cancelled`).'}, verdict: {type: string, description: 'Verdict once finished, empty before.'}}}, description: 'Assessments queued to recheck touched commits.'}
        reassessment_counts: {type: object, additionalProperties: {type: integer}, description: 'Number of reassessments by status.'}
        actors_note: {type: string, description: 'Caveat about matching accounts, for example that usernames can be renamed.'}
    IncidentPage:
      example: {"items": [{"id": "e5a1c0de-7b42-4d3f-9a6e-0c8f1d2b3a47", "title": "Suspected token theft, mallory", "actors": ["mallory"], "since": "2026-11-10T00:00:00Z", "until": "2026-11-17T12:00:00Z", "created_by": "ir-lead", "created_at": "2026-11-17T12:00:00Z", "report": {"touched": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "verdict": "warn", "actor": "mallory", "at": "2026-11-16T09:30:00Z"}], "signals": [{"kind": "force_push", "severity": "high", "repository": "acme/api", "ref": "refs/heads/main", "actor": "mallory", "at": "2026-11-16T09:29:50Z"}], "branches": [], "pull_requests": [], "changes": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "advisory_id": "SCRS-WORKFLOW-CHANGE", "title": "Workflow file changed since prior assessed revision", "severity": "high", "path": ".github/workflows/ci.yml"}], "recovery": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "ref": "main", "last_known_good": {"commit": "a1b2c3d4e5f60718293a4b5c6d7e8f9012345678", "assessment_id": "d4f6b8a0-2c1e-4a73-9b5d-8e0f1a2c3b66", "at": "2026-11-02T14:02:40Z"}, "mirrors": []}], "truncated": []}, "reassessments": [], "actors_note": "Actors are the identities named in provider events and in trigger.actor: claims, not verified identities."}], "next_cursor": ""}
      description: 'One page of incidents.'
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Incident'}, description: 'Incidents on this page.'}
        next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}
    IntegrityPolicy:
      description: 'Which repository-integrity signals raise findings.'
      type: object
      example: {"revision": 2, "author_new_days": 60, "off_hours": true, "pusher_differs": false, "large_file_bytes": 5242880, "ci_growth_bytes": 20480, "updated_at": "2026-11-16T09:30:00Z"}
      properties:
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        author_new_days: {type: integer, minimum: 0, maximum: 3650, description: 0 turns the check off}
        off_hours: {type: boolean, description: 'Flag a push at an hour that author rarely pushes at, once they have enough recorded pushes.'}
        pusher_differs: {type: boolean, description: 'Flag a push whose pusher is not the commit author.'}
        large_file_bytes: {type: integer, minimum: 0, maximum: 1073741824, description: 0 turns the check off}
        ci_growth_bytes: {type: integer, minimum: 0, maximum: 1073741824, description: 0 turns the check off}
        updated_at: {type: [string, 'null'], format: date-time, description: 'When the policy last changed, or `null` if never set.'}
    DependencyPolicy:
      description: 'Which dependency-hygiene checks raise findings.'
      type: object
      example: {"revision": 3, "min_release_age_days": 7, "typosquat": true, "updated_at": "2026-11-16T09:30:00Z"}
      properties:
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        min_release_age_days: {type: integer, minimum: 0, maximum: 365, description: 'Flag a package version published fewer than this many days ago (0 turns it off, maximum 365).'}
        typosquat: {type: boolean, description: 'Flag a package name that is one edit away from a popular package. A legitimate neighbour can trigger it.'}
        updated_at: {type: [string, 'null'], format: date-time, description: 'When the policy last changed, or `null` if never set.'}
    Comment:
      description: 'A note on a register entry.'
      type: object
      example: {"id": "7d1e5c2a-9b34-4f68-8a0d-3c5b7e9f1a24", "finding_id": "9a4d2e71-5c08-4f3b-a6d9-0e8b1c7f2a35", "author": "frontend-dashboard", "on_behalf_of": "alex@example.com", "body": "Waiting on the vendor patch; revisit Friday", "created_at": "2026-11-16T09:30:00Z"}
