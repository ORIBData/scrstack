        connection check failed. `maintenance.completed`: scheduled maintenance ran. `qa.completed`, `qa.failed`: an E2E QA run finished.
        `dependency_track.upload_failed`: an SBOM upload to Dependency-Track was rejected for good, or Dependency-Track accepted it but did not import it (`stage` is `upload` or `processing`).
        `system.degraded`: the platform status (see `GET /system/status`) left `ok` or changed between `degraded` and `down`; lists the
        failing components. `system.recovered`: the status returned to `ok`, with how long it was not ok. `ping`: sent by a webhook test.
