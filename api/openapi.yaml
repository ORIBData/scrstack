            signals: {type: array, items: {type: object, properties: {kind: {type: string}, severity: {type: string}, repository: {type: string}, ref: {type: string}, commit: {type: string}, actor: {type: string}, at: {type: string, format: date-time}}}}
            branches: {type: array, items: {type: object, properties: {repository: {type: string}, ref: {type: string}, event: {type: string}, actor: {type: string}, at: {type: string, format: date-time}}}}
