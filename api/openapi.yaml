      properties:
        id: {type: string, format: uuid, description: 'Job ID, the same as the resource it created.'}
        kind: {type: string, enum: [assessment, qa_run, qa_generation, ai_summary, ai_review, report, mirror, dependency_track_upload], description: 'What kind of work: `assessment`, `qa_run`, `qa_generation`, `ai_summary`, `ai_review`, `report`, `mirror` or `dependency_track_upload`.'}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled], description: Normalised across kinds}
        state: {type: string, description: 'The kind''s own status, for example `passed` for a QA run or `uploaded` for a Dependency-Track upload'}
