      summary: Enable, disable or reschedule a source
      description: Changes `enabled` or `schedule_minutes` (15 to 10080) of a worker-synced source (`nvd`, `cve_program`). Enabling a licence-restricted source needs `acknowledge_terms` set to true. Every change is audited. Sources downloaded by `scrs-feed-sync` answer `409`. Requires `If-Match`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {enabled: {type: boolean, description: '`false` stops syncing the feed.'}, schedule_minutes: {type: integer, minimum: 15, maximum: 10080, description: 'Minutes between syncs (15 to 10080).'}, acknowledge_terms: {type: boolean, description: 'Set `true` to accept the terms of a licence-restricted feed. Needed to enable one.'}}}, example: {"enabled": true, "schedule_minutes": 360, "acknowledge_terms": true}}}}
      responses:
        '200': {description: Changed, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilitySource'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'Stale revision, managed by feed-sync, or terms not acknowledged', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerability-sources/{key}:sync:
    parameters: [{name: key, in: path, required: true, schema: {type: string}}]
    post:
      tags: [Vulnerability data and VEX]
      operationId: syncVulnerabilitySource
      security: [{bearerAuth: [admin]}]
      summary: Sync an advisory source now
      description: Makes a worker-synced source (`nvd`, `cve_program`) due now. Set `SCRS_NVD_API_KEY` on the worker for the NVD's higher rate limit. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {example: {"queued": true}, schema: {type: object, properties: {queued: {type: boolean, description: '`true` when a sync was queued.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Managed by scrs-feed-sync, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerabilities/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'CVE, GHSA or other advisory id'}
    get:
      tags: [Vulnerability data and VEX]
      operationId: getVulnerability
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Everything known about a vulnerability
      description: |
        The vulnerability's records from every synced origin in OSV schema (`nvd`, `cve5`), each with the original kept verbatim server-side; every CVSS vector and score offered with its source (`severity_sources`); CWEs; and vendor statements from imported VEX documents, filtered to a product with `purl` (a statement without a version applies to every version). Statements are attributed inputs and never close a finding. Scope `read` or `write`.
      parameters: [{name: purl, in: query, schema: {type: string}, description: 'Show only the affected ranges for this package URL.'}]
      responses:
        '200':
          description: Vulnerability
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VulnerabilityDetail'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /advisories:
    get:
      tags: [Vulnerability data and VEX]
      operationId: searchAdvisories
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Search advisories
      description: |
        Searches every synced advisory (`nvd`, `cve5`, `local`) by id, alias, summary or details (`q`, a case-insensitive substring; `%` and `_` match themselves), and filters by origin, affected ecosystem and package (exact, case-insensitive), alias, withdrawn state and modification time. Ordered by id then origin; pass `next_cursor` as `cursor`. Results are summaries: read one in full with `GET /advisories/{id}`. Scope `read` or `write`.
      parameters:
        - {name: q, in: query, schema: {type: string, maxLength: 100}, description: 'Text to search for in advisory IDs, aliases and summaries (up to 100 characters).'}
        - {name: origin, in: query, schema: {type: string, enum: [nvd, cve5, local]}, description: 'Only advisories from this feed: `nvd`, `cve5` or `local`.'}
        - {name: ecosystem, in: query, schema: {type: string}, example: npm, description: 'Only advisories for packages of this ecosystem, for example `npm`.'}
        - {name: package, in: query, schema: {type: string}, description: 'Only advisories for this package name.'}
        - {name: alias, in: query, schema: {type: string}, description: 'An id the advisory is also known by, for example a CVE'}
        - {name: withdrawn, in: query, schema: {type: boolean}, description: '`true` for withdrawn advisories only, `false` to hide them.'}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: Modified at or after}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: 'Most advisories to return (1 to 200).'}
        - {name: cursor, in: query, schema: {type: string}, description: 'Page marker. Pass the `next_cursor` of the previous page; leave out for the first page.'}
      responses:
        '200': {description: Page of advisories, content: {application/json: {schema: {$ref: '#/components/schemas/AdvisoryPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Vulnerability data and VEX]
      operationId: createLocalAdvisory
      security: [{bearerAuth: [write]}]
      summary: Create a local advisory
      description: |
        Writes an OSV 1.9.2 record for something no public database knows, such as an internal package found compromised. SCRS assigns the id `x_SCRS-<year>-<number>` (the `x_` prefix marks a local database). Audited. Scope `write`.

        **Affected packages.** Per package give one of: `versions` (exact versions, any ecosystem), `ranges` (`introduced`, then `fixed` or `last_affected`; semantic versioning only: npm, Go, crates.io, NuGet, Hex, Pub) or `all_versions: true`. A name matches ignoring case, and PyPI names also ignore `-`, `_` and `.`. A reference needs an OSV type and an http or https URL.

        **What it opens.** At creation the advisory is matched against the newest inventory of every asset and ref, with no rescan, and every later assessment matches it too. `malicious: true` raises critical `malicious_dependency` entries that fail the verdict and emit `malicious_dependency.reported`. Otherwise `rating` (default high) sets the severity of a `vulnerability` entry. Entries close when a scan no longer finds the component, and at once when the advisory is withdrawn.

        The response is the stored record plus `register_entries_opened`. It is searchable in `GET /intel/vulnerabilities/{id}`, and `GET /advisories/{id}/affected` lists what matches now.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/LocalAdvisoryInput'}, example: {"summary": "Compromised release of acme-utils", "details": "Versions 2.3.0 and 2.3.1 contain a credential stealer.", "severity": [{"type": "CVSS_V3", "score": "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"}], "affected": [{"package": {"ecosystem": "npm", "name": "acme-utils"}, "versions": ["2.3.0", "2.3.1"]}], "malicious": true, "rating": "critical", "references": [{"type": "ADVISORY", "url": "https://example.com/advisory/acme-utils"}]}}}
      responses:
        '201':
          description: The stored OSV record
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {example: {"schema_version": "1.9.2", "id": "x_SCRS-2026-0001", "modified": "2026-11-16T09:30:00Z", "published": "2026-11-16T09:30:00Z", "summary": "Internal package acme-utils 2.3.1 published with a backdoor", "details": "Version 2.3.1 was published from a compromised account. Upgrade to 2.3.2.", "affected": [{"package": {"ecosystem": "npm", "name": "acme-utils"}, "versions": ["2.3.1"]}], "references": [{"type": "ADVISORY", "url": "https://intel.example.com/INC-2291"}], "register_entries_opened": 2}, schema: {type: object, description: 'The stored advisory as an OSV 1.9.2 record, with the ID SCRS assigned (`x_SCRS-<year>-<number>`).'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /advisories/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'CVE, GHSA or local `x_SCRS-` id'}
    get:
      tags: [Vulnerability data and VEX]
      operationId: getAdvisory
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Read one advisory
      description: |
        The same view as `GET /intel/vulnerabilities/{id}`: the records of every origin, severity sources, CWEs and vendor statements. Scope `read` or `write`.
      parameters: [{name: purl, in: query, schema: {type: string}, description: 'Show only the affected ranges for this package URL.'}]
      responses:
        '200': {description: Advisory, content: {application/json: {schema: {$ref: '#/components/schemas/VulnerabilityDetail'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /advisories/{id}:withdraw:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'A local `x_SCRS-` id'}
    post:
      tags: [Vulnerability data and VEX]
      operationId: withdrawLocalAdvisory
      security: [{bearerAuth: [write]}]
      summary: Withdraw a local advisory
      description: Marks a local advisory withdrawn with a reason (8 to 1000 characters). The record is kept and audited, its open register entries are closed (`fixed`, with an `advisory_withdrawn` event in each history) and the response carries `register_entries_closed`. Only local advisories can be withdrawn; public records are managed by their source. Scope `write`.
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 8, maxLength: 1000, description: 'Why the advisory is withdrawn. Stored with it.'}}}, example: {"reason": "False alarm: the published versions were clean."}}}
      responses:
        '200': {description: The withdrawn record, content: {application/json: {example: {"schema_version": "1.9.2", "id": "x_SCRS-2026-0001", "modified": "2026-11-16T09:30:00Z", "withdrawn": "2026-11-16T09:30:00Z", "summary": "Internal package acme-utils 2.3.1 published with a backdoor", "affected": [{"package": {"ecosystem": "npm", "name": "acme-utils"}, "versions": ["2.3.1"]}]}, schema: {type: object, description: 'The withdrawn OSV record, plus `register_entries_closed`: how many open register entries were closed.'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /advisories/{id}/affected:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'A local `x_SCRS-` id'}
    get:
      tags: [Vulnerability data and VEX]
      operationId: listAdvisoryAffected
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Components a local advisory names
      description: |
        For a local advisory that is not withdrawn, the components in the newest successful assessment of each asset and ref whose ecosystem, name and version match an affected package, version or range (at most 1000 rows; `truncated` says when more exist). It reads stored inventories: nothing is rescanned. The register entries for these components are opened when the advisory is created and at each later assessment. Scope `read` or `write`.
      responses:
        '200': {description: Matching components, content: {application/json: {schema: {$ref: '#/components/schemas/AdvisoryAffected'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vex-documents:
    get:
      tags: [Vulnerability data and VEX]
      operationId: listVEXDocuments
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List imported VEX documents
      description: Imported OpenVEX, CycloneDX VEX and CSAF documents, newest first, with publisher, statement count and digest. Scope `read` or `write`.
      responses:
        '200': {description: Documents, content: {application/json: {example: {"items": [{"id": "6b2d8f10-4c37-4a95-8e1d-9a0c7f3e5b24", "publisher": "Acme PSIRT", "issued_at": "2026-11-16T09:30:00Z", "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "statements": 18, "imported_by": "ci-pipeline", "imported_at": "2026-11-16T09:30:00Z"}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/VEXDocument'}, description: 'Imported documents.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Vulnerability data and VEX]
      operationId: importVEX
      security: [{bearerAuth: [write]}]
      summary: Import a VEX document
      description: |
        Stores the vendor and maintainer statements of an OpenVEX, CycloneDX VEX or CSAF 2.0 (`csaf_vex` or `csaf_security_advisory`) document, one per vulnerability and product (purl, or product name when the document gives none). CycloneDX analysis states map to `not_affected`, `affected`, `fixed` and `under_investigation`. The same document (by SHA-256) imported twice is `409`. Up to 16 MiB and 20000 statements. Scope `write`.
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        '201': {description: Imported, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/VEXDocument'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {description: Already imported, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Over 16 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vex-documents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      tags: [Vulnerability data and VEX]
      operationId: deleteVEXDocument
      security: [{bearerAuth: [admin]}]
      summary: Delete a VEX document
      description: Removes the document and its statements. Audited. Scope `admin`.
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vex-statements:
    get:
      tags: [Vulnerability data and VEX]
      operationId: listVendorStatements
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Find vendor statements
      description: Statements about a `vulnerability` and/or a product `purl` (a versionless statement purl matches every version), newest first, up to 500. Scope `read` or `write`.
      parameters:
        - {name: vulnerability, in: query, schema: {type: string}, description: 'Only statements about this vulnerability ID, for example `CVE-2024-1234`.'}
        - {name: purl, in: query, schema: {type: string}, description: 'Only statements about this package URL.'}
      responses:
        '200': {description: Statements, content: {application/json: {example: {"items": [{"vulnerability": "CVE-2021-23337", "purl": "pkg:npm/lodash@4.17.20", "product": "lodash", "status": "fixed", "justification": "", "impact": "", "action": "Upgrade to 4.17.21.", "document_id": "6b2d8f10-4c37-4a95-8e1d-9a0c7f3e5b24", "publisher": "Acme PSIRT", "issued_at": "2026-11-16T09:30:00Z"}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/VendorStatement'}, description: 'Statements.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}/taxii:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Indicators of compromise]
      operationId: getTAXIIFeed
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: TAXII feed settings and poll state
      description: Settings, cursor and the last poll's outcome of a `taxii` source. The credential is never returned. Scope `read` or `write`.
      responses:
        '200': {description: Feed, content: {application/json: {schema: {$ref: '#/components/schemas/TAXIIFeed'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    patch:
      tags: [Indicators of compromise]
      operationId: updateTAXIIFeed
      security: [{bearerAuth: [admin]}]
      summary: Change a TAXII feed
      description: |
        Changes settings; omitted fields are unchanged. Any credential field (`api_key`, `username`, `password`, `cert_pem`,
        `key_pem`) replaces the whole credential, so send all the parts the feed needs. A new `api_root` or `collection`, or
        `reset_cursor`, restarts from the beginning of the collection. The next poll is due at once. Scope `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TAXIIFeedInput'}, example: {"interval_minutes": 120, "page_size": 500}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/TAXIIFeed'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:poll:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Indicators of compromise]
      operationId: pollTAXIIFeed
      security: [{bearerAuth: [admin]}]
      summary: Poll a TAXII feed now
      description: Makes the feed due; the worker polls it within `SCRS_TAXII_POLL_SECONDS`. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {example: {"queued": true}, schema: {type: object, properties: {queued: {type: boolean, description: '`true` when a poll was queued.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:test:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Indicators of compromise]
      operationId: testTAXIIFeed
      security: [{bearerAuth: [admin]}]
      summary: Check a TAXII feed's settings
      description: Reads the collection resource with the stored URL, credential and certificates, and reports whether the collection can be read. Scope `admin`.
      responses:
        '200': {description: Reached, content: {application/json: {example: {"ok": true, "collection": {"id": "91a7b528-80eb-42ed-a74d-c6fbd5a26116", "can_read": true, "can_write": false}}, schema: {type: object, properties: {ok: {type: boolean, description: The collection allows reading}, collection: {type: object, properties: {id: {type: string, description: 'Collection ID.'}, title: {type: string, description: 'Collection title.'}, can_read: {type: boolean, description: '`true` when the credential may read the collection.'}, can_write: {type: boolean, description: '`true` when the credential may also write to it.'}}, description: 'The TAXII collection that answered.'}}}}}}
        '502': {description: The server could not be reached or refused the request, content: {application/json: {schema: {type: object, properties: {ok: {type: boolean, description: 'Always `false` here.'}, error: {type: string, description: 'Why the server could not be reached or refused SCRS.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:hunt:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Indicators of compromise]
      operationId: huntIndicatorSource
      security: [{bearerAuth: [write]}]
      summary: Retro-hunt with a source
      description: Queues a rescan of the default branch of every in-scope repository so enabled indicators are checked against current code. Rescans already queued in the same window are not repeated. Scope `write`.
      responses:
        '202': {description: Rescans queued, content: {application/json: {example: {"rescans_queued": 3}, schema: {type: object, properties: {rescans_queued: {type: integer, description: 'Assessments queued to rescan against the source.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Source disabled, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Operations
  /incidents:
    post:
      tags: [Incidents]
      operationId: createIncident
      security: [{bearerAuth: [admin]}]
      summary: Sweep what an account touched
      description: |
        Collects evidence for a suspected account compromise, read-only, and (by default) queues fresh scans. It contains nothing: suspending the account, rotating secrets and restoring code stay manual or an automation's runbook.

        **Input.** One to twenty actor logins and a time window: `since`, and `until` (default now); at most 366 days. Actors are the identities events and triggers claim, never verified; matching ignores case.

        **The report holds**
        - `touched`: the revisions those actors triggered scans of.
        - Integrity signals raised for them.
        - Branches and pull requests from the stored webhook deliveries (only as far back as inbound events are retained).
        - Workflow, install-hook, remote-execution and large-file entries found in the touched revisions.
        - Per touched asset and ref: the last known good revision and the newest mirror snapshots to restore from.

        **Rescans.** Unless `reassess` is false, a fresh scan of each touched revision is queued, pinned to its commit, at most `max_reassess` (default 50, at most 200).

        Each list is cut at 500 entries and `report.truncated` names the lists that were. Audited. Scope `admin`.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IncidentRequest'}, example: {"title": "Compromised maintainer account", "actors": ["octocat"], "since": "2026-11-10T00:00:00Z", "reassess": true, "max_reassess": 50}}}
      responses:
        '201':
          description: The incident with its report
          headers: {Location: {schema: {type: string}}}
          content: {application/json: {schema: {$ref: '#/components/schemas/Incident'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [Incidents]
      operationId: listIncidents
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List incidents
      description: Newest first, without reports; read one with `GET /incidents/{id}`. Scope `read` or `write`.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: 'Most incidents to return (1 to 200).'}
        - {name: cursor, in: query, schema: {type: string}, description: 'Page marker. Pass the `next_cursor` of the previous page; leave out for the first page.'}
      responses:
        '200': {description: Page of incidents, content: {application/json: {schema: {$ref: '#/components/schemas/IncidentPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /incidents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Incidents]
      operationId: getIncident
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Read an incident
      description: The report written when the incident was created, with the current status and verdict of the re-assessments it queued (`reassessments`, counted by status in `reassessment_counts`). Scope `read` or `write`.
      responses:
        '200': {description: The incident, content: {application/json: {schema: {$ref: '#/components/schemas/Incident'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List background jobs
      description: |
        One newest-first list of the platform's queued and finished work, for a status page or to find what is stuck: assessments, QA runs, QA test generation, AI summaries and reviews, compliance reports, git mirrors and Dependency-Track uploads. Each job has a normalised `status` (`queued`, `running`, `succeeded`, `failed`, `cancelled`), its own `state`, and `resource`, the path of the endpoint that returns the full record. Filter by `kind`, `status`, `asset_id` and `since` (created at or after). A QA run whose tests fail is a succeeded job (its `state` is `failed`). Scheduled maintenance jobs are not listed; see `GET /maintenance/schedule`. Scope `read` or `write`.
      parameters:
        - {name: kind, in: query, schema: {type: string, enum: [assessment, qa_run, qa_generation, ai_summary, ai_review, report, mirror, dependency_track_upload]}, description: 'Only this kind of job.'}
        - {name: status, in: query, schema: {type: string, enum: [queued, running, succeeded, failed, cancelled]}, description: 'Only jobs in this state.'}
        - {name: asset_id, in: query, schema: {type: string, format: uuid}, description: Jobs of one asset (reports have none)}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: 'Only jobs created at or after this time (RFC 3339, UTC).'}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}, description: 'Most jobs to return (1 to 200).'}
        - {name: cursor, in: query, schema: {type: string}, description: 'Page marker. Pass the `next_cursor` of the previous page; leave out for the first page.'}
      responses:
        '200': {description: Page of jobs, content: {application/json: {schema: {$ref: '#/components/schemas/JobPage'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /jobs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Jobs]
      operationId: getJob
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Read one job
      description: Finds the job whatever its kind and returns the normalised view; follow `resource` for the full record. Scope `read` or `write`.
      responses:
        '200': {description: The job, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /jobs/{id}:cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Jobs]
      operationId: cancelJob
      security: [{bearerAuth: [admin]}]
      summary: Cancel a job
      description: Stops a queued or running assessment (same effect as `DELETE /assessments/{id}`) or QA run (same as `POST /qa/runs/{id}:cancel`). Other kinds cannot be stopped and answer `409`, as does a job that already finished. Audited. Scope `admin`.
      responses:
        '200': {description: The job after cancelling, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/run:
    post:
      tags: [Maintenance]
      operationId: runMaintenance
      security: [{bearerAuth: [admin]}]
      summary: Run maintenance now
      description: Applies retention, expires idempotency keys and purges old deliveries. Concurrent runs are skipped. Scope `admin`.
      responses:
        '200': {description: Report, content: {application/json: {schema: {$ref: '#/components/schemas/MaintenanceReport'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/rescan:
    post:
      tags: [Maintenance]
      operationId: rescanDefaultBranches
      security: [{bearerAuth: [admin]}]
      summary: Rescan default branches
      description: Queues a rescan of every in-scope repository's default branch that has no recent assessment. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {example: {"rescans_queued": 3}, schema: {type: object, properties: {rescans_queued: {type: integer, description: 'Assessments queued.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/redeliver-dead:
    post:
      tags: [Maintenance]
      operationId: redeliverDead
      security: [{bearerAuth: [admin]}]
      summary: Requeue all dead deliveries
      description: 'Use after a receiver outage. Every delivery that ran out of retries goes back in the queue and is sent again. Answers `202` with the number requeued. Scope `admin`.'
      responses:
        '202': {description: Requeued, content: {application/json: {example: {"deliveries_requeued": 5}, schema: {type: object, properties: {deliveries_requeued: {type: integer, description: 'Dead webhook deliveries queued again.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/reset:
    post:
      tags: [Maintenance]
      operationId: resetData
      security: [{bearerAuth: [admin]}]
      summary: Reset one scope of data
      description: |
        Scoped reset, audited. `feed_state` clears TAXII cursors and NVD/CVE sync state so the next runs resync from scratch. `indicators` deletes every indicator of `source_id`. `asset_findings` deletes one asset's register entries and their history (`asset_id`); assets on legal hold are refused. `confirm` must repeat the scope. Scope `admin`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"scope": "feed_state", "confirm": "feed_state"}
            schema:
              type: object
              additionalProperties: false
              required: [scope, confirm]
              properties:
                scope: {type: string, enum: [feed_state, indicators, asset_findings], description: 'What to clear: `feed_state` TAXII cursors and NVD/CVE sync state, so the next runs resync; `indicators` every indicator of `source_id`; `asset_findings` one asset''s register entries and history (refused for assets on legal hold). Send `confirm` repeating the scope.'}
                confirm: {type: string, description: The scope name again}
                asset_id: {type: string, format: uuid, description: 'Asset to reset. Needed for `asset_findings`.'}
                source_id: {type: string, format: uuid, description: 'Indicator source to reset. Needed for `indicators`.'}
      responses:
        '200': {description: Reset, content: {application/json: {example: {"scope": "feed_state", "removed": {"taxii_cursors": 2}}, schema: {type: object, properties: {scope: {type: string, description: 'The scope that was reset.'}, removed: {type: object, additionalProperties: {type: integer}, description: 'Counts of what was removed.'}}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: The asset is on legal hold, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/rebuild:
    post:
      tags: [Maintenance]
      operationId: rebuildDerived
      security: [{bearerAuth: [admin]}]
      summary: Re-assess current revisions
      description: Queues the newest successful assessment of every tracked asset and ref (last 180 days) again, so findings, scores, KEV/EPSS, indicator and rule matches are recomputed against current feeds. Pull requests are left to their own events. Audited. Scope `admin`.
      responses:
        '202': {description: Queued, content: {application/json: {example: {"assessments_queued": 14}, schema: {type: object, properties: {assessments_queued: {type: integer, description: 'Assessments queued to rebuild their results.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/update-sensors:
    post:
      tags: [Maintenance]
      operationId: updateSensors
      security: [{bearerAuth: [admin]}]
      summary: Refresh feeds now
      description: Makes every enabled TAXII feed and NVD/CVE Program sync due now and returns the vulnerability sources with their freshness. OSV, KEV, EPSS and ClamAV signatures refresh on their own schedules in `scrs-feed-sync` and `scrs-clamav`. Audited. Scope `admin`.
      responses:
        '202': {description: Due now, content: {application/json: {example: {"due_now": {"taxii": 1, "nvd": 1}, "sources": [{"key": "osv", "name": "OSV", "kind": "vulnerability database", "url": "https://osv.dev", "managed_by": "feed-sync", "schedule_minutes": 60, "licence": "CC-BY-4.0", "terms_url": "https://osv.dev/docs/", "restricted": false, "enabled": true, "state": {}, "last_sync_at": "2026-11-16T09:30:00Z", "last_success_at": "2026-11-16T09:30:00Z", "next_sync_at": "2026-11-16T10:30:00Z", "record_count": 412345, "last_error": "", "failures": 0, "stale": false, "lag_seconds": 120, "revision": 4}]}, schema: {type: object, properties: {due_now: {type: object, additionalProperties: {type: integer}, description: 'Feeds that were due and will sync now.'}, sources: {type: array, items: {$ref: '#/components/schemas/VulnerabilitySource'}, description: 'Every feed with its state.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/schedule:
    get:
      tags: [Maintenance]
      operationId: maintenanceSchedule
      security: [{bearerAuth: [admin]}]
      summary: Scheduled jobs and their last runs
      description: Each scheduled job (maintenance and retention, TAXII polling, advisory sync, feed monitor, GitHub delivery check) with interval, last start, finish, status, detail and next run, plus every feed source's schedule and health. Scope `admin`.
      responses:
        '200':
          description: Schedule
          content:
            application/json:
              example: {"jobs": [{"job": "maintenance", "interval_seconds": 3600, "last_started_at": "2026-11-16T09:30:00Z", "last_finished_at": "2026-11-16T09:30:08Z", "last_status": "ok", "last_detail": {"inbound_events_purged": 128}, "next_run_at": "2026-11-16T10:30:00Z"}], "feeds": []}
              schema:
                type: object
                properties:
                  jobs: {type: array, items: {type: object, properties: {job: {type: string, description: 'Job name.'}, interval_seconds: {type: integer, description: 'Seconds between runs.'}, last_started_at: {type: [string, 'null'], format: date-time, description: 'When it last started, or `null`.'}, last_finished_at: {type: [string, 'null'], format: date-time, description: 'When it last finished, or `null`.'}, last_status: {type: string, description: 'Outcome of the last run.'}, last_detail: {type: object, description: 'Details of the last run.'}, next_run_at: {type: [string, 'null'], format: date-time, description: 'When it runs next, or `null`.'}}}, description: 'Scheduled background jobs.'}
                  feeds: {type: array, items: {type: object}, description: 'Feed sync schedule.'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /maintenance/versions:
    get:
      tags: [Maintenance]
      operationId: platformVersions
      security: [{bearerAuth: [admin]}]
      summary: Platform versions and update check
      description: The SCRS build (version, Go, VCS revision), feed freshness, the Karate runner's versions, and the newest published release when `SCRS_RELEASE_FEED_URL` names an https JSON feed with `tag_name` or `version`. Scope `admin`.
      responses:
        '200': {description: Versions, content: {application/json: {example: {"scrs": {"version": "0.5.0", "go": "go1.27.4", "vcs.revision": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "vcs.time": "2026-11-16T09:30:00Z"}, "feeds": {"osv": {"last_success_at": "2026-11-16T09:30:00Z", "stale": false, "records": 412345}}, "qa_runner": {"karate": "1.5.1", "gatling": true, "lint_tools": ["ruff", "mypy", "bandit", "pylint", "phpstan", "phpcs", "clang-tidy", "golangci-lint", "eslint", "ktlint", "swiftlint", "dart-analyze"], "slots": 2, "queued": 0, "running": 1}, "latest_release": {"version": "v0.5.1", "url": "https://releases.example.com/scrs/v0.5.1"}}, schema: {type: object, properties: {scrs: {type: object, description: 'Version and build of this SCRS.'}, feeds: {type: object, description: 'Per feed key: `last_success_at`, `stale` and `records` (stored record count).'}, qa_runner: {type: object, description: 'What the QA runner reports about itself, or `{error}` when it cannot be reached. Absent when no runner is configured.'}, latest_release: {type: object, description: 'Newest release from the feed in `SCRS_RELEASE_FEED_URL`. Absent when that is not set.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- SAST and reachability (M9)
  /sast/analyzers:
    get:
      tags: [SAST]
      operationId: listSASTAnalyzers
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Bundled analyzers
      description: The analyzers in the scrs-sast image with version, languages, licence, rules licence, whether they may leave CreditChek (`redistributable`), rule count and whether this deployment enables them (`SCRS_SAST_ANALYZERS`), plus the reachability tool. Read live from the service; `service` is `unconfigured` or `unavailable` when it cannot be asked, and then only static metadata is returned. Scope `read` or `write`.
      responses:
        '200': {description: Analyzers, content: {application/json: {example: {"service": "ok", "enabled_by_default": true, "analyzers": [{"name": "opengrep", "version": "1.8.0", "languages": ["go", "python", "javascript", "typescript", "java"], "license": "LGPL-2.1", "rules_license": "Semgrep Rules License v1.0", "redistributable": true, "needs_network": false, "executes_project_code": false, "rule_count": 2140, "enabled": true}], "reachability": {"name": "govulncheck", "version": "1.8.0", "languages": ["go"], "license": "BSD-3-Clause", "rules_license": "", "redistributable": true, "needs_network": false, "executes_project_code": false, "rule_count": 0, "enabled": true}}, schema: {type: object, properties: {service: {type: string, enum: [ok, unavailable, unconfigured], description: '`ok` the SAST service answers; `unavailable` it is down; `unconfigured` no SAST service is set.'}, enabled_by_default: {type: boolean, description: 'Whether assessments run SAST when a repository has no setting.'}, analyzers: {type: array, items: {$ref: '#/components/schemas/SASTAnalyzer'}, description: 'Bundled analysers.'}, reachability: {$ref: '#/components/schemas/SASTAnalyzer'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reachability/capabilities:
    get:
      tags: [SAST]
      operationId: reachabilityCapabilities
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Reachability capabilities
      description: Ecosystems, methods and tool versions for reachability. Go uses the govulncheck call graph (`reachable`, `imported_only`, `not_reachable`). npm and PyPI use an import-level reading of the repository's own source (`imported_only` when it imports the package, otherwise `unknown`, never `not_reachable`, because another dependency may still reach it). Other ecosystems report `unsupported`. A failed or skipped analysis is `unknown`, never `not_reachable`. Scope `read` or `write`.
      responses:
        '200': {description: Capabilities, content: {application/json: {example: {"enabled_by_default": true, "capabilities": [{"ecosystem": "Go", "method": "call_graph", "tool": "govulncheck", "version": "1.1.4", "statuses": ["reachable", "imported_only", "not_reachable", "unknown"], "notes": "Call-graph analysis of Go module sources."}, {"ecosystem": "npm", "method": "import_graph", "tool": "scrs-imports", "version": "1", "statuses": ["imported_only", "unknown"], "notes": "Reads the imports of the repository's own JavaScript and TypeScript source."}, {"ecosystem": "Rust", "method": "none", "status": "unsupported", "notes": "Not offered."}]}, schema: {type: object, properties: {enabled_by_default: {type: boolean, description: 'Whether reachability analysis runs by default.'}, capabilities: {type: array, items: {type: object}, description: 'Languages supported and how deep the analysis goes for each.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sast/settings:
    get:
      tags: [SAST]
      operationId: getSASTSettings
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Deployment SAST settings
      description: Rules disabled everywhere (`tool:rule`, globs allowed, for example `bearer:javascript_express_helmet_missing` or `gosec:G104`) and paths excluded everywhere (globs such as `docs/**`). Scope `read` or `write`.
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SASTSettings'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [SAST]
      operationId: setSASTSettings
      security: [{bearerAuth: [admin]}]
      summary: Replace deployment SAST settings
      description: Replaces the disabled rules and excludes; `If-Match` carries the revision (0 before the first change). Audited as `sast_settings.updated`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {disabled_rules: {type: array, maxItems: 500, items: {type: string}, description: 'Rule IDs to ignore everywhere.'}, excludes: {type: array, maxItems: 200, items: {type: string}, description: 'Path patterns never analysed.'}}}, example: {"disabled_rules": ["G104"], "excludes": ["vendor/**", "**/*_test.go"]}}}}
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/SASTSettings'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/sast:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [SAST]
      operationId: getAssetSAST
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Asset SAST settings
      description: The asset's overrides (null fields inherit `SCRS_SAST_ENABLED` and `SCRS_REACHABILITY_ENABLED`) and the effective settings the next assessment uses, including enabled custom rulesets. Scope `read` or `write`.
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {example: {"settings": {"enabled": true, "reachability": true, "analyzers": ["gosec", "opengrep"], "disabled_rules": [], "excludes": ["vendor/**"], "revision": 2}, "effective": {"enabled": true, "reachability": true, "analyzers": ["gosec", "opengrep"], "disabled_rules": [], "excludes": ["vendor/**"], "custom_rulesets": []}}, schema: {type: object, properties: {settings: {$ref: '#/components/schemas/AssetSAST'}, effective: {type: object, description: 'Platform and repository settings merged, as a scan would use them.'}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [SAST]
      operationId: setAssetSAST
      security: [{bearerAuth: [write]}]
      summary: Replace asset SAST settings
      description: Turns SAST and reachability on or off for the asset, selects analyzers, and adds disabled rules and excludes. `If-Match` carries the revision (0 before the first change). Audited. Scope `write`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/AssetSAST'}, example: {"enabled": true, "reachability": true, "disabled_rules": [], "excludes": ["testdata/**"], "revision": 1}}}}
      responses:
        '200':
          description: Settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/AssetSAST'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sast/rulesets:
    get:
      tags: [SAST]
      operationId: listSASTRulesets
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Custom OpenGrep rulesets
      description: Uploaded rulesets without their bodies. Enabled rulesets run with the bundled OpenGrep rules on every SAST assessment. Scope `read` or `write`.
      responses:
        '200': {description: Rulesets, content: {application/json: {example: {"items": [{"id": "d8f1a3c5-7e29-4b60-91a4-5c0e2b8d3f17", "name": "team-opengrep-rules", "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "enabled": true, "revision": 1, "size": 2048, "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/SASTRuleset'}, description: 'Rulesets.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [SAST]
      operationId: saveSASTRuleset
      security: [{bearerAuth: [write]}]
      summary: Upload a custom ruleset
      description: Stores or replaces (by name) an OpenGrep/Semgrep rule document after the scrs-sast service compiles it (`opengrep validate`). Audited as `sast_ruleset.saved`. Scope `write`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"name": "internal-tokens", "description": "Our internal token format", "enabled": true, "rules": "rules:\n  - id: internal-token\n    languages: [generic]\n    message: Internal token in source\n    pattern: scrs_internal_\n    severity: ERROR\n"}
            schema:
              type: object
              additionalProperties: false
              required: [name, rules]
              properties:
                name: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,62}$', description: 'Unique name.'}
                description: {type: string, maxLength: 500, description: 'What the rules look for.'}
                enabled: {type: boolean, default: true, description: 'Set `false` to store the ruleset without using it.'}
                rules: {type: string, maxLength: 1048576, description: OpenGrep rule YAML}
      responses:
        '201': {description: Stored, content: {application/json: {schema: {$ref: '#/components/schemas/SASTRuleset'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '422': {description: Rules do not compile, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Validation service failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: SAST service not configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sast/rulesets/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [SAST]
      operationId: getSASTRuleset
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Get a ruleset
      description: 'One custom OpenGrep ruleset with its rule YAML, to show or edit in the settings screen. Scope `read` or `write`.'
      responses:
        '200': {description: Ruleset, content: {application/json: {schema: {$ref: '#/components/schemas/SASTRuleset'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    delete:
      tags: [SAST]
      operationId: deleteSASTRuleset
      security: [{bearerAuth: [admin]}]
      summary: Delete a ruleset
      description: 'Removes a custom ruleset so later SAST runs no longer use it. Audited. Scope `admin`.'
      responses:
        '204': {description: Deleted}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  # ---------------------------------------------------------------- Licences (M8)
  /policies/gate:
    get:
      tags: [Licences]
      operationId: getGatePolicy
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Default gate rules
      description: The fixed verdict rules as text. The gate is not configurable in this release; licence entries follow the licence policy. Scope `read` or `write`.
      responses:
        '200': {description: Gate rules, content: {application/json: {example: {"kind": "gate", "builtin": true, "policy": {"name": "scrs-default-gate", "configurable": false, "rules": ["Malicious content (malware, malicious dependency, blocking indicator or YARA match) fails, new or existing; a waiver lowers it to warn, never pass.", "A new critical vulnerability fails; a new high, or an existing critical, warns."]}}, schema: {type: object, properties: {kind: {const: gate, description: 'Always `gate`.'}, builtin: {type: boolean, description: '`true` for the default gate shipped with SCRS.'}, policy: {type: object, description: 'The fixed verdict rules as readable text.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /policies/dependencies:
    get:
      tags: [Policies]
      operationId: getDependencyPolicy
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Dependency checks policy
      description: |
        The two optional package checks. Both start off. `min_release_age_days` flags a package version published fewer than that many days ago (needs deps.dev, and covers npm, PyPI, Go, Maven, crates.io, NuGet and RubyGems). `typosquat` flags an npm or PyPI package name that is one edit away from a popular package, or equal to it once `-`, `_` and `.` are ignored (a curated list, so it misses much and can flag a legitimate neighbour). Both produce `suspicious_dependency` entries (`SCRS-NEW-RELEASE`, `SCRS-TYPOSQUAT`) of severity `medium`, which inform and never change a verdict. Each assessment reports them in its `dependency_policy` stage. Scope `read` or `write`.
      responses:
        '200':
          description: Settings and revision
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DependencyPolicy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Policies]
      operationId: setDependencyPolicy
      security: [{bearerAuth: [admin]}]
      summary: Change the dependency checks
      description: Replaces both settings. `If-Match` must carry the current revision (`428` when missing, `409` when stale). The change applies from the next assessment; existing entries close when a scan with the check on no longer reports them, and stay open if the check could not cover every package. Audited. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [min_release_age_days, typosquat], properties: {min_release_age_days: {type: integer, minimum: 0, maximum: 365, description: 0 turns the release-age check off}, typosquat: {type: boolean, description: 'Flag a package name one edit away from a popular package.'}}}, example: {"min_release_age_days": 7, "typosquat": true}}}
      responses:
        '200':
          description: Stored settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/DependencyPolicy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /policies/integrity:
    get:
      tags: [Policies]
      operationId: getIntegrityPolicy
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Behavioural and size signals policy
      description: |
        The optional integrity signals. All are off until an admin sets them. Who pushed what is recorded for every push even while a signal is off, so enabling one later has history. A repository with no recorded authors only builds a baseline. Authors are the identities claimed in the event, never verified.

        **From push webhooks (GitHub and GitLab)**
        - `author_new_days`: a commit author not seen in the repository for that many days, or never. Raises `author_new` (high on the default branch, else medium).
        - `off_hours`: a push at an hour the author rarely pushes at, after at least 20 recorded pushes. Raises `author_off_hours` (low).
        - `pusher_differs`: a pusher who is not the commit author, ignoring merges and web merges. Raises `pusher_differs_from_author` (low).

        **From scans**
        - `large_file_bytes`: a file above that size that is new since the previous scan of the ref. Raises `SCRS-LARGE-NEW-FILE` (high when the pusher's first push to the repository left that commit, else medium).
        - `ci_growth_bytes`: a CI or build file (workflows, Dockerfile, Makefile, package manifests) that grew by more than that many bytes. Raises `SCRS-CI-FILE-GROWTH` (medium).

        Scope `read` or `write`.
      responses:
        '200':
          description: Settings and revision
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/IntegrityPolicy'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Policies]
      operationId: setIntegrityPolicy
      security: [{bearerAuth: [admin]}]
      summary: Change the integrity signals
      description: Replaces every setting; a field left out becomes off. `If-Match` must carry the current revision (`428` when missing, `409` when stale). Applies from the next push or scan. Audited. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {author_new_days: {type: integer, minimum: 0, maximum: 3650, description: 'Flag a commit author not seen in the repository for this many days, or never. 0 turns it off (maximum 3650).'}, off_hours: {type: boolean, description: 'Flag a push at an hour that author rarely pushes at.'}, pusher_differs: {type: boolean, description: 'Flag a push whose pusher is not the commit author.'}, large_file_bytes: {type: integer, minimum: 0, maximum: 1073741824, description: 'Flag a new file larger than this many bytes. 0 turns it off.'}, ci_growth_bytes: {type: integer, minimum: 0, maximum: 1073741824, description: 'Flag a CI or build file that grew by more than this many bytes. 0 turns it off.'}}}, example: {"author_new_days": 30, "off_hours": true, "pusher_differs": true, "large_file_bytes": 5242880, "ci_growth_bytes": 2048}}}
      responses:
        '200':
          description: Stored settings
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/IntegrityPolicy'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /policies/license:
    get:
      tags: [Licences]
      operationId: getLicensePolicy
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Active licence policy
      description: The licence policy applied to every assessment. Until an admin stores one it is the built-in `corporate-default` at revision 0. Licence data is a policy aid, not legal advice; counsel reviews the default before it is made enforcing. Scope `read` or `write`.
      responses:
        '200':
          description: Policy and revision
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LicensePolicyRecord'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Licences]
      operationId: setLicensePolicy
      security: [{bearerAuth: [admin]}]
      summary: Replace the licence policy
      description: Stores a policy validated against `GET /schemas/license-policy`. `If-Match` must carry the current revision (0 for corporate-default). Set `enforcing` to true only after counsel review; until then licence entries cap the verdict at `warn`. Audited as `license_policy.updated`. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LicensePolicy'}, example: {"name": "company-policy", "description": "Deny network copyleft in SaaS", "enforcing": true, "default": "review", "severity": {"deny": "high", "review": "medium"}, "matrix": {"permissive": {"internal": "allow", "saas": "allow", "distributed": "allow"}, "network_copyleft": {"internal": "review", "saas": "deny", "distributed": "deny"}}}}}}
      responses:
        '200':
          description: Stored policy
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LicensePolicyRecord'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /policies/license:evaluate:
    post:
      tags: [Licences]
      operationId: evaluateLicense
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Try a licence against the policy
      description: Normalises licence text to an SPDX expression and decides it under the active policy for a distribution model, without recording anything. Useful when counsel reviews rules. Scope `read` or `write`.
      requestBody:
        required: true
        content:
          application/json:
            example: {"expression": "AGPL-3.0-only", "distribution": "saas", "dev": false}
            schema:
              type: object
              additionalProperties: false
              properties:
                expression: {type: string, maxLength: 2000, examples: ['Apache License, Version 2.0', 'MIT OR AGPL-3.0-only'], description: 'SPDX licence expression to check, for example `GPL-3.0-only`.'}
                distribution: {$ref: '#/components/schemas/Distribution'}
                asset_id: {type: string, format: uuid, description: 'Asset whose distribution and rules should apply.'}
                purl: {type: string, maxLength: 512, description: 'Package URL, to test package rules.'}
                path: {type: string, maxLength: 512, description: 'Manifest path, to test path rules.'}
                dev: {type: boolean, description: '`true` to test as a development-only dependency.'}
                project_license: {type: string, maxLength: 2000, description: 'Adds the outbound check: can this licence be combined into a project released under project_license?', examples: [GPL-2.0-only]}
      responses:
        '200':
          description: Normalised expression and decision
          content: {application/json: {example: {"normalized": {"expression": "MIT OR Apache-2.0", "refs": {"MIT": "https://spdx.org/licenses/MIT.html", "Apache-2.0": "https://spdx.org/licenses/Apache-2.0.html"}, "exact": true}, "policy": "default", "policy_revision": 2, "enforcing": false, "decision": {"effect": "allow", "expression": "MIT OR Apache-2.0", "category": "permissive", "basis": "matrix", "reason": "Permissive licences are allowed for every distribution.", "licenses": ["MIT", "Apache-2.0"]}, "outbound": {"effect": "allow", "project_license": "Apache-2.0", "dependency_license": "MIT", "category": "permissive", "licenses": ["MIT"], "reason": "MIT code can be included in an Apache-2.0 project."}}, schema: {type: object, properties: {normalized: {$ref: '#/components/schemas/NormalizedLicense'}, policy: {type: string, description: 'Name of the policy applied.'}, policy_revision: {type: integer, description: 'Its revision.'}, enforcing: {type: boolean, description: 'Whether the policy is enforcing.'}, decision: {$ref: '#/components/schemas/LicenseDecision'}, outbound: {$ref: '#/components/schemas/OutboundCompatibility'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /licenses/categories:
    get:
      tags: [Licences]
      operationId: getLicenseCategories
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Licence categories
      description: Category of every SPDX License List licence and SCRS LicenseRef, with operator overrides and the override revision. Categories are permissive, public_domain, weak_copyleft, strong_copyleft, network_copyleft, source_available_restricted, non_commercial, proprietary and unknown. Scope `read` or `write`.
      responses:
        '200':
          description: Category mapping
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {schema: {$ref: '#/components/schemas/LicenseCategories'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    put:
      tags: [Licences]
      operationId: setLicenseCategories
      security: [{bearerAuth: [admin]}]
      summary: Replace category overrides
      description: Stores a new revision of the overrides (SPDX id or LicenseRef to category); the shipped mapping applies to every id not overridden. Versioned and audited as `license_categories.updated` with each change. Requires `If-Match` with the current revision. Scope `admin`.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody:
        required: true
        content:
          application/json:
            example: {"overrides": {"Elastic-2.0": "source_available_restricted"}, "note": "Reviewed by legal on 2026-11-18"}
            schema:
              type: object
              additionalProperties: false
              required: [overrides]
              properties:
                overrides: {type: object, maxProperties: 2000, additionalProperties: {$ref: '#/components/schemas/LicenseCategory'}, description: 'Map of licence ID to the category you assign it, for example `{"Elastic-2.0": "source_available_restricted"}`.'}
                note: {type: string, maxLength: 500, description: 'Why you changed it. Stored in the history.'}
      responses:
        '200':
          description: New revision
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {example: {"version": "2026-11", "revision": 3, "overrides": {"LicenseRef-Acme-Internal": "proprietary"}, "counts": {"permissive": 310, "proprietary": 1}}, schema: {type: object, properties: {version: {type: string, description: 'Version of the category data in use.'}, revision: {type: integer, description: 'Revision of your overrides.'}, overrides: {type: object, additionalProperties: {type: string}, description: 'Overrides now in force.'}, counts: {type: object, additionalProperties: {type: integer}, description: 'Licences per category.'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /licenses/categories/history:
    get:
      tags: [Licences]
      operationId: listLicenseCategoryHistory
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Category override history
      description: Stored override revisions, newest first (up to 100). Scope `read` or `write`.
      responses:
        '200': {description: Revisions, content: {application/json: {example: {"items": [{"revision": 3, "overrides": {"LicenseRef-Acme-Internal": "proprietary"}, "note": "Classify our internal licence", "created_by": "admin-console", "created_at": "2026-11-16T09:30:00Z"}]}, schema: {type: object, properties: {items: {type: array, items: {type: object, properties: {revision: {type: integer, description: 'Revision number.'}, overrides: {type: object, additionalProperties: {type: string}, description: 'Overrides at that revision.'}, note: {type: string, description: 'Note given with it.'}, created_by: {type: string, format: uuid, description: 'Token that saved it.'}, created_at: {type: string, format: date-time, description: 'When it was saved (RFC 3339, UTC).'}}}, description: 'Revisions, newest first.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/licenses:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Licences]
      operationId: assetLicenses
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Asset licence inventory
      description: Components of the asset's newest successful assessment (of `ref`, when given) with licence expression, category, source (`declared`, `detected`, `metadata`, `none` or `unresolved`), confidence, the current policy result and the register status and waiver of each licence entry. Scope `read` or `write`.
      parameters: [{name: ref, in: query, schema: {type: string}, description: 'Branch or tag to read the inventory for. Default is the asset''s newest assessed revision.'}]
      responses:
        '200': {description: Inventory, content: {application/json: {schema: {$ref: '#/components/schemas/LicenseInventory'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /assets/{id}/licenses/notices:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Licences]
      operationId: assetLicenseNotices
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Third-party notices file
      description: A THIRD-PARTY-NOTICES text file for the asset's newest assessed revision, with each component's licence, the copyright lines SCRS recorded and links to the licence texts. Development-only dependencies are omitted unless `include_dev=true`. A starting point, not legal advice. Scope `read` or `write`.
      parameters:
        - {name: ref, in: query, schema: {type: string}, description: 'Branch or tag to build the notices for. Default is the newest assessed revision.'}
        - {name: include_dev, in: query, schema: {type: boolean, default: false}, description: 'Include development-only dependencies, which are not shipped by default.'}
      responses:
        '200': {description: Notices, content: {text/plain: {schema: {type: string}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /reports/licenses:
    get:
      tags: [Licences]
      operationId: licenseReport
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Licence report
      description: Licence inventory of one asset (`asset_id`) or of every assessed asset, as JSON, CSV (one row per component; cells that start with a formula character are quoted) or Markdown. Scope `read` or `write`.
      parameters:
        - {name: asset_id, in: query, schema: {type: string, format: uuid}, description: 'Limit the report to this asset. Default is every asset.'}
        - {name: format, in: query, schema: {type: string, enum: [json, csv, md], default: json}, description: 'Output format: `json`, `csv` or `md`.'}
      responses:
        '200':
          description: Report
          content:
            application/json: {example: {"generated_at": "2026-11-16T09:30:00Z", "scrs_version": "0.5.0", "statement": "Licence inventory of the latest assessment of each asset. A policy aid, not legal advice.", "assets": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "asset": "acme/api", "distribution": "saas", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "revision": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "ref": "main", "assessed_at": "2026-11-16T09:30:00Z", "policy": "default", "enforcing": false, "counts": {"permissive": 212, "weak_copyleft": 4, "unknown": 2}, "distribution_hint": "", "project_license": {"expression": "MIT", "source": "declared", "confidence": 1, "evidence": "package.json", "copyright": ["Copyright (c) OpenJS Foundation"], "refs": {"MIT": "https://spdx.org/licenses/MIT.html"}}, "outbound": {"allow": 210, "review": 6, "deny": 2}, "items": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "asset": "acme/api", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "name": "lodash", "version": "4.17.21", "ecosystem": "npm", "purl": "pkg:npm/lodash@4.17.21", "path": "package-lock.json", "dev": false, "expression": "MIT", "category": "permissive", "source": "declared", "confidence": 1, "policy_result": "allow", "policy_basis": "matrix", "status": "open"}]}]}, schema: {type: object, properties: {generated_at: {type: string, format: date-time, description: 'When the report was built (RFC 3339, UTC).'}, scrs_version: {type: string, description: 'SCRS version that built it.'}, statement: {type: string, description: 'Plain-language statement of scope and limits. Include it when you share the report.'}, assets: {type: array, items: {$ref: '#/components/schemas/LicenseInventory'}, description: 'Licence inventory of each asset.'}}}}
            text/csv: {schema: {type: string}}
            text/markdown: {schema: {type: string}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /sboms/{id}/download:
    parameters:
      - {name: id, in: path, required: true, schema: {type: string}, description: 'SBOM SHA-256 (`sbom_sha256` of an assessment) or the assessment id'}
