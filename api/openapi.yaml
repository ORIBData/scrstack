      summary: Get a test generation and its files
      description: The generation's status, provider, model, token usage and every file it produced (without content). Scope `read`, `write`, `trigger` or `qa`.
      responses:
        '200': {description: Generation, content: {application/json: {example: {"generation": {"id": "e4b8d1f2-0a3c-4975-86d1-2c5f7a9e0b34", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "kind": "api", "provider_id": "0e9a8b2c-6f41-4d0e-9c1a-5b7d3f2a1c80", "provider_name": "local-ollama", "model": "qwen2.5-coder:14b", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "ref": "main", "commit": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "status": "queued", "requested_by": "qa-pipeline", "attempts": 0, "input_tokens": 0, "output_tokens": 0, "accepted": 0, "rejected": 0, "error": "", "created_at": "2026-11-16T09:30:00Z", "completed_at": ""}, "suites": [{"id": "1a9e4c70-5b2d-4f83-8c16-7d0f3e2a9b45", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "generation_id": "e4b8d1f2-0a3c-4975-86d1-2c5f7a9e0b34", "kind": "api", "path": "karate/generated/orders.feature", "source": "POST /orders", "content": "Feature: Create an order\n  Scenario: valid order\n    Given path 'orders'\n    When method post\n    Then status 201", "sha256": "5d41402abc4b2a76b9719d911017c592a0b1c2d3e4f5061728394a5b6c7d8e9f", "status": "draft", "problems": [], "reviewed_by": "", "reviewed_at": "", "note": "", "created_at": "2026-11-16T09:30:00Z"}]}, schema: {type: object, properties: {generation: {$ref: '#/components/schemas/QAGeneration'}, suites: {type: array, items: {$ref: '#/components/schemas/QASuite'}, description: 'Files the generation produced, without content.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
