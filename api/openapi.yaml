      responses:
        '200': {description: Sources, content: {application/json: {example: {"items": [{"id": "a7c1e9d3-2b45-4f08-9c6a-1e3d5f7b9a02", "name": "internal-blocklist", "kind": "manual", "mode": "hunt", "severity": "high", "min_confidence": 50, "enabled": true, "origin": {"vendor": "Security team", "url": "https://intel.example.com", "version": "2026-11", "license": "internal"}, "version": "2026-11-16", "indicator_count": 42, "imported_at": "2026-11-16T09:30:00Z", "yara_ruleset_id": null, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/IndicatorSource'}, description: 'Sources.'}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    post:
      tags: [Indicators of compromise]
      operationId: createIndicatorSource
      security: [{bearerAuth: [write]}]
      summary: Create an indicator source
      description: |
        Creates an empty source; import indicators next. New sources default to mode `hunt`: matches are recorded as `ioc_hunt`
        findings and never change a verdict. Scope `write` for `hunt`; `admin` to create in `alert` (`ioc_alert` findings gate
        by the source severity like vulnerabilities) or `block` (`ioc_match`, any match fails the assessment like malware).
        Sources of kind `taxii` poll a TAXII 2.1 collection and need `admin` for every change; give their settings and
        credential in `taxii`. The credential is encrypted with `SCRS_MASTER_KEY` and never returned.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/IndicatorSourceInput'}, example: {"name": "vendor_iocs", "kind": "manual", "description": "Indicators from a vendor advisory", "mode": "hunt", "min_confidence": 50}}}
      responses:
