        '200': {description: Runner status, content: {application/json: {schema: {$ref: '#/components/schemas/QARunnerStatus'}}}}
        '502': {description: Runner unreachable, content: {application/json: {schema: {$ref: '#/components/schemas/QARunnerStatus'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA runs]
      operationId: getQARun
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: Get a QA run
      description: Status and results of one run. Poll until `status` is passed, failed, error, cancelled or skipped, or subscribe to `qa.completed` and `qa.failed`. Functional runs have scenario counts and coverage; performance runs have load statistics; lint runs have `summary.lint` (issues by tool and severity). The individual lint problems are register entries of type `qa_lint` (`GET /register?type=qa_lint`), and a tool that could not run is a `qa_lint_config` entry. Scope `read`, `write`, `trigger` or `qa`.
      responses:
        '200': {description: Run, content: {application/json: {schema: {$ref: '#/components/schemas/QARun'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/scenarios:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA runs]
      operationId: listQAScenarios
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: Scenarios of a QA run
      description: The Karate scenarios that ran, with outcome, duration, tags and failure reason, 500 per page; filter with `status=failed`. Lint and performance runs have none. Scope `read`, `write`, `trigger` or `qa`.
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {name: status, in: query, schema: {type: string, enum: [passed, failed, skipped]}, description: 'Only scenarios with this outcome, for example `failed`.'}
      responses:
        '200': {description: Scenarios, content: {application/json: {example: {"items": [{"suite": "repo", "feature": "karate/orders.feature", "name": "Create an order", "line": 12, "tags": ["@smoke"], "status": "passed", "duration_ms": 412, "error": ""}], "next_cursor": ""}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/QAScenario'}, description: 'Scenarios on this page.'}, next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/coverage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA runs]
      operationId: getQACoverage
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: API coverage of a QA run
      description: Every documented operation with how many test calls and which response statuses were seen, plus paths the tests called that the document does not describe. Present only when the commit had an OpenAPI document and the run was functional. Scope `read`, `write`, `trigger` or `qa`.
      responses:
        '200': {description: Coverage, content: {application/json: {schema: {$ref: '#/components/schemas/QACoverage'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/report:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [QA runs]
      operationId: downloadQAReport
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: Download a QA run's reports
      description: The runner's report archive (gzip tar), for download or offline review. Functional runs have `result.json`, `console.log`, Karate HTML, JUnit XML and JSON Lines reports; performance runs the Gatling report; lint runs `lint/<tool>.json` (the tool's own output) and `lint/<tool>.meta.json` (did it run, its exit code, notes). Secret values and credential headers are redacted by the runner. Verify against `X-Content-SHA256`. `409` when the run stored no report. Scope `read`, `write`, `trigger` or `qa`.
      responses:
        '200':
          description: Report archive
          headers: {X-Content-SHA256: {schema: {type: string}}}
          content: {application/gzip: {schema: {type: string, format: binary}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: The run has no stored report, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '502': {description: Object store unavailable or integrity check failed, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}/triage:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [QA runs]
      operationId: triageQARun
      security: [{bearerAuth: [write]}]
      summary: Ask a model to triage a finished QA run
      description: |
        Queues an AI triage of a finished (`passed` or `failed`) run. Answers `202`; poll `GET /summary-jobs/{id}` (the `Location`). Scope `write`.

        It writes a summary of what failed and what to do first (a `qa_summary` in the asset's chronicle), and an advisory on each of the most important entries (failed scenarios, breached load thresholds, lint entries, untested operations): what went wrong, the likely cause, whether the application or the test should change, and the steps to fix it.

        **Provider.** Without `provider_id` the profile's `llm_provider_id` is used. The entries carry file paths, test and rule names and failure text, so the provider must be allowed to receive source code: self-hosted, or hosted and acknowledged with `POST /llm/providers/{id}:allow-source` (and `SCRS_LLM_ALLOW_SOURCE_TO_HOSTED=true`). This is checked when queued and again when the job runs.

        **Rules.** With the profile's `ai_triage` on, SCRS queues one after each run itself. A run with no assessment (profile `gate: none`) cannot be triaged (`409`), and two triages of one run never run at once (`409`). Texts are written by a model, are not verified, and never change a verdict or an entry's status.
      requestBody:
        required: false
        content: {application/json: {schema: {type: object, additionalProperties: false, properties: {provider_id: {type: string, format: uuid, description: 'Provider to use. Omit to use the one named in the asset''s QA profile.'}}}, example: {"provider_id": "0e9a8b2c-6f41-4d0e-9c1a-5b7d3f2a1c80"}}}
      responses:
        '202': {description: Queued, headers: {Location: {schema: {type: string}}}, content: {application/json: {schema: {$ref: '#/components/schemas/AISummary'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
    get:
      tags: [QA runs]
      operationId: listQARunTriages
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: Triage jobs of a QA run
      description: The AI triage jobs of one run, newest first, with status and token use. Poll a job with `GET /summary-jobs/{id}`. The written summary is in the asset's chronicle (kind `qa_summary`) and the per-entry advisories are on the register entries. Scope `read`, `write`, `trigger` or `qa`.
      responses:
        '200': {description: Jobs, content: {application/json: {example: {"items": [{"id": "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "provider_name": "local-qwen", "model": "qwen2.5-coder-32b", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "status": "succeeded", "requested_by": "frontend-dashboard", "attempts": 1, "findings_considered": 7, "findings_excluded": 2, "advisories": 5, "input_tokens": 6120, "output_tokens": 1480, "incomplete": "", "redactions": {}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:31:05Z"}]}, schema: {type: object, properties: {items: {type: array, items: {$ref: '#/components/schemas/AISummary'}, description: 'Triage jobs, newest first.'}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /qa/runs/{id}:cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [QA runs]
      operationId: cancelQARun
      security: [{bearerAuth: [write]}, {bearerAuth: [trigger]}, {bearerAuth: [qa]}]
      summary: Cancel a QA run
      description: Stops a queued or running run and removes its job from the runner. A finished run cannot be cancelled (`409`). Scope `write`, `trigger` or `qa`.
      responses:
