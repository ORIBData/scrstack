        '200': {description: Progress, content: {application/json: {example: {"model": "nomic-embed-text", "embedded": 120, "failed": 0, "remaining": 0}, schema: {type: object, properties: {model: {type: string, description: 'Embedding model used.'}, embedded: {type: integer, description: 'Documents embedded in this call.'}, failed: {type: integer, description: 'Documents that failed.'}, remaining: {type: integer, description: 'Documents still without vectors after this call'}}}}}}
