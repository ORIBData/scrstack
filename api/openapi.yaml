      description: 'Whether SCRS can reach the QA runner and what it offers: Karate version, Gatling support, free slots and queue, and `runner.lint_tools`, the linters installed on it (ruff, mypy, bandit, pylint, phpstan, phpcs, clang-tidy, golangci-lint, eslint, ktlint, swiftlint, dart-analyze). Back office: offer only these tools in the profile''s lint settings, and use it as a health check after a deploy (`502` with `reachable: false` means the runner is down or the token does not match). A slim runner image lists only ruff. Operators who call the runner directly use its own `/v1/info` with the runner token. Scope `read`, `write`, `trigger` or `qa`.'
