        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:import-stix:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Indicators of compromise]
      operationId: importSTIXBundle
      security: [{bearerAuth: [write]}]
      summary: Upload a STIX 2.1 bundle
      description: |
        Loads a STIX 2.1 bundle into a source of kind `stix` (`taxii` sources also accept uploads, for a backfill from an export). Limits: 32 MiB, 50000 indicators and 200 YARA patterns. Scope `write` for `hunt` sources of kind `stix`, otherwise `admin`.

        **Imported.** Indicator objects whose patterns can be checked against files at rest: `file:hashes` (MD5, SHA-1, SHA-256), `file:name`, `domain-name:value`, single `ipv4-addr:value` and `ipv6-addr:value`, and `url:value`, compared with `=` or `IN`. Alternatives joined by OR are imported separately; in an AND with a file hash, the hash is used. Patterns with `pattern_type: yara` are compiled into the ruleset `stix_<source>`, which follows the source's mode, severity and enabled flag and is rebuilt on every upload.

        **Skipped, and counted by reason in the report.** Patterns that join observations, time windows, network traffic and other runtime objects, other pattern types, and revoked or expired indicators.

        **Replace or merge.** Without `merge`, the upload replaces all the source's indicators. With `merge=true` it replaces only what the bundle's indicator objects produced before, so revoked objects are removed.
      parameters:
        - {name: merge, in: query, schema: {type: boolean, default: false}, description: 'When `true`, keep the source''s other indicators and add these; otherwise the bundle replaces them.'}
        - {name: valid_days, in: query, description: Expiry for indicators without valid_until, schema: {type: integer, minimum: 1, maximum: 3650, default: 180}}
      requestBody:
        required: true
        content:
          application/stix+json: {schema: {$ref: '#/components/schemas/STIXBundle'}}
          application/json: {schema: {$ref: '#/components/schemas/STIXBundle'}}
      responses:
        '200': {description: Imported, headers: {ETag: {$ref: '#/components/headers/ETag'}}, content: {application/json: {schema: {$ref: '#/components/schemas/STIXImportResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: 'The source is not of kind stix, or another ruleset has the name stix_<source>', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: Bundle too large, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: 'The combined YARA patterns do not compile, or a scan limit would be exceeded', content: {application/json: {schema: {$ref: '#/components/schemas/RuleCompileError'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/indicator-sources/{id}:import-csv:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      tags: [Indicators of compromise]
      operationId: importIndicatorCSV
      security: [{bearerAuth: [write]}]
      summary: Import indicators from CSV
      description: |
        Loads a CSV export into a manual source. The header row names columns; map them with `value_column` (default `value`), `type_column`, `first_seen_column`, `confidence_column`, `label_column` and `valid_until_column`. Without a type, `type` sets one for every row, otherwise each value's type is detected (MD5, SHA-1, SHA-256, IPv4, IPv6, URL, purl, domain). Defanged values are accepted. `valid_days` (default 180) sets the expiry from the first-seen date when a row has none. The label becomes part of the indicator ID, and so of the finding's advisory ID.
        Rows that do not parse are skipped and reported (first 50). `merge=true` keeps the source's other indicators; otherwise the CSV replaces them. Scope `write` for hunt sources, `admin` for alert and block.
      parameters:
        - {name: merge, in: query, schema: {type: boolean, default: false}, description: 'When `true`, keep the source''s other indicators and add these; otherwise the CSV replaces them.'}
        - {name: type, in: query, schema: {type: string, enum: [sha256, sha1, md5, domain, ipv4, ipv6, url, purl, workflow_step_name, file_path_regex, file_content_regex]}, description: 'Indicator type for every row. Leave out to detect each value''s type.'}
        - {name: valid_days, in: query, schema: {type: integer, minimum: 1, maximum: 3650, default: 180}, description: 'Days an indicator stays valid when its row has no expiry (1 to 3650).'}
        - {name: delimiter, in: query, schema: {type: string, enum: [comma, tab, semicolon], default: comma}, description: 'Column separator in the file.'}
        - {name: value_column, in: query, schema: {type: string}, description: 'Header of the column holding the indicator value. Default `value`.'}
        - {name: type_column, in: query, schema: {type: string}, description: 'Header of the column holding each row''s type.'}
        - {name: first_seen_column, in: query, schema: {type: string}, description: 'Header of the column holding when the indicator was first seen.'}
        - {name: confidence_column, in: query, schema: {type: string}, description: 'Header of the column holding confidence (0 to 100).'}
        - {name: label_column, in: query, schema: {type: string}, description: 'Header of the column holding a label. It becomes part of the indicator ID and of the finding''s advisory ID.'}
        - {name: valid_until_column, in: query, schema: {type: string}, description: 'Header of the column holding the expiry time.'}
      requestBody: {required: true, content: {text/csv: {schema: {type: string}}}}
      responses:
        '200':
          description: Imported
          headers: {ETag: {$ref: '#/components/headers/ETag'}}
          content: {application/json: {example: {"source": {"id": "a7c1e9d3-2b45-4f08-9c6a-1e3d5f7b9a02", "name": "internal-blocklist", "kind": "manual", "mode": "hunt", "severity": "high", "min_confidence": 50, "enabled": true, "origin": {"vendor": "Security team", "url": "https://intel.example.com", "version": "2026-11", "license": "internal"}, "version": "2026-11-16", "indicator_count": 42, "imported_at": "2026-11-16T09:30:00Z", "yara_ruleset_id": null, "revision": 1, "created_by": "7e1c0b52-4a9d-4f36-8b07-d3a5c9e2f148", "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}, "merged": false, "report": {"rows": 100, "accepted": 96, "skipped": 4, "problems": [{"row": 7, "reason": "invalid sha256 value"}]}}, schema: {type: object, properties: {source: {$ref: '#/components/schemas/IndicatorSource'}, merged: {type: boolean, description: '`true` when the rows were added to existing indicators.'}, report: {type: object, properties: {rows: {type: integer, description: 'Rows read.'}, accepted: {type: integer, description: 'Rows imported.'}, skipped: {type: integer, description: 'Rows that could not be used.'}, problems: {type: array, items: {type: object, properties: {row: {type: integer, description: 'Row number, from 1 after the header.'}, reason: {type: string, description: 'Why it was skipped.'}}}, description: 'The first 50 skipped rows.'}}, description: 'What the import did.'}}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {description: Not a manual source, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '413': {description: CSV over 16 MiB, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {description: Indicator limits exceeded, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /intel/vulnerability-sources:
    get:
      tags: [Vulnerability data and VEX]
      operationId: listVulnerabilitySources
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: List vulnerability and advisory sources
