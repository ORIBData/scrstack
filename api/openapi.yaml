        '200': {description: Context document, content: {application/json: {example: {"schema_version": 1, "profile": "full", "assessment": {"id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "kind": "scan", "status": "succeeded", "verdict": "fail", "repository": "acme/api", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "stages": [{"name": "inventory", "status": "ok"}, {"name": "malware", "status": "ok"}, {"name": "ioc", "status": "ok"}], "verdict_reasons": ["1 new high vulnerability"]}, "asset": {"id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "type": "github_repo", "locator": "acme/api", "environment": "prod", "criticality": 4, "exposure": "internet", "labels": {"team": "payments"}}, "revision": {"repository": "acme/api", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "ref_moved": false}, "diff": {}, "sbom": {"sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "component_count": 214, "link": "https://scrs.example.com/scrs/v1/assessments/c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44/sbom"}, "links": {"self": "https://scrs.example.com/scrs/v1/assessments/c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44"}, "untrusted_paths": ["/findings/0/title"], "findings": [], "findings_truncated": {"path": "/findings", "total": 7, "returned": 0, "next": "https://scrs.example.com/scrs/v1/assessments/c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44/findings"}}, schema: {type: object, description: 'JSON document for automation and AI agents: `verdict`, the gate rule that produced it, `findings` with `guidance`, counts and the asset''s business context. Text that comes from the repository is marked untrusted in the `agent` profile. The `full` and `agent` payloads of `assessment.completed` carry the same context (schemas: `GET /schemas/events`).'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
