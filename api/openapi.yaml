  /assets/{id}/chronicle/search:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      tags: [Advisories and summaries]
      operationId: searchAssetChronicle
      security: [{bearerAuth: [read]}, {bearerAuth: [write]}]
      summary: Search the chronicle by meaning
      description: |
        Finds the parts of an asset's chronicle (advisories, summaries, code reviews) closest in meaning to a question, for example "what did we decide about the lodash finding?". The question is embedded by the self-hosted embedding server (nothing goes to a hosted provider) and compared with the stored chunks by cosine similarity; each hit is a chunk of text with its document, kind and `score` (0 to 1). Only documents of this asset are searched, superseded ones only with `include_superseded`. A document stored while embedding was unavailable has no vectors and cannot be found: `unindexed_documents` counts them, and `POST /knowledge:backfill` indexes them. `truncated` is true when the asset has more chunks than were compared. `503` when no embedding server is configured, `502` when it fails. Scope `read` or `write`.
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 500}, description: 'The question or topic in plain words'}
        - {name: k, in: query, schema: {type: integer, minimum: 1, maximum: 20, default: 8}, description: 'How many hits to return'}
        - {name: kind, in: query, schema: {type: string}, description: 'Comma separated document kinds to search, as for `GET /assets/{id}/chronicle`'}
        - {name: finding_id, in: query, schema: {type: string, format: uuid}, description: 'Only documents about this register entry'}
        - {name: include_superseded, in: query, schema: {type: boolean, default: false}, description: 'Also return documents that a newer one replaced. Default: only the current ones.'}
      responses:
        '200': {description: Nearest chunks first, content: {application/json: {schema: {$ref: '#/components/schemas/ChronicleSearchResult'}}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '502': {description: The embedding server could not embed the question, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '503': {description: No embedding server is configured, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
