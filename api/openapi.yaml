        Every advisory source: OSV.dev dumps, OpenSSF malicious packages, CISA KEV and FIRST EPSS (downloaded by `scrs-feed-sync`), the NVD CVE API 2.0 and the CVE Program's CVE Services API (synced by the worker for CVEs the register references), and imported VEX statements. Each lists its licence and terms, schedule, last sync and success, record count, lag and failures. A source with no success within twice its schedule is `stale` and raises `feed.stale` once. Scope `read` or `write`.
