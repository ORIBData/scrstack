        updated_at: {type: string, format: date-time, readOnly: true, description: 'When the record last changed (RFC 3339, UTC).'}
    DTrackFinding:
      example: {"id": "9a1b3c5d-7e2f-4a60-8b4c-0d1e2f3a4b5c", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "project": "github/acme/api", "version": "main", "finding_id": "4f8e2d1c-aaaa-bbbb-cccc-0123456789ab", "matched": false, "vulnerability_id": "GHSA-35jh-r3h4-6jhm", "vulnerability_source": "GITHUB", "analyzer": "OSSINDEX", "ids": ["GHSA-35jh-r3h4-6jhm", "CVE-2021-23337"], "purl": "pkg:npm/lodash@4.17.20", "severity": "high", "analysis_state": "NOT_SET", "suppressed": false, "pushed_status": "", "first_seen": "2026-11-16T09:30:00Z", "last_seen": "2026-11-16T09:30:00Z"}
      description: 'A finding Dependency-Track reports for an uploaded project.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'ID of this record in SCRS.'}
        asset_id: {type: string, format: uuid, description: 'Asset the project belongs to.'}
        project: {type: string, description: The Dependency-Track project name}
        version: {type: string, description: 'Project version in Dependency-Track.'}
        finding_id: {type: string, format: uuid, description: 'The register entry this finding belongs to (GET /register/{id})'}
        matched: {type: boolean, description: SCRS's own scan reports the same vulnerability on the same package}
        vulnerability_id: {type: string, description: 'Vulnerability ID, for example `CVE-2024-1234`.'}
        vulnerability_source: {type: string, description: 'Dependency-Track vulnerability source, such as NVD, GITHUB, OSV, OSSINDEX, SNYK or TRIVY'}
        analyzer: {type: string, description: 'Dependency-Track analyzer that found it, such as TRIVY_ANALYZER'}
        ids: {type: array, items: {type: string}, description: The vulnerability ID and its aliases}
        purl: {type: string, description: 'Package URL of the affected package.'}
        severity: {type: string, enum: [critical, high, medium, low, unknown], description: 'Severity as Dependency-Track rates it.'}
        analysis_state: {type: string, enum: [NOT_SET, IN_TRIAGE, EXPLOITABLE, FALSE_POSITIVE, NOT_AFFECTED, RESOLVED], description: 'Triage state in Dependency-Track.'}
        suppressed: {type: boolean, description: '`true` when it is suppressed there.'}
        pushed_status: {type: string, description: The register status last shared with Dependency-Track}
        first_seen: {type: string, format: date-time, description: 'First time it was reported (RFC 3339, UTC).'}
        last_seen: {type: string, format: date-time, description: 'Last time it was reported (RFC 3339, UTC).'}
    DTrackUpload:
      example: {"id": "2c8e4a60-9d13-4f57-b0a2-6e1d3c5f7a89", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "project_name": "github/acme/api", "project_version": "main", "status": "uploaded", "attempts": 1, "next_attempt_at": "2026-11-16T09:30:00Z", "token": "2d1f3a4b-5c6d-4e7f-8091-a2b3c4d5e6f7", "error": "", "created_at": "2026-11-16T09:30:00Z", "uploaded_at": "2026-11-16T09:30:04Z", "processing": "processed", "processing_error": "", "processed_at": "2026-11-16T09:30:20Z"}
      description: 'One SBOM upload to Dependency-Track and its delivery state.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Upload ID, used in `POST /integrations/dependency-track/uploads/{id}/retry`.'}
        assessment_id: {type: string, format: uuid, description: 'Assessment whose SBOM is sent.'}
        asset_id: {type: string, format: uuid, description: 'Asset whose SBOM was uploaded.'}
        project_name: {type: string, description: 'The Dependency-Track project: the provider and the asset locator, such as github/org/app'}
        project_version: {type: string, description: The assessed ref (else the commit or digest)}
        status: {type: string, enum: [queued, sending, uploaded, failed], description: '`queued`, `sending`, `uploaded` or `failed` after retries.'}
        attempts: {type: integer, description: 'Delivery attempts so far.'}
        next_attempt_at: {type: string, format: date-time, description: 'When it is tried next (RFC 3339, UTC).'}
        token: {type: string, description: Dependency-Track processing token}
        error: {type: string, description: 'Last error. Empty otherwise.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        uploaded_at: {type: string, format: date-time, description: When Dependency-Track accepted the BOM. Accepted is not imported; see `processing`}
        processing: {type: string, enum: [pending, processed, unconfirmed, failed], description: 'Dependency-Track processes an accepted BOM afterwards, and the worker checks the outcome about every 30 seconds for up to ten minutes. `pending`: not yet checked or still running. `processed`: finished and the project''s last BOM import is newer than the upload. `unconfirmed`: finished, but the key cannot read projects (`VIEW_PORTFOLIO`) or the check ran out of time. `failed`: finished without importing the BOM; emits `dependency_track.upload_failed`'}
        processing_error: {type: string, description: Why `processing` is `unconfirmed` or `failed`}
        processed_at: {type: string, format: date-time, description: 'When it finished (RFC 3339, UTC).'}
    FrameworkPack:
      example: {"id": "owasp-top10-2021", "name": "OWASP Top 10", "version": "2021", "kind": "cwe_mapping", "source": "OWASP", "url": "https://owasp.org/Top10/", "builtin": true, "categories": [{"id": "A03", "name": "Injection", "cwes": [79, 89, 94]}], "type_categories": {"secret": "A02"}, "type_categories_note": "Entry types with no CWE are mapped by type."}
      type: object
      description: A versioned framework data pack. Uploads use kind `cwe_mapping`, or `stig` for an edited imported STIG; schema at `GET /schemas/framework-pack`.
      required: [id, name, version, kind]
      properties:
        id: {type: string, examples: [owasp-top10-2025], description: 'Pack ID, for example `owasp-top10-2021`.'}
        name: {type: string, description: 'Name shown in report pickers.'}
        version: {type: string, description: 'Version of the framework, for example `2021` for the OWASP Top 10.'}
        kind: {type: string, enum: [cwe_mapping, pci_dss, stig], description: '`cwe_mapping` (OWASP, CWE Top 25), `pci_dss` or `stig`.'}
        benchmark: {type: object, description: 'For `stig` packs only: the benchmark the rules come from.', properties: {id: {type: string, description: 'STIG benchmark ID.'}, title: {type: string, description: 'STIG benchmark title.'}, version: {type: string, description: 'STIG benchmark version.'}, release: {type: string, description: 'STIG release and date.'}}}
        source: {type: string, description: Where the mapping comes from}
        url: {type: string, description: 'Where the framework is published.'}
        builtin: {type: boolean, readOnly: true, description: '`true` for packs shipped with SCRS.'}
        categories: {type: array, items: {type: object, properties: {id: {type: string, description: 'Category ID, for example `A03`.'}, name: {type: string, description: 'Name of the category, requirement group or STIG rule title.'}, cwes: {type: array, items: {type: integer}, description: 'CWE numbers that map to it.'}, severity: {type: string, enum: [CAT I, CAT II, CAT III], description: 'For `stig` packs only: the STIG category, `CAT I` being the most severe.'}, vuln_id: {type: string, description: 'STIG vulnerability ID.'}, rule_id: {type: string, description: 'STIG rule ID.'}, ccis: {type: array, items: {type: string}, description: 'Control Correlation Identifiers (CCI) the rule maps to.'}}}, description: 'Categories of the framework.'}
        type_categories: {type: object, additionalProperties: {type: string}, description: 'Finding types without a CWE of their own (vulnerable or malicious dependency, integrity, secret, misconfiguration) mapped to a category'}
        type_categories_note: {type: string, description: 'Note on finding types mapped without a CWE.'}
        requirements: {type: array, items: {type: object, properties: {id: {type: string, description: 'Requirement number, for example `6.3.2`.'}, title: {type: string, description: 'Requirement title.'}, evidence: {type: string, description: 'What SCRS can show as evidence for it.'}}}, description: 'Requirements of a PCI DSS pack.'}
    ReportScope:
      description: 'What a report covers.'
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [asset, owner, portfolio], description: '`asset` one asset, `owner` all assets of an owner, `portfolio` everything.'}
        id: {type: string, format: uuid, description: Asset or owner id; omit for the portfolio}
        name: {type: string, readOnly: true, description: 'Name of the asset or owner. Empty for the portfolio.'}
    ReportRequest:
      description: 'Body to request a compliance report.'
      type: object
      example: {"framework": "owasp-top10-2025", "scope": {"kind": "owner", "id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "name": "Payments team"}, "since": "2026-08-18T00:00:00Z", "format": "pdf"}
      additionalProperties: false
      required: [framework, scope]
      properties:
        framework: {type: string, examples: [owasp-top10-2025, pci-dss-4.0.1], description: 'Framework pack ID, for example `owasp-top10-2021`.'}
        scope: {$ref: '#/components/schemas/ReportScope'}
        since: {type: string, format: date-time, description: Default 90 days before until}
        until: {type: string, format: date-time, description: 'Look at activity up to this time (RFC 3339, UTC). Defaults to now.'}
        format: {type: string, enum: [json, csv, md, pdf], default: json, description: 'pdf is an A4 text layout with the same content as md; the same report always produces the same bytes'}
        params:
          description: 'Framework-specific options. See the framework''s documentation.'
          type: object
          additionalProperties: false
          properties:
            sbom_max_age_days: {type: integer, minimum: 0, maximum: 3650, description: An asset without an SBOM this recent is a gap (default 30)}
            sla_critical_days: {type: integer, minimum: 0, maximum: 3650, description: PCI DSS 6.3.3 patch window for critical (default 30)}
            sla_high_days: {type: integer, minimum: 0, maximum: 3650, description: Patch window for high (default 90)}
            include_ai_summaries: {type: boolean, default: false, description: 'Adds the newest AI-written assessment summary of each asset in scope (see `POST /assessments/{id}/summaries`), marked unverified, in the json, md and pdf formats (csv is unchanged). It changes no count, mapping or gap; the notice `ai_summary_notice` travels with it'}
    ReportJob:
      description: 'A report being generated or ready to download.'
      type: object
      example: {"id": "b8c0d2e4-1f3a-4b5c-8d7e-9a0b1c2d3e4f", "framework": "owasp-top10-2025", "scope": {"kind": "owner", "id": "2f7b9d60-1a4c-4e83-b5d2-6c0e8a1f3b97", "name": "Payments team"}, "since": "2026-08-18T00:00:00Z", "until": "2026-11-16T09:30:00Z", "format": "pdf", "status": "succeeded", "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "size": 48213, "data_as_of": "2026-11-16T09:30:00Z", "scrs_version": "1.0.0", "summary": {"assets": 12, "gaps": 2, "findings_considered": 64, "open": 19, "unmapped": 3}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:30:41Z"}
      properties:
        id: {type: string, format: uuid, description: 'Report ID, also its job ID.'}
        framework: {type: string, description: 'ID of the framework pack the report uses.'}
        scope: {$ref: '#/components/schemas/ReportScope'}
        since: {type: string, format: date-time, description: 'Start of the period covered (RFC 3339, UTC).'}
        until: {type: string, format: date-time, description: 'End of the period covered (RFC 3339, UTC).'}
        format: {type: string, enum: [json, csv, md, pdf], description: 'Output format: `json`, `csv`, `md` or `pdf`.'}
        params: {type: object, description: 'Options the report was requested with.'}
        status: {type: string, enum: [queued, running, succeeded, failed], description: '`queued`, `running`, `succeeded` or `failed`.'}
        sha256: {type: string, description: 'SHA-256 of the file once ready.'}
        size: {type: integer, description: 'File size in bytes once ready.'}
        data_as_of: {type: string, format: date-time, description: 'Time of the newest data in the report (RFC 3339, UTC).'}
        scrs_version: {type: string, description: 'SCRS version that produced it.'}
        feed_freshness: {type: array, items: {type: object, properties: {key: {type: string, description: 'Feed key, as in `GET /intel/vulnerability-sources`.'}, name: {type: string, description: 'Feed name shown to people.'}, last_success_at: {type: [string, 'null'], format: date-time, description: 'Last successful sync, or `null`.'}, stale: {type: boolean, description: '`true` when the feed is overdue.'}}}, description: 'Age of each threat data feed when the report was built, so a reader can judge it.'}
        summary: {type: object, description: 'assets, gaps, findings_considered, open, unmapped counts'}
        error: {type: string, description: 'Why it failed. Empty otherwise.'}
        requested_by: {type: string, format: uuid, description: 'Token that requested it.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        completed_at: {type: string, format: date-time, description: 'When it finished (RFC 3339, UTC).'}
    EvidenceReport:
      type: object
      description: A built evidence report. `statement` says it is not a certification; there is no verdict field.
      properties:
        report: {type: object, description: 'id, framework, scope, since, until, data_as_of, scrs_version, format, params'}
        statement: {type: string, description: 'Plain-language statement of scope and limits. Include it when you share the report.'}
        feed_freshness: {type: array, items: {type: object}, description: 'Age of each threat data feed.'}
        assets: {type: array, items: {type: object}, description: 'Assets covered by the report, with their numbers.'}
        gaps: {type: array, items: {type: object, properties: {asset_id: {type: string, format: uuid, description: 'Asset the report could not cover.'}, locator: {type: string, description: 'Repository or image name of that asset.'}, reason: {type: string, description: 'Why it is missing, for example no finished assessment.'}}}, description: 'Assets the report could not cover.'}
        totals: {type: object, description: 'Counts for the whole scope, by category.'}
        categories: {type: array, items: {type: object}, description: 'One entry per category: open findings, findings opened and closed in the window, a count by severity, CWE counts and a weekly trend.'}
        unmapped: {type: object, properties: {no_cwe: {type: integer, description: 'Findings without a CWE.'}, cwe_outside_pack: {type: integer, description: 'Findings whose CWE the pack does not include.'}, top_outside_pack: {type: array, items: {type: object}, description: 'Most common CWEs outside the pack.'}}, description: 'Findings that map to no category of the framework.'}
        requirements: {type: array, items: {type: object}, description: 'Evidence metrics for PCI DSS requirements 6.3.1, 6.3.2 and 6.3.3.'}
        stig:
          type: object
          description: 'STIG packs only. Each category also carries `severity` (CAT I to III) and `evidence`: open_findings, no_open_findings (SCRS scans cover the rule and report nothing open) or not_evidenced (manual review). These are not STIG checklist statuses.'
          properties:
            benchmark: {type: object, description: 'The STIG benchmark used.'}
            rules: {type: integer, description: 'Rules in the benchmark.'}
            rules_by_evidence: {type: object, additionalProperties: {type: integer}, description: 'Rules by how much evidence SCRS has.'}
            rules_with_open_findings_by_cat: {type: object, additionalProperties: {type: integer}, description: 'Rules with open findings, by STIG category (CAT I to III).'}
    Finding:
      description: 'One entry in the risk register: a deduplicated problem on an asset, with its triage state.'
      type: object
      example: {"id": "9a4d2e71-5c08-4f3b-a6d9-0e8b1c7f2a35", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "fingerprint": "vulnerability:npm:lodash:CVE-2021-23337", "ref": "main", "type": "vulnerability", "advisory_id": "CVE-2021-23337", "title": "lodash command injection in template", "severity": "high", "score": 78, "status": "open", "component": {"name": "lodash", "version": "4.17.20", "ecosystem": "npm", "purl": "pkg:npm/lodash@4.17.20", "path": "package-lock.json", "license": {"spdx": "MIT"}}, "guidance": {"summary": "Upgrade lodash", "fixed_versions": ["4.17.21"], "smallest_safe_upgrade": "4.17.21", "kev": false, "epss": 0.012}, "first_seen": "2026-11-16T09:30:00Z", "last_seen": "2026-11-16T09:30:00Z", "change": "new"}
      properties:
        id: {type: string, format: uuid, description: 'Register entry ID, used in `/register/{id}`.'}
        asset_id: {type: string, format: uuid, description: 'Asset it belongs to.'}
        fingerprint: {type: string, description: 'Stable hash used to recognise the same problem across assessments.'}
        ref: {type: string, description: 'Branch or tag where it was last seen.'}
        type: {type: string, enum: [vulnerability, malicious_dependency, suspicious_dependency, malware, ioc_match, integrity, posture, misconfiguration, secret, code, yara_match, yara_alert, yara_hunt, ioc_alert, ioc_hunt, qa_failure, qa_untested, qa_performance, qa_config, qa_unconfigured, qa_lint, qa_lint_config, license, sast, dt_vulnerability, ai_review], description: '`ai_review` is a finding of the AI code review (see `POST /assets/{id}/ai-reviews`): written by a language model, marked `unverified` in its evidence, report-only and never part of a verdict. `dt_vulnerability` is a vulnerability only Dependency-Track reported (see `PUT /integrations/dependency-track`): report-only, and closed when Dependency-Track stops reporting it. Threat-intelligence types carry the source mode. `yara_match` and `ioc_match` (block) fail like malware, `yara_alert` and `ioc_alert` gate by severity, `yara_hunt` and `ioc_hunt` never gate. E2E QA types (`qa_*`) are report-only and never gate. `license` entries (advisory id `SCRS-LICENSE:<expression>`, or `SCRS-LICENSE-OUTBOUND:<project licence>:<expression>` for a runtime dependency incompatible with, or needing review against, the licence of the repository itself in a SaaS or distributed asset) follow the licence policy: report-only, a deny warns; enforcing, deny fails and review warns. `sast` entries (advisory id `<tool>:<rule>`, evidence with tool, rule, CWE ids, path and lines, code hash, data-flow steps and `suppressed_in_code`; no code) gate only when new: a new critical fails, a new high warns; inline-suppressed entries never gate, and a suppression added for an open entry raises integrity entry `SCRS-SAST-SUPPRESSION-ADDED`. Vulnerability evidence carries `reachability` (status reachable, imported_only, not_reachable, unknown or unsupported; method, tool, confidence, file-and-line trace) when reachability ran; reachable adds 10 to the score and not reachable subtracts 15, known-exploited entries keep at least 45, and nothing is closed for being unreachable'}
        advisory_id: {type: string, description: 'For YARA findings `YARA:<ruleset>:<rule>`'}
        title: {type: string, description: 'Short description shown in lists.'}
        severity: {type: string, enum: [critical, high, medium, low, info, unknown], description: 'Severity after scoring.'}
        score: {type: integer, minimum: 0, maximum: 100, description: 'Priority score from 0 to 100. Higher is more urgent.'}
        status: {type: string, enum: [open, triaged, in_progress, accepted, suppressed, false_positive, fixed], description: 'Triage state: `open` new; `triaged` seen; `in_progress` being fixed; `accepted` waived until `waiver_until`; `suppressed` hidden; `false_positive`; `fixed` no longer reported.'}
        component: {$ref: '#/components/schemas/Component'}
        evidence: {type: object, description: 'Type-specific detail. For an entry about a dependency that is new since the previous assessment of the ref (vulnerability, malicious_dependency, suspicious_dependency, license) it carries `introduced_by`: the revision (`commit`, `ref`, `assessment_id`) and the trigger''s `actor` and `origin`. The actor is whatever the trigger claimed, for example the pusher named in a webhook, never verified. It stays on the entry for its life.'}
        guidance: {type: object, description: 'summary, reference, kev, epss; for vulnerabilities fixed_versions, safe_versions (ascending, at most ten), smallest_safe_upgrade, latest_safe and safe_basis (advisories checked, whether the full local mirror set was used, and whether registry version lists or only advisory fixes were candidates)'}
        first_seen: {type: string, format: date-time, description: 'When it first appeared (RFC 3339, UTC).'}
        last_seen: {type: string, format: date-time, description: 'When an assessment last reported it (RFC 3339, UTC).'}
        waiver_until: {type: string, format: date-time, description: 'When an `accepted` waiver ends and it reopens (RFC 3339, UTC).'}
        assignee: {type: string, description: 'Who holds the entry (free text; absent when unassigned). Read live from the register, so it is not in an assessment''s frozen findings'}
        assigned_at: {type: string, format: date-time, description: 'When it was assigned (RFC 3339, UTC).'}
        comment_count: {type: integer, description: Comments on the entry; absent when none}
        source_repository: {type: string, description: 'For an entry of a container image: the repository it was built from, when a link exists (see `GET /assets/{id}/links`); absent otherwise'}
        change: {type: string, enum: [new, existing], description: 'Inside one assessment: `new` since the previous assessment of the ref, or `existing`.'}
    RegisterSummary:
      description: 'Counts for a risk-register dashboard.'
      type: object
      example: {"total": 148, "open": 61, "by_status": {"open": 44, "triaged": 9, "in_progress": 8, "accepted": 12, "fixed": 75}, "open_by_severity": {"critical": 2, "high": 14, "medium": 29, "low": 16}, "open_by_type": {"vulnerability": 48, "license": 9, "sast": 4}, "waivers_expiring_30d": 3, "oldest_open_age_days": 87}
      properties:
        total: {type: integer, description: 'All entries that match the filters.'}
        open: {type: integer, description: 'Entries in `open`, `triaged` or `in_progress`'}
        by_status: {type: object, additionalProperties: {type: integer}, description: 'Entries per triage status.'}
        open_by_severity: {type: object, additionalProperties: {type: integer}, description: 'Open entries per severity.'}
        open_by_type: {type: object, additionalProperties: {type: integer}, description: 'Open entries per type (vulnerability, malware, licence and so on).'}
        waivers_expiring_30d: {type: integer, description: 'Accepted entries whose waiver ends within 30 days.'}
        oldest_open_age_days: {type: integer, description: 'Age in days of the oldest open entry.'}
    RegisterTimeseries:
      description: 'Entries found and fixed per day, for a trend chart.'
      type: object
      example: {"days": 7, "items": [{"day": "2026-11-10", "detected": 4, "fixed": 1}, {"day": "2026-11-11", "detected": 0, "fixed": 2}, {"day": "2026-11-12", "detected": 7, "fixed": 0}]}
      properties:
        days: {type: integer, description: 'Number of days covered.'}
        items:
          description: 'One point per day, oldest first.'
          type: array
          items:
            type: object
            properties:
              day: {type: string, format: date, description: 'Calendar day (UTC), as `YYYY-MM-DD`.'}
              detected: {type: integer, description: 'Entries first seen that day.'}
              fixed: {type: integer, description: 'Entries fixed that day.'}
    RegisterTopAssets:
      description: 'Assets with the most open entries.'
      type: object
      example: {"items": [{"asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "locator": "acme/api", "open": 17, "open_by_severity": {"critical": 1, "high": 6, "medium": 10}, "max_score": 92}]}
      properties:
        items:
          description: 'Assets, worst first.'
          type: array
          items:
            type: object
            properties:
              asset_id: {type: string, format: uuid, description: 'Asset the counts are for.'}
              locator: {type: string, description: 'The asset''s locator, for example `org/repo`'}
              open: {type: integer, description: 'Entries that are not fixed, waived or suppressed.'}
              open_by_severity: {type: object, additionalProperties: {type: integer}, description: 'Open entries per severity.'}
              max_score: {type: integer, description: 'Highest score among them.'}
    RegisterExport:
      description: 'A bounded export of register entries.'
      type: object
      example: {"items": [{"id": "9a4d2e71-5c08-4f3b-a6d9-0e8b1c7f2a35", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "fingerprint": "vulnerability:npm:lodash:CVE-2021-23337", "ref": "main", "type": "vulnerability", "advisory_id": "CVE-2021-23337", "title": "lodash command injection in template", "severity": "high", "score": 78, "status": "open", "component": {"name": "lodash", "version": "4.17.20", "ecosystem": "npm", "purl": "pkg:npm/lodash@4.17.20", "path": "package-lock.json", "license": {"spdx": "MIT"}}, "guidance": {"summary": "Upgrade lodash", "fixed_versions": ["4.17.21"], "smallest_safe_upgrade": "4.17.21", "kev": false, "epss": 0.012}, "first_seen": "2026-11-16T09:30:00Z", "last_seen": "2026-11-16T09:30:00Z", "change": "new"}], "truncated": false}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Finding'}, description: 'Register entries, one per row of the export.'}
        truncated: {type: boolean, description: '`true` when more entries match than the export limit.'}
    FindingPage:
      description: 'One page of register entries.'
      type: object
      example: {"items": [{"id": "9a4d2e71-5c08-4f3b-a6d9-0e8b1c7f2a35", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "fingerprint": "vulnerability:npm:lodash:CVE-2021-23337", "ref": "main", "type": "vulnerability", "advisory_id": "CVE-2021-23337", "title": "lodash command injection in template", "severity": "high", "score": 78, "status": "open", "component": {"name": "lodash", "version": "4.17.20", "ecosystem": "npm", "purl": "pkg:npm/lodash@4.17.20", "path": "package-lock.json", "license": {"spdx": "MIT"}}, "guidance": {"summary": "Upgrade lodash", "fixed_versions": ["4.17.21"], "smallest_safe_upgrade": "4.17.21", "kev": false, "epss": 0.012}, "first_seen": "2026-11-16T09:30:00Z", "last_seen": "2026-11-16T09:30:00Z", "change": "new"}], "next_cursor": "eyJpZCI6IjlhNGQyZTcxIn0"}
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Finding'}, description: 'Entries on this page.'}
        next_cursor: {type: string, description: 'Pass as `cursor` to get the next page. Empty on the last page.'}
    FileEvidence:
      example: {"path": "src/server.js", "sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "size": 4821, "malware": "clean"}
      description: 'A file of the assessed source with its malware scan result.'
      type: object
      properties:
        path: {type: string, description: 'File path in the repository or image.'}
        sha256: {type: string, description: 'SHA-256 of the file.'}
        size: {type: integer, description: 'File size in bytes.'}
        malware: {type: string, enum: [clean, infected, error, skipped, skipped_oversize], description: 'Scan result: `clean`, `infected`, `error`, `skipped`, or `skipped_oversize` when over the size limit.'}
    IngestOutcome:
      example: {"status": "recorded", "integrity_signals": 0}
      description: 'Result of a provider webhook SCRS accepted.'
      type: object
      properties:
        status: {type: string, examples: [ignored_event, recorded, ignored_out_of_scope], description: 'What SCRS did with the event: `recorded` it, or ignored it with a reason such as `ignored_event`, `ignored_deleted_ref`, `ignored_non_branch_ref`, `ignored_pull_request_action` or `ignored_out_of_scope`.'}
        integrity_signals: {type: integer, description: 'Integrity signals the event raised.'}
    RegistryIngestResult:
      example: {"status": "recorded", "items": [{"locator": "acme/api", "tag": "1.4.2", "digest": "sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "status": "queued", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44"}]}
      description: 'Result of a registry webhook, one entry per pushed image.'
      type: object
      properties:
        status: {type: string, description: 'Overall outcome: `recorded`, or why nothing was queued.'}
        items:
          description: 'One result per image reference in the event.'
          type: array
          items:
            type: object
            properties:
              locator: {type: string, description: 'Repository path in the registry.'}
              tag: {type: string, description: 'Image tag that was pushed.'}
              digest: {type: string, description: 'Image digest pushed.'}
              status: {type: string, enum: [queued, replayed, ignored_out_of_scope, invalid_reference, ambiguous_connection], description: '`queued` assessment started; `replayed` already seen; `ignored_out_of_scope` not an asset of the connection; `invalid_reference` unreadable; `ambiguous_connection` more than one connection could own it.'}
              assessment_id: {type: string, format: uuid, description: 'Assessment created, when one was.'}
    EventType:
      type: string
      enum: [assessment.completed, assessment.failed, finding.created, finding.status_changed, finding.assigned, finding.rescored, malicious_dependency.reported, integrity.alert, feed.stale, connection.degraded, maintenance.completed, qa.completed, qa.failed, dependency_track.upload_failed, system.degraded, system.recovered, ping]
      description: |
        `assessment.completed` and `assessment.failed`: an assessment finished. `finding.created`, `finding.status_changed`,
        `finding.assigned` (an entry's assignee changed or was cleared), `finding.rescored`, `malicious_dependency.reported`: risk register changes. `integrity.alert`: a repository integrity rule fired.
        `feed.stale`: a vulnerability, advisory or threat-intelligence source stopped updating. `connection.degraded`: a provider
        connection check failed. `maintenance.completed`: scheduled maintenance ran. `qa.completed`, `qa.failed`: an E2E QA run finished.
        `dependency_track.upload_failed`: an SBOM upload to Dependency-Track was rejected for good, or Dependency-Track accepted it but did not import it (`stage` is `upload` or `processing`).
        `system.degraded`: the platform status (see `GET /system/status`) left `ok` or changed between `degraded` and `down`; lists the
        failing components. `system.recovered`: the status returned to `ok`, with how long it was not ok. `ping`: sent by a webhook test.
    AuthHeader:
      type: object
      description: Configure as Header Auth in n8n (name and value).
      properties:
        name: {type: string, const: X-SCRS-Auth, description: 'Header name, always `X-SCRS-Auth`.'}
        value: {type: string, description: 'Header value. Shown once, when the subscription is created or its secret rotated.'}
    Subscription:
      description: 'An outbound webhook: where SCRS sends events and which.'
      type: object
      example: {"id": "1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", "name": "n8n-prod", "url": "https://n8n.example.com/webhook/scrs", "events": ["assessment.completed", "finding.created"], "profile": "summary", "egress_ack": true, "include_contacts": false, "connections": [], "enabled": true, "revision": 1, "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}
      properties:
        id: {type: string, format: uuid, description: 'Subscription ID, used in `/webhooks/{id}`.'}
        name: {type: string, description: 'Unique name. A request can limit delivery to subscriptions by name (`notify`).'}
        url: {type: string, description: 'HTTPS endpoint that receives the events, or a `mailto:` address list when the subscription sends email.'}
        events: {type: array, items: {$ref: '#/components/schemas/EventType'}, description: 'Event types delivered.'}
        profile: {type: string, enum: [summary, full, agent], description: 'How much each payload carries: `summary` ids and counts; `full` and `agent` add the assessment context document (`agent` is shaped for an AI agent). `full` and `agent` need `egress_ack`.'}
        egress_ack: {type: boolean, description: '`true` when an administrator acknowledged that `full` and `agent` payloads leave SCRS.'}
        include_contacts: {type: boolean, description: 'Add owner contacts to payloads.'}
        connections: {type: array, items: {type: string, format: uuid}, description: Connection scope; empty receives every connection's events}
        enabled: {type: boolean, description: '`false` pauses delivery.'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        updated_at: {type: string, format: date-time, description: 'When the record last changed (RFC 3339, UTC).'}
    SubscriptionSecret:
      example: {"secret": "whsec_4f1e0c7a9b2d58163e0a7c4b9d1f2a38", "auth_header": {"name": "X-SCRS-Auth", "value": "scrs_7c2a91e04b5d83f6a1c0e9d2b47f3a58"}, "subscription": {"id": "1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", "name": "n8n-prod", "url": "https://n8n.example.com/webhook/scrs", "events": ["assessment.completed", "finding.created"], "profile": "summary", "egress_ack": true, "include_contacts": false, "connections": [], "enabled": true, "revision": 1, "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z"}}
      description: 'Signing secret and auth header of a subscription. Returned once.'
      type: object
      properties:
        secret: {type: string, description: HMAC signing secret (shown once)}
        auth_header: {$ref: '#/components/schemas/AuthHeader'}
        subscription: {$ref: '#/components/schemas/Subscription'}
    Delivery:
      example: {"id": "5e0b7a14-9c32-4d8f-a1b6-3f7c2d9e0a85", "subscription_id": "1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f", "event_id": "b2c4e6a8-1d3f-4a5b-9c7e-0f1a2b3c4d5e", "event_type": "assessment.completed", "status": "delivered", "attempts": 1, "next_attempt_at": "2026-11-16T09:30:00Z", "last_status": 200, "last_error": "", "created_at": "2026-11-16T09:30:00Z", "delivered_at": "2026-11-16T09:30:02Z", "payload": {"event": {"id": "b2c4e6a8-1d3f-4a5b-9c7e-0f1a2b3c4d5e", "type": "assessment.completed", "version": 1, "time": "2026-11-16T09:30:00Z"}, "data": {}}}
      description: 'One attempt series to deliver an event to a subscription.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Delivery ID, used to redeliver it.'}
        subscription_id: {type: string, format: uuid, description: 'Subscription the delivery belongs to.'}
        event_id: {type: string, format: uuid, description: 'Event ID, also sent as `Idempotency-Key`.'}
        event_type: {$ref: '#/components/schemas/EventType'}
        status: {type: string, enum: [pending, sending, delivered, dead], description: '`pending` or `sending` in progress; `delivered`; `dead` after the retries were used up.'}
        attempts: {type: integer, description: 'Attempts made so far. After 8 failures it becomes `dead`.'}
        next_attempt_at: {type: string, format: date-time, description: 'When the next attempt is due (RFC 3339, UTC).'}
        last_status: {type: integer, description: 'HTTP status the receiver answered on the last attempt. Empty or 0 when none was received.'}
        last_error: {type: string, description: 'Error of the last attempt.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        delivered_at: {type: [string, 'null'], format: date-time, description: 'When it succeeded, or `null`.'}
        payload: {type: object, description: 'The JSON body that is sent.'}
    IndicatorBundle:
      example: {"version": "2026-11-16", "indicators": [{"id": "ioc-1", "type": "domain", "value": "evil.example.net", "valid_until": "2027-02-14T00:00:00Z", "confidence": 80}]}
      description: 'Versioned indicators of compromise that SCRS matches against source.'
      type: object
      additionalProperties: false
      required: [version, indicators]
      properties:
        version: {type: string, minLength: 1, maxLength: 128, description: 'Bundle version, set by the author.'}
        indicators:
          type: array
          maxItems: 50000
          description: At most 10000 on `PUT /feeds/indicators`
          items:
            type: object
            additionalProperties: false
            required: [id, type, value, valid_until]
            properties:
              id: {type: string, maxLength: 128, description: Unique within the bundle}
              type: {type: string, enum: [sha256, sha1, md5, domain, ipv4, ipv6, url, purl, workflow_step_name, file_path_regex, file_content_regex, git_branch_regex, commit_message_regex, pr_title_regex], description: 'What the value is: a hash, domain, address, URL, package URL, or a regular expression over a workflow step name, file path, file content, branch name, commit message or pull request title.'}
              value: {type: string, description: 'Defanged domains, addresses and URLs (`[.]`, `hxxp`) are normalized. URLs are http, https or ftp and match exactly after lower-casing the scheme and host and dropping the fragment.'}
              valid_until: {type: string, format: date-time, description: 'When the indicator stops matching (RFC 3339, UTC).'}
              confidence: {type: integer, minimum: 0, maximum: 100, description: 'As in STIX 2.1; compared with the source''s `min_confidence`'}
    InboundEvent:
      example: {"id": "f0a2c4e6-8b1d-4357-9a6c-2e4f6b8d0a13", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "mode": "direct", "event_type": "push", "created_at": "2026-11-16T09:30:00Z", "body": {"ref": "refs/heads/main", "repository": {"full_name": "acme/api"}}}
      description: 'A provider or automation event SCRS received, kept for audit and replay.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Inbound event ID, used in `/events/inbound/{id}`.'}
        assessment_id: {type: [string, 'null'], format: uuid, description: 'Assessment it started, or `null`.'}
        mode: {type: string, enum: [direct, relay, trigger], description: 'How it arrived: `direct` from the provider, `relay` forwarded by automation, `trigger` through `POST /assessments`.'}
        event_type: {type: string, description: 'Provider event name, for example `push`.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        body: {type: object, description: 'The event body as received.'}
    Retention:
      example: {"revision": 2, "inbound_event_days": 30, "webhook_delivery_days": 30, "classes": [{"class": "inbound_events", "guard": "events of queued or running assessments", "days": 30, "effective_days": 30, "source": "policy", "minimum_days": 0, "last_purged_at": "2026-11-16T09:30:00Z", "last_purged_count": 128}, {"class": "closed_findings", "guard": "open, triaged, in-progress and accepted entries; assets on legal hold", "days": null, "effective_days": 0, "source": "default", "minimum_days": 0, "last_purged_at": null, "last_purged_count": 0}, {"class": "audit_log", "guard": "at least 365 days are always kept", "days": 730, "effective_days": 730, "source": "policy", "minimum_days": 365, "last_purged_at": null, "last_purged_count": 0}]}
      description: 'How long each kind of data is kept.'
      type: object
      properties:
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        inbound_event_days: {type: integer, description: 'Days to keep raw inbound events; 0 keeps them forever. The original setting, shown in `classes` as `inbound_events`.'}
        webhook_delivery_days: {type: integer, description: 'Days to keep webhook deliveries; 0 keeps them forever. Shown in `classes` as `webhook_deliveries`.'}
        classes:
          description: 'Every data class with its setting.'
          type: array
          items:
            type: object
            properties:
              class: {type: string, enum: [inbound_events, webhook_deliveries, closed_findings, scan_artifacts, sbom_documents, source_snapshots, uploaded_archives, remediation_plans, qa_reports, reports, expired_indicators, audit_log], description: 'Kind of data the setting covers, for example `closed_findings` or `audit_log`.'}
              description: {type: string, description: 'What the class holds.'}
              guard: {type: string, description: What the class never purges}
              days: {type: [integer, 'null'], description: 'Days you set, or `null` to use the default. 0 keeps the data forever.'}
              effective_days: {type: integer, description: 'Days that apply now.'}
              source: {type: string, enum: [policy, default], description: '`policy` you set it; `default` built-in.'}
              minimum_days: {type: integer, description: 'Shortest value allowed.'}
              last_purged_at: {type: [string, 'null'], format: date-time, description: 'When the last purge ran, or `null`.'}
              last_purged_count: {type: integer, description: 'Records removed by that purge.'}
    MaintenanceReport:
      example: {"inbound_events_purged": 128, "webhook_deliveries_purged": 342, "idempotency_keys_expired": 57, "rescans_queued": 0, "skipped_concurrent_run": false, "purged": {"closed_findings": 12}, "objects_deleted": 3, "object_errors": 0, "orphans_deleted": 0}
      description: 'What a maintenance run did.'
      type: object
      properties:
        inbound_events_purged: {type: integer, description: 'Inbound events removed.'}
        webhook_deliveries_purged: {type: integer, description: 'Webhook deliveries removed.'}
        idempotency_keys_expired: {type: integer, description: 'Idempotency keys removed after 24 hours.'}
        rescans_queued: {type: integer, description: 'Scheduled assessments queued.'}
        skipped_concurrent_run: {type: boolean, description: '`true` when another run held the lock and this one did nothing.'}
        purged: {type: object, additionalProperties: {type: integer}, description: Rows removed per retention class}
        objects_deleted: {type: integer, description: 'Stored objects deleted.'}
        object_errors: {type: integer, description: 'Objects it could not delete.'}
        orphans_deleted: {type: integer, description: 'Unreferenced artifacts older than 24 hours removed by the daily orphan sweep (an upload whose database write never committed)'}
    AuditEntry:
      example: {"id": 1042, "occurred_at": "2026-11-16T09:30:00Z", "action": "connection.updated", "target_id": "5d1a7c34-82f0-4e0b-b6c1-7a9e2f3d4b10", "details": {"actor": "admin-console"}}
      description: 'One audit-log entry for a change made through the API.'
      type: object
      properties:
        id: {type: integer, description: 'Sequence number of the entry.'}
        occurred_at: {type: string, format: date-time, description: 'When it happened (RFC 3339, UTC).'}
        action: {type: string, description: 'What was done, for example `token.created`.'}
        target_id: {type: [string, 'null'], format: uuid, description: 'ID of the thing changed, or `null`.'}
        details: {type: object, description: 'Action-specific details. Secrets are never included.'}
    VulnerabilitySource:
      example: {"key": "osv", "name": "OSV", "kind": "vulnerability database", "url": "https://osv.dev", "managed_by": "feed-sync", "schedule_minutes": 60, "licence": "CC-BY-4.0", "terms_url": "https://osv.dev/docs/", "restricted": false, "enabled": true, "state": {}, "last_sync_at": "2026-11-16T09:30:00Z", "last_success_at": "2026-11-16T09:30:00Z", "next_sync_at": "2026-11-16T10:30:00Z", "record_count": 412345, "last_error": "", "failures": 0, "stale": false, "lag_seconds": 120, "revision": 4}
      description: 'A vulnerability or threat data feed and how fresh it is.'
      type: object
      properties:
        key: {type: string, enum: [osv, malicious_packages, kev, epss, nvd, cve_program, vex], description: 'Feed key: `osv`, `malicious_packages`, `kev`, `epss`, `nvd`, `cve_program` or `vex`.'}
        name: {type: string, description: 'Name shown to people.'}
        kind: {type: string, description: 'What it provides, for example advisories, malicious packages or exploit data.'}
        url: {type: string, description: 'Where it is read from.'}
        managed_by: {type: string, enum: [feed-sync, worker, operator], description: 'Who fills it: `feed-sync` or `worker` sync it on a schedule; `operator` means it holds what you import (VEX documents).'}
        schedule_minutes: {type: integer, description: 'Minutes between syncs.'}
        licence: {type: string, description: 'Licence of the data.'}
        terms_url: {type: string, description: 'Link to the feed''s terms of use.'}
        restricted: {type: boolean, description: Licence restricts use; enabling needs acknowledge_terms}
        enabled: {type: boolean, description: '`false` stops syncing it.'}
        state: {type: object, description: 'Feed-specific sync state, for example a cursor.'}
        last_sync_at: {type: [string, 'null'], format: date-time, description: 'When the last sync started, or `null`.'}
        last_success_at: {type: [string, 'null'], format: date-time, description: 'When a sync last succeeded, or `null`.'}
        next_sync_at: {type: string, format: date-time, description: 'When the next sync is due (RFC 3339, UTC).'}
        record_count: {type: integer, description: 'Records currently stored.'}
        last_error: {type: string, description: 'Why the last sync failed. Empty after a success.'}
        failures: {type: integer, description: 'Consecutive failed syncs.'}
        stale: {type: boolean, description: No success within twice the schedule (raises feed.stale once)}
        lag_seconds: {type: [integer, 'null'], description: 'Seconds since the last success, or `null` before the first.'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
    VulnerabilityDetail:
      example: {"id": "CVE-2021-23337", "records": [{"source": "nvd", "summary": "Command injection in lodash template", "published": "2021-02-15T00:00:00Z"}], "severity_sources": [{"version": "3.1", "vector": "CVSS:3.1/AV:N/AC:L/PR:H/UI:N/S:U/C:H/I:H/A:H", "base_score": 7.2, "base_severity": "HIGH", "source": "nvd", "type": "Primary"}], "cwe": ["CWE-94"], "vendor_statements": []}
      type: object
      description: 'Everything known about one vulnerability or advisory: the record each origin holds, every severity score with its source, weakness types and vendor statements. Records keep their original wording.'
      properties:
        id: {type: string, description: 'The ID that was looked up.'}
        records: {type: array, items: {type: object}, description: 'The advisory as each origin (OSV, NVD, CVE Program, local) holds it.'}
        severity_sources: {type: array, items: {type: object, properties: {version: {type: string, description: 'Scoring system version, for example `3.1`.'}, vector: {type: string, description: 'CVSS vector string behind the score.'}, base_score: {type: number, description: 'CVSS base score, 0 to 10.'}, base_severity: {type: string, description: 'Severity band for the score.'}, source: {type: string, description: 'Who scored it, for example `nvd` or a vendor.'}, type: {type: string, description: 'Scoring system, for example `CVSS_V3`.'}}}, description: 'Every severity score found, with where it came from.'}
        cwe: {type: array, items: {type: string}, description: 'Weakness types, for example `CWE-79`.'}
        vendor_statements: {type: array, items: {$ref: '#/components/schemas/VendorStatement'}, description: 'VEX statements from vendors about this vulnerability.'}
    VendorStatement:
      example: {"vulnerability": "CVE-2021-23337", "purl": "pkg:npm/lodash@4.17.20", "product": "lodash", "status": "fixed", "justification": "", "impact": "", "action": "Upgrade to 4.17.21.", "document_id": "6b2d8f10-4c37-4a95-8e1d-9a0c7f3e5b24", "publisher": "Acme PSIRT", "issued_at": "2026-11-16T09:30:00Z"}
      description: 'A vendor''s statement about whether a product is affected by a vulnerability (VEX).'
      type: object
      properties:
        vulnerability: {type: string, description: 'Vulnerability ID the vendor speaks about, for example a CVE.'}
        purl: {type: string, description: 'Package the statement is about.'}
        product: {type: string, description: 'Product the vendor named.'}
        status: {type: string, enum: [not_affected, affected, fixed, under_investigation], description: '`not_affected`, `affected`, `fixed` or `under_investigation`.'}
        justification: {type: string, description: 'Why it is not affected, in VEX terms.'}
        impact: {type: string, description: 'Free-text impact statement.'}
        action: {type: string, description: 'What the vendor advises.'}
        document_id: {type: string, format: uuid, description: 'VEX document it came from.'}
        format: {type: string, enum: [openvex, cyclonedx, csaf], description: 'Format of the document the statement came from.'}
        publisher: {type: string, description: 'Organisation that published the document.'}
        issued_at: {type: [string, 'null'], format: date-time, description: 'When it was issued, or `null`.'}
    VEXDocument:
      example: {"id": "6b2d8f10-4c37-4a95-8e1d-9a0c7f3e5b24", "publisher": "Acme PSIRT", "issued_at": "2026-11-16T09:30:00Z", "sha256": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "statements": 18, "imported_by": "ci-pipeline", "imported_at": "2026-11-16T09:30:00Z"}
      description: 'An imported VEX document (OpenVEX, CycloneDX VEX or CSAF).'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Document ID, used in `DELETE /intel/vex-documents/{id}`.'}
        format: {type: string, enum: [openvex, cyclonedx, csaf], description: 'Format of the imported document.'}
        publisher: {type: string, description: 'Organisation that published the document.'}
        title: {type: string, description: 'Title of the document, when it has one.'}
        issued_at: {type: [string, 'null'], format: date-time, description: 'When it was issued, or `null`.'}
        sha256: {type: string, description: 'SHA-256 of the document.'}
        statements: {type: integer, description: 'Statements it contains.'}
        imported_by: {type: string, description: 'Token that imported it.'}
        imported_at: {type: string, format: date-time, description: 'When it was imported (RFC 3339, UTC).'}
    QAAuth:
      type: object
      description: Header added to every generated request, valued `prefix` + the variable's value
      properties:
        header: {type: string, examples: [Authorization], description: 'Header name, for example `Authorization`.'}
        variable: {type: string, description: Name of one of the profile's variables}
        prefix: {type: string, maxLength: 32, examples: ['Bearer '], description: 'Text put before the value, for example `Bearer `.'}
    QAPerf:
      type: object
      required: [features, users, duration_seconds, p95_millis]
      description: Load profile run with karate-gatling; a breached threshold fails the run
      properties:
        features: {type: array, items: {type: string}, maxItems: 20, description: Feature paths relative to `test_path`}
        users: {type: integer, minimum: 1, maximum: 500, description: 'Concurrent virtual users (1 to 500).'}
        ramp_seconds: {type: integer, minimum: 0, maximum: 3600, description: 'Seconds to reach full load (0 to 3600).'}
        duration_seconds: {type: integer, minimum: 5, maximum: 3600, description: 'Seconds to hold full load (5 to 3600).'}
        p95_millis: {type: integer, minimum: 1, maximum: 600000, description: 'Fail when the 95th percentile response time is above this many milliseconds.'}
        max_error_percent: {type: integer, minimum: 0, maximum: 100, description: 'Fail when more than this percentage of requests fail (0 to 100).'}
        auto_run: {type: boolean, description: Run after every passing functional run}
    QAProfileInput:
      type: object
      description: '`base_url` is required unless the profile only lints (`functional` false and no `perf`).'
      properties:
        functional: {type: boolean, default: true, description: 'Queue a Karate functional run after each successful assessment (with `auto_run`). A profile that only lints sets it false and needs `lint` and no `base_url`.'}
        enabled: {type: boolean, default: true, description: 'Set `false` to pause QA without deleting the profile.'}
        auto_run: {type: boolean, default: true, description: Queue a functional run after each successful assessment of a matching ref}
        refs: {type: array, items: {type: string}, maxItems: 20, description: 'Refs or patterns (main, release/*, pull/*); empty means every ref'}
        base_url: {type: string, format: uri, description: Deployed environment the tests call (SCRS_BASE_URL / baseUrl)}
        environment: {type: string, description: 'Value of `karate.env`, which selects the Karate environment config, for example `staging`.'}
        tags: {type: array, items: {type: string}, maxItems: 8, description: 'Karate tag expressions for the repository suite, for example @smoke or ~@slow'}
        threads: {type: integer, minimum: 1, maximum: 16, default: 1, description: 'Parallel Karate threads (1 to 16).'}
        timeout_seconds: {type: integer, minimum: 60, maximum: 7200, default: 900, description: 'Longest a run may take (60 to 7200).'}
        test_path: {type: string, default: karate, description: Repository directory holding the Karate project; empty for the root}
        openapi_path: {type: string, description: 'OpenAPI document path; empty finds openapi.yaml, openapi.json, swagger.yaml or swagger.json'}
        auth: {$ref: '#/components/schemas/QAAuth'}
        variables: {type: object, additionalProperties: {type: string}, description: 'Secrets passed to tests as QA_<NAME> environment variables and redacted from reports; write-only, omitted keeps the stored set'}
        perf: {oneOf: [{$ref: '#/components/schemas/QAPerf'}, {type: 'null'}], description: 'Load test settings, or `null` for none.'}
        llm_provider_id: {type: [string, 'null'], format: uuid, description: 'LLM provider for test generation and AI triage, or `null`.'}
        allow_source_upload: {type: boolean, default: false, description: Allow unit-test generation to send source files to the LLM provider}
        lint: {oneOf: [{$ref: '#/components/schemas/QALint'}, {type: 'null'}], description: 'Lint the assessed commit''s source with these linters after each successful assessment (when `auto_run` is on) and on request (`kind: lint`). Report-only: `qa_lint` entries never change a verdict.'}
        gate: {type: string, enum: [assessment, none], default: assessment, description: '`assessment` (default): a manual run tests a commit that passed a security assessment, and a `fail` verdict blocks it. `none`: a manual run may test the head of a ref with no assessment at all (`POST /assets/{id}/qa/runs` without `assessment_id`). The repository''s Karate features and linter configuration then run on the QA runner without the security gate having looked at them, so use it for repositories you trust. Only an `admin` token can save a profile.'}
        ai_triage: {type: boolean, default: false, description: 'After each finished run, send its failures, load breaches and lint entries to `llm_provider_id` for a summary and per-entry advisories. Needs `llm_provider_id`, and the provider must be allowed to receive source code (self-hosted, or hosted and acknowledged), because the entries carry file paths, test names and failure text.'}
    QALint:
      type: object
      required: [tools]
      additionalProperties: false
      description: Linters the runner runs over the source. A tool that is not installed on the runner is reported as a `qa_lint_config` entry.
      properties:
        tools: {type: array, minItems: 1, items: {type: string, enum: [ruff, mypy, bandit, pylint, phpstan, phpcs, clang-tidy, golangci-lint, eslint, ktlint, swiftlint, dart-analyze]}, uniqueItems: true, description: 'ruff (Python style and errors), mypy (Python types), bandit (Python security), pylint (Python code quality), phpstan (PHP analysis), phpcs (PHP style), clang-tidy (C and C++, best effort without a build), golangci-lint (Go), eslint (JavaScript, TypeScript), ktlint (Kotlin), swiftlint (Swift) and dart-analyze (Dart, Flutter). The full runner image (the default build, `make qa-runner-lint-image`) has all of them; the slim `base` image has only ruff. `GET /qa/runner` lists what the runner has. An unknown or missing tool is reported as a `qa_lint_config` entry.'}
    QAProfile:
      example: {"base_url": "https://api.staging.example.com", "environment": "staging", "refs": ["main", "release/*"], "test_path": "karate", "openapi_path": "api/openapi.yaml", "variables": {"API_TOKEN": "…"}, "auth": {"header": "Authorization", "variable": "API_TOKEN", "prefix": "Bearer "}, "perf": {"features": ["perf/browse.feature"], "users": 20, "ramp_seconds": 30, "duration_seconds": 120, "p95_millis": 800, "max_error_percent": 1, "auto_run": false}, "enabled": true, "functional": true, "auto_run": true, "gate": "assessment", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "variable_names": ["API_TOKEN"], "revision": 3, "updated_at": "2026-11-16T09:30:00Z"}
      description: 'An asset''s QA settings as stored. Secret values are never returned, only their names.'
      allOf:
        - {$ref: '#/components/schemas/QAProfileInput'}
        - type: object
          properties:
            asset_id: {type: string, format: uuid, description: 'Repository the profile belongs to.'}
            variable_names: {type: array, items: {type: string}, description: 'Names of the stored secret variables.'}
            revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
            updated_at: {type: string, format: date-time, description: 'When the record last changed (RFC 3339, UTC).'}
    QARunStatus: {type: string, enum: [queued, submitted, running, passed, failed, error, cancelled, skipped], description: 'Where a run is: `queued`, `submitted` to the runner, `running`, then `passed` or `failed` (tests ran), `error` (it could not run), `cancelled`, or `skipped` (the assessment''s verdict was `fail`).'}
    QARunRequest:
      description: 'Body to start QA runs.'
      type: object
      properties:
        kind: {type: string, enum: [functional, performance, lint, full], default: functional, description: '`full` queues every run the profile configures: functional (when it has a `base_url` and `functional` is on), performance (unless it already follows a passing functional run) and lint (when it has `lint`). `lint` needs the profile''s `lint` settings.'}
        assessment_id: {type: string, format: uuid, description: 'Test the commit of this assessment. Without it, a profile with `gate: assessment` tests the asset''s latest successful git assessment, and a profile with `gate: none` tests the head of `ref`.'}
        ref: {type: string, maxLength: 255, description: 'Branch or tag to test when the run has no assessment (profile `gate: none`); empty is the repository''s default branch. Must match the profile''s `refs`. The worker resolves it to a commit when the run starts and records it as `commit`.'}
        include_drafts: {type: boolean, description: Also run draft generated features (admin)}
    QASummary:
      description: 'Result counts of a run. Lint runs fill `lint`; functional runs fill the scenario counts.'
      type: object
      properties:
        features: {type: integer, description: 'Karate feature files run.'}
        scenarios: {type: integer, description: 'Scenarios that ran.'}
        passed: {type: integer, description: 'Scenarios that passed.'}
        failed: {type: integer, description: 'Scenarios that failed.'}
        skipped: {type: integer, description: 'Scenarios that were skipped.'}
        duration_ms: {type: integer, description: 'Run time in milliseconds.'}
        karate_version: {type: string, description: 'Karate version used.'}
        lint: {type: object, description: 'Lint results. Present on lint runs only.', properties: {issues: {type: integer, description: 'Issues reported by all linters.'}, files: {type: integer, description: 'Files with at least one issue.'}, by_tool: {type: object, additionalProperties: {type: integer}, description: 'Issue count per linter.'}, by_severity: {type: object, additionalProperties: {type: integer}, description: 'Issues per severity.'}}}
    QAPerfStats:
      description: 'Gatling results of a load run.'
      type: object
      properties:
        requests: {type: integer, description: 'Requests sent during the load test.'}
        ok: {type: integer, description: 'Requests that succeeded.'}
        ko: {type: integer, description: 'Requests that failed.'}
        min_ms: {type: number, description: 'Fastest response in milliseconds.'}
        mean_ms: {type: number, description: 'Average response in milliseconds.'}
        max_ms: {type: number, description: 'Slowest response in milliseconds.'}
        p50_ms: {type: number, description: 'Median response in milliseconds.'}
        p75_ms: {type: number, description: '75th percentile in milliseconds.'}
        p95_ms: {type: number, description: '95th percentile in milliseconds.'}
        p99_ms: {type: number, description: '99th percentile in milliseconds.'}
        throughput_rps: {type: number, description: 'Requests per second.'}
        assertions: {type: array, items: {type: object, properties: {description: {type: string, description: 'What the threshold checks.'}, passed: {type: boolean, description: '`true` when the threshold held.'}, actual: {type: number, description: 'Value that was measured.'}}}, description: 'Thresholds that were checked (95th percentile time, error rate).'}
    QARun:
      example: {"id": "6d2f8b40-3a1c-4e97-b5d0-9c7e1a2f4b63", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "assessment_id": null, "kind": "functional", "trigger": "manual", "requested_by": "qa-pipeline", "ref": "main", "commit": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "include_drafts": false, "status": "passed", "attempts": 1, "base_url": "https://api.staging.example.com", "summary": {"features": 12, "scenarios": 48, "passed": 46, "failed": 2, "skipped": 0, "duration_ms": 83210, "karate_version": "1.5.1"}, "coverage": {"total": 120, "covered": 96, "percent": 80, "spec": "api/openapi.yaml", "problems": []}, "report_sha256": "3b7e0c91a5d24f68b1c9e0a7d3f52814c6a9b0e1d2f3a4b5c6d7e8f901a2b3c4", "error": "", "created_at": "2026-11-16T09:30:00Z", "submitted_at": "2026-11-16T09:30:00Z", "started_at": "2026-11-16T09:30:05Z", "completed_at": "2026-11-16T09:31:28Z"}
      description: 'One QA run: functional, performance or lint. Poll it until `status` is final.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Run ID, also its job ID.'}
        asset_id: {type: string, format: uuid, description: 'Repository that was tested.'}
        assessment_id: {type: [string, 'null'], format: uuid, description: 'Assessment whose commit was tested, or `null` for a run with no assessment (profile `gate: none`).'}
        kind: {type: string, enum: [functional, performance, lint], description: '`functional` Karate tests, `performance` Gatling load test, or `lint` static checks.'}
        trigger: {type: string, enum: [assessment, manual, functional_pass], description: 'What started it: `assessment` finished, `manual` call, or `functional_pass` (the automatic load test after passing tests).'}
        requested_by: {type: string, description: 'Token name that started it, or `scrs`.'}
        ref: {type: string, description: 'Branch or tag that was tested.'}
        commit: {type: string, description: 'Commit that was tested. Empty until the worker resolves it for a run with no assessment.'}
        include_drafts: {type: boolean, description: '`true` when draft generated tests were included.'}
        status: {$ref: '#/components/schemas/QARunStatus'}
        attempts: {type: integer, description: 'Times SCRS tried to hand it to the runner.'}
        base_url: {type: string, description: 'Deployed environment the tests called. Empty for lint.'}
        summary: {$ref: '#/components/schemas/QASummary'}
        coverage: {type: object, properties: {total: {type: integer, description: 'Documented operations.'}, covered: {type: integer, description: 'Operations the tests called.'}, percent: {type: number, description: 'Covered share, 0 to 100.'}, spec: {type: string, description: 'OpenAPI document used.'}, problems: {type: array, items: {type: string}, description: 'Why coverage is incomplete, if it is.'}}, description: 'OpenAPI coverage of a functional run, when measured.'}
        perf: {$ref: '#/components/schemas/QAPerfStats'}
        report_sha256: {type: string, description: 'SHA-256 of the report archive.'}
        error: {type: string, description: 'Why it ended in `error`. Empty otherwise.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        submitted_at: {type: string, format: date-time, description: 'When it went to the runner (RFC 3339, UTC).'}
        started_at: {type: string, format: date-time, description: 'When the runner started it (RFC 3339, UTC).'}
        completed_at: {type: string, format: date-time, description: 'When it ended (RFC 3339, UTC).'}
    QAScenario:
      example: {"suite": "repo", "feature": "karate/orders.feature", "name": "Create an order", "line": 12, "tags": ["@smoke"], "status": "passed", "duration_ms": 412, "error": ""}
      description: 'One Karate scenario and its outcome.'
      type: object
      properties:
        suite: {type: string, enum: [repo, generated], description: '`repo` from the repository, or `generated` from approved generated tests.'}
        feature: {type: string, description: 'Path of the feature file in the repository.'}
        name: {type: string, description: 'Scenario name from the feature file.'}
        line: {type: integer, description: 'Line in the feature file.'}
        tags: {type: array, items: {type: string}, description: 'Karate tags on the scenario, for example `@smoke`.'}
        status: {type: string, enum: [passed, failed, skipped], description: '`passed`, `failed` or `skipped`.'}
        duration_ms: {type: integer, description: 'Time in milliseconds.'}
        error: {type: string, description: 'Failure message. Empty when it passed.'}
    QACoverage:
      example: {"total": 120, "covered": 96, "percent": 80, "spec": "api/openapi.yaml", "problems": [], "operations": [{"method": "GET", "path": "/orders", "operation_id": "listOrders", "summary": "List orders", "deprecated": false, "hits": 6, "statuses": [200, 401]}, {"method": "POST", "path": "/orders", "operation_id": "createOrder", "summary": "Create an order", "deprecated": false, "hits": 0, "statuses": []}], "unmatched": ["/health"]}
      description: 'Which documented API operations the tests called.'
      type: object
      properties:
        total: {type: integer, description: 'Documented operations, less deprecated ones'}
        covered: {type: integer, description: 'Operations called at least once.'}
        percent: {type: number, description: 'Covered share, 0 to 100.'}
        spec: {type: string, description: 'OpenAPI document used.'}
        problems: {type: array, items: {type: string}, description: 'Setup problems, for example a missing document.'}
        operations:
          description: 'Every documented operation.'
          type: array
          items:
            type: object
            properties:
              method: {type: string, description: 'HTTP method of the documented operation.'}
              path: {type: string, description: 'Path template of the documented operation, for example `/orders/{id}`.'}
              operation_id: {type: string, description: 'OpenAPI operationId.'}
              summary: {type: string, description: 'Summary of the operation from the OpenAPI document.'}
              deprecated: {type: boolean, description: '`true` when marked deprecated.'}
              hits: {type: integer, description: 'Calls the tests made.'}
              statuses: {type: array, items: {type: integer}, description: 'Response statuses seen.'}
        unmatched: {type: array, items: {type: string}, description: Called paths no operation describes (first 50)}
    QACoveragePoint:
      example: {"run_id": "6d2f8b40-3a1c-4e97-b5d0-9c7e1a2f4b63", "created_at": "2026-11-16T09:30:00Z", "ref": "main", "commit": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "status": "passed", "total": 120, "covered": 96, "percent": 80, "passed": 46, "failed": 2}
      description: 'Coverage of one finished run, for a trend chart.'
      type: object
      properties:
        run_id: {type: string, format: uuid, description: 'Run the point comes from.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        ref: {type: string, description: 'Branch or tag that was tested.'}
        commit: {type: string, description: 'Commit that was tested.'}
        status: {type: string, description: 'Final status of that run.'}
        total: {type: integer, description: 'Documented operations.'}
        covered: {type: integer, description: 'Operations called at least once.'}
        percent: {type: number, description: 'Covered share, 0 to 100.'}
        passed: {type: integer, description: 'Scenarios that passed.'}
        failed: {type: integer, description: 'Scenarios that failed.'}
    QAGenerationRequest:
      description: 'Body to ask a model to draft tests.'
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [api, unit], description: '`api` Karate features from the OpenAPI document, or `unit` unit tests from source.'}
        max_operations: {type: integer, minimum: 1, maximum: 200, default: 30, description: 'Most operations to cover in one go (1 to 200).'}
        operations: {type: array, items: {type: string}, description: 'Only these operations, as "GET /users/{id}"'}
        max_files: {type: integer, minimum: 1, maximum: 20, default: 5, description: 'Most source files to cover (1 to 20), for `unit`.'}
        paths: {type: array, items: {type: string}, description: Only these source files (unit)}
    QAGeneration:
      example: {"id": "e4b8d1f2-0a3c-4975-86d1-2c5f7a9e0b34", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "kind": "api", "provider_id": "0e9a8b2c-6f41-4d0e-9c1a-5b7d3f2a1c80", "provider_name": "local-ollama", "model": "qwen2.5-coder:14b", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "ref": "main", "commit": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b", "status": "queued", "requested_by": "qa-pipeline", "attempts": 0, "input_tokens": 0, "output_tokens": 0, "accepted": 0, "rejected": 0, "error": "", "created_at": "2026-11-16T09:30:00Z", "completed_at": ""}
      description: 'A request to draft tests with a model and what it produced.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Generation ID, also its job ID.'}
        asset_id: {type: string, format: uuid, description: 'Repository the tests were drafted for.'}
        kind: {type: string, enum: [api, unit], description: '`api` drafts Karate features from the OpenAPI document; `unit` drafts unit tests for source files that have none.'}
        provider_id: {type: [string, 'null'], format: uuid, description: 'Provider used, or `null` if it was deleted.'}
        provider_name: {type: string, description: 'Provider name when it ran.'}
        model: {type: string, description: 'Model name when it ran.'}
        assessment_id: {type: string, format: uuid, description: 'Assessment whose commit was used.'}
        ref: {type: string, description: 'Branch or tag the assessed commit belongs to.'}
        commit: {type: string, description: 'Assessed commit the tests were drafted from.'}
        options: {$ref: '#/components/schemas/QAGenerationRequest'}
        status: {type: string, enum: [queued, running, succeeded, failed], description: '`queued`, `running`, `succeeded` or `failed`.'}
        requested_by: {type: string, description: 'Token that asked for it.'}
        attempts: {type: integer, description: 'Times the worker tried the job.'}
        input_tokens: {type: integer, description: 'Tokens sent to the model.'}
        output_tokens: {type: integer, description: 'Tokens the model returned.'}
        accepted: {type: integer, description: 'Files that passed the static checks and became drafts.'}
        rejected: {type: integer, description: 'Files that failed them.'}
        error: {type: string, description: 'Why it failed. Empty otherwise.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        completed_at: {type: string, format: date-time, description: 'When it finished (RFC 3339, UTC).'}
    QASuite:
      example: {"id": "1a9e4c70-5b2d-4f83-8c16-7d0f3e2a9b45", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "generation_id": "e4b8d1f2-0a3c-4975-86d1-2c5f7a9e0b34", "kind": "api", "path": "karate/generated/orders.feature", "source": "POST /orders", "content": "Feature: Create an order\n  Scenario: valid order\n    Given path 'orders'\n    When method post\n    Then status 201", "sha256": "5d41402abc4b2a76b9719d911017c592a0b1c2d3e4f5061728394a5b6c7d8e9f", "status": "draft", "problems": [], "reviewed_by": "", "reviewed_at": "", "note": "", "created_at": "2026-11-16T09:30:00Z"}
      description: 'One generated test file and its review state. Drafts never run until approved.'
      type: object
      properties:
        id: {type: string, format: uuid, description: 'Generated file ID, used in `/qa/suites/{id}`.'}
        asset_id: {type: string, format: uuid, description: 'Repository the file was drafted for.'}
        generation_id: {type: string, format: uuid, description: 'Generation that produced it.'}
        kind: {type: string, enum: [api, unit], description: '`api` is a Karate feature that runs against the environment; `unit` is a unit test to commit to the repository.'}
        path: {type: string, description: 'Where to commit it in the repository.'}
        source: {type: string, description: Operations (api) or source file (unit) the file covers}
        content: {type: string, description: 'Present on GET /qa/suites/{id}'}
        sha256: {type: string, description: 'SHA-256 of the content.'}
        status: {type: string, enum: [draft, approved, rejected, superseded], description: '`draft` waiting for review; `approved` runs in every functional run; `rejected`; `superseded` by a newer file at the same path.'}
        problems: {type: array, items: {type: string}, description: 'Static-check problems. A draft with problems cannot be approved.'}
        reviewed_by: {type: string, description: 'Token name of the person or system that approved or rejected it.'}
        reviewed_at: {type: string, format: date-time, description: 'When (RFC 3339, UTC).'}
        note: {type: string, description: 'Reviewer''s note, given when approving or rejecting.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
    QAReview:
      description: 'Body to approve or reject a generated test.'
      type: object
      properties: {note: {type: string, maxLength: 1000, description: 'Optional note stored with the decision.'}}
    QARunnerStatus:
      example: {"configured": true, "reachable": true, "runner": {"karate": "1.5.1", "gatling": true, "lint_tools": ["ruff", "mypy", "bandit", "pylint", "phpstan", "phpcs", "clang-tidy", "golangci-lint", "eslint", "ktlint", "swiftlint", "dart-analyze"], "slots": 2, "queued": 0, "running": 1}}
      description: 'Whether SCRS can reach the QA runner and what it offers.'
      type: object
      properties:
        configured: {type: boolean, description: '`true` when a runner URL and token are set.'}
        reachable: {type: boolean, description: '`true` when the last probe succeeded.'}
        error: {type: string, description: 'Why it is unreachable. Empty otherwise.'}
        runner: {type: object, properties: {karate: {type: string, description: 'Karate version installed.'}, gatling: {type: boolean, description: '`true` when load tests are available.'}, lint_tools: {type: array, items: {type: string}, description: Linters installed on the runner}, slots: {type: integer, description: 'Jobs it can run at once.'}, queued: {type: integer, description: 'Jobs waiting for a free slot.'}, running: {type: integer, description: 'Jobs running now.'}}, description: 'What the runner reports about itself.'}
    LLMPreset:
      example: {"kind": "anthropic", "protocol": "anthropic", "base_url": "https://api.anthropic.com", "base_url_required": false, "api_key_optional": false}
      description: 'A known model service with its default address.'
      type: object
      properties:
        kind: {type: string, description: 'Provider kind to send when creating a provider.'}
        protocol: {type: string, enum: [openai, anthropic, gemini], description: 'Wire protocol SCRS speaks to it.'}
        base_url: {type: string, description: 'Default API address. Empty when you must supply one.'}
        base_url_required: {type: boolean, description: '`true` when `base_url` must be given.'}
        api_key_optional: {type: boolean, description: '`true` when it can run without a key (a local server).'}
    LLMProviderInput:
      description: 'Body to create or change a model provider.'
      type: object
      properties:
        name: {type: string, pattern: '^[a-z][a-z0-9_-]{1,62}$', description: Required on create; cannot change}
        kind: {type: string, enum: [openai, azure_openai, anthropic, gemini, mistral, groq, deepseek, xai, openrouter, together, ollama, openai_compatible], description: 'Service type. See `GET /llm/presets`.'}
        base_url: {type: string, description: Defaults to the kind's inference URL; required for azure_openai and openai_compatible}
        model: {type: string, description: Model or deployment name}
        max_tokens: {type: integer, minimum: 256, maximum: 131072, default: 8192, description: 'Largest answer to ask for (256 to 131072).'}
        temperature: {type: number, minimum: 0, maximum: 2, description: 'Sampling temperature (0 to 2). Omit to use the provider default.'}
        clear_temperature: {type: boolean, description: 'On change, set `true` to remove a stored temperature.'}
        enabled: {type: boolean, default: true, description: 'Set `false` to stop using it.'}
        api_key: {type: string, writeOnly: true, description: 'API key. Write-only; never returned.'}
    AISummaryRequest:
      description: 'Body to ask a model for advisories and a summary of an assessment.'
      type: object
      required: [provider_id]
      additionalProperties: false
      properties:
        provider_id: {type: string, format: uuid, description: 'Any enabled provider, hosted or self-hosted'}
        max_advisories: {type: integer, minimum: 0, maximum: 30, default: 10, description: 'How many findings get an advisory, most important first'}
    AISummary:
      description: 'A summary job: what the model was asked to write and what it used.'
      type: object
      example: {"id": "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "provider_name": "local-qwen", "model": "qwen2.5-coder-32b", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "status": "succeeded", "requested_by": "frontend-dashboard", "attempts": 1, "findings_considered": 7, "findings_excluded": 2, "advisories": 5, "input_tokens": 6120, "output_tokens": 1480, "incomplete": "", "redactions": {}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:31:05Z"}
      properties:
        id: {type: string, format: uuid, description: 'Job ID, used in `GET /summary-jobs/{id}`.'}
        asset_id: {type: string, format: uuid, description: 'Asset the summary is about.'}
        assessment_id: {type: string, format: uuid, description: 'Assessment summarised.'}
        provider_id: {type: [string, 'null'], format: uuid, description: 'Provider used, or `null` if it was deleted.'}
        provider_name: {type: string, description: 'Provider name when it ran.'}
        model: {type: string, description: 'Model name when it ran.'}
        ref: {type: string, description: 'Branch or tag that was summarised.'}
        commit: {type: string, description: 'Commit that was summarised.'}
        options: {$ref: '#/components/schemas/AISummaryRequest'}
        status: {type: string, enum: [queued, running, succeeded, failed], description: 'A failed job that may work later is retried up to three times'}
        requested_by: {type: string, description: 'Token that asked for it, or `scrs` for automatic triage.'}
        attempts: {type: integer, description: 'Times the worker tried the job.'}
        findings_considered: {type: integer, description: Open findings of a type that may be described to a model}
        findings_excluded: {type: integer, description: 'Findings of other types (code analysis, secret detection, AI review, malware matches, QA), counted but never sent'}
        advisories: {type: integer, description: 'Advisories the job wrote.'}
        input_tokens: {type: integer, description: 'Tokens sent to the model.'}
        output_tokens: {type: integer, description: 'Tokens the model returned.'}
        incomplete: {type: string, description: 'Why fewer advisories were written than asked for (token budget reached, or answers cut off at max_tokens). Empty when complete.'}
        redactions: {type: object, additionalProperties: {type: integer}, description: 'What the guard removed from prompts and answers, counted by kind; values are never kept'}
        summary_document_id: {type: string, format: uuid, description: 'The assessment summary in the chronicle'}
        error: {type: string, description: 'Why it failed. Empty otherwise.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        completed_at: {type: [string, 'null'], format: date-time, description: 'When it finished, or `null`.'}
    ChronicleSearchResult:
      description: 'Chronicle passages closest in meaning to a question.'
      type: object
      example: {"query": "lodash prototype pollution", "model": "BAAI/bge-small-en-v1.5", "hits": [{"document_id": "6a7b8c9d-0e1f-4a2b-8c3d-4e5f6a7b8c9d", "seq": 0, "text": "Upgrade lodash to fix the prototype pollution flaw.", "score": 0.91, "kind": "advisory", "title": "Upgrade lodash", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "created_at": "2026-11-16T09:30:00Z"}], "candidates": 120, "truncated": false, "unindexed_documents": 0}
      properties:
        query: {type: string, description: 'The question that was searched.'}
        model: {type: string, description: 'The embedding model; vectors of other models are never compared'}
        hits:
          description: 'Matching passages, best match first.'
          type: array
          items:
            type: object
            properties:
              document_id: {type: string, format: uuid, description: 'Read the whole document with `GET /assets/{id}/chronicle`'}
              seq: {type: integer, description: Chunk number within the document}
              text: {type: string, description: 'Passage that matched.'}
              score: {type: number, description: 'Cosine similarity between the question and the passage, from -1 to 1. Higher is closer.'}
              kind: {type: string, description: 'Kind of document the passage is from.'}
              title: {type: string, description: 'Title of that document.'}
              asset_id: {type: string, format: uuid, description: 'Asset the document is about.'}
              created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        candidates: {type: integer, description: 'Passages that were compared with the question before ranking.'}
        truncated: {type: boolean, description: '`true` when more passages match than were returned.'}
        unindexed_documents: {type: integer, description: 'Documents of this asset with no vectors; run `POST /knowledge:backfill`'}
    KnowledgeDocument:
      example: {"id": "0c3d5e7f-1a2b-4c4d-8e6f-7a8b9c0d1e2f", "kind": "assessment_summary", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "finding_id": "", "ref": "main", "body": "Two high vulnerabilities in lodash and axios need upgrades. No malware or integrity findings. Risk is lower than the previous assessment.", "body_sha256": "9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08", "origin": "llm", "provenance": {"model": "qwen2.5-coder:14b", "provider": "local-ollama", "prompt_version": "summary-v3", "guard_removed": 0}, "supersedes": "", "superseded_at": null, "created_at": "2026-11-16T09:30:00Z"}
      type: object
      description: A text in an asset's chronicle.
      properties:
        id: {type: string, format: uuid, description: 'Document ID.'}
        kind: {type: string, enum: [advisory, finding_summary, assessment_summary, asset_chronicle, qa_summary, code_review, report], description: 'Type of text: `advisory`, `finding_summary`, `assessment_summary`, `asset_chronicle`, `qa_summary`, `code_review` or `report`.'}
        asset_id: {type: string, format: uuid, description: 'Asset the document is about.'}
        assessment_id: {type: string, format: uuid, description: 'Assessment it was written for.'}
        finding_id: {type: string, format: uuid, description: 'The register entry an advisory is about (`GET /register/{id}`)'}
        ref: {type: string, description: 'Branch or tag the document refers to.'}
        title: {type: string, description: 'Short title of the document.'}
        body: {type: string, description: 'Plain text. When `origin` is `llm` it was written by a model and is not verified.'}
        body_sha256: {type: string, description: 'SHA-256 of the body.'}
        origin: {type: string, enum: [scrs, llm], description: '`llm` means a language model wrote the text'}
        provenance: {type: object, additionalProperties: true, description: 'How it was made: model, provider, provider_locality, prompt_version, job ids, counts and what the guard removed'}
        supersedes: {type: string, format: uuid, description: The earlier document this one replaced}
        superseded_at: {type: [string, 'null'], format: date-time, description: When a newer document replaced this one}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
    AIReviewRequest:
      description: 'Body to ask a model to review source code.'
      type: object
      required: [provider_id]
      additionalProperties: false
      properties:
        provider_id: {type: string, format: uuid, description: 'A provider whose `source_allowed` is true (self-hosted, or hosted and opted in) that will read the code'}
        max_files: {type: integer, minimum: 0, maximum: 40, default: 10, description: 'How many source files to read, most risk-prone first'}
        paths: {type: array, maxItems: 40, items: {type: string, maxLength: 512}, description: Review only these source files (paths relative to the repository root)}
    AIReview:
      description: 'A code review job and what it used.'
      type: object
      example: {"id": "3b4c5d6e-7f80-4192-a3b4-c5d6e7f8091a", "asset_id": "0b6f1c1e-3d52-4a6e-9f4a-1d2c3b4a5e60", "provider_name": "local-qwen", "model": "qwen2.5-coder-32b", "locality": "local", "assessment_id": "c3e8a0f2-6b17-4d9a-8e55-2f0a9b7d1c44", "ref": "main", "commit": "3f9c2a1b7d4e5f60a8b9c0d1e2f3a4b5c6d7e8f9", "status": "succeeded", "requested_by": "frontend-dashboard", "attempts": 1, "files_reviewed": 10, "files_skipped": 2, "findings": 3, "input_tokens": 41230, "output_tokens": 3902, "incomplete": "", "redactions": {"aws_access_key": 1}, "created_at": "2026-11-16T09:30:00Z", "completed_at": "2026-11-16T09:36:50Z"}
      properties:
        id: {type: string, format: uuid, description: 'Review ID, also its job ID.'}
        asset_id: {type: string, format: uuid, description: 'Repository that was reviewed.'}
        provider_id: {type: [string, 'null'], format: uuid, description: 'Provider used, or `null` if it was deleted.'}
        provider_name: {type: string, description: 'Provider name when it ran.'}
        model: {type: string, description: 'Model name when it ran.'}
        locality: {type: string, enum: [local, hosted, ''], description: 'Where the source went: `local` (your model server) or `hosted`'}
        assessment_id: {type: string, format: uuid, description: The assessment whose commit was reviewed}
        ref: {type: string, description: 'Branch or tag that was reviewed.'}
        commit: {type: string, description: 'Commit that was reviewed.'}
        options: {$ref: '#/components/schemas/AIReviewRequest'}
        status: {type: string, enum: [queued, running, succeeded, failed], description: 'A failed review that may work later is retried up to three times'}
        requested_by: {type: string, description: 'Token that asked for it.'}
        attempts: {type: integer, description: 'Times the worker tried the job.'}
        files_reviewed: {type: integer, description: 'Files read by the model.'}
        files_skipped: {type: integer, description: 'Files not read: over the file limit, over 48 KiB, over the token budget, or answers cut off'}
        findings: {type: integer, description: Register entries this review reports}
        input_tokens: {type: integer, description: 'Tokens sent to the model.'}
        output_tokens: {type: integer, description: 'Tokens the model returned.'}
        incomplete: {type: string, description: 'Why the review did not cover everything it selected (token budget reached, or answers cut off at max_tokens). Empty when it did.'}
        redactions: {type: object, additionalProperties: {type: integer}, description: 'What the guard removed from prompts and answers, counted by kind (such as `aws_access_key`); values are never kept'}
        document_id: {type: string, format: uuid, description: 'The summary stored in the asset''s chronicle; read it with `GET /assets/{id}/chronicle?kind=code_review`'}
        error: {type: string, description: 'Why it failed. Empty otherwise.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        completed_at: {type: [string, 'null'], format: date-time, description: 'When it finished, or `null`.'}
    LLMProvider:
      description: 'A configured model service. The API key is never returned.'
      type: object
      example: {"id": "0e9a8b2c-6f41-4d0e-9c1a-5b7d3f2a1c80", "name": "local-qwen", "kind": "openai_compatible", "base_url": "https://model.example.com/v1", "model": "qwen2.5-coder-32b", "max_tokens": 4096, "temperature": 0.2, "enabled": true, "has_api_key": true, "revision": 2, "created_at": "2026-11-16T09:30:00Z", "updated_at": "2026-11-16T09:30:00Z", "locality": "local", "source_allowed": true, "managed_by_environment": false}
      properties:
        id: {type: string, format: uuid, description: 'Provider ID, used in `/llm/providers/{id}`.'}
        name: {type: string, description: 'Unique name shown in pickers.'}
        kind: {type: string, description: 'Service type, for example `openai`, `anthropic`, `ollama`. `GET /llm/presets` lists them.'}
        base_url: {type: string, description: 'Address of the model API. Changing it withdraws any source-code opt-in.'}
        model: {type: string, description: 'Model name sent with each request.'}
        max_tokens: {type: integer, description: 'Largest answer asked for.'}
        temperature: {type: [number, 'null'], description: 'Sampling temperature, or `null` for the provider default.'}
        enabled: {type: boolean, description: '`false` stops SCRS using it.'}
        has_api_key: {type: boolean, description: '`true` when a key is stored.'}
        revision: {type: integer, description: 'Revision counter. Send it back in `If-Match` when you change the resource; a stale value answers `409`.'}
        created_at: {type: string, format: date-time, description: 'When the record was created (RFC 3339, UTC).'}
        updated_at: {type: string, format: date-time, description: 'When the record last changed (RFC 3339, UTC).'}
        last_test_at: {type: [string, 'null'], format: date-time, description: 'When `:test` last ran, or `null`.'}
        last_test_error: {type: string, description: 'Why the last test failed. Empty after a success.'}
        locality:
          type: string
          enum: [local, hosted]
          readOnly: true
          description: '`local` is a model server you run (its host is in `SCRS_LLM_PRIVATE_HOSTS`). `hosted` is any other provider. Computed, not stored.'
        source_allowed:
          type: boolean
          readOnly: true
          description: 'Whether this provider may be sent source code now: always for `local`; for `hosted` only when the platform switch `SCRS_LLM_ALLOW_SOURCE_TO_HOSTED` is on and `source_ack_at` is set. Computed.'
        source_ack_by: {type: string, description: 'Who acknowledged source code going to this hosted provider (a token name, or `environment`)'}
        source_ack_at: {type: [string, 'null'], format: date-time, description: When it was acknowledged; null when not. Cleared when `kind` or `base_url` changes.}
        source_ack_note: {type: string, description: 'Why source code may be sent to this hosted provider, as recorded by the administrator who allowed it.'}
        managed_by_environment: {type: boolean, readOnly: true, description: 'Declared in `SCRS_LLM_PROVIDERS`: change it in the environment; the API only enables or disables it'}
    LLMTestResult:
      example: {"ok": true, "model": "qwen2.5-coder:14b", "reply": "OK", "latency_ms": 412, "input_tokens": 18, "output_tokens": 2, "error": ""}
      description: 'Result of a connectivity test of a provider.'
      type: object
      properties:
        ok: {type: boolean, description: '`true` when the provider answered.'}
        model: {type: string, description: 'Model that answered.'}
        reply: {type: string, description: 'Start of the model''s answer to the test prompt.'}
        latency_ms: {type: integer, description: 'Round trip in milliseconds.'}
        input_tokens: {type: integer, description: 'Tokens sent to the model.'}
        output_tokens: {type: integer, description: 'Tokens the model returned.'}
        error: {type: string, description: 'What went wrong. Empty on success.'}
