services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: test-admin-password
    volumes:
      - ./storage-init.sql:/docker-entrypoint-initdb.d/storage-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 2s
      retries: 15

  storage-bootstrap:
    image: scrs:storage-test
    command: ["init"]
    environment: &storage-env
      SCRS_DATABASE_URL: postgres://scrs_app:test-app-password@postgres:5432/scrs_test?sslmode=disable
      SCRS_DATABASE_ADMIN_URL: postgres://postgres:test-admin-password@postgres:5432/postgres?sslmode=disable
      SCRS_DATABASE_SCHEMA: scrs
      SCRS_REDIS_QUEUE_URL: redis://redis:6379/0
      SCRS_S3_ENDPOINT: http://minio:9000
      SCRS_S3_REGION: us-east-1
      SCRS_S3_BUCKET: scrs-integration-test
      SCRS_S3_ACCESS_KEY: test-access-key
      SCRS_S3_SECRET_KEY: test-secret-key
      SCRS_S3_FORCE_PATH_STYLE: "true"
      SCRS_MASTER_KEY: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      SCRS_GITHUB_AUTH_TYPE: fine_grained_pat
      SCRS_GITHUB_ORGANIZATION: qa-org
      SCRS_GITHUB_TOKEN: synthetic-github-token
      SCRS_GITHUB_REPOSITORY_MODE: selected
      SCRS_GITHUB_REPOSITORY_INCLUDE: qa-org/api
      SCRS_DOCKERHUB_NAMESPACE: qa-org
      SCRS_DOCKERHUB_IDENTIFIER: qa-org
      SCRS_DOCKERHUB_TOKEN: synthetic-test-only-token
      SCRS_DOCKERHUB_IMAGE_MODE: selected
      SCRS_DOCKERHUB_IMAGE_INCLUDE: docker.io/qa-org/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  storage-check:
    image: scrs:storage-test
    command: ["storage", "check"]
    environment:
      <<: *storage-env
      SCRS_DATABASE_ADMIN_URL: ""
    depends_on:
      storage-bootstrap:
        condition: service_completed_successfully

  connections-list:
    image: scrs:storage-test
    command: ["connections", "list"]
    environment:
      <<: *storage-env
      SCRS_DATABASE_ADMIN_URL: ""
    depends_on:
      storage-bootstrap:
        condition: service_completed_successfully

  api:
    image: scrs:storage-test
    command: ["api"]
    environment:
      <<: *storage-env
      SCRS_DATABASE_ADMIN_URL: ""
      SCRS_BOOTSTRAP_API_TOKEN: synthetic-admin-token-longer-than-32-characters
    depends_on:
      storage-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/scrs", "healthcheck"]
      interval: 2s
      retries: 15

  connections-create:
    image: curlimages/curl:8.11.1
    command:
      - --fail-with-body
      - --silent
      - --show-error
      - --request
      - POST
      - --header
      - "Authorization: Bearer synthetic-admin-token-longer-than-32-characters"
      - --header
      - "Content-Type: application/json"
      - --data
      - '{"provider":"github","name":"github-second-org","config":{"organization":"second-org","auth_type":"fine_grained_pat"},"scope":{"include":["second-org/*"]},"credential":{"token":"synthetic-test-only-token"}}'
      - http://api:8080/scrs/v1/connections
    depends_on:
      api:
        condition: service_healthy
